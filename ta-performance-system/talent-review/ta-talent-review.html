<style>

:root {

    --paper: #0f1218; --card: #171b23; --card-2: #1d222c; --ink: #edf0f5; --ink-2: #b6bdcb; --muted: #8790a2;

}
:root[data-theme="dark"] {
  --paper: #0f1218; --card: #171b23; --card-2: #1d222c; --ink: #edf0f5; --ink-2: #b6bdcb; --muted: #8790a2;

* { box-sizing: border-box; }
html, body { height: 100%; }

.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100%; }
/* rail */
.rail { background: var(--rail); color: var(--rail-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px); }

.pbtn { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; color: var(--rail-ink); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.pbtn:hover { background: var(--rail-2); }
.pbtn.on { background: var(--rail-2); box-shadow: inset 3px 0 0 #8fa6ff; }
.pbtn .nm { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbtn .rl { font-size: 11px; color: var(--rail-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ring { width: 28px; height: 28px; }

.rail .foot button { background: var(--rail-2); color: var(--rail-ink); border: 1px solid var(--rail-line); border-radius: 7px; padding: 6px 10px; cursor: pointer; font-size: 12.5px; text-align: left; }

/* main */
.main { min-width: 0; padding-block: 22px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; }

/* figures */
.fig { padding: 14px 16px; min-width: 0; }
.fig .l { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.fig .v { font: 600 26px/1.15 var(--display); margin-top: 6px; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }

.heat { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; border-radius: 6px; padding: 6px 4px; min-width: 52px; }

.heat.empty { background: repeating-linear-gradient(135deg, var(--line) 0 3px, transparent 3px 7px); color: var(--muted); font-weight: 500; }

/* charts */
svg.viz { display: block; width: 100%; height: auto; overflow: visible; }
svg.viz text { fill: var(--ink-2); font: 12px var(--body); }
svg.viz .nm { fill: var(--ink); font-weight: 600; font-size: 12.5px; }
svg.viz .mu { fill: var(--muted); font-size: 11px; }
svg.viz .vl { fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
svg.viz .gl { stroke: var(--line); }
svg.viz .row { cursor: pointer; } svg.viz .row:hover .hl { fill: var(--card-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }

.tip { position: fixed; z-index: 90; pointer-events: none; background: var(--card); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 8px 28px rgba(0,0,0,.18); max-width: 280px; opacity: 0; }
.tip .r { display: flex; justify-content: space-between; gap: 16px; } .tip .k { color: var(--ink-2); }

/* bars */
.bar { height: 8px; background: var(--line); border-radius: 4px; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }

.srow .why { grid-column: 2 / 4; font-size: 12px; color: var(--muted); margin-top: -4px; }

/* lists */
.items { display: grid; gap: 10px; }
.item { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); display: grid; gap: 4px; }

.dmaic { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 4px; }

.note { background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: var(--ink-2); }

.crit .y { color: var(--good); font-weight: 700; } .crit .x { color: var(--muted); font-weight: 700; }

.rcol { text-align: center; min-width: 74px; }
.rcol .y { font-size: 11px; color: var(--muted); }
.rcol .b { margin: 4px auto 0; width: 34px; border-radius: 5px 5px 0 0; background: var(--h5); }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .5); z-index: 80; display: flex; align-items: flex-start; justify-content: center; padding: max(40px, env(safe-area-inset-top, 0px)) 16px 24px; overflow-y: auto; }
.modal { background: var(--card); border-radius: 14px; width: min(640px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.3); border: 1px solid var(--line); }
.modal header { padding: 16px 20px 0; } .modal header h3 { font-size: 17px; font-weight: 600; } .modal header p { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }

.modal input, .modal select, .modal textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--card); font-size: 13.5px; }
.modal textarea { min-height: 76px; resize: vertical; }

.state { max-width: 520px; margin: 12vh auto; text-align: center; color: var(--ink-2); }
.state h2 { font-size: 20px; color: var(--ink); margin-bottom: 8px; }

@media (max-width: 1100px) { .c5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

}

</div>

<div id="modalRoot"></div>

<script>
/* ===================== constants (from the TA Head's rules) ===================== */
const YEAR = 2026, CUTOFF = '2026-10-16';
const COMPETENCIES = ['Delivery Ownership', 'Stakeholder Management', 'Talent Advisory', 'Market Intelligence', 'Data & Analytics', 'Assessment Capability', 'Digital & AI Capability', 'Collaboration & Leadership'];
const RATINGS = ['Exceptional', 'High', 'Good', 'Adequate', 'Low'];
const RVAL = { Exceptional: 5, High: 4, Good: 3, Adequate: 2, Low: 1 };
const LEVELS = ['SG1', 'SG2', 'SG3', 'SG4', 'SG5', 'SG6', 'SG7', 'SG8', 'SG9', 'SG10', 'SG11', 'SG12'];
const ROLES = ['Recruiter', 'Team Lead', 'Sourcer', 'Support / Operations'];
const DMAIC = ['Define', 'Measure', 'Analyse', 'Improve', 'Control'];
const PROJECT_STATUS = ['Not started', 'On track', 'In progress', 'Completed', 'On hold', 'To confirm'];
const PLAN_TYPES = ['Development action', 'Area for improvement'];
const PLAN_STATUS = ['Planned', 'In progress', 'Done', 'Dropped'];
const LEARN_STATUS = ['Planned', 'In progress', 'Completed'];
const PROMO = ['Recommend now', 'Recommend in 6–12 months', 'Not this cycle', 'Not decided'];
const JR_BANDS = [[90, 15], [85, 13], [80, 11], [75, 8], [0, 5]];
const CT = { strong: 45, ok: 55 }, VB = { low: 10, high: 20 };
const MIX_GROUPS = [
  { label: 'Lateral SG5 and above', cats: ['SG9 and above', 'Lateral SG5-SG8'], c: 's1' },
  { label: 'Lateral SG1–SG4', cats: ['Lateral SG1-SG4'], c: 's2' },
  { label: 'FTC (new hire)', cats: ['FTC'], c: 's3' },
  { label: 'NATS, ExcelHER, AICTE, PhD', cats: ['NATS Hiring', 'ExcelHER', 'AICTE Professor', 'PhD Internship', 'PMIS'], c: 's4' },
  { label: 'Campus (GET / PGET)', cats: ['GET / PGET'], c: 's5' },
  { label: 'Conversions', cats: ['Contract Conversion', 'FTC Conversion', 'ExcelHER Conversion', 'NATS Conversion'], c: 's6' },
];

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r1 = x => x == null || isNaN(x) ? null : Math.round(x * 10) / 10;
const fmt = (x, d = 1) => x == null || x === '' || isNaN(x) ? '—' : (Math.round(x * 10 ** d) / 10 ** d).toLocaleString('en-IN');
const pct = x => x == null || isNaN(x) ? '—' : Math.round(x) + '%';
const sum = a => a.reduce((s, x) => s + (Number(x) || 0), 0);
const nice = s => { if (!s) return '—'; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
const yearsSince = s => { if (!s) return null; const d = new Date(s + 'T00:00:00'), c = new Date(CUTOFF + 'T00:00:00'); return isNaN(d) ? null : (c - d) / (365.25 * 864e5); };
const num = v => v === '' || v == null ? null : (isNaN(Number(v)) ? null : Number(v));
const clampN = (v, lo, hi) => v == null ? null : Math.max(lo, Math.min(hi, v));
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const ICON = {
  good: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M4.6 8.2l2.2 2.2 4.6-4.8" stroke="var(--card)" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  watch: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2l7.2 13H.8z" fill="currentColor"/><path d="M8 6v3.6M8 11.7v.3" stroke="var(--card)" stroke-width="1.9" stroke-linecap="round"/></svg>',
  below: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="currentColor"/><path d="M8 4.5v4.6M8 11.3v.3" stroke="var(--card)" stroke-width="1.9" stroke-linecap="round"/></svg>',
  none: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
};
const ST = { good: 'On target', watch: 'Close to target', below: 'Below target', none: 'Not scored' };
const chip = (s, text) => `<span class="chip ${s}">${ICON[s]}${esc(text || ST[s])}</span>`;
const statusOf = a => a == null ? 'none' : a >= 1 ? 'good' : a >= .85 ? 'watch' : 'below';

/* ===================== store ===================== */
const COLS = ['people', 'delivery', 'projects', 'learning', 'plans', 'behaviours', 'reviews', 'teams', 'settings', 'comments', 'programmes', 'opsKpis'];
const OPS_LABELS = { 5: ['Outstanding', 'Exceptional'], 4: ['Exceeds Expectations', 'High'], 3: ['Meets Expectations', 'Good'], 2: ['Needs Improvement', 'Adequate'], 1: ['Unsatisfactory', 'Low'] };
const OPS_KEYS = ['timely', 'errors', 'volume', 'experience'];
const THEMES = ['Role', 'University relations & talent pipeline', 'Strategic initiative', 'Process improvement', 'Capability', 'Development area', 'Delivery note', 'Leadership', 'Promotion', 'Other'];
const PILLARS = ['Unleash Human Potential', 'People Experience', 'Data-Driven Insights', 'Sustainable Operational Excellence'];
const PIPE_CATS = [['NATS Hiring', 'NATS'], ['ExcelHER', 'ExcelHER'], ['GET / PGET', 'Campus GET / PGET'], ['Internship (no points rule)', 'Interns'], ['AICTE Professor', 'AICTE professors'], ['PhD Internship', 'PhD'], ['NATS Conversion', 'NATS conversions'], ['ExcelHER Conversion', 'ExcelHER conversions']];
const projStatusClass = st => ({ 'Completed': 'good', 'On track': 'good', 'On hold': 'watch', 'To confirm': 'watch' }[st] || 'none');
const isIntern = c => /^Internship/.test(c);
const internPts = () => num((S.settings.scoring || {}).internPts) ?? 0;
const scaleText = (comp, n) => { const sc = S.settings.behaviourScale || {}; return ((sc.byComp || {})[comp] || {})[n] || (sc.general || {})[n] || ''; };
const S = Object.fromEntries(COLS.map(c => [c, {}]));
let LOG = [];
let db = null, canWrite = false, loaded = new Set(), ready = false;

function peopleList() { return Object.entries(S.people).map(([id, p]) => ({ id, ...p })); }
function inReview(p) { return p.inReview !== false && p.status !== 'Left'; }
const isSupport = p => p.role === 'Support / Operations';
const isCompare = p => !inReview(p) && !!p.compare;
const isLead = p => p.role === 'Team Lead';
function teamNames() { const t = Object.values(S.teams).sort((a, b) => (a.order ?? 99) - (b.order ?? 99)).map(t => t.name); peopleList().forEach(p => { if (p.team && !t.includes(p.team)) t.push(p.team); }); return t; }

/* ===================== scoring ===================== */
const jrScore = v => { if (v == null) return null; for (const [m, s] of JR_BANDS) if (v >= m) return s; return 0; };
const ctScore = v => v == null ? null : v < CT.strong ? 10 : v <= CT.ok ? 7 : 4;
const ctLabel = v => v == null ? '—' : v < CT.strong ? 'Strong' : v <= CT.ok ? 'Acceptable' : 'Improvement required';
const vScore = v => v == null ? null : v < VB.low ? 5 : v <= VB.high ? 3 : 1;

function ownBlock(id) {
  const d = S.delivery[id]; if (!d) return null;
  const ppo = num(d.ppo) ?? 2, target = num(d.target), prorate = num(d.prorate) ?? 1;
  const ptFull = num(d.ptAnnual) ?? (target != null ? target * ppo : null);
  const ptPro = ptFull != null ? ptFull * prorate : null;
  const interns = sum((d.mix || []).filter(m => isIntern(m[0])).map(m => m[1])), basePts = num(d.points);
  const points = basePts == null ? null : basePts + interns * internPts(), offers = num(d.offers), joiners = num(d.joiners);
  const att = points != null && ptPro ? points / ptPro : null;
  const offer = att != null ? r1(40 * Math.min(att, 1)) : null;
  const jr = offers ? joiners / offers * 100 : null;
  const parts = { offer, jr: jrScore(jr), ct: ctScore(num(d.offerDays)), vendor: vScore(num(d.vendorPct)) };
  const all = Object.values(parts).every(v => v != null);
  return { d, interns, basePts, ppo, target, prorate, ptFull, ptPro, points, offers, joiners, att, jr, offerDays: num(d.offerDays), vendorPct: num(d.vendorPct), parts, del: all ? r1(parts.offer + parts.jr + parts.ct + parts.vendor) : null, raw: r1(sum(Object.values(parts))) };
}
function teamOf(lead) { return peopleList().filter(p => p.team === lead.team && p.id !== lead.id && !isLead(p) && !isSupport(p) && inReview(p)); }
function teamBlock(lead) {
  const ms = teamOf(lead).map(p => ({ p, b: ownBlock(p.id) })).filter(x => x.b);
  if (!ms.length) return null;
  const pts = ms.every(x => x.b.points != null) ? sum(ms.map(x => x.b.points)) : null, ptPro = sum(ms.map(x => x.b.ptPro));
  const offers = sum(ms.map(x => x.b.offers)), joiners = sum(ms.map(x => x.b.joiners));
  const wavg = k => { const w = ms.filter(x => x.b[k] != null && x.b.offers); const t = sum(w.map(x => x.b.offers)); return t ? sum(w.map(x => x.b[k] * x.b.offers)) / t : null; };
  const att = pts != null && ptPro ? pts / ptPro : null, jr = offers ? joiners / offers * 100 : null, ct = wavg('offerDays'), vp = wavg('vendorPct');
  const parts = { offer: att != null ? r1(40 * Math.min(att, 1)) : null, jr: jrScore(jr), ct: ctScore(ct), vendor: vScore(vp) };
  const all = Object.values(parts).every(v => v != null);
  return { members: ms.map(x => x.p), points: pts, ptPro, offers, joiners, att, jr, ct, vp, parts, del: all ? r1(sum(Object.values(parts))) : null };
}
function projectScore(pr) { const s = pr.scores || {}; const v = [s.discipline, s.impact, s.control, s.learning].map(num); return v.every(x => x != null) ? v[0] + v[1] + v[2] + v[3] : null; }
function projectsOf(id) { return Object.entries(S.projects).map(([k, v]) => ({ id: k, ...v })).filter(x => x.owner === id); }
function learningOf(id) { return Object.entries(S.learning).map(([k, v]) => ({ id: k, ...v })).filter(x => x.emp === id); }
function plansOf(id) { return Object.entries(S.plans).map(([k, v]) => ({ id: k, ...v })).filter(x => x.emp === id); }

function evalPerson(p) {
  const id = p.id, sup = isSupport(p), rv = S.reviews[id] || {};
  const own = sup ? null : ownBlock(id);
  const team = isLead(p) ? teamBlock(p) : null;
  let del = own ? own.del : null;
  if (isLead(p) && team && own) del = team.del != null && own.del != null ? r1(team.del * 35 / 70 + own.del * 35 / 70) : null;
  const projs = projectsOf(id), counted = projs.filter(x => x.contributing).map(projectScore).filter(x => x != null);
  const proj = counted.length ? Math.max(...counted) : null;
  const cd = [num(rv.growth), num(rv.application), num(rv.planDone)];
  const comp = cd.every(x => x != null) ? cd[0] + cd[1] + cd[2] : null;
  const max = sup ? 30 : 100;
  const total = sup ? (proj != null && comp != null ? r1(proj + comp) : null) : (del != null && proj != null && comp != null ? r1(del + proj + comp) : null);
  const partial = r1((del ?? (own ? own.raw : 0)) + (proj || 0) + (comp || 0));
  const att = own ? own.att : null;
  const stat = !inReview(p) || sup ? 'none' : statusOf(isLead(p) && team && team.att != null && att != null ? Math.min(att, team.att) : att);
  return { p, sup, own, team, del, proj, comp, cd, total, partial, max, att, stat, rv, projs, learn: learningOf(id), plans: plansOf(id), beh: (S.behaviours[id] || {}).ratings || {} };
}

function promotion(E) {
  const p = E.p, r = p.ratings || {}, crit = [];
  const last2 = [r.y2025, r.y2024];
  const strong = last2.every(x => x && RVAL[x] >= 4);
  crit.push({ ok: strong, label: `Last two P4P ratings High or above`, fact: `${YEAR - 1}: ${r.y2025 || 'no rating'} · ${YEAR - 2}: ${r.y2024 || 'no rating'}` });
  const score = E.total != null ? E.total / E.max * 100 : null;
  crit.push({ ok: score != null && score >= 80, label: `${YEAR} total score of 80% or more`, fact: E.total != null ? `${fmt(E.total)} of ${E.max}` : `Not complete yet (${fmt(E.partial)} of ${E.max} so far)` });
  const strongB = COMPETENCIES.filter(c => num((E.beh[c] || {}).head) >= 4);
  crit.push({ ok: strongB.length >= 3, label: 'Three or more behaviours rated 4+ by the TA Head', fact: strongB.length ? strongB.join(', ') : 'None rated 4 or above yet' });
  const yrs = yearsSince(p.since);
  const exc = p.roleTimeException;
  crit.push({ ok: !!exc || (yrs != null && yrs >= 2), label: 'Two or more years in current role', fact: (yrs == null ? 'Date in current role not recorded' : `${fmt(yrs)} years in ${p.level || 'current level'} (since ${nice(p.since)})`) + (exc ? ` · Exception: ${p.roleTimeReason || 'approved by the TA Head'}` : '') });
  const lead = num((E.beh['Collaboration & Leadership'] || {}).head) >= 4 || E.projs.some(x => num(x.stage) >= 3 && projectScore(x) != null);
  crit.push({ ok: lead, label: 'Leadership evidence', fact: 'Collaboration & Leadership rated 4+, or a scored project validated to Improve or Control' });
  const met = crit.filter(c => c.ok).length, known = [r.y2025, r.y2024, r.y2023].filter(Boolean).length;
  let level;
  if (!inReview(p)) level = 'Not assessed';
  else if (known < 2) level = 'Not enough rating history';
  else if (met === 5) level = 'Ready now';
  else if (met >= 4 || (met === 3 && strong)) level = 'Ready in 6–12 months';
  else level = 'Develop in current role';
  const next = LEVELS.includes(p.level) ? LEVELS[LEVELS.indexOf(p.level) + 1] || '—' : '—';
  return { crit, met, level, next };
}

function opsRating(id) {
  const k = S.opsKpis[id]; if (!k) return null;
  const pl = ((S.reviews[id] || {}).pillars) || {}, breach = !!pl.breach;
  const vals = OPS_KEYS.map(key => { let v = num(pl[key]); if (v != null && key === 'errors' && breach) v = Math.min(v, 2); return v; });
  const all = vals.every(v => v != null);
  let overall = all ? Math.round(sum(vals) / 4) : null; if (overall != null && breach) overall = Math.min(overall, 3);
  return { k, pl, vals, breach, overall, avg: all ? sum(vals) / 4 : null, rated: vals.filter(v => v != null).length };
}
/* ===================== tooltip / toast ===================== */
const tip = $('#tip');
function bindTips(root) {
  root.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', e => { tip.innerHTML = el.dataset.tip; tip.style.opacity = 1; moveTip(e); });
    el.addEventListener('mousemove', moveTip);
    el.addEventListener('mouseleave', () => tip.style.opacity = 0);
  });
}
function moveTip(e) { const r = tip.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14; if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14; if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
const tipRows = rows => rows.map(([k, v]) => `<div class="r"><span class="k">${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
let toastT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

/* ===================== routing ===================== */
let route = { view: 'team', id: null, tab: 'overview' };
function go(view, id = null, tab = 'overview') { route = { view, id, tab }; tip.style.opacity = 0; render(); $('.main').scrollTo?.(0, 0); window.scrollTo(0, 0); }

/* ===================== rail ===================== */
function ringSvg(a, stat) {
  const r = 11, c = 2 * Math.PI * r, f = a == null ? 0 : Math.min(a, 1);
  const col = { good: 'var(--good)', watch: 'var(--watch)', below: 'var(--bad)', none: 'var(--rail-muted)' }[stat];
  return `<svg class="ring" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="${r}" fill="none" stroke="var(--rail-line)" stroke-width="3"/><circle cx="14" cy="14" r="${r}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c * f} ${c}" transform="rotate(-90 14 14)"/></svg>`;
}
const NAV = [['team', 'Team overview', '<path d="M3 13h4v5H3zM8 8h4v10H8zM13 3h4v15h-4z" fill="currentColor"/>'], ['programmes', 'Programmes & projects', '<path d="M10 2l8 4-8 4-8-4z" fill="currentColor"/><path d="M2 10l8 4 8-4M2 14l8 4 8-4" fill="none" stroke="currentColor" stroke-width="1.6"/>'], ['promotion', 'Promotion board', '<path d="M10 2l3 6 6 .9-4.5 4.3 1 6.3L10 16.5 4.5 19.5l1-6.3L1 8.9 7 8z" fill="currentColor"/>'], ['manage', 'People & teams', '<circle cx="7" cy="7" r="3.2" fill="currentColor"/><circle cx="14.5" cy="8" r="2.6" fill="currentColor"/><path d="M1.5 17c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5zM12.5 17c.3-1.9.1-3.4-.8-4.6 2.5-.5 5.2.8 6.3 4.6z" fill="currentColor"/>'], ['log', 'Change log', '<path d="M4 3h12v14H4z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 7h6M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.6"/>']];
function renderRail() {
  $('#rnav').innerHTML = NAV.filter(([k]) => canWrite || k !== 'log').map(([k, t, ic]) => `<button class="rbtn ${route.view === k ? 'on' : ''}" data-nav="${k}" type="button"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true">${ic}</svg>${t}</button>`).join('');
  const ppl = peopleList(), groups = [];
  for (const t of teamNames()) { const m = ppl.filter(p => p.team === t && inReview(p)).sort((a, b) => (isLead(b) - isLead(a)) || a.name.localeCompare(b.name)); if (m.length) groups.push([t, m]); }
  const noTeam = ppl.filter(p => !p.team && inReview(p)); if (noTeam.length) groups.push(['No team yet', noTeam]);
  const left = ppl.filter(p => !inReview(p)); if (left.length) groups.push(['Not in this year\'s review', left]);
  $('#roster').innerHTML = groups.map(([t, m]) => `<div class="rgroup"><div class="gh"><span>${esc(t)}</span><span>${m.length}</span></div>${m.map(p => { const E = evalPerson(p); return `<button class="pbtn ${route.view === 'person' && route.id === p.id ? 'on' : ''}" data-person="${esc(p.id)}" type="button" aria-label="${esc(p.name)}">${ringSvg(E.att, E.stat)}<span style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="rl">${esc(p.role || '')}</div></span><span class="pc">${E.att != null ? Math.round(E.att * 100) + '%' : ''}</span></button>`; }).join('')}</div>`).join('');
  $('#mPick').innerHTML = `<option value="">Team overview</option>` + groups.map(([t, m]) => `<optgroup label="${esc(t)}">${m.map(p => `<option value="${esc(p.id)}" ${route.id === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>`).join('');
  const inR = ppl.filter(inReview).length;
  $('#brandSub').textContent = `${inR} people in review · data to ${nice(CUTOFF)}`;
}

/* ===================== TEAM OVERVIEW ===================== */
function heatCell(v, max, label) {
  if (v == null) return `<div class="heat empty" title="${esc(label)}: not scored yet">—</div>`;
  const f = v / max, step = Math.max(1, Math.min(6, Math.ceil(f * 6)));
  const ink = step >= 5 ? 'var(--hink-dark)' : 'var(--hink)';
  return `<div class="heat" style="background:var(--h${step});color:${ink}" title="${esc(label)}: ${fmt(v)} of ${max}">${fmt(v)}<small>/${max}</small></div>`;
}
const cw = half => { const v = $('#view').clientWidth || 900; const two = half && innerWidth > 900; return Math.max(300, Math.round((two ? (v - 14) / 2 : v) - 38)); };
function bulletChart(list) {
  const W = cw(false), L = W < 520 ? 104 : 150, R = 56, rowH = 40, top = 26;
  const maxV = Math.max(...list.map(E => Math.max(E.own.points || 0, E.own.ptFull || 0))) * 1.05;
  const step = maxV > 300 ? 100 : 50, axMax = Math.ceil(maxV / step) * step, x = v => L + (W - L - R) * v / axMax, H = top + list.length * rowH + 6;
  let s = `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weighted points against target per person">`;
  for (let t = 0; t <= axMax; t += step) s += `<line class="gl" x1="${x(t)}" x2="${x(t)}" y1="${top - 6}" y2="${H - 4}"/><text class="mu" x="${x(t)}" y="${top - 11}" text-anchor="middle">${t}</text>`;
  list.forEach((E, i) => {
    const y = top + i * rowH, o = E.own, col = { good: 'var(--good)', watch: 'var(--watch)', below: 'var(--bad)', none: 'var(--none)' }[statusOf(o.att)];
    const th = `<b>${esc(E.p.name)}</b>` + tipRows([['Weighted points', fmt(o.points)], ['Target to date', fmt(o.ptPro)], ['Full-year target', fmt(o.ptFull, 0)], ['Attainment', pct(o.att * 100)], ['Offers in trackers', fmt((o.d.tracker || {}).offers, 0)]]);
    s += `<g class="row" data-person="${esc(E.p.id)}" data-tip="${esc(th)}"><rect class="hl" x="0" y="${y}" width="${W}" height="${rowH - 3}" rx="6" fill="transparent"/>
      <text class="nm" x="${L - 12}" y="${y + 16}" text-anchor="end">${esc(E.p.name)}</text><text class="mu" x="${L - 12}" y="${y + 30}" text-anchor="end">${esc(E.p.role)}</text>
      <rect x="${L}" y="${y + 8}" width="${Math.max(0, x(o.ptFull || 0) - L)}" height="20" rx="4" fill="var(--line)"/>
      <rect x="${L}" y="${y + 13}" width="${Math.max(2, x(o.points || 0) - L)}" height="10" rx="3" fill="${col}"/>
      <rect x="${x(o.ptPro || 0) - 1.5}" y="${y + 5}" width="3" height="26" rx="1" fill="var(--ink)"/>

function commentsOf(id) { return ((S.comments[id] || {}).items || []).map((c, i) => ({ ...c, idx: i })); }

function programmesFor(p) {

const ownerName = x => x.owner && S.people[x.owner] ? S.people[x.owner].name : (x.ownerText || '—');

function resultsChart(rows) {
  const W = cw(true), L = 110, R = 70, rowH = 30, top = 22, max = Math.max(...rows.map(r => Math.max(r[1], r[2]))) * 1.05, x = v => L + (W - L - R) * v / max, H = top + rows.length * rowH + 4;
  let s = `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Programme joiners against target">`;
  rows.forEach(([n, t, j], i) => { const y = top + i * rowH, a = j / t, col = { good: 'var(--good)', watch: 'var(--watch)', below: 'var(--bad)' }[statusOf(a)];
    s += `<g data-tip="${esc(`<b>${esc(n)}</b>` + tipRows([['Target', t], ['Joined', j], ['Attainment', pct(a * 100)]]))}"><text class="nm" x="${L - 10}" y="${y + 16}" text-anchor="end">${esc(n)}</text><rect x="${L}" y="${y + 4}" width="${x(t) - L}" height="16" rx="3" fill="var(--line)"/><rect x="${L}" y="${y + 8}" width="${Math.max(2, x(j) - L)}" height="8" rx="2" fill="${col}"/><rect x="${x(t) - 1.5}" y="${y + 1}" width="3" height="22" fill="var(--ink)"/><text class="vl" x="${Math.max(x(t), x(j)) + 7}" y="${y + 16}">${pct(a * 100)}</text></g>`; });
  return s + '</svg>';
}
function trendSmall(name, vals, years, cur) {
  const W = 220, H = 90, L = 26, R = 12, T = 14, B = 18, mx = Math.max(...vals, cur ?? 0) * 1.15, x = i => L + (W - L - R) * i / (years.length), y = v => T + (H - T - B) * (1 - v / mx);
  const pts = vals.map((v, i) => [x(i), y(v)]); if (cur != null) pts.push([x(years.length), y(cur)]);
  let s = `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(name)} 2020 to 2026"><text class="mu" x="${L}" y="10">${esc(name)} %</text>`;
  s += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  pts.forEach((p, i) => { const last = i === pts.length - 1; s += `<circle cx="${p[0]}" cy="${p[1]}" r="${last ? 4.5 : 2.5}" fill="${last ? 'var(--accent)' : 'var(--card)'}" stroke="var(--accent)" stroke-width="1.5"><title>${i < years.length ? years[i] : '2026 YTD'}: ${i < vals.length ? vals[i] : cur}%</title></circle>`; });
  s += `<text class="vl" x="${pts[pts.length - 1][0] - 4}" y="${pts[pts.length - 1][1] - 8}" text-anchor="end">${cur ?? vals[vals.length - 1]}%</text><text class="mu" x="${x(0)}" y="${H - 3}">2020</text><text class="mu" x="${x(years.length)}" y="${H - 3}" text-anchor="end">2026</text>`;
  return s + '</svg>';
}

let modalCtx = null;
function field(f, val) {
  const id = 'f_' + f.k, req = f.req ? ' required' : '', cls = f.full ? 'full' : '';
  if (f.type === 'check') return `<label class="chk ${cls}"><input id="${id}" type="checkbox" ${val ? 'checked' : ''}> ${esc(f.label)}</label>`;
  let input;
  if (f.type === 'select') input = `<select id="${id}"${req}>${f.blank !== false ? '<option value="">—</option>' : ''}${f.options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(val ?? '') === String(v) ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  else if (f.type === 'textarea') input = `<textarea id="${id}"${req}>${esc(val ?? '')}</textarea>`;
  else input = `<input id="${id}" type="${f.type || 'text'}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.step != null ? `step="${f.step}"` : ''} value="${esc(val ?? '')}"${req}${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}>`;
  return `<label class="${cls}">${esc(f.label)}${f.hint ? ` <span style="color:var(--muted);font-weight:400">${esc(f.hint)}</span>` : ''}${input}</label>`;
}
function openForm({ title, intro, fields, values = {}, save, del, saveLabel = 'Save' }) {
  modalCtx = { fields, save, del };
  $('#modalRoot').innerHTML = `<div class="scrim" id="scrim"><form class="modal" id="mform" role="dialog" aria-modal="true" aria-labelledby="mTitle" novalidate><header><h3 id="mTitle">${esc(title)}</h3>${intro ? `<p>${intro}</p>` : ''}</header><div class="body">${fields.map(f => f.section ? `<div class="full" style="font:600 12.5px var(--display);margin-top:6px">${esc(f.section)}</div>` : field(f, values[f.k])).join('')}<div class="err" id="mErr"></div></div><footer>${del ? '<button class="btn danger" type="button" id="mDel">Delete</button>' : ''}<span class="sp"></span><button class="btn" type="button" id="mCancel">Cancel</button><button class="btn pri" type="submit">${esc(saveLabel)}</button></footer></form></div>`;
  const first = $('#mform input, #mform select, #mform textarea'); first && first.focus();
}
function readForm() {
  const out = {};
  for (const f of modalCtx.fields) { if (f.section) continue; const el = document.getElementById('f_' + f.k); if (!el) continue;
    if (f.type === 'check') out[f.k] = el.checked;
    else if (f.type === 'number') { const v = num(el.value); out[f.k] = v == null ? null : (f.min != null || f.max != null ? clampN(v, f.min ?? -Infinity, f.max ?? Infinity) : v); }
    else out[f.k] = el.value.trim() || null; }
  return out;
}
