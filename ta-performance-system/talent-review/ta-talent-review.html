<title>India TA Talent Review 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: graphite roster rail on the left (whole team + people by team), review workspace on the right; the rail folds into a picker at phone width. */
:root {
  --paper: #eef0f4; --card: #ffffff; --card-2: #f6f7fa; --ink: #141821; --ink-2: #4a5263; --muted: #7b8396;
  --line: #e1e4eb; --line-2: #cdd2dc; --accent: #2348c7; --accent-ink: #ffffff; --accent-soft: #e4e9fb;
  --rail: #1a1e27; --rail-2: #252a35; --rail-ink: #e9ecf2; --rail-muted: #949cad; --rail-line: #2e3441;
  --good: #0f8a3c; --good-bg: #e2f4e8; --watch: #9a6400; --watch-bg: #fdf0d4; --bad: #c0312f; --bad-bg: #fbe4e3; --none: #7b8396; --none-bg: #eceef2;
  --h1: #eef3fd; --h2: #cfdcf8; --h3: #a3bdf2; --h4: #6f97e8; --h5: #3f6fd8; --h6: #2348c7; --hink-dark: #ffffff; --hink: #141821;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #6250d6;
  --display: "Sora", "Segoe UI", system-ui, sans-serif; --body: "Public Sans", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --shadow: 0 1px 2px rgba(20, 24, 33, .05), 0 4px 14px rgba(20, 24, 33, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1218; --card: #171b23; --card-2: #1d222c; --ink: #edf0f5; --ink-2: #b6bdcb; --muted: #8790a2;
    --line: #272d39; --line-2: #343b49; --accent: #7f9bff; --accent-ink: #0f1218; --accent-soft: #1f2a4a;
    --rail: #0b0d12; --rail-2: #161a22; --rail-ink: #e9ecf2; --rail-muted: #8c94a6; --rail-line: #222733;
    --good: #4cd17c; --good-bg: #133222; --watch: #f2b84b; --watch-bg: #3a2c10; --bad: #ff7d78; --bad-bg: #3d1a1a; --none: #8790a2; --none-bg: #222733;
    --h1: #1a2236; --h2: #1e3264; --h3: #24459a; --h4: #3a64cf; --h5: #6f97e8; --h6: #a3bdf2; --hink-dark: #0f1218; --hink: #edf0f5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1218; --card: #171b23; --card-2: #1d222c; --ink: #edf0f5; --ink-2: #b6bdcb; --muted: #8790a2;
  --line: #272d39; --line-2: #343b49; --accent: #7f9bff; --accent-ink: #0f1218; --accent-soft: #1f2a4a;
  --rail: #0b0d12; --rail-2: #161a22; --rail-ink: #e9ecf2; --rail-muted: #8c94a6; --rail-line: #222733;
  --good: #4cd17c; --good-bg: #133222; --watch: #f2b84b; --watch-bg: #3a2c10; --bad: #ff7d78; --bad-bg: #3d1a1a; --none: #8790a2; --none-bg: #222733;
  --h1: #1a2236; --h2: #1e3264; --h3: #24459a; --h4: #3a64cf; --h5: #6f97e8; --h6: #a3bdf2; --hink-dark: #0f1218; --hink: #edf0f5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; margin: 0; }
.mono { font-family: var(--mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100%; }
/* rail */
.rail { background: var(--rail); color: var(--rail-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px); }
.brand { padding: 18px 18px 14px; border-bottom: 1px solid var(--rail-line); }
.brand .k { font: 600 10.5px/1 var(--body); letter-spacing: 1.4px; text-transform: uppercase; color: var(--rail-muted); }
.brand h1 { font-size: 17px; margin-top: 6px; font-weight: 600; letter-spacing: -.2px; }
.brand .sub { font-size: 12px; color: var(--rail-muted); margin-top: 3px; }
.rnav { padding: 10px 10px 4px; display: grid; gap: 2px; }
.rbtn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; color: var(--rail-ink); padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
.rbtn:hover { background: var(--rail-2); }
.rbtn.on { background: var(--rail-2); box-shadow: inset 3px 0 0 #8fa6ff; }
.rbtn .ico { width: 18px; height: 18px; flex: none; opacity: .85; }
.rgroup { padding: 12px 10px 2px; }
.rgroup .gh { display: flex; justify-content: space-between; align-items: baseline; padding: 0 10px 6px; font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--rail-muted); font-weight: 600; }
.pbtn { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; color: var(--rail-ink); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.pbtn:hover { background: var(--rail-2); }
.pbtn.on { background: var(--rail-2); box-shadow: inset 3px 0 0 #8fa6ff; }
.pbtn .nm { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbtn .rl { font-size: 11px; color: var(--rail-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbtn .pc { font: 500 11.5px var(--mono); color: var(--rail-muted); }
.ring { width: 28px; height: 28px; }
.rail .foot { margin-top: auto; padding: 12px 18px 18px; border-top: 1px solid var(--rail-line); font-size: 11.5px; color: var(--rail-muted); display: grid; gap: 8px; }
.rail .foot button { background: var(--rail-2); color: var(--rail-ink); border: 1px solid var(--rail-line); border-radius: 7px; padding: 6px 10px; cursor: pointer; font-size: 12.5px; text-align: left; }
.mpick { display: none; }

/* main */
.main { min-width: 0; padding-block: 22px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; }
.phead { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 18px; }
.phead h2 { font-size: 26px; font-weight: 600; letter-spacing: -.4px; }
.phead .meta { color: var(--ink-2); font-size: 13px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.phead .sp { flex: 1; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line-2); background: var(--card); color: var(--ink); border-radius: 8px; padding: 7px 13px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.pad { padding: 16px 18px; }
.sec { margin-top: 16px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.sec-h h3 { font-size: 15px; font-weight: 600; }
.sec-h .hint { color: var(--muted); font-size: 12.5px; }
.sec-h .sp { flex: 1; }
.grid { display: grid; gap: 14px; }
.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.grid > * { min-width: 0; }
.nw { white-space: nowrap; }
td.who { min-width: 150px; } td.who b { white-space: nowrap; }

/* figures */
.fig { padding: 14px 16px; min-width: 0; }
.fig .l { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.fig .v { font: 600 26px/1.15 var(--display); margin-top: 6px; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
.fig .v small { font: 500 13px var(--body); color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.fig .f { font-size: 12px; color: var(--muted); margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 999px; white-space: nowrap; }
.chip svg { width: 12px; height: 12px; flex: none; }
.fb-late { background: var(--bad-bg) !important; color: var(--bad) !important; }
table.rq th.c { text-align: center; } table.rq td.rq-att { background: var(--bad-bg); color: var(--bad); } table.rq tr.rq-team td { background: var(--none-bg); } table.rq tr.rq-all td { background: var(--none-bg); font-weight: 700; color: var(--accent); }
.chip.good { color: var(--good); background: var(--good-bg); } .chip.watch { color: var(--watch); background: var(--watch-bg); } .chip.below { color: var(--bad); background: var(--bad-bg); } .chip.none { color: var(--none); background: var(--none-bg); }
.tag { display: inline-flex; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--card-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.tag.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line-2); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 9px 13px; cursor: pointer; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--ink-2); padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--card-2); }
td .sub { font-size: 11.5px; color: var(--muted); }
.heat { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; border-radius: 6px; padding: 6px 4px; min-width: 52px; }
.heat small { font-weight: 500; opacity: .75; }
.heat.empty { background: repeating-linear-gradient(135deg, var(--line) 0 3px, transparent 3px 7px); color: var(--muted); font-weight: 500; }

/* charts */
svg.viz { display: block; width: 100%; height: auto; overflow: visible; }
svg.viz text { fill: var(--ink-2); font: 12px var(--body); }
svg.viz .nm { fill: var(--ink); font-weight: 600; font-size: 12.5px; }
svg.viz .mu { fill: var(--muted); font-size: 11px; }
svg.viz .vl { fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
svg.viz .gl { stroke: var(--line); }
svg.viz .row { cursor: pointer; } svg.viz .row:hover .hl { fill: var(--card-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.legend i.tick { width: 3px; height: 12px; border-radius: 1px; background: var(--ink); }
.tip { position: fixed; z-index: 90; pointer-events: none; background: var(--card); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 8px 28px rgba(0,0,0,.18); max-width: 280px; opacity: 0; }
.tip .r { display: flex; justify-content: space-between; gap: 16px; } .tip .k { color: var(--ink-2); }

/* bars */
.bar { height: 8px; background: var(--line); border-radius: 4px; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }
.bar.empty { background: repeating-linear-gradient(135deg, var(--line) 0 3px, transparent 3px 7px); }
.srow { display: grid; grid-template-columns: minmax(130px, 1.1fr) minmax(0, 2fr) 84px; gap: 6px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.srow:last-child { border-bottom: 0; }
.srow .s { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.srow .s small { color: var(--muted); font-weight: 500; }
.srow .why { grid-column: 2 / 4; font-size: 12px; color: var(--muted); margin-top: -4px; }

/* lists */
.items { display: grid; gap: 10px; }
.item { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); display: grid; gap: 4px; }
.item .t { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item .d { font-size: 12.5px; color: var(--ink-2); }
.item .acts { display: flex; gap: 4px; margin-left: auto; }
.dmaic { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 4px; }
.dmaic span { font-size: 10.5px; text-align: center; padding: 3px 0; border-radius: 4px; background: var(--line); color: var(--muted); font-weight: 600; }
.dmaic span.done { background: var(--accent); color: var(--accent-ink); }
.empty-note { padding: 16px; border: 1px dashed var(--line-2); border-radius: 10px; color: var(--ink-2); font-size: 13px; background: var(--card); }
.note { background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: var(--ink-2); }
.note.warn { border-left: 3px solid var(--watch); }
.crit { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 8px; font-size: 13px; }
.crit .y { color: var(--good); font-weight: 700; } .crit .x { color: var(--muted); font-weight: 700; }
.crit .f { grid-column: 2; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.lane { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 120px; }
.lane h4 { font-size: 12.5px; font-weight: 600; display: flex; justify-content: space-between; margin: 2px 4px 8px; }
.lane .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
.lane .pcard:hover { border-color: var(--accent); }
.lane .pcard .sub { font-size: 11.5px; color: var(--muted); }
.beh { display: grid; grid-template-columns: minmax(150px, 1.2fr) repeat(5, 34px) minmax(0, 1.4fr); gap: 4px; align-items: center; font-size: 13px; }
.beh .hdr { font-size: 11px; color: var(--muted); text-align: center; font-weight: 600; }
.beh .cell { height: 30px; border-radius: 6px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; position: relative; }
.beh .dot { width: 12px; height: 12px; border-radius: 50%; }
.beh .dot.self { border: 2px solid var(--ink-2); background: transparent; }
.beh .dot.head { background: var(--accent); }
.beh .both { display: flex; gap: 2px; }
.beh .ev { font-size: 12px; color: var(--muted); padding-left: 8px; }
.attn { display: grid; gap: 8px; }
.attn .a { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); cursor: pointer; font-size: 13px; }
.attn .a:hover { border-color: var(--accent); }
.attn .a i { width: 8px; height: 28px; border-radius: 3px; }
.ratings { display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; }
.rcol { text-align: center; min-width: 74px; }
.rcol .y { font-size: 11px; color: var(--muted); }
.rcol .b { margin: 4px auto 0; width: 34px; border-radius: 5px 5px 0 0; background: var(--h5); }
.rcol .b.na { background: repeating-linear-gradient(135deg, var(--line) 0 3px, transparent 3px 7px); }
.rcol .t { font-size: 12px; font-weight: 600; margin-top: 4px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .5); z-index: 80; display: flex; align-items: flex-start; justify-content: center; padding: max(40px, env(safe-area-inset-top, 0px)) 16px 24px; overflow-y: auto; }
.modal { background: var(--card); border-radius: 14px; width: min(640px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.3); border: 1px solid var(--line); }
.modal header { padding: 16px 20px 0; } .modal header h3 { font-size: 17px; font-weight: 600; } .modal header p { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }
.modal .body { padding: 14px 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.modal .body .full { grid-column: 1 / -1; }
.modal label { font-size: 12px; color: var(--ink-2); font-weight: 500; display: grid; gap: 4px; }
.modal input, .modal select, .modal textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--card); font-size: 13.5px; }
.modal textarea { min-height: 76px; resize: vertical; }
.modal label.chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); }
.modal label.chk input { width: auto; }
.modal .err { color: var(--bad); font-size: 12.5px; grid-column: 1 / -1; }
.modal footer { padding: 12px 20px 16px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line); }
.modal footer .sp { flex: 1; }
.toast { position: fixed; bottom: max(18px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 9px; font-size: 13px; z-index: 95; opacity: 0; transition: opacity .15s; pointer-events: none; }
.toast.on { opacity: 1; }
.state { max-width: 520px; margin: 12vh auto; text-align: center; color: var(--ink-2); }
.state h2 { font-size: 20px; color: var(--ink); margin-bottom: 8px; }

@media (max-width: 1100px) { .c5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .rail .rgroup, .rail .foot { display: none; }
  .rnav { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 8px 0; }
  .brand { padding: 14px 0 10px; }
  .mpick { display: block; padding: 0 0 12px; }
  .mpick select { width: 100%; padding: 8px 10px; border-radius: 8px; background: var(--rail-2); color: var(--rail-ink); border: 1px solid var(--rail-line); }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .c4, .c3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .c2 { grid-template-columns: 1fr; } .span2 { grid-column: auto; }
}
@media (max-width: 560px) {
  .c4, .c3, .board { grid-template-columns: 1fr; } .c5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fig .v { font-size: 22px; }
  .modal .body { grid-template-columns: 1fr; }
  .beh { grid-template-columns: minmax(110px, 1fr) repeat(5, 28px); } .beh .ev { grid-column: 1 / -1; padding: 0 0 6px; }
  .srow { grid-template-columns: minmax(100px, 1fr) minmax(0, 1.2fr) 70px; }
}

let modalCtx = null;
function field(f, val) {
  const id = 'f_' + f.k, req = f.req ? ' required' : '', cls = f.full ? 'full' : '';
  if (f.type === 'check') return `<label class="chk ${cls}"><input id="${id}" type="checkbox" ${val ? 'checked' : ''}> ${esc(f.label)}</label>`;
  let input;
  if (f.type === 'select') input = `<select id="${id}"${req}>${f.blank !== false ? '<option value="">—</option>' : ''}${f.options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(val ?? '') === String(v) ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  else if (f.type === 'textarea') input = `<textarea id="${id}"${req}>${esc(val ?? '')}</textarea>`;
  else input = `<input id="${id}" type="${f.type || 'text'}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.step != null ? `step="${f.step}"` : ''} value="${esc(val ?? '')}"${req}${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}>`;
  return `<label class="${cls}">${esc(f.label)}${f.hint ? ` <span style="color:var(--muted);font-weight:400">${esc(f.hint)}</span>` : ''}${input}</label>`;

function openForm({ title, intro, fields, values = {}, save, del, saveLabel = 'Save' }) {

function readForm() {
  const out = {};
  for (const f of modalCtx.fields) { if (f.section || f.note) continue; const el = document.getElementById('f_' + f.k); if (!el) continue;
    if (f.type === 'check') out[f.k] = el.checked;

    else out[f.k] = el.value.trim() || null; }
  return out;

  const user = await cl.use('user');
  canWrite = user ? (user.canEdit ? await user.canEdit() : false) : false;
  for (const c of COLS) db.collection(c).onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S[c] = m; loaded.add(c); if (loaded.size === COLS.length && !ready) { ready = true; const h = location.hash.slice(1); if (S.people[h]) route = { view: 'person', id: h, tab: 'overview' }; } scheduleRender(); }, err => { if (!ready) { $('#view').innerHTML = `<div class="state"><h2>This dashboard is private</h2><p>Only the TA Head can see the review data.</p></div>`; } });
  if (canWrite) db.collection('log').orderBy('at', 'desc').limit(150).onSnapshot(snap => { LOG = snap.docs.map(d => d.data()); if (route.view === 'log') scheduleRender(); }, () => { });
  setTimeout(() => { if (!ready) { ready = true; scheduleRender(); } }, 8000);
})();
</script>
