<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TA Performance Dashboard</title>
<style>
/* Palette from BRD §17: Deep Navy, Muted Teal, Soft Blue-Grey, Charcoal on white.
   Status colours appear only beside an icon and text label. */
:root {
  --bg: #FFFFFF; --panel: #FFFFFF; --soft: #EEF3F5; --soft2: #F6F9FA; --line: #D7E0E5;
  --ink: #303A43; --muted: #5B6873; --navy: #18324A; --teal: #397A86; --teal-soft: #DCEBEE;
  --s1: #18324A; --s2: #397A86; --grid: #E4EAEE; --onnavy: #FFFFFF;
  --good: #1E7B34; --watch: #8A5A00; --bad: #B03030; --info: #397A86;
  --good-bg: #E5F2E8; --watch-bg: #FBF0D9; --bad-bg: #F8E3E3;
  --h1: #DCEBEE; --h2: #B5D5DB; --h3: #7FB3BD; --h4: #397A86; --h5: #18324A;
  --f: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181F; --panel: #172029; --soft: #1E2A35; --soft2: #1A242E; --line: #2E3D4A;
    --ink: #E3E9ED; --muted: #A6B3BD; --navy: #9CC0DE; --teal: #6FB3BF; --teal-soft: #1F3A40;
    --s1: #9CC0DE; --s2: #6FB3BF; --grid: #26333E; --onnavy: #11181F;
    --good: #7FCB8E; --watch: #E5B95C; --bad: #EE8C8C; --good-bg: #1C3324; --watch-bg: #3A2F17; --bad-bg: #3D2222;
    --h1: #1F3A40; --h2: #2A5A63; --h3: #3F7F8A; --h4: #6FB3BF; --h5: #B8E0E6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181F; --panel: #172029; --soft: #1E2A35; --soft2: #1A242E; --line: #2E3D4A;
  --ink: #E3E9ED; --muted: #A6B3BD; --navy: #9CC0DE; --teal: #6FB3BF; --teal-soft: #1F3A40;
  --s1: #9CC0DE; --s2: #6FB3BF; --grid: #26333E; --onnavy: #11181F;
  --good: #7FCB8E; --watch: #E5B95C; --bad: #EE8C8C; --good-bg: #1C3324; --watch-bg: #3A2F17; --bad-bg: #3D2222;
  --h1: #1F3A40; --h2: #2A5A63; --h3: #3F7F8A; --h4: #6FB3BF; --h5: #B8E0E6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f); }
a { color: var(--teal); }
button, select, input, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { color: var(--navy); margin: 0 0 .4em; line-height: 1.25; }
h1 { font-size: 22px; } h2 { font-size: 17px; } h3 { font-size: 15px; } h4 { font-size: 13.5px; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .mono { font-family: var(--mono); font-size: 12.5px; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: var(--onnavy); display: flex; align-items: center; gap: 12px; padding: 8px 16px; flex-wrap: wrap; }
.top .brand { font-weight: 600; font-size: 15px; margin-right: auto; display: flex; gap: 10px; align-items: center; }
.top .brand small { font-weight: 400; opacity: .8; }
.top label { font-size: 12px; opacity: .9; display: flex; align-items: center; gap: 6px; }
.top select, .top button { background: transparent; color: var(--onnavy); border: 1px solid rgba(255,255,255,.4); border-radius: 6px; padding: 4px 8px; }
:root[data-theme="dark"] .top select, :root[data-theme="dark"] .top button { border-color: rgba(0,0,0,.35); }
.top select option { color: #303A43; background: #fff; }
.mode { font-size: 11.5px; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,.18); }
.layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 50px); }
nav.side { border-right: 1px solid var(--line); padding: 14px 10px; background: var(--soft2); }
nav.side a { display: flex; gap: 8px; padding: 7px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; margin-bottom: 2px; }
nav.side a:hover { background: var(--soft); }
nav.side a.on { background: var(--teal-soft); color: var(--navy); font-weight: 600; }
nav.side .badge { margin-left: auto; background: var(--teal); color: #fff; border-radius: 10px; font-size: 11px; padding: 0 7px; }
nav.side .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 10px 4px; }
main { padding: 20px 24px 60px; max-width: 1280px; width: 100%; min-width: 0; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  nav.side { display: flex; overflow-x: auto; gap: 4px; padding: 6px 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  nav.side a { white-space: nowrap; margin: 0; } nav.side .sec { display: none; }
  main { padding: 16px; }
}

/* blocks */
.pagehead { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 14px; }
.pagehead .grow { flex: 1; min-width: 240px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; min-width: 0; }
.card.soft { background: var(--soft); border-color: transparent; }
.card > header { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
.card > header h2 { margin: 0; margin-right: auto; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 1100px) { .g5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .g2, .g3, .g4, .g5 { grid-template-columns: 1fr; } }
.kpi { background: var(--soft); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.kpi .lab { font-size: 12px; color: var(--muted); }
.kpi .val { font-size: 24px; font-weight: 600; color: var(--navy); line-height: 1.2; margin: 2px 0; font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: 13px; color: var(--muted); font-weight: 400; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi details { margin-top: 6px; font-size: 12px; }
.kpi details summary { cursor: pointer; color: var(--teal); }
.pbar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 6px 0 2px; }
.pbar span { display: block; height: 100%; background: var(--teal); border-radius: 3px; }

.chip { display: inline-flex; gap: 4px; align-items: center; font-size: 11.5px; border-radius: 10px; padding: 1px 8px; white-space: nowrap; border: 1px solid transparent; background: var(--soft); color: var(--ink); }
.st-good, .st-brd, .st-approved { background: var(--good-bg); color: var(--good); }
.st-watch, .st-prov, .st-pending { background: var(--watch-bg); color: var(--watch); }
.st-below { background: var(--bad-bg); color: var(--bad); }
.st-none { background: var(--soft); color: var(--muted); }
.tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.tag.calc { color: var(--teal); border-color: var(--teal); }
.conf { background: var(--bad-bg); color: var(--bad); font-size: 11.5px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }

.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--teal); }
.btn.pri { background: var(--navy); color: var(--onnavy); border-color: var(--navy); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn.link { border: 0; background: none; color: var(--teal); padding: 2px 4px; text-decoration: underline; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
.filters label, .field { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 3px; }
select, input[type=text], input[type=date], input[type=number], textarea { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--panel); min-width: 0; }
textarea { width: 100%; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--soft2); position: sticky; top: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--soft2); }
tr.grp td { background: var(--soft); font-weight: 600; color: var(--navy); }
tr.err td { background: var(--bad-bg); } tr.warn td { background: var(--watch-bg); } tr.excl td { opacity: .5; text-decoration: line-through; }
td[contenteditable] { outline: 1px dashed var(--line); }

/* charts */
.chart { margin: 0; min-width: 0; }
.chart figcaption { font-weight: 600; color: var(--navy); font-size: 13px; margin-bottom: 4px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--muted); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; }
.chart .ax.miss { fill: var(--bad); font-weight: 700; }
.chart .dl { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
.chart .bar { fill: var(--s1); }
.chart .bar.partial { fill: none; stroke: var(--s1); stroke-width: 1.5; stroke-dasharray: 3 2; }
.chart .target { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.chart .line { fill: none; stroke-width: 2; }
.chart .line.s1 { stroke: var(--s1); } .chart .line.s2 { stroke: var(--s2); }
.chart .line.dashed { stroke-dasharray: 6 4; }
.chart .line.s3 { stroke: var(--muted); stroke-dasharray: 2 3; }
.chart .mk { stroke: var(--panel); stroke-width: 2; } .chart .mk.s1 { fill: var(--s1); } .chart .mk.s2 { fill: var(--s2); } .chart .mk.s3 { fill: var(--muted); }
.chart .hit { fill: transparent; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
.lg { display: inline-flex; gap: 6px; align-items: center; }
.sw { display: inline-block; width: 16px; height: 10px; border-radius: 2px; }
.sw.bar { background: var(--s1); } .sw.bar.partial { background: none; border: 1.5px dashed var(--s1); }
.sw.target { height: 0; border-top: 2px dashed var(--ink); border-radius: 0; }
.sw.line { height: 0; border-top: 2.5px solid; border-radius: 0; } .sw.line.s1 { border-color: var(--s1); } .sw.line.s2 { border-color: var(--s2); }
.sw.line.dashed { border-top-style: dashed; } .sw.line.s3 { border-color: var(--muted); border-top-style: dotted; }
.empty { color: var(--muted); font-style: italic; padding: 16px 0; }
.hb { display: flex; flex-direction: column; gap: 6px; }
.hb-row { display: grid; grid-template-columns: minmax(110px, 200px) 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; }
.hb-lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-track { position: relative; height: 14px; background: var(--soft); border-radius: 3px; }
.hb-bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s1); border-radius: 0 3px 3px 0; }
.hb-bar.alt { background: var(--s2); }
.hb-ref { position: absolute; top: -3px; bottom: -3px; border-left: 2px dashed var(--ink); z-index: 1; }
.hb-val { font-variant-numeric: tabular-nums; min-width: 60px; text-align: right; display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
.hg { display: flex; gap: 10px; align-items: flex-end; height: 170px; padding-top: 10px; }
.hg-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.hg-bar { width: 70%; background: var(--s1); border-radius: 3px 3px 0 0; min-height: 1px; }
.hg-n { font-size: 12px; font-weight: 600; } .hg-lab { font-size: 11px; color: var(--muted); margin-top: 4px; }
#tip { position: fixed; z-index: 100; pointer-events: none; background: var(--navy); color: var(--onnavy); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 320px; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.18); }

/* heatmap */
.hm td.c { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 44px; }
.hm .v1 { background: var(--h1); } .hm .v2 { background: var(--h2); } .hm .v3 { background: var(--h3); color: #fff; }
.hm .v4 { background: var(--h4); color: #fff; } .hm .v5 { background: var(--h5); color: #fff; }
:root[data-theme="dark"] .hm .v5, :root[data-theme="dark"] .hm .v4 { color: #11181F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hm .v5, :root:not([data-theme="light"]) .hm .v4 { color: #11181F; } }
.hm .gneg { box-shadow: inset 0 -3px 0 var(--bad); }

/* DMAIC */
.dmaic { list-style: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 0; margin: 8px 0; }
.dm { text-align: center; padding: 6px 2px; border-radius: 6px; background: var(--soft); font-size: 12px; }
.dm.done { background: var(--teal-soft); } .dm.prog { outline: 1.5px dashed var(--teal); }
.dm-dot { display: block; color: var(--teal); font-size: 14px; } .dm-st { display: block; font-weight: 600; color: var(--navy); } .dm-lab { display: block; color: var(--muted); font-size: 11px; }

/* misc */
.note { border-left: 3px solid var(--teal); background: var(--soft2); padding: 8px 12px; font-size: 12.5px; margin: 8px 0; border-radius: 0 6px 6px 0; }
.note.warn { border-color: var(--watch); }
.fact { font-size: 12px; font-weight: 700; color: var(--navy); letter-spacing: .04em; }
.sugg { font-size: 12px; font-weight: 700; color: var(--teal); letter-spacing: .04em; }
.rec { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.rec pre { white-space: pre-wrap; font: inherit; margin: 2px 0 6px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.steps span { padding: 4px 10px; border-radius: 14px; background: var(--soft); font-size: 12px; color: var(--muted); }
.steps span.on { background: var(--navy); color: var(--onnavy); } .steps span.done { background: var(--teal-soft); color: var(--navy); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 7px 12px; border-bottom: 2px solid transparent; cursor: pointer; color: var(--muted); }
.tabs button.on { border-color: var(--navy); color: var(--navy); font-weight: 600; }
.secnav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; position: sticky; top: 50px; background: var(--bg); padding: 6px 0; z-index: 5; }
.secnav a { font-size: 12.5px; padding: 3px 10px; border-radius: 12px; background: var(--soft); color: var(--navy); text-decoration: none; }
.hdr { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
.hdr dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 16px; margin: 6px 0 0; }
.hdr dt { font-size: 11.5px; color: var(--muted); } .hdr dd { margin: 0; font-weight: 600; }
.alert { display: flex; gap: 10px; flex-wrap: wrap; background: var(--watch-bg); color: var(--ink); padding: 8px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; max-width: min(720px, 94vw); width: 100%; background: var(--panel); color: var(--ink); }
dialog::backdrop { background: rgba(10, 20, 30, .45); }
dialog .dh { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
dialog .db { padding: 16px 18px; max-height: 70vh; overflow: auto; }
dialog .df { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 600px) { .formgrid { grid-template-columns: 1fr; } }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--navy); color: var(--onnavy); padding: 8px 16px; border-radius: 8px; z-index: 200; font-size: 13px; }

/* report document (screen preview + print) */
#report-root { display: none; }
.rdoc { background: #fff; color: #303A43; max-width: 820px; margin: 0 auto; padding: 28px 34px; border: 1px solid #D7E0E5; }
.rdoc h1 { color: #18324A; font-size: 20px; } .rdoc h2 { color: #18324A; font-size: 15px; border-bottom: 2px solid #18324A; padding-bottom: 3px; margin-top: 18px; }
.rdoc h3 { color: #397A86; font-size: 13px; margin-top: 12px; }
.rdoc table { font-size: 11.5px; } .rdoc th { background: #EEF3F5; color: #303A43; }
.rdoc .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 14px; font-size: 11px; background: #EEF3F5; padding: 8px 10px; border-radius: 4px; }
.rdoc .pb { page-break-before: always; break-before: page; }
.rdoc .wm { color: #8A5A00; font-weight: 700; font-size: 11px; }
.rdoc .chart svg { max-height: 200px; }
@media print {
  body.printing > *:not(#report-root) { display: none !important; }
  body.printing #report-root { display: block !important; }
  .rdoc { border: 0; padding: 0; max-width: none; }
  .noprint { display: none !important; }
  @page { size: A4; margin: 14mm; }
}
</style>
</head>
<body>
<div class="top" role="banner">
  <div class="brand">TA Performance &amp; Development <small id="period-label"></small> <span class="mode" id="mode-label"></span></div>
  <label>Signed in as <select id="role-sel" aria-label="Role"></select></label>
  <label id="emp-sel-wrap">Person <select id="emp-sel" aria-label="Person"></select></label>
  <button id="theme-btn" type="button" aria-label="Toggle dark mode">◐ Theme</button>
</div>
<div class="layout">
  <nav class="side" id="nav" aria-label="Pages"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="tip" role="tooltip"></div>
<dialog id="dlg"><div class="dh"><h2 id="dlg-title"></h2><button class="btn sm" type="button" onclick="closeDlg()" aria-label="Close">✕</button></div><div class="db" id="dlg-body"></div><div class="df" id="dlg-foot"></div></dialog>
<div id="report-root"></div>

<!-- SheetJS for .xlsx export; without internet the dashboard falls back to Excel 2003 XML (.xls). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/views.js"></script>
<script src="js/actions.js"></script>
<script src="js/import.js"></script>
<script src="js/reports.js"></script>
<script>boot();</script>
</body>
</html>
