  const decide = k => head && R.status[k] && R.status[k][0] === 'pending' ? `<button class="btn sm" onclick="approveRule('${k}')">Record decision</button>` : '';
  const rows = [
    ['pointsTable', 'Hiring points table', `<select ${admin ? '' : 'disabled'} onchange="setRule('pointsTable',this.value)">${Object.entries(POINT_TABLES).map(([k, v]) => `<option value="${k}" ${R.pointsTable === k ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}</select>`],
 ['offerFormula', 'Offer Delivery & Complexity formula (40)', `<select ${admin ? '' : 'disabled'} onchange="setRule('offerFormula',this.value)"><option value="P" ${R.offerFormula === 'P' ? 'selected' : ''}>P Points vs points target (offer target × points per offer)</option><option value="O1" ${R.offerFormula === 'O1' ? 'selected' : ''}>O1 Points attainment</option><option value="O2" ${R.offerFormula === 'O2' ? 'selected' : ''}>O2 Volume 28 + complexity 12</option><option value="O3" ${R.offerFormula === 'O3' ? 'selected' : ''}>O3 Banded attainment</option></select>`],
    ['pointsPerOffer', 'Points per offer (default for points target)', `<input type="number" step="0.1" style="width:64px" ${admin ? '' : 'disabled'} value="${R.pointsPerOffer}" onchange="setRule('pointsPerOffer',+this.value)"> points; areas can override in Team Setup`],
    ['gate', 'Volume gate (offer-count floor; 0 = off)', `below <input type="number" step="5" style="width:64px" ${admin ? '' : 'disabled'} value="${R.gate.g * 100}" onchange="setRule('gate.g',this.value/100)">% volume → cap at <input type="number" step="5" style="width:64px" ${admin ? '' : 'disabled'} value="${R.gate.c * 100}" onchange="setRule('gate.c',this.value/100)">% of 40`],
    ['tlModel', 'Team Lead scorecard', `<select ${admin ? '' : 'disabled'} onchange="setRule('tlModel',this.value)"><option value="TL-A" ${R.tlModel === 'TL-A' ? 'selected' : ''}>TL-A: team 35 + own 35, projects 15, competency 15</option><option value="TL-B" ${R.tlModel === 'TL-B' ? 'selected' : ''}>TL-B: team 40 + own 20, leadership 20, competency 20</option></select>`],
    ['tlTargetShare', 'Team Lead own offer target', `<input type="number" step="5" style="width:64px" ${admin ? '' : 'disabled'} value="${R.tlTargetShare * 100}" onchange="setRule('tlTargetShare',this.value/100)">% of a team member's target`],
    ['jrBands', 'Joining ratio bands', R.jrBands.map(b => `≥${b[0]}% → ${b[1]}`).join(' · ')],
    ['jrException', 'Joining ratio exception threshold', `<input type="number" style="width:64px" ${admin ? '' : 'disabled'} value="${R.jrException}" onchange="setRule('jrException',+this.value)">%`],
    ['ctBands', 'Cycle time bands', `&lt;${R.ctBands.strong} = 10 · ${R.ctBands.strong}–${R.ctBands.acceptable} = 7 · &gt;${R.ctBands.acceptable} = 4`],
    ['vendorBands', 'Vendor usage bands', `&lt;${R.vendorBands.low}% = 5 · ${R.vendorBands.low}–${R.vendorBands.high}% = 3 · &gt;${R.vendorBands.high}% = 1`],
    ['vendorExcluded', 'Vendor denominator exclusions', CATEGORIES.map(c => `<label class="small" style="display:inline-block;margin-right:8px"><input type="checkbox" ${admin ? '' : 'disabled'} ${R.vendorExcluded.includes(c) ? 'checked' : ''} onchange="toggleVendorEx('${esc(c)}',this.checked)"> ${esc(c)}</label>`).join('')],
    ['repeatMissN', 'Repeated misses = consecutive cycles', `<input type="number" style="width:64px" ${admin ? '' : 'disabled'} value="${R.repeatMissN}" onchange="setRule('repeatMissN',+this.value)">`],
    ['stalledDays', 'Stalled project = days since validation', `<input type="number" style="width:64px" ${admin ? '' : 'disabled'} value="${R.stalledDays}" onchange="setRule('stalledDays',+this.value)">`],
    ['belowTargetBy', 'Competency materially below target by more than', `<input type="number" style="width:64px" ${admin ? '' : 'disabled'} value="${R.belowTargetBy}" onchange="setRule('belowTargetBy',+this.value)"> level(s)`],
    ['gapThreshold', 'Self vs TA Head gap flagged when more than', `<input type="number" style="width:64px" ${admin ? '' : 'disabled'} value="${R.gapThreshold}" onchange="setRule('gapThreshold',+this.value)"> level(s)`],
  ];
  const conflict = CATEGORIES.map(c => { const a = POINT_TABLES.S53.rows[c], b = POINT_TABLES.A3.rows[c]; const diff = a[0] !== b[0] || a[1] !== b[1];
    return `<tr class="${diff ? 'warn' : ''}"><td>${esc(c)}</td><td class="n">${a[0]}</td><td>${a[1] ? '+0.5' : 'None'}</td><td class="n">${b[0]}</td><td>${b[1] ? '+0.5' : 'None'}</td><td>${diff ? '▲ Conflict' : '—'}</td></tr>`; }).join('');
  return `<div class="pagehead"><div class="grow"><h1>Rules &amp; settings</h1><p class="muted">Rule version <span class="mono">${esc(R.version)}</span>. ${admin ? 'Changes need a reason and are audited; they create a new rule version.' : head ? 'Administrators maintain rules. As TA Head you record decisions on pending items.' : ''} Pending items are placeholders: every score that depends on them is shown as provisional.</p></div></div>
  <section class="card"><div class="tbl-wrap"><table><thead><tr><th>Rule</th><th>Current setting</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r[1])}</td><td>${r[2]}</td><td>${st(r[0])}</td><td>${decide(r[0])}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="card"><header><h2>Hiring points: BRD §5.3 vs Appendix A3</h2>${st('pointsTable')}</header><div class="tbl-wrap"><table><thead><tr><th>Category</th><th class="n">§5.3 base</th><th>§5.3 women bonus</th><th class="n">A3 base</th><th>A3 women bonus</th><th></th></tr></thead><tbody>${conflict}</tbody></table></div>
  <p class="small muted">BRD acceptance tests (SG10 woman 3.5, NATS woman 1.5, AICTE woman 2.0) hold under both tables, so they cannot settle the conflict.</p></section>
  <section class="card"><header><h2>Working-day calendar (sample)</h2>${statusChip('pending', true, 'D-09')}</header><p class="small">${HOLIDAYS.map(h => D.nice(h[0]) + ' ' + esc(h[1])).join(' · ')}</p></section>
  <section class="card"><header><h2>Confidential data access</h2></header><p class="small">Administrators do not see TA Head comments, ratings rationale, rating history or promotion notes. Access needs an approved, time-limited break-glass request (D-27).</p>
   ${admin ? `<button class="btn sm" onclick="breakGlassDlg()">Request break-glass access</button>` : ''}
   ${state.breakGlass.length ? `<table><thead><tr><th>Requested</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>${state.breakGlass.map((b, i) => `<tr><td>${esc(b.at)}</td><td>${esc(b.reason)}</td><td>${esc(b.status)}</td><td>${head && b.status === 'Pending' ? `<button class="btn sm" onclick="decideBreakGlass(${i},'Approved for 24h')">Approve 24h</button><button class="btn sm" onclick="decideBreakGlass(${i},'Rejected')">Reject</button>` : ''}</td></tr>`).join('')}</tbody></table>` : ''}</section>`;
};

// ================= AUDIT =================
VIEWS.audit = () => {
  const list = state.audit.filter(a => ui.role !== 'importer' || /Import/.test(a.action));
  return `<div class="pagehead"><div class="grow"><h1>Audit log</h1><p class="muted">Append-only record of imports, amendments, overrides, ratings, rule changes, report versions and access.</p></div><button class="btn sm" onclick="download('Audit_log.csv', toCSV([['When','Who','Action','Object','Detail','Reason']].concat(state.audit.map(a=>[a.at,a.who,a.action,a.object,a.detail,a.reason]))),'text/csv')">Download Excel</button></div>
  <section class="card"><div class="tbl-wrap"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Object</th><th>Detail</th><th>Reason</th></tr></thead><tbody>${list.map(a => `<tr><td class="mono">${esc(a.at)}</td><td>${esc(a.who)}</td><td>${esc(a.action)}</td><td>${esc(a.object)}</td><td class="small">${esc(a.detail)}</td><td class="small">${esc(a.reason)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No entries.</td></tr>'}</tbody></table></div></section>`;
};

// ================= GUIDE =================
VIEWS.guide = () => `<div class="pagehead"><div class="grow"><h1>How to use this dashboard</h1></div></div>
 ${session && session.kind === 'member' ? `<section class="card"><h2>Your performance file</h2><ol>
  <li><b>My Performance</b> shows only your own record: points against your points target, joining, cycle time, vendor usage, projects, competencies and development plan.</li>
  <li>Complete your <b>self-assessment</b>, update <b>projects</b> and <b>learning</b>, and answer requests in your <b>Inbox</b>.</li>
  <li>Click <b>Export my responses</b> (top right) and send the file to your TA Head. Changes are not saved in the browser until you export them.</li>
  <li><b>Reports</b> lets you download your own reports.</li></ol></section>`
 : `<section class="card"><h2>Getting started (TA Head)</h2><ol>
  <li>Sign in with <b>${esc(TA_HEAD_EMAIL)}</b> and your passphrase. The workspace is encrypted in this browser.</li>
  <li><b>Team Setup</b>: restore your team file, then add, rename or remove people and set teams, roles and each person's <b>annual points target</b>.</li>
  <li><b>Data Import</b>: paste or upload offers or recruiter scorecards (with weighted points). Review, fix and approve.</li>
  <li><b>Create personal files</b> (Team Setup) for each person and send each passphrase separately. People see only their own performance.</li>
  <li><b>Import employee responses</b> (Requests page) when people send their responses file back.</li>
  <li>Use <b>Member View</b>, <b>Compare</b>, <b>Annual Review</b> and <b>Talent &amp; Promotion</b> for the overall view; <b>Reports</b> for PDF and Excel.</li>
  <li><b>Export an encrypted backup</b> regularly (Team Setup).</li></ol>
  <p class="small muted">"View as" previews what each role sees; it does not change who can open the data.</p></section>`}
 <section class="card"><h2>How performance is assessed</h2><p>Delivery is assessed on <b>weighted hiring points</b> against a <b>points target</b> (offer target × ${state.rules.pointsPerOffer}, or a personal target set by the TA Head). Offer Delivery &amp; Complexity = 40 × points ÷ points target, capped at 40. Scores marked ${statusChip('prov')} depend on rules still awaiting decisions (see <span class="mono">SYSTEM_DESIGN.md</span> §8). Metrics are evidence for discussion, not a substitute for managerial judgement.</p></section>`;

</script>
<script>
/* User actions: dialogs and state changes. Every change that matters is audited. */

const opt = (arr, cur) => arr.map(v => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('');
const ratingSel = (id, cur) => `<select id="${id}">${[1, 2, 3, 4, 5].map(v => `<option value="${v}" ${v === cur ? 'selected' : ''}>${v} · ${LEVEL_ANCHORS[v]}</option>`).join('')}</select>`;
const nextPeriod = id => { const h = state.assessments[id] || []; const order = ['Baseline', 'Q1', 'Q2', 'Q3', 'Q4']; const last = h.length ? order.indexOf(h[h.length - 1].period) : -1; return order[Math.min(order.length - 1, last + 1)]; };

// ---------- offers ----------
function offersDlg(id) {
  const b = metrics(id).own;
  const rows = b.offers.map(o => { const p = pointsFor(o); return `<tr><td class="mono">${esc(o.req)}</td><td class="mono">${esc(o.cand)}</td><td>${D.nice(o.offerDate)}</td><td>${esc(o.cat)}</td><td>${esc(o.sg)}</td><td>${esc(o.gender)}</td><td class="n">${p.base}</td><td class="n">${p.bonus}</td><td class="n">${p.total}</td><td class="n">${cycleDays(o)}${o.exc ? ` <span class="chip" data-tip="${esc(o.exc.reason + ' · ' + o.exc.status)}">excl.</span>` : ''}</td><td>${esc(o.status)}</td><td>${esc(o.source)}</td><td>${o.confirmed ? '✓' : ''}</td>${isHead() ? `<td><button class="btn sm" onclick="exceptionDlg('${o.id}')">Exception</button></td>` : ''}</tr>`; }).join('');
  openDlg('Offer details — ' + emp(id).name, `<p class="small muted">${b.offers.length} offers to ${D.nice(PERIOD.cutoff)}. Points use ${esc(POINT_TABLES[state.rules.pointsTable].label)}. ✓ = confirmed by employee.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Req</th><th>Candidate</th><th>Offer date</th><th>Category</th><th>SG</th><th>Gender</th><th class="n">Base</th><th class="n">Bonus</th><th class="n">Total</th><th class="n">Cycle days</th><th>Joining</th><th>Source</th><th>Conf.</th>${isHead() ? '<th></th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>`,
    [{ label: 'Download Excel', onClick: () => { sectionReport(id, 'offers', 'xls'); return false; } }, { label: 'Close', cls: 'pri' }]);
  document.getElementById('dlg').style.maxWidth = '1100px';
}
function exceptionDlg(oid) {
  const o = state.offers.find(x => x.id === oid);
  openDlg('Cycle-time exception — ' + o.req, `<p class="small">Original cycle time <b>${cycleDays(o)} days</b> stays visible. An approved exception removes it from the scored average.</p>
   <div class="formgrid"><label class="field">Reason (list pending D-12)<select id="x-r">${opt(['Business hold', 'Hiring-manager delay', 'Approval delay', 'Niche search', 'Other'], o.exc && o.exc.reason)}</select></label>
   <label class="field">Decision<select id="x-s">${opt(['Approved', 'Rejected', 'Remove exception'], o.exc && o.exc.status)}</select></label></div><label class="field">Justification<textarea id="x-j" rows="2"></textarea></label>`,
    [{ label: 'Cancel' }, { label: 'Save', cls: 'pri', onClick: () => { const j = val('x-j'); if (!requireReason(j)) return false; const s = val('x-s');
      const before = o.exc ? o.exc.status : 'none';
      o.exc = s === 'Remove exception' ? null : { reason: val('x-r'), status: s, by: 'TA Head', at: nowStamp(), note: j };
      audit('Cycle-time exception', o.req, `${before} → ${o.exc ? o.exc.status : 'none'} (${val('x-r')})`, j); touch(); render(); toast('Exception saved'); } }]);
}

// ---------- overrides ----------
function overrideDlg(id, k) {
  const names = { offer: ['Offer Delivery & Complexity', 40], jr: ['Joining Ratio', 15], ct: ['Req-to-Offer Cycle Time', 10], vendor: ['Vendor Usage', 5] };
  const m = metrics(id); const part = m.ownDel.parts.find(p => p.k === k);
  const ex = state.overrides.find(o => o.emp === id && o.measure === k);
  openDlg('Override — ' + names[k][0], `<p class="small">Calculated value: <b>${part.original == null ? '—' : part.original}</b> / ${names[k][1]}. Overrides keep the original value, and need a justification and evidence (BRD §14).</p>
   <div class="formgrid"><label class="field">Revised score<input type="number" id="ov-v" min="0" max="${names[k][1]}" step="0.5" value="${ex ? ex.revised : ''}"></label><label class="field">Evidence link<input type="text" id="ov-e" value="${ex ? esc(ex.evidence || '') : ''}"></label></div>
   <label class="field">Justification (required)<textarea id="ov-r" rows="3">${ex ? esc(ex.reason) : ''}</textarea></label>`,
    [ex ? { label: 'Remove override', onClick: () => { askText('Remove override', 'Reason for removing the override:', r => { state.overrides = state.overrides.filter(o => o !== ex); audit('Override removed', emp(id).name + ' · ' + names[k][0], `${ex.revised} → calculated ${part.original}`, r); touch(); render(); }); return false; } } : { label: 'Cancel' },
     { label: 'Save override', cls: 'pri', onClick: () => { const v = parseFloat(val('ov-v')), r = val('ov-r'); if (isNaN(v) || v < 0 || v > names[k][1]) { toast('Enter a score between 0 and ' + names[k][1]); return false; } if (!requireReason(r)) return false;
       state.overrides = state.overrides.filter(o => !(o.emp === id && o.measure === k));
       state.overrides.push({ emp: id, measure: k, original: part.original, revised: v, reason: r, evidence: val('ov-e'), by: 'TA Head', at: nowStamp() });
       audit('Score override', emp(id).name + ' · ' + names[k][0], `${part.original} → ${v}`, r); touch(); render(); toast('Override saved and audited'); } }]);
}

// ---------- assessments ----------
function assessForm(id, who) {
  const e = emp(id), last = (state.assessments[id] || []).slice(-1)[0];
  return `<p class="small muted">Rate each competency 1–5 with an example. Previous ratings are kept; this creates a new dated record.</p><div class="tbl-wrap"><table><thead><tr><th>Competency</th><th>Previous</th><th>Rating</th><th>Evidence / example</th></tr></thead><tbody>
   ${COMPETENCIES.map((c, i) => `<tr><td>${esc(c)}<br><span class="muted small">Target ${e.targets[c]}</span></td><td class="n">${last && last[who][c] != null ? last[who][c] : '—'}</td><td>${ratingSel('as-' + i, last && last[who][c] != null ? last[who][c] : 3)}</td><td><input type="text" id="ae-${i}" style="width:100%" placeholder="Specific example"></td></tr>`).join('')}</tbody></table></div>`;
}
function selfAssessDlg(id) {
  const h = state.assessments[id] || [], last = h[h.length - 1];
  const per = last && last.selfPending ? last.period : nextPeriod(id);
  openDlg(`Self-assessment — ${per}`, assessForm(id, 'self'), [{ label: 'Cancel' }, { label: 'Submit', cls: 'pri', onClick: () => saveAssessment(id, per, 'self') }]);
}
function mgrAssessDlg(id) {
  const h = state.assessments[id] || [];
  const last = h[h.length - 1];
  const per = last && !last.mgrPending ? nextPeriod(id) : (last ? last.period : 'Baseline');
  openDlg(`TA Head assessment — ${emp(id).name} — ${per}`, assessForm(id, 'mgr') + '<p class="small muted">Rate independently. The self-rating for this period is shown on the dashboard after you submit.</p>',
    [{ label: 'Cancel' }, { label: 'Submit', cls: 'pri', onClick: () => saveAssessment(id, per, 'mgr') }]);
}
function saveAssessment(id, per, who) {
  const h = state.assessments[id] = state.assessments[id] || [];
  let rec = h.find(a => a.period === per);
  const vals = {}, ev = {};
  COMPETENCIES.forEach((c, i) => { vals[c] = +val('as-' + i); ev[c] = val('ae-' + i); });
  if (!rec) {
    const last = h[h.length - 1];
    rec = { period: per, date: per === 'Q4' ? '2026-12-15' : D.fmt(Date.now()), self: {}, mgr: {}, selfEvidence: {}, mgrEvidence: {}, by: who };
    rec[who === 'self' ? 'mgrPending' : 'selfPending'] = true;
    h.push(rec);
  } else delete rec[who === 'self' ? 'selfPending' : 'mgrPending'];
  rec[who] = vals; rec[who === 'self' ? 'selfEvidence' : 'mgrEvidence'] = ev;
  if (who === 'self') state.review[id] && (state.review[id].selfDone = true);
  audit(who === 'self' ? 'Self-assessment submitted' : 'TA Head assessment submitted', emp(id).name + ' · ' + per, COMPETENCIES.map(c => c.split(' ')[0] + ' ' + vals[c]).join(', '));
  touch(); render(); toast('Saved. Earlier ratings remain in history.');
}

function afiDlg(id) {
  openDlg('Add area for improvement', `<div class="formgrid"><label class="field">Area<select id="af-a">${opt(COMPETENCIES.concat(['Delivery consistency', 'Data quality', 'Other']))}</select></label><label class="field">Target date<input type="date" id="af-d" value="${D.add(PERIOD.cutoff, 60)}"></label></div>
   <label class="field">Evidence / observation<textarea id="af-e" rows="2"></textarea></label><label class="field">Expected behaviour<input type="text" id="af-x"></label><label class="field">Action and support<input type="text" id="af-c"></label>`,
    [{ label: 'Cancel' }, { label: 'Add', cls: 'pri', onClick: () => { if (!requireReason(val('af-e'))) return false; (state.afi[id] = state.afi[id] || []).push({ area: val('af-a'), evidence: val('af-e'), expected: val('af-x'), action: val('af-c'), due: val('af-d'), status: 'Open' }); audit('Observation added', emp(id).name, val('af-a')); touch(); render(); } }]);
}

// ---------- projects ----------
function projectDlg(id) {
  openDlg('New improvement project', `<label class="field">Title<input type="text" id="pj-t"></label><label class="field">Business problem<textarea id="pj-p" rows="2"></textarea></label>
   <div class="formgrid"><label class="field">Metric<input type="text" id="pj-m"></label><label class="field">Sponsor<input type="text" id="pj-s"></label><label class="field">Baseline<input type="number" id="pj-b"></label><label class="field">Target<input type="number" id="pj-g"></label><label class="field">Start<input type="date" id="pj-st" value="${D.fmt(Date.now())}"></label><label class="field">Planned end<input type="date" id="pj-e" value="${D.add(D.fmt(Date.now()), 180)}"></label></div>`,
    [{ label: 'Cancel' }, { label: 'Create', cls: 'pri', onClick: () => { if (!requireReason(val('pj-t'))) return false; const st = val('pj-st'), en = val('pj-e'), span = Math.max(5, D.diff(en, st));
      const p = { id: 'P-' + String(state.projects.length + 1).padStart(3, '0'), owner: id, title: val('pj-t'), problem: val('pj-p'), metric: val('pj-m'), baseline: +val('pj-b'), target: +val('pj-g'), actual: null, sponsor: val('pj-s'), start: st, planEnd: en,
        stage: -1, inProgress: 0, lastValidated: st, planStages: [1, 2, 3, 4, 5].map(i => D.add(st, Math.round(span * i / 5))), history: [], nextAction: 'Complete Define stage evidence', contributing: false, mgrScore: null, selfScore: null, lessons: '' };
      state.projects.push(p); audit('Project created', p.id, p.title); touch(); render(); } }]);
}
function validateStage(pid) {
  const p = state.projects.find(x => x.id === pid); const next = DMAIC[p.stage + 1];
  openDlg(`Validate ${next} — ${p.title}`, `<p class="small">Confirm the stage evidence is sufficient. Labelling a stage complete does not by itself earn points.</p><label class="field">Evidence reviewed (link or description)<textarea id="vs-e" rows="2"></textarea></label>`,
    [{ label: 'Cancel' }, { label: 'Validate stage', cls: 'pri', onClick: () => { const ev = val('vs-e'); if (!requireReason(ev)) return false;
      p.stage++; p.inProgress = p.stage < 4 ? p.stage + 1 : null; p.lastValidated = D.fmt(Date.now()); p.history.push({ stage: next, validated: p.lastValidated, by: 'TA Head', evidence: ev });
      audit('DMAIC stage validated', p.id + ' · ' + emp(p.owner).name, next, ev); touch(); render(); } }]);
}
function projectScoreDlg(pid, who) {
  const p = state.projects.find(x => x.id === pid); const s = (who === 'mgr' ? p.mgrScore : p.selfScore) || {};
  const f = (k, lab, max) => `<label class="field">${lab} (0–${max})<input type="number" min="0" max="${max}" id="ps-${k}" value="${s[k] != null ? s[k] : ''}"></label>`;
  openDlg((who === 'mgr' ? 'Score project — ' : 'Self-score project — ') + p.title, `<div class="formgrid">${f('discipline', 'Project discipline & execution', 5)}${f('impact', 'Demonstrated business impact', 5)}${f('control', 'Sustainability / control', 3)}${f('learning', 'Learning & knowledge sharing', 2)}</div>
   <p class="small muted">Scoring anchors are not yet defined (D-33). Full marks need evidence and impact, not only completed stages.</p>${who === 'mgr' ? '<label class="field">Rationale<textarea id="ps-r" rows="2"></textarea></label>' : ''}`,
    [{ label: 'Cancel' }, { label: 'Save', cls: 'pri', onClick: () => {

function suggestIDP(id) {
  const m = metrics(id); if (!m.latest) { toast('No assessment yet to base suggestions on.'); return; }
  const gaps = COMPETENCIES.map(c => ({ c, g: m.e.targets[c] - m.latest.mgr[c], v: m.latest.mgr[c] })).filter(x => x.g > 0).sort((a, b) => b.g - a.g).slice(0, 3);
  if (!gaps.length) { toast('No validated gaps against target.'); return; }
  const list = state.idp[id] = state.idp[id] || [];
  for (const x of gaps) { if (list.some(i => i.area === x.c)) continue; const L = IDP_LIBRARY[x.c];
    list.push({ id: 'I-' + id + '-' + (list.length + 1), area: x.c, current: x.v, target: m.e.targets[x.c], training: L[0], cert: L[1], stretch: L[2], application: L[3], evidence: 'TA Head-validated example of ' + LEVEL_ANCHORS[m.e.targets[x.c]].toLowerCase() + ' behaviour', due: (PERIOD.year + 1) + '-09-30', status: 'Draft', source: 'Suggestion' }); }
  audit('IDP suggestions drafted', emp(id).name, gaps.map(g => g.c).join(', '), 'From validated gaps; awaiting TA Head approval'); touch(); render(); toast('Draft suggestions added — approve, edit or reject each.');

function normDate(v) {
  v = String(v || '').trim(); if (!v) return '';
  let m;
  if ((m = v.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return iso(m[1], m[2], m[3]);

   <div class="filters"><label>Show <select onchange="impState().filter=this.value;render()">${[['all', 'All rows'], ['error', 'Errors'], ['warn', 'Warnings'], ['ok', 'OK'], ['excluded', 'Excluded']].map(([k, l]) => `<option value="${k}" ${f === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>

     ${cols.map(c => `<td contenteditable="true" data-r="${r.n}" data-k="${c[0]}" onblur="impEdit(this)">${esc(r.v[c[0]])}</td>`).join('')}<td><input type="checkbox" aria-label="Exclude row ${r.n}" ${r.excluded ? 'checked' : ''} onchange="impExclude(${r.n},this.checked)"></td></tr>`).join('')}</tbody></table></div>
   ${shown.length > 300 ? `<p class="small muted">Showing first 300 of ${shown.length}. Use the filter or the error report.</p>` : ''}
   <div class="actions" style="margin-top:10px"><button class="btn" onclick="impState().step=2;render()">Back</button><button class="btn pri" ${cnt('error') ? 'disabled' : ''} onclick="impState().step=4;render()">Continue to approval</button>${cnt('error') ? '<span class="small" style="color:var(--bad)">Fix or exclude error rows first.</span>' : ''}</div></section>`;
}
function impEdit(td) {
  const im = impState(), r = im.records.find(x => x.n === +td.dataset.r); const nv = td.textContent.trim();
  if (r.v[td.dataset.k] !== nv) { (r.edits = r.edits || []).push([td.dataset.k, r.v[td.dataset.k], nv]); r.v[td.dataset.k] = nv; }
}
function impExclude(n, on) { const r = impState().records.find(x => x.n === n); r.excluded = on; render(); }
function impErrorReport() {
  const im = impState(), ds = IMPORT_DATASETS[im.dataset]; const cols = ds.fields.filter(x => im.mapping[x[0]] != null);
  download('import_error_report.csv', toCSV([['Row', 'Status', 'Messages', ...cols.map(c => c[1])]].concat(im.records.filter(r => r.status !== 'ok').map(r => [r.n, r.status, r.msgs.map(m => m[1]).join('; '), ...cols.map(c => r.v[c[0]])]))), 'text/csv');
}

function impStep4() {
  const im = impState(); const recs = im.records.filter(r => !r.excluded && r.status !== 'error');
  const upd = recs.filter(r => r.norm._existing || (im.dataset === 'profile' && emp(r.norm.id))).length;
  const people = [...new Set(recs.map(r => r.norm.emp || r.norm.id).filter(Boolean))];
  const head = isHead();
  const edits = im.records.reduce((a, r) => a + (r.edits ? r.edits.length : 0), 0);
  let impact = '';
  if (im.dataset === 'offers') {
    impact = `<h3>Impact preview</h3><div class="tbl-wrap"><table><thead><tr><th>Employee</th><th class="n">Rows</th><th class="n">Points (calculated)</th></tr></thead><tbody>${people.map(p => { const rs = recs.filter(r => r.norm.emp === p); return `<tr><td>${esc(emp(p).name)}</td><td class="n">${rs.length}</td><td class="n">${fmt(sum(rs.map(r => pointsFor({ cat: r.norm.cat, gender: r.norm.gender }).total)))}</td></tr>`; }).join('')}</tbody></table></div>`;
  }
  return `<section class="card"><header><h2>${head ? 'Approve and publish' : 'Submit for approval'}</h2></header>
   <div class="grid g4"><div class="kpi"><div class="lab">Rows to add</div><div class="val">${recs.length - upd}</div></div><div class="kpi"><div class="lab">Rows to update</div><div class="val">${upd}</div></div><div class="kpi"><div class="lab">Excluded</div><div class="val">${im.records.filter(r => r.excluded).length}</div></div><div class="kpi"><div class="lab">People affected</div><div class="val">${people.length}</div></div></div>
   <p class="small">Source: ${esc(im.source)} · ${edits} cell correction(s) made in review · rule version ${esc(state.rules.version)}.</p>${impact}
   ${head ? '<div class="note">You prepared this batch and are approving it. With a delegated importer, the importer prepares and you approve (maker-checker, D-26). Your approval is recorded in the audit log.</div>' : '<div class="note">The TA Head reviews and approves this batch before it is published. You cannot approve your own batch.</div>'}
   <label class="field">Note for the audit log<input type="text" id="imp-note" placeholder="e.g. ATS export, week 42"></label>
   <div class="actions" style="margin-top:10px"><button class="btn" onclick="impState().step=3;render()">Back</button><button class="btn pri" onclick="${head ? 'impPublish()' : 'impSubmit()'}">${head ? 'Approve & publish' : 'Submit for TA Head approval'}</button></div></section>`;
}
function newBatchId() { return 'B-' + String(state.batches.length + 1).padStart(4, '0'); }
function impSubmit() {
  const im = impState();
  const b = { id: newBatchId(), dataset: IMPORT_DATASETS[im.dataset].label, dsKey: im.dataset, source: im.source, by: currentUserLabel(), approver: '', at: nowStamp(), status: 'Awaiting approval', added: im.records.filter(r => !r.excluded && r.status !== 'error').length, updated: 0, excluded: im.records.filter(r => r.excluded).length, errors: 0, rule: state.rules.version, note: val('imp-note'),
    pending: { headers: im.headers, rows: im.rows, mapping: im.mapping, records: im.records } };
  state.batches.push(b); audit('Import prepared', b.id, `${b.dataset}: ${b.added} rows from ${b.source}`, b.note); touch();
  ui.imp = { dataset: im.dataset, step: 1 }; render(); toast('Submitted to TA Head for approval');
}
function reviewBatch(id) {
  const b = state.batches.find(x => x.id === id);
  ui.imp = { dataset: b.dsKey, step: 3, source: b.source, headers: b.pending.headers, rows: b.pending.rows, mapping: b.pending.mapping, records: b.pending.records, pii: [], fromBatch: id };
  impValidate(); render();
}
function impPublish() {
  const im = impState(); const recs = im.records.filter(r => !r.excluded && r.status !== 'error');
  let b = im.fromBatch ? state.batches.find(x => x.id === im.fromBatch) : null;
  if (!b) { b = { id: newBatchId(), dataset: IMPORT_DATASETS[im.dataset].label, dsKey: im.dataset, source: im.source, by: currentUserLabel(), at: nowStamp() }; state.batches.push(b); }
  if (b.by === currentUserLabel() && !isHead()) { toast('You cannot approve your own batch.'); return; }
  const added = [], updated = [];
  if (im.dataset === 'offers') {
    for (const r of recs) {
      const n = r.norm;
      const data = { emp: n.emp, cand: n.cand, req: n.req, area: n.area, cat: n.cat, sg: n.sg, gender: n.gender, reqDate: n.reqDate, offerDate: n.offerDate, expJoin: n.expJoin, actJoin: n.actJoin || '', status: n.status, source: n.source, vendor: n.vendor || '', batch: b.id };
      if (n._existing) { const o = state.offers.find(x => x.id === n._existing); updated.push({ id: o.id, prev: { ...o } }); Object.assign(o, data); }
      else { const o = Object.assign({ id: 'O' + Date.now().toString(36) + added.length, exc: null, confirmed: false }, data); if (n.excReq) o.exc = { reason: n.excReq, status: 'Requested', by: b.by, at: nowStamp() }; state.offers.push(o); added.push(o.id); }
    }
  } else if (im.dataset === 'profile') {
    for (const r of recs) { const n = r.norm, e = emp(n.id);
      const data = { name: n.name, team: n.team, area: n.area, type: n.type, level: n.level, since: n.since || (e ? e.since : null), start: n.start || null, end: n.end || null, status: n.status, alsoTeams: n.alsoTeams, flags: n.flags, ratings: n.ratings, aliases: n.aliases, joined: n.joined };
      if (e) { updated.push({ id: e.id, prev: JSON.parse(JSON.stringify(e)) }); Object.assign(e, data); } else { addEmployee(Object.assign({ id: n.id }, data)); added.push(n.id); } }
  } else if (im.dataset === 'ratings') {
    for (const r of recs) { const n = r.norm; const h = state.assessments[n.emp] = state.assessments[n.emp] || [];
      let rec = h.find(a => a.period === n.period);
      if (!rec) { rec = { period: n.period, date: D.fmt(Date.now()), self: {}, mgr: {}, selfEvidence: {}, mgrEvidence: {}, by: 'import' }; h.push(rec); h.sort((a, c) => ['Baseline', 'Q1', 'Q2', 'Q3', 'Q4'].indexOf(a.period) - ['Baseline', 'Q1', 'Q2', 'Q3', 'Q4'].indexOf(c.period)); }
      rec[n.by][n.comp] = n.rating; rec[n.by === 'self' ? 'selfEvidence' : 'mgrEvidence'][n.comp] = n.evidence || '';
      if (n.target) emp(n.emp).targets[n.comp] = n.target;
      rec.mgrPending = COMPETENCIES.some(c => rec.mgr[c] == null); rec.selfPending = COMPETENCIES.some(c => rec.self[c] == null);
      if (!rec.mgrPending) delete rec.mgrPending; if (!rec.selfPending) delete rec.selfPending;
      added.push(n.emp + ':' + n.period + ':' + n.comp); }
  } else if (im.dataset === 'scorecard') {
    for (const r of recs) { const n = r.norm; if (state.scorecards[n.emp]) updated.push({ id: n.emp, prev: JSON.parse(JSON.stringify(state.scorecards[n.emp])) }); else added.push(n.emp);
      const { emp: _e, ...rest } = n; state.scorecards[n.emp] = Object.assign(rest, { batch: b.id }); }
  } else if (im.dataset === 'learning') {
    for (const r of recs) { const n = r.norm; const l = { id: 'L-' + Date.now().toString(36) + added.length, emp: n.emp, programme: n.programme, provider: n.provider, type: n.type, skill: n.skill, start: n.start, completion: n.completion, cert: n.cert, status: n.status, application: n.application, validated: false, batch: b.id }; state.learning.push(l); added.push(l.id); }
  }
  Object.assign(b, { status: 'Published', approver: currentUserLabel(), approvedAt: nowStamp(), added: added.length, updated: updated.length, excluded: im.records.filter(r => r.excluded).length, errors: 0, rule: state.rules.version, records: { added, updated } });
  delete b.pending;
  const edits = im.records.reduce((a, r) => a + (r.edits ? r.edits.length : 0), 0);
  audit('Import approved', b.id, `${b.dataset}: ${added.length} added, ${updated.length} updated, ${b.excluded} excluded, ${edits} corrections`, val('imp-note'));
  touch(); im.published = b.id; im.step = im.dataset === 'offers' ? 5 : 1; if (im.step === 1) ui.imp = { dataset: im.dataset, step: 1 };
  render(); toast('Published — dashboards recalculated');
}
function impStep5() {
  const im = impState(), b = state.batches.find(x => x.id === im.published);

  return `<section class="card"><header><h2>Share with employees (optional)</h2>${statusChip('approved', true, 'Batch ' + b.id + ' published')}</header>

}
function impShare(bid) {
  const b = state.batches.find(x => x.id === bid);
  const ids = new Set([...(b.records.added || []), ...(b.records.updated || []).map(u => u.id)]);
  const sel = [...document.querySelectorAll('.sh-p:checked')].map(x => x.value);
  for (const p of sel) {
    const rows = state.offers.filter(o => ids.has(o.id) && o.emp === p).map(o => o.id);
    state.requests.push({ id: 'RQ-' + String(state.requests.length + 1).padStart(3, '0'), emp: p, type: val('sh-t'), msg: val('sh-m'), rows, due: val('sh-d'), status: 'Sent', created: D.fmt(Date.now()), response: null, batch: bid });
  }
  audit('Requests sent from import', bid, `${val('sh-t')} → ${sel.length} employee(s)`); touch(); ui.imp = { dataset: 'offers', step: 1 }; render(); toast(sel.length + ' request(s) sent');
}
function reverseBatch(id) {
  const b = state.batches.find(x => x.id === id);
  askText('Reverse ' + id, 'Added rows are removed and updated rows restored; the batch record is kept. Reason:', reason => doReverse(id, b, reason));
}
function doReverse(id, b, reason) {
  const added = new Set(b.records.added || []);
  if (b.dsKey === 'offers' || b.dataset.startsWith('Offers')) { state.offers = state.offers.filter(o => !added.has(o.id)); for (const u of b.records.updated || []) { const o = state.offers.find(x => x.id === u.id); if (o) Object.assign(o, u.prev); } }
  else if (b.dsKey === 'profile') { state.employees = state.employees.filter(e => !added.has(e.id)); for (const u of b.records.updated || []) { const e = emp(u.id); if (e) Object.assign(e, u.prev); } }
  else if (b.dsKey === 'learning') state.learning = state.learning.filter(l => !added.has(l.id));
  else if (b.dsKey === 'scorecard') { added.forEach(id => delete state.scorecards[id]); for (const u of b.records.updated || []) state.scorecards[u.id] = u.prev; }
  else { toast('Rating imports are reversed by re-importing corrected ratings (history is kept).'); return; }
  b.status = 'Reversed';
  state.batches.push({ id: newBatchId(), dataset: 'Reversal of ' + id, source: id, by: currentUserLabel(), approver: currentUserLabel(), at: nowStamp(), status: 'Published', added: 0, updated: (b.records.updated || []).length, excluded: 0, errors: 0, rule: state.rules.version, removed: added.size });

}

function createReportVersion(empId, typeLabel, status, typeKey = 'annual', fmtExt = 'pdf') {
  const e = empId ? emp(empId) : null;

  const fileType = (REPORT_TYPES[typeKey] || {}).file || 'Report';
  const name = e ? e.name.split(' ')[0] + '_' + e.id : 'Team';
  const rec = { id: 'RV-' + (state.reports.length + 1), emp: empId, empName: e ? e.name : null, type: typeLabel, typeKey, version, status, at: nowStamp(), by: currentUserLabel(), cutoff: PERIOD.cutoff, rule: state.rules.version,

  audit('Report generated', rec.file, `${typeLabel} · ${status}`); touch();

}

function runReport() {
  const type = val('rb-t'), f = val('rb-f'), status = val('rb-s');
  const ids = [...document.querySelectorAll('.rb-e:checked')].map(x => x.value);

  const opts = { tx: document.getElementById('rb-tx').checked, graphs: document.getElementById('rb-g').checked, ec: document.getElementById('rb-ec').checked, mc: document.getElementById('rb-mc').checked, summary: document.getElementById('rb-sum').checked, period: val('rb-p'), status };

function generate(type, ids, f, opts) {
  const T = REPORT_TYPES[type];
  let versions = [];
  const ext = f === 'xls' ? excelExt() : 'pdf';
  if (T.team || T.multi) versions.push(createReportVersion(null, T.label, opts.status, type, ext));
  else versions = ids.map(id => createReportVersion(id, T.label, opts.status, type, ext));
  if (f === 'xls') {
    const sheets = T.team || T.multi ? teamSheets(type, ids) : [].concat(...ids.map(id => personSheets(type, id, opts, ids.length > 1)));
    const name = versions.length === 1 ? versions[0].file : `${PERIOD.year}_Annual_${T.file}_${ids.length}_employees.${excelExt()}`;
    download(name, excelFile(sheets, versions), 'application/vnd.ms-excel');
    toast('Excel downloaded'); render(); return;
  }
  let html = '';
  if (T.team || T.multi) html = teamDoc(type, ids, opts, versions[0]);
  else html = ids.map((id, i) => `<div class="${i ? 'pb' : ''}">${personDoc(type, id, opts, versions[i])}</div>`).join('');
  render();
  const pdfLabel = HOSTED ? 'Download for PDF (.html)' : 'Print / Save as PDF';
  lastReport = { html, file: versions.length === 1 ? versions[0].file : `${PERIOD.year}_Annual_${T.file}_${ids.length || 'team'}.pdf` };
  openDlg('Report preview', `<div class="noprint actions" style="margin-bottom:10px"><button class="btn pri" onclick="printReport()">${pdfLabel}</button><span class="small muted">File name: ${esc(lastReport.file)}${HOSTED ? ' · open the downloaded file in a browser and print it to PDF' : ''}</span></div><div id="rp-prev">${html}</div>`, [{ label: 'Close' }, { label: pdfLabel, cls: 'pri', onClick: () => { printReport(); return false; } }]);
  document.getElementById('dlg').style.maxWidth = '900px';
  document.getElementById('report-root').innerHTML = html;
}
let lastReport = null;
function printReport() {
  if (HOSTED) {
    const css = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n');
    const doc = `<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><title>${esc(lastReport.file)}</title><style>${css}</style></head><body><div id="report-root" style="display:block">${lastReport.html}</div></body></html>`;
    download(lastReport.file.replace(/\.pdf$/, '.html'), doc, 'text/html');
    return;
  }
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print(); setTimeout(done, 1500);
}

function rCadence(m) { return `<h2>10-working-day cadence (points)</h2><table><thead><tr><th>Cycle</th><th>Period</th><th class="n">Points target</th><th class="n">Points</th><th class="n">Variance</th><th class="n">Offers</th><th>Status</th></tr></thead><tbody>${m.own.cycles.map(c => `<tr><td>${c.n}</td><td>${D.nice(c.from)} – ${D.nice(c.to)}</td><td class="n">${fmt(c.pointsTarget)}</td><td class="n">${fmt(c.points)}</td><td class="n">${fmt(c.points - c.pointsTarget)}</td><td class="n">${c.offers}</td><td>${c.closed ? (c.points >= c.pointsTarget ? '✓ Met' : '✕ Missed') : '○ Partial (not scored)'}</td></tr>`).join('')}</tbody></table>`; }
function rCalc(m) {
  const b = m.own, R = state.rules;
  if (m.mode !== 'tx') return `<h2>Annex: Calculation detail</h2><p>${m.mode === 'support' ? 'No hiring calculation for support roles.' : `Summary scorecard as of ${D.nice(b.asOf)}: points target = offer target ${b.target} × ${b.ppo} = ${fmt(b.pointsTargetFull)} per year; pro-rated × ${b.elapsed} ÷ ${b.yearDays} working days = ${fmt(b.pointsTargetFormal)}. Weighted points ${b.pointsFormal == null ? 'not recorded' : fmt(b.pointsFormal)}. Score = 40 × points ÷ points target (capped). Joining ratio = joiners ÷ offers (approximate). Source: ${esc(b.sc.source || '')}.`}</p>`;
  return `<h2>Annex: Calculation detail</h2><table><tbody>
   <tr><td>Eligible working days (to cut-off)</td><td>${b.days}${m.e.leave ? ' (approved leave excluded)' : ''}</td></tr><tr><td>Closed 10-day cycles</td><td>${b.nClosed}</td></tr>
   <tr><td>Offer target per 10 days</td><td>${fmt(m.target)}${m.isTL ? ' (' + Math.round(R.tlTargetShare * 100) + '% of team-member target)' : ''}</td></tr>
   <tr><td>Expected offers (closed)</td><td>${b.nClosed} × ${fmt(m.target)} = ${fmt(b.expectedFormal)}</td></tr>
   <tr><td>Points target (closed)</td><td>${fmt(b.expectedFormal)} × ${b.ppo} points per offer = ${fmt(b.pointsTargetFormal)} (TA Head decision 18 Oct 2026)</td></tr><tr><td>Hiring points table</td><td>${esc(POINT_TABLES[R.pointsTable].label)} (pending D-01)</td></tr>
   <tr><td>Offer score formula</td><td>${esc(R.offerFormula)}: ${esc(b.offer.how || '')}; volume gate below ${R.gate.g * 100}% → cap ${R.gate.c * 40}${b.offer.gated ? ' (applied)' : ''}</td></tr>
   <tr><td>Joining ratio bands</td><td>${R.jrBands.map(x => '≥' + x[0] + '%→' + x[1]).join(', ')}</td></tr><tr><td>Cycle time bands</td><td>&lt;${R.ctBands.strong}→10, ${R.ctBands.strong}–${R.ctBands.acceptable}→7, &gt;${R.ctBands.acceptable}→4; ${b.ctExcluded} excluded</td></tr>
   <tr><td>Vendor usage</td><td>${b.vendor}/${b.applicable}; excluded categories: ${esc(R.vendorExcluded.join(', '))}</td></tr>
   ${m.isTL ? `<tr><td>Team Lead model</td><td>${esc(R.tlModel)} (proposed): team ${fmt(m.teamDel.total)}/70 and own ${fmt(m.ownDel.total)}/70 combined</td></tr>` : ''}</tbody></table>`;
}

function personDoc(type, id, opts, v) {
  const m = metrics(id), e = m.e; const T = REPORT_TYPES[type];
  const title = type === 'annual' ? `${PERIOD.year} Annual Performance Report — ${roleOf(e).name}${isFormer(e) ? ' (former team member)' : ''}` : T.label;
  let h = `<div class="rdoc">` + metaBlock(title, e, v, opts);
  if (type === 'annual' || type === 'full') {
    const r = state.review[id] || {};
    const L = m.latest; const strengths = L ? COMPETENCIES.filter(c => L.mgr[c] >= 4) : []; const gaps = L ? COMPETENCIES.filter(c => L.mgr[c] < e.targets[c]) : [];
    h += `<h2>Executive summary</h2><p style="white-space:pre-wrap">${esc(r.summary || draftSummary(id))}</p>${r.summary ? '' : '<p class="wm">Draft generated from data (FACT/SUGGESTION). TA Head to edit before finalising.</p>'}
      <h2>Overall score</h2>${scoreTable(m)}` + rDeliverables(m, opts, type === 'full') + `<div class="pb"></div>` + rProjects(m) + rCompetency(m, { graphs: type === 'full' && opts.graphs }) + rBehaviour(m)
      + `<h2>Key strengths</h2><p>${strengths.map(esc).join(', ') || '—'}</p><h2>Key improvement areas</h2><p>${gaps.map(esc).join(', ') || '—'}</p><h2>Significant contributions</h2><p>${m.projs.filter(p => p.stage >= 3).map(p => esc(p.title) + (p.actual != null ? ` (${esc(p.metric)} ${p.baseline} → ${p.actual})` : '')).join('; ') || '—'}</p>`

  } else {

      joining: () => kpiTable(m.own, 'Joining & conversion') + `<p>Matured offers ${m.own.matured}; joined ${m.own.joined}; declined ${m.own.declined}; no-show ${m.own.noshow}; not yet due ${m.own.pending}.</p>`,

      vendor: () => `<h2>Vendor usage</h2><p>${pct(m.own.vendorPct)} — ${m.own.vendor} vendor of ${m.own.applicable} applicable offers. Score ${m.own.vendorScore == null ? '—' : m.own.vendorScore}/5.</p>`,
      behaviour: () => rBehaviour(m) + rAFI(m), afi: () => rAFI(m), projects: () => rProjects(m), competency: () => rCompetency(m, opts) + rTraining(m), training: () => rTraining(m), idp: () => rIDP(m),

      + sortedEmployees().map(e => { const pr = promotion(e.id), m = metrics(e.id), d = state.promo[e.id] || {}; return `<tr><td>${esc(e.name)}</td><td>${esc(e.level)} (${fmt(pr.yrs)})</td><td>${e.ratings.map(r => esc(r || '—')).join(' / ')}</td><td class="n">${m.total == null ? '(' + fmt(m.partial) + ')' : fmt(m.total)}</td><td>${esc(pr.level)}</td><td class="small">${pr.crit.map(c => (c.ok ? '✓ ' : '✕ ') + esc(c.label) + ' — ' + esc(c.fact)).join('<br>')}</td><td>${esc(d.decision || '—')}${d.note ? '<br><span class="small">' + esc(d.note) + '</span>' : ''}</td></tr>`; }).join('') + `</tbody></table>`;
  }
  return h + `</div>`;
}

  const sheets = [];

    ['Pillar', 'Self', 'TA Head', 'Max'], ['Business Deliverables', m.deliverables, m.deliverables, 70], ['Improvement Projects', m.projectsSelf, m.projects, 15], ['Competency Development', m.cdS, m.cdM, 15], ['Total', m.selfTotal, m.total, 100], [],

  if (want('offers') && opts.tx !== false) sheets.push({ name: p + 'Offers', rows: [['Offer date', 'Requisition', 'Candidate ID', 'Business area', 'Category', 'SG', 'Gender', 'Base', 'Bonus', 'Total points', 'Req created', 'Cycle days', 'Exception', 'Expected joining', 'Actual joining', 'Joining status', 'Source', 'Vendor', 'Batch', 'Employee confirmed']].concat(b.offers.map(o => { const pt = pointsFor(o); return [o.offerDate, o.req, o.cand, o.area, o.cat, o.sg, o.gender, pt.base, pt.bonus, pt.total, o.reqDate, cycleDays(o), o.exc ? o.exc.reason + ' (' + o.exc.status + ')' : '', o.expJoin, o.actJoin, o.status, o.source, o.vendor, o.batch, o.confirmed ? 'Yes' : '']; })) });
  if (want('behaviour') || want('selfmgr')) sheets.push({ name: p + 'Self vs TA Head', rows: [['Period', 'Competency', 'Self', 'TA Head', 'Gap', 'Target', 'Self evidence', 'TA Head evidence']].concat([].concat(...m.hist.map(a => COMPETENCIES.map(c => [a.period, c, a.self[c], a.mgr[c], a.self[c] != null ? a.self[c] - a.mgr[c] : '', e.targets[c], a.selfEvidence[c] || '', a.mgrEvidence[c] || ''])))) });

  return sheets;
}
function teamSheets(type, ids) {
  if (type === 'talent') return [{ name: 'Talent CONFIDENTIAL', rows: [['STRICTLY CONFIDENTIAL — TA HEAD ONLY'], ['Employee', 'Team', 'Job level', 'Years in level', `Rating ${PERIOD.year - 1}`, `Rating ${PERIOD.year - 2}`, `Rating ${PERIOD.year - 3}`, 'Score', 'Readiness (advisory)', 'Criteria met', 'Reasons', 'Decision', 'Note']].concat(sortedEmployees().map(e => { const pr = promotion(e.id), m = metrics(e.id), d = state.promo[e.id] || {}; return [e.name, teamName(e.team), e.level, r1(pr.yrs), ...e.ratings.map(r => r || ''), m.total != null ? m.total : m.partial, pr.level, pr.met, pr.crit.map(c => (c.ok ? 'MET ' : 'NOT MET ') + c.label + ' — ' + c.fact).join(' | '), d.decision || '', d.note || '']; })) }];

// Real .xlsx when SheetJS has loaded (needs internet); otherwise Excel 2003 XML (.xls) for offline use.
function excelExt() { return window.XLSX ? 'xlsx' : 'xls'; }
function reportInfoRows(versions) {
  return [['Report', versions.map(v => v.type).join('; ')], ['Files', versions.map(v => v.file).join('; ')], ['Version', versions.map(v => 'v' + v.version + ' ' + v.status).join('; ')], ['Generated', nowStamp() + ' by ' + currentUserLabel()], ['Data cut-off', PERIOD.cutoff], ['Rule version', state.rules.version], ['Classification', 'Confidential — People & Culture'], ['Status', anyPending() ? 'Provisional: scoring rules pending approval' : 'Rules approved']];
}
function excelFile(sheets, versions) {
  if (!window.XLSX) return xlsWorkbook(sheets, versions);
  const wb = XLSX.utils.book_new(), used = new Set();
  [{ name: 'Report info', rows: reportInfoRows(versions) }].concat(sheets).forEach(s => {
    let n = s.name.replace(/[\\/?*[\]:]/g, ' ').slice(0, 31); while (used.has(n)) n = n.slice(0, 28) + used.size; used.add(n);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s.rows.map(r => (r || []).map(c => c == null ? '' : c))), n);
  });
  return new Blob([XLSX.write(wb, { bookType: 'xlsx', type: 'array' })]);
}
function xlsWorkbook(sheets, versions) {
  const x = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const meta = reportInfoRows(versions);
  const used = new Set();
  const sheetXml = (name, rows) => { let n = name.replace(/[\\/?*[\]:]/g, ' ').slice(0, 31); while (used.has(n)) n = n.slice(0, 28) + used.size; used.add(n);
    return `<Worksheet ss:Name="${x(n)}"><Table>${rows.map((r, i) => `<Row>${(r || []).map(c => typeof c === 'number' && isFinite(c) ? `<Cell${i === 0 ? ' ss:StyleID="h"' : ''}><Data ss:Type="Number">${c}</Data></Cell>` : `<Cell${i === 0 ? ' ss:StyleID="h"' : ''}><Data ss:Type="String">${x(c)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`; };
  return `<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#EEF3F5" ss:Pattern="Solid"/></Style></Styles>`
    + sheetXml('Report info', meta) + sheets.map(s => sheetXml(s.name, s.rows)).join('') + `</Workbook>`;
}

<script>
/* Access control without a server.
   - TA Head: access restricted to TA_HEAD_EMAIL plus a passphrase. The workspace is stored AES-256-GCM encrypted
     (key derived with PBKDF2-SHA256), so it cannot be read from browser storage or a backup file without the passphrase.
   - Team members: open a personal file created by the TA Head. It contains only that person's records and is
     encrypted with its own passphrase, so peer data is not present at all. Members export their inputs as a
     responses file (same passphrase) for the TA Head to import.
   This protects confidentiality; it is not corporate single sign-on. Production access belongs in the BRD
   architecture with Entra ID (SYSTEM_DESIGN.md §9). */

const TA_HEAD_EMAIL = 'ranjith.tp@volvo.com';
const SECURE_KEY = 'ta-pdms-secure-v1';
const KDF_ITER = 310000;
let session = null; // { kind: 'head' | 'member' | 'demo', email, empId, key, salt, pass }

// ---------- crypto ----------
const enc = new TextEncoder(), dec = new TextDecoder();
function b64(buf) { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: KDF_ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function sealWithKey(obj, key, salt, format, meta = {}) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
  return { format, v: 1, meta, kdf: 'PBKDF2-SHA256-' + KDF_ITER, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
}
async function seal(obj, pass, format, meta) { const salt = crypto.getRandomValues(new Uint8Array(16)); return sealWithKey(obj, await deriveKey(pass, salt), salt, format, meta); }
async function openEnvelope(env, pass) {

  try { return { obj: JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.ct)))), key, salt }; }
  catch (e) { throw new Error('Wrong passphrase, or the file is damaged.'); }
}
function newPassphrase() {

const isEncrypted = o => o && typeof o === 'object' && typeof o.ct === 'string' && typeof o.salt === 'string';

// ---------- persistence (replaces plain localStorage) ----------
let saveTimer = null;
function persistState() {
  if (!session || session.kind !== 'head') return; // demo and member sessions stay in memory
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { const env = await sealWithKey(state, session.key, session.salt, 'ta-pdms-workspace', { email: session.email, updated: nowStamp() }); localStorage.setItem(SECURE_KEY, JSON.stringify(env)); }
    catch (e) { toast('Could not save in this browser: ' + e.message + '. Export a backup.'); }
  }, 300);
}
function readSecureStore() { try { const s = localStorage.getItem(SECURE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function readLegacyPlain() { try { const s = localStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

// ---------- sign-in ----------

}
const emailOk = v => String(v || '').trim().toLowerCase() === TA_HEAD_EMAIL;
async function headSetup() {

  const legacy = readLegacyPlain();
  state = legacy && legacy.mode === 'live' ? migrateState(legacy) : emptyState();

async function headSignIn() {

}

// ---------- personal performance files ----------
const clone = o => JSON.parse(JSON.stringify(o));
function packStateFor(id) {
  const e = clone(emp(id)), m = metrics(id), mine = x => x.emp === id;
  e.ratings = [null, null, null]; e.flags = []; // rating history (D-29) and internal notes stay with the TA Head
  const tl = teamLead(e.team); if (tl && tl.id !== id) e.leadName = tl.name; // reporting line only
  const pick = obj => (obj && obj[id] != null ? { [id]: clone(obj[id]) } : {});

    mode: 'member', rules: clone(state.rules), teams: clone(state.teams), roles: clone(state.roles), areaTargets: clone(state.areaTargets), areaPPO: clone(state.areaPPO || {}),
    employees: [e], offers: clone(state.offers.filter(mine)), scorecards: pick(state.scorecards), assessments: pick(state.assessments),
    projects: clone(state.projects.filter(p => p.owner === id)), learning: clone(state.learning.filter(mine)), compDev: pick(state.compDev), idp: pick(state.idp), afi: pick(state.afi),
    requests: clone(state.requests.filter(mine)), comments: pick(state.comments), review: pick(state.review), overrides: clone(state.overrides.filter(mine)),
    reports: clone(state.reports.filter(r => r.emp === id)), promo: {}, audit: [], batches: [], breakGlass: [], teamSnapshots: {},
  };
  if (m.isTL && m.team) { const t = clone(m.team); t.offers = []; t.members = t.members.map(() => ''); s.teamSnapshots[id] = t; } // team totals only, no member-level data
  return s;
}
function packsDlg() {
  const list = sortedEmployees().filter(e => !isFormer(e));

   <div class="grid g3">${list.map(e => `<label class="small"><input type="checkbox" class="pk-e" value="${e.id}" checked> ${esc(e.name)} <span class="muted">${esc(roleOf(e).name)}</span></label>`).join('')}</div>
   <label class="small" style="display:block;margin-top:8px"><input type="checkbox" id="pk-new"> Create new passphrases (otherwise each person keeps their existing one)</label>`,
    [{ label: 'Cancel' }, { label: 'Create files', cls: 'pri', onClick: () => { makePacks([...document.querySelectorAll('.pk-e:checked')].map(x => x.value), document.getElementById('pk-new').checked); return false; } }]);
}
async function makePacks(ids, fresh) {
  state.packs = state.packs || {};
  const out = [];
  for (const id of ids) {
    if (fresh || !state.packs[id]) state.packs[id] = { pass: newPassphrase(), created: nowStamp() };
    const e = emp(id), env = await seal(packStateFor(id), state.packs[id].pass, 'ta-pdms-pack', { created: nowStamp() });
    out.push({ id, name: e.name, pass: state.packs[id].pass, file: `${PERIOD.year}_My_Performance_${e.name.replace(/[^A-Za-z]+/g, '_')}.json`, data: JSON.stringify(env) });

// ---------- responses round-trip ----------
async function exportResponses() {

  const data = {
    assessments: (state.assessments[id] || []).map(a => ({ period: a.period, date: a.date, self: a.self, selfEvidence: a.selfEvidence })),
    requests: state.requests.filter(own).filter(r => r.response).map(r => ({ id: r.id, response: r.response, status: r.status })),
    comment: (state.comments[id] || {}).emp || '', empComment: (state.review[id] || {}).empComment || '',
    learning: state.learning.filter(own), projects: state.projects.filter(p => p.owner === id).map(p => ({ id: p.id, title: p.title, problem: p.problem, metric: p.metric, baseline: p.baseline, target: p.target, actual: p.actual, nextAction: p.nextAction, lessons: p.lessons, selfScore: p.selfScore, pendingEvidence: p.pendingEvidence, start: p.start, planEnd: p.planEnd })),
    compDevSelf: (state.compDev[id] || {}).self || null,
  };
  const env = await seal({ format: 'ta-pdms-responses', emp: id, name: emp(id).name, at: nowStamp(), data }, session.pass, 'ta-pdms-responses', { at: nowStamp() });
  download(`${PERIOD.year}_Responses_${emp(id).name.replace(/[^A-Za-z]+/g, '_')}_${D.fmt(Date.now())}.json`, JSON.stringify(env), 'application/json');
  session.dirty = false; render(); toast('Send this file to your TA Head.');
}
async function importResponsesFile(file) {
  if (!file) return;
  let env; try { env = JSON.parse(await readFileText(file)); } catch (e) { toast('Not a responses file.'); return; }
  if (!isEncrypted(env) || env.format !== 'ta-pdms-responses') { toast('Not a responses file.'); return; }
  const tryPasses = Object.values(state.packs || {}).map(p => p.pass);
  for (const p of tryPasses) { try { const { obj } = await openEnvelope(env, p); return mergeResponses(obj, file.name); } catch (e) { /* next */ } }
  askPass('Import responses', 'Passphrase of this person\'s file', async pass => { try { mergeResponses((await openEnvelope(env, pass)).obj, file.name); } catch (e) { toast(e.message); } });
}
function mergeResponses(r, fname) {
  const id = r.emp, e = emp(id);
  if (!e) { toast('This person is not in your workspace.'); return; }
  const d = r.data, changes = [];
  const h = state.assessments[id] = state.assessments[id] || [];
  for (const a of d.assessments || []) {
    if (!a.self || !Object.keys(a.self).length) continue;
    let rec = h.find(x => x.period === a.period);
    if (!rec) { rec = { period: a.period, date: a.date, self: {}, mgr: {}, selfEvidence: {}, mgrEvidence: {}, by: 'self', mgrPending: true }; h.push(rec); }
    if (JSON.stringify(rec.self) !== JSON.stringify(a.self)) { rec.self = a.self; rec.selfEvidence = a.selfEvidence || {}; delete rec.selfPending; changes.push('self-assessment ' + a.period); }
  }
  for (const x of d.requests || []) { const q = state.requests.find(y => y.id === x.id && y.emp === id); if (q && ['Sent', 'Viewed'].includes(q.status)) { q.response = x.response; q.status = x.status === 'Closed' ? 'Closed' : 'Responded'; if (x.response.kind === 'Confirm all') state.offers.forEach(o => { if (q.rows.includes(o.id)) o.confirmed = true; }); changes.push('response to ' + q.id); } }
  if (d.comment && (state.comments[id] || {}).emp !== d.comment) { (state.comments[id] = state.comments[id] || {}).emp = d.comment; changes.push('comment'); }
  if (d.empComment && (state.review[id] || {}).empComment !== d.empComment) { (state.review[id] = state.review[id] || {}).empComment = d.empComment; changes.push('annual review comment'); }
  for (const l of d.learning || []) { const i = state.learning.findIndex(y => y.id === l.id); if (i < 0) { state.learning.push(Object.assign(l, { emp: id, validated: false })); changes.push('learning ' + l.programme); } else if (state.learning[i].emp === id) { const v = state.learning[i].validated && state.learning[i].application === l.application; state.learning[i] = Object.assign(l, { emp: id, validated: v }); } }
  for (const p of d.projects || []) { const q = state.projects.find(y => y.id === p.id); if (q && q.owner === id) { Object.assign(q, { actual: p.actual, nextAction: p.nextAction, lessons: p.lessons, selfScore: p.selfScore, pendingEvidence: p.pendingEvidence }); } else if (!q) { state.projects.push(Object.assign({ owner: id, stage: -1, inProgress: 0, lastValidated: '', planStages: [], history: [], contributing: false, mgrScore: null, sponsor: '' }, p, { id: 'P-' + String(state.projects.length + 1).padStart(3, '0') })); changes.push('new project ' + p.title); } }
  if (d.compDevSelf) { (state.compDev[id] = state.compDev[id] || {}).self = d.compDevSelf; }
  audit('Employee responses imported', e.name, changes.join('; ') || 'No new changes', fname); touch(); render();
  toast(changes.length ? `Imported for ${e.name}: ${changes.length} change(s)` : 'No new changes in this file');
}

function updatePlan(u) {
  const plan = [];
  for (const t of u.teams || []) { const ex = state.teams[t.key];
    const add = (t.addAreas || []).filter(a => !(ex ? ex.areas : []).includes(a));
    if (!ex) plan.push(['Team', t.name, 'add team' + (add.length ? ' with areas ' + add.join(', ') : '')]); else if (add.length) plan.push(['Team', ex.name, 'add business area ' + add.join(', ')]); }
  const tName = k => (state.teams[k] && state.teams[k].name) || ((u.teams || []).find(t => t.key === k) || {}).name || k;
  for (const p of u.newPeople || []) { if (emp(p.id)) plan.push(['Skipped', p.name, 'Already in this workspace']); else plan.push(['New person', p.name, [tName(p.team), p.area, (state.roles[p.type] || {}).name || p.type, p.status].filter(Boolean).join(' · ')]); }
  for (const p of u.people || []) { const e = emp(p.id); if (!e) { plan.push(['Skipped', p.id, 'Not in this workspace']); continue; }
    const ch = Object.entries(p.set || {}).filter(([k, v]) => JSON.stringify(e[k]) !== JSON.stringify(v)).map(([k, v]) => k + ': ' + (Array.isArray(v) ? v.join(', ') : v));
    const rm = (e.flags || []).filter(f => (p.removeFlags || []).some(x => f.includes(x)));
    const add = (p.addFlags || []).filter(f => !(e.flags || []).includes(f));
    if (ch.length || rm.length || add.length) plan.push(['Person', e.name, [...ch, ...rm.map(f => 'resolved: ' + f), ...add.map(f => 'to confirm: ' + f)].join(' · ')]); }
  const newP = Object.fromEntries((u.newPeople || []).map(p => [p.id, p]));
  for (const [id, f] of Object.entries(u.scorecards || {})) { const e = emp(id) || newP[id]; if (!e) { plan.push(['Skipped', id, 'Not in this workspace']); continue; }
    plan.push(['Scorecard', e.name, Object.keys(f).join(', ') + (state.scorecards[id] ? '' : ' (new scorecard)')]); }
  for (const p of u.projects || []) { const e = emp(p.owner); if (!e) { plan.push(['Skipped', p.owner, 'Project owner not in this workspace']); continue; }
    const ex = p.match && state.projects.find(x => x.owner === p.owner && x.title.toLowerCase().includes(p.match.toLowerCase()));
    if (p.add && state.projects.some(x => x.owner === p.owner && x.title.toLowerCase() === p.add.title.toLowerCase())) { plan.push(['Skipped', e.name, 'Project already present: ' + p.add.title]); continue; }
    plan.push(['Project', e.name, ex ? 'update "' + ex.title + '"' + (p.set.title && p.set.title !== ex.title ? ' → "' + p.set.title + '"' : '') : p.add ? 'add "' + p.add.title + '"' : 'no match for "' + p.match + '" (skipped)']); }
  return plan;
}
function previewUpdate(u, fname) {
  const plan = updatePlan(u);
  openDlg('Apply update', `<p class="small">Source: ${esc(u.source || fname)}. Nothing is replaced wholesale; only the items below change, and each change is recorded in the audit log.</p>
   <div class="tbl-wrap"><table><thead><tr><th>Type</th><th>Who</th><th>Change</th></tr></thead><tbody>${plan.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="small">${esc(r[2])}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">Nothing new in this file.</td></tr>'}</tbody></table></div>`,
    [{ label: 'Cancel' }, { label: 'Apply', cls: 'pri', onClick: () => { mergeUpdate(u, fname); } }]);
  document.getElementById('dlg').style.maxWidth = '960px';
}
function mergeUpdate(u, fname) {
  const src = u.source || fname; let n = 0;
  for (const t of u.teams || []) {
    if (!state.teams[t.key]) { state.teams[t.key] = { name: t.name, areas: [] }; audit('Team added from file', t.name, '', src); n++; }
    for (const a of t.addAreas || []) if (!state.teams[t.key].areas.includes(a)) { state.teams[t.key].areas.push(a); if (!(a in state.areaTargets)) state.areaTargets[a] = t.areaTargets && t.areaTargets[a] != null ? t.areaTargets[a] : null; audit('Business area added from file', state.teams[t.key].name, a, src); n++; } }
  for (const p of u.newPeople || []) { if (emp(p.id)) continue; addEmployee(p); audit('Person added from file', p.name, [teamName(p.team), p.area, (state.roles[p.type] || {}).name, p.status].join(' · '), src); n++; }
  for (const p of u.people || []) { const e = emp(p.id); if (!e) continue;
    for (const [k, v] of Object.entries(p.set || {})) if (JSON.stringify(e[k]) !== JSON.stringify(v)) { audit('Updated from file', e.name, k + ': ' + (e[k] ?? '—') + ' → ' + v, src); e[k] = v; n++; }
    const before = (e.flags || []).length;
    e.flags = (e.flags || []).filter(f => !(p.removeFlags || []).some(x => f.includes(x)));
    if (e.flags.length < before) { audit('Resolved from file', e.name, (before - e.flags.length) + ' item(s) to confirm', src); n++; }
    for (const f of p.addFlags || []) if (!e.flags.includes(f)) { e.flags.push(f); n++; } }
  for (const [id, f] of Object.entries(u.scorecards || {})) { if (!emp(id)) continue; state.scorecards[id] = Object.assign(state.scorecards[id] || { asOf: PERIOD.cutoff }, f); audit('Scorecard updated from file', emp(id).name, Object.keys(f).join(', '), src); n++; }
  for (const p of u.projects || []) { if (!emp(p.owner)) continue;
    const ex = p.match && state.projects.find(x => x.owner === p.owner && x.title.toLowerCase().includes(p.match.toLowerCase()));
    if (ex) { Object.assign(ex, p.set); audit('Project updated from file', ex.id + ' · ' + emp(p.owner).name, ex.title, src); n++; }
    else if (p.add && !state.projects.some(x => x.owner === p.owner && x.title.toLowerCase() === p.add.title.toLowerCase())) {
      const pr = Object.assign({ id: 'P-' + String(state.projects.length + 1).padStart(3, '0'), owner: p.owner, problem: '', metric: '', baseline: '—', target: '—', actual: null, sponsor: 'TA Head', start: '', planEnd: '',
        stage: -1, inProgress: null, lastValidated: '', planStages: [], history: [], nextAction: '', contributing: false, mgrScore: null, selfScore: null, lessons: '', reported: '' }, p.add);
      state.projects.push(pr); audit('Project added from file', pr.id + ' · ' + emp(p.owner).name, pr.title, src); n++; } }
  touch(); render(); toast(n + ' change(s) applied');
}

</script>
<script>boot();</script>
