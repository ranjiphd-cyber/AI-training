<title>Hiring Package Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy app bar, section rail on the left (tabs on phones), one working sheet on the right. */
:root{
  --navy:#001433; --slate:#4A5568; --paper:#F7FAFC; --surface:#FFFFFF; --ink:#0D1B2E;
  --muted:#4A5568; --line:#D9E1EA; --line-strong:#B9C5D3; --field:#FFFFFF;
  --accent:#B7791F; --accent-ink:#8A5A12; --accent-soft:#FBF1DF;
  --bar:#001433; --bar-ink:#F7FAFC; --bar-muted:#A9B8CC;
  --btn:#001433; --btn-ink:#FFFFFF; --btn2:#E9EEF4; --btn2-ink:#001433;
  --ok:#22704A; --ok-soft:#E3F2EA; --tbc:#B42318; --tbc-soft:#FCE9E7; --prop:#2B4C7E; --prop-soft:#E6EDF7;
  --font:"Inter","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --r:6px; --c-missing:#A3AFBF; --c-bar:#1F3F6E;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#020B1A; --surface:#0A1830; --ink:#E6ECF4; --muted:#A3B1C4; --line:#1D2F4D; --line-strong:#2E4468; --field:#06122A;
  --accent:#E0A84A; --accent-ink:#F0C27A; --accent-soft:#2A2110;
  --bar:#000A1C; --bar-ink:#F7FAFC; --bar-muted:#8C9DB4;
  --btn:#E6ECF4; --btn-ink:#001433; --btn2:#14274A; --btn2-ink:#E6ECF4;
  --ok:#6FCF9B; --ok-soft:#10301F; --tbc:#F2877C; --tbc-soft:#3A1512; --prop:#9DB8E6; --prop-soft:#14274A; --c-missing:#4F6080; --c-bar:#7FA3DA;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#020B1A; --surface:#0A1830; --ink:#E6ECF4; --muted:#A3B1C4; --line:#1D2F4D; --line-strong:#2E4468; --field:#06122A;
  --accent:#E0A84A; --accent-ink:#F0C27A; --accent-soft:#2A2110;
  --bar:#000A1C; --bar-ink:#F7FAFC; --bar-muted:#8C9DB4;
  --btn:#E6ECF4; --btn-ink:#001433; --btn2:#14274A; --btn2-ink:#E6ECF4;
  --ok:#6FCF9B; --ok-soft:#10301F; --tbc:#F2877C; --tbc-soft:#3A1512; --prop:#9DB8E6; --prop-soft:#14274A; --c-missing:#4F6080; --c-bar:#7FA3DA;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
h1,h2,h3{text-wrap:balance;margin:0;color:var(--ink)}
a{color:var(--prop)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* App bar */
.bar{background:var(--bar);color:var(--bar-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.bar-in{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-size:16px;font-weight:700;letter-spacing:.01em}
.brandtx{display:flex;flex-direction:column;gap:1px;min-width:0}
.byline{color:var(--bar-muted);font-size:12px;letter-spacing:.01em}
.mark{width:10px;height:10px;background:var(--accent);display:inline-block;transform:translateY(-1px)}
.bar select{background:#0B2147;color:var(--bar-ink);border:1px solid #2A4472;border-radius:var(--r);padding:6px 8px;max-width:340px;min-width:0}
.bar .btn2{background:#0B2147;color:var(--bar-ink);border-color:#2A4472}
.savestate{font-size:12px;color:var(--bar-muted);min-width:110px;font-variant-numeric:tabular-nums}
.savestate.dirty{color:var(--accent)}
.baracts{display:flex;flex-wrap:wrap;gap:6px}

.btn,.btn2,.btn3{border-radius:var(--r);padding:7px 12px;border:1px solid transparent;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn{background:var(--btn);color:var(--btn-ink)}
.btn2{background:var(--btn2);color:var(--btn2-ink);border-color:var(--line)}
.btn3{background:transparent;color:var(--muted);border-color:transparent;padding:4px 8px}
.btn3:hover{color:var(--tbc)}
.btn:hover,.btn2:hover{filter:brightness(1.08)}
.btn.danger{background:var(--tbc);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}

/* Notices */
.notices{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.notice{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);border-radius:var(--r);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.notice.warn{border-left-color:var(--tbc)}
.notice p{margin:0;flex:1 1 260px;min-width:0}

/* Shell */
.shell{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;display:flex;flex-direction:column;gap:2px}
.rail .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}
.rail button{display:flex;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:7px 10px;cursor:pointer;color:var(--muted);border-radius:0 var(--r) var(--r) 0}
.rail button .n{font-variant-numeric:tabular-nums;font-size:12px;width:24px;flex:0 0 24px;white-space:nowrap;color:var(--muted)}
.rail button:hover{color:var(--ink);background:var(--surface)}
.rail button[aria-current="true"]{color:var(--ink);font-weight:600;border-left-color:var(--accent);background:var(--surface)}
.rail .cnt{margin-left:auto;font-size:11px;background:var(--tbc-soft);color:var(--tbc);border-radius:10px;padding:0 7px;font-weight:600}
main{min-width:0}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px 28px 32px}
.sheet-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
.sheet-head h1{font-size:22px;font-weight:700;margin-top:2px}
.sheet-head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
section.blk{padding-top:22px}
section.blk>h2{font-size:15px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
section.blk>h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.help{color:var(--muted);font-size:12.5px;margin:4px 0 10px;max-width:80ch}

/* Fields */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 18px;margin-top:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;font-weight:500;color:var(--muted)}
.fld .row{display:flex;gap:6px;min-width:0}
.fld .row>input,.fld .row>select,.fld .row>textarea{flex:1 1 auto;min-width:0}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{background:var(--field);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
input.bad{border-color:var(--tbc);box-shadow:0 0 0 1px var(--tbc)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
.fld .row>select.st{flex:0 0 auto}
select.st{width:auto;flex:0 0 auto;font-size:12px;font-weight:600;border-radius:14px;padding:4px 8px}
.st-confirmed{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.st-tbc,.st-pending,.st-open,.st-unverified{background:var(--tbc-soft);color:var(--tbc);border-color:transparent}
.st-proposed,.st-recommended,.st-discuss,.st-estimate,.st-in-progress{background:var(--prop-soft);color:var(--prop);border-color:transparent}
.st-accept,.st-decided,.st-answered,.st-done,.st-verified{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.st-reject,.st-declined,.st-assumption{background:var(--btn2);color:var(--muted);border-color:transparent}
select.st option{background:var(--field);color:var(--ink)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:8px}
table.ed{border-collapse:collapse;width:100%;font-size:13px}
table.ed th{background:var(--paper);text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.03em;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ed td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.ed tr:last-child td{border-bottom:0}
table.ed td input,table.ed td select,table.ed td textarea{font-size:13px;padding:5px 6px}
table.ed td.num{font-variant-numeric:tabular-nums;color:var(--muted);width:34px;padding-top:10px}
table.ed td.empty{color:var(--muted);padding:14px 10px;font-style:italic}
table.ed td.act{width:36px}
.addrow{margin-top:8px}
.diff{display:flex;flex-direction:column;gap:4px;min-width:120px;padding-top:4px}
.diff b{font-size:12.5px}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.lvl-Low b{color:var(--ok)} .lvl-Moderate b{color:var(--prop)} .lvl-High b,.lvl-Very\ high b{color:var(--tbc)}

/* Read-only lists and tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.tile .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.tile.ok .v{color:var(--ok)} .tile.tbc .v{color:var(--tbc)} .tile.prop .v{color:var(--prop)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:12px;padding:1px 8px;white-space:nowrap}
ul.plain{margin:6px 0 0;padding-left:18px} ul.plain li{margin:3px 0}
.kv{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:4px 14px;margin-top:8px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.callout{border:1px solid var(--line);background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-top:10px}
.callout.warn{background:var(--tbc-soft);color:var(--ink)}
.inline-confirm{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-left:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.linklist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.linklist a{font-size:13px;border:1px solid var(--line);border-radius:14px;padding:3px 10px;text-decoration:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted);margin-top:8px}

/* Email document */
.docframe{border:1px solid var(--line);border-radius:var(--r);background:#FFFFFF;margin-top:12px;overflow:auto;max-height:none}
.docframe .docpad{padding:20px;min-width:0}
.emailbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px 18px}

/* Dashboard */
.tile .s{font-size:12px;color:var(--muted);margin-top:2px;min-height:1.4em;overflow-wrap:anywhere}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px 16px 16px;min-width:0;background:var(--surface)}
.card.wide{grid-column:1/-1}
.ch-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.ch-h h3{font-size:14px;font-weight:600}
.ch-h span{font-size:12px;color:var(--muted)}
.c-confirmed{background:var(--ok)} .c-proposed{background:var(--prop)} .c-tbc{background:var(--tbc)} .c-missing{background:var(--c-missing)} .c-navy{background:var(--c-bar)}
.lv-Low{background:var(--ok)} .lv-Moderate{background:var(--prop)} .lv-High,.lv-Veryhigh{background:var(--tbc)}
.stack{display:flex;gap:2px;height:14px;margin-top:12px}
.stack .seg{display:block;height:100%;border-radius:2px;min-width:3px}
.stack .seg:first-child{border-radius:4px 2px 2px 4px} .stack .seg:last-child{border-radius:2px 4px 4px 2px}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.lg b{color:var(--ink);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.minibars{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.mb{display:grid;grid-template-columns:minmax(80px,40%) minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:12px}
.mbl,.brl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbt{display:flex;gap:2px;height:8px;background:var(--paper);border-radius:2px}
.mbt .seg{display:block;height:100%;border-radius:2px}
.mbn{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.br{display:grid;grid-template-columns:minmax(80px,34%) minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px}
.brt{display:flex;align-items:center;gap:8px;min-width:0}
.trk{position:relative;flex:1 1 auto;height:14px;min-width:0}
.trk .hbar{position:absolute;left:0;top:1px;height:12px;border-radius:0 4px 4px 0;min-width:2px}
.trk.g5{background:linear-gradient(to right,var(--line) 1px,transparent 1px) 0 0/20% 100% repeat-x;border-right:1px solid var(--line)}
.brv{flex:0 0 auto;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:28px}
.brv.w{width:96px}
.axis5{display:grid;grid-template-columns:minmax(80px,34%) minmax(0,1fr);gap:10px;font-size:11px;color:var(--muted);margin-top:4px}
.axis5 .ticks{display:flex;justify-content:space-between;margin-right:104px;font-style:normal}
.axis5 i{font-style:normal;font-variant-numeric:tabular-nums}
.cg+.cg{margin-top:12px}
.cgk{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.trk .rng{position:absolute;top:1px;height:12px;border-radius:4px;background:var(--c-bar);min-width:3px}
.trk .midk{position:absolute;top:-2px;width:3px;height:18px;background:var(--ink);border:1px solid var(--surface);transform:translateX(-50%);border-radius:1px}
.midsw{width:3px;background:var(--ink);border-radius:1px}
.tl{display:grid;grid-template-columns:minmax(110px,28%) minmax(0,1fr);gap:12px;margin-top:10px;font-size:12px}
.tll{padding-top:18px}
.tlr{height:30px;line-height:30px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.tlt{min-width:0}
.tlg{position:relative;background:repeating-linear-gradient(to bottom,transparent 0 29px,var(--line) 29px 30px) 0 18px/100% 100% no-repeat}
.tk{position:absolute;top:18px;bottom:22px;width:1px;background:var(--line)}
.tk em{position:absolute;bottom:-19px;transform:translateX(-50%);font-style:normal;color:var(--muted);white-space:nowrap;font-size:11px}
.vl{position:absolute;top:14px;bottom:22px;width:0;border-left:2px solid var(--ink)}
.vl.close{border-left:2px dashed var(--accent)}
.vl em{position:absolute;top:-16px;left:-2px;font-size:11px;font-style:normal;white-space:nowrap;color:var(--ink)}
.vl.close em{color:var(--accent-ink);left:auto;right:-2px}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--prop);transform:translate(-50%,-50%)}
.dot::after{content:"";position:absolute;inset:-8px}
.dot.conf{background:var(--ok);border-color:var(--ok)}
.dot.late{background:var(--tbc);border-color:var(--tbc)}
.dot.dec{border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
.dotsw{border-radius:50%;border:2px solid var(--prop);background:var(--surface)}
.dotsw.conf{background:var(--ok);border-color:var(--ok)} .dotsw.late{background:var(--tbc);border-color:var(--tbc)}
.vsw{width:0;height:12px;border-left:2px dashed var(--accent);border-radius:0}
[data-tip]{cursor:default}
[data-tip]:hover,[data-tip]:focus-visible{filter:brightness(1.18)}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 9px;font-size:12px;box-shadow:0 6px 18px rgba(0,20,51,.18);max-width:260px}
.tip b{display:block;font-variant-numeric:tabular-nums}
.tip span{color:var(--muted)}
.doccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.doccard{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.doccard h3{font-size:15px;font-weight:600}
.doccard p{margin:0;color:var(--muted);font-size:12.5px;flex:1}
.doccard .toolbar{margin-top:6px}
@media (max-width:900px){.dgrid{grid-template-columns:minmax(0,1fr)}}

.research{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.kv.plan{grid-template-columns:minmax(110px,40%) minmax(0,1fr);margin-top:4px}
.gantt{margin-top:8px;font-size:12px}
.gr{display:grid;grid-template-columns:minmax(110px,26%) minmax(0,1fr) 92px;gap:10px;align-items:center;min-height:28px;border-top:1px solid var(--line)}
.gr.gh{min-height:0;height:0;border-top:0}
.gr.ga{border-top:0;min-height:22px}
.gl{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gd{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11.5px}
.gt{position:relative;height:28px;min-width:0}
.gr.gh .gt{height:0}
.gx{position:absolute;left:0;right:0;top:0;height:0}
.gw{position:absolute;top:0;width:1px;background:var(--line);height:var(--gh,400px)}
.gw em{display:none}
.gv{position:absolute;top:-6px;width:0;height:var(--gh,400px);border-left:2px solid var(--ink);z-index:1}
.gv.close{border-left:2px dashed var(--accent)}
.gv em{position:absolute;top:-14px;left:3px;font-size:10.5px;font-style:normal;white-space:nowrap;color:var(--ink);background:var(--surface);padding:0 2px}
.gv.close em{color:var(--accent-ink)}
.gb{position:absolute;top:8px;height:12px;border-radius:4px;min-width:6px;z-index:2}
.gm{position:absolute;top:8px;width:12px;height:12px;transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:2}
.gb.late,.gm.late{outline:2px solid var(--tbc);outline-offset:1px}
.gb::after,.gm::after{content:"";position:absolute;inset:-8px}
.gaxis{height:22px}
.gaxis em{position:absolute;top:4px;transform:translateX(-50%);font-style:normal;color:var(--muted);font-size:10.5px;white-space:nowrap}
.gmsw{transform:rotate(45deg);background:var(--prop);width:9px;height:9px}
.todaysw{width:0;height:12px;border-left:2px solid var(--ink);border-radius:0}
.btn-submit{background:var(--accent);color:#001433;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,10,28,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal-card{background:var(--surface);color:var(--ink);border-radius:10px;max-width:560px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,10,28,.35);max-height:calc(100% - 32px);overflow:auto}
ul.checks{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-direction:column;gap:4px;font-size:13px}
ul.checks li span{display:inline-block;width:18px;font-weight:700}
ul.checks li.ok span{color:var(--ok)} ul.checks li.bad span{color:var(--tbc)} ul.checks li.warn span{color:var(--accent-ink)}
.steps{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.step{display:flex;gap:10px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);min-width:0}
.step.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.step.done{background:var(--paper)}
.sn{flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;border:2px solid var(--line-strong);color:var(--muted);font-variant-numeric:tabular-nums}
.step.done .sn{background:var(--ok);border-color:var(--ok);color:#fff}
.step.current .sn{background:var(--accent);border-color:var(--accent);color:#001433}
.sb{display:flex;flex-direction:column;gap:3px;min-width:0}
.sb b{font-size:13px}
.sb>span{font-size:12px;color:var(--muted);line-height:1.35}
.sbtn{align-self:flex-start;margin-top:6px;padding:5px 10px;font-size:12.5px;white-space:normal;text-align:left;max-width:100%}
.slinks{display:flex;gap:2px;margin-top:2px}
.slinks .btn3{padding:2px 6px;font-size:12px;color:var(--prop)}
@media (max-width:1100px){.steps{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}}
.subh{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px;font-weight:600}
.secbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,20,51,.14)}
.secst{display:flex;gap:8px;align-items:center;margin-right:auto;min-width:0;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.seg button{background:var(--surface);border:0;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:9px 14px;border-radius:var(--r);font-size:13px;box-shadow:0 6px 20px rgba(0,20,51,.25);max-width:calc(100% - 32px);z-index:20}
.ro input,.ro select,.ro textarea{pointer-events:none;opacity:.85}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .rail .grp{display:none}
  .rail button{border-left:0;border-bottom:2px solid transparent;border-radius:0;white-space:nowrap}
  .rail button[aria-current="true"]{border-bottom-color:var(--accent)}
  .sheet{padding:18px 16px 24px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

}

/* ---------- market-based plan basis ---------- */
const LEAD={Low:5,Moderate:7,High:10,"Very high":15};
const RESUME_SUGGEST={Low:5,Moderate:5,High:4,"Very high":3};
function schedWhen(r){return r.from?(r.to&&r.to!==r.from?`${fmtDate(r.from)} – ${fmtDate(r.to)}`:fmtDate(r.from)):""}
function schedCheck(){const bad=pkg.plan.schedule.filter(r=>r.from&&r.to&&r.to<r.from).map(r=>r.stage);const cl=pkg.meta.closureDate.v;const late=pkg.plan.schedule.filter(r=>r.from&&cl&&r.from>cl&&r.stage!=="Tentative onboarding").map(r=>r.stage);
  return (bad.length?`<div class="callout warn">End date is before the start date for: ${bad.map(esc).join(", ")}.</div>`:"")+(late.length?`<div class="callout warn">After the tentative closure date (${fmtDate(cl)}): ${late.map(esc).join(", ")}.</div>`:"")}
function marketBasis(){
  const prim=pkg.skills.filter(s=>s.tier==="primary"&&s.name).map(s=>s.name.toLowerCase());
  const rows=pkg.market.availability.filter(r=>r.skill).map(r=>({r,sc:scoreOf(r)})).filter(x=>x.sc).sort((a,b)=>b.sc.avg-a.sc.avg);
  if(!rows.length)return {level:null,skill:"",lead:7,extra:0,note:"Market difficulty not yet assessed, so a moderate lead time (7 business days) is assumed. Run market research to tailor the plan."};
  const top=rows[0], lvl=top.sc.lvl, lead=LEAD[lvl], extra=lvl==="High"?1:lvl==="Very high"?2:0;
  const isPrim=prim.some(p=>top.r.skill.toLowerCase().includes(p)||p.includes(top.r.skill.toLowerCase()));
  return {level:lvl,skill:top.r.skill,lead,extra,note:`Based on market intelligence: the hardest area to hire is ${top.r.skill}${isPrim?" (a primary skill)":""}, rated ${lvl} (${top.sc.avg.toFixed(1)} of 5). The plan allows ${lead} business days to the first resumes${extra?` and ${extra} extra day(s) in each interview window`:""}.`};
}

function importResearch(){

  const userSrc=mk.sources.filter(s=>s.by!=="Claude");const idMap={};mk.sources.forEach((s,i)=>{if(s.by!=="Claude")idMap["S"+(i+1)]="S"+(userSrc.indexOf(s)+1)});
  const fixRefs=v=>String(v||"").replace(/S(\d+)/g,m=>idMap[m]||"");
  MKT_LISTS.forEach(k=>{mk[k]=(mk[k]||[]).filter(x=>x.by!=="Claude");mk[k].forEach(x=>{if(x.sources)x.sources=fixRefs(x.sources).replace(/(,\s*)+/g,", ").replace(/^,\s*|,\s*$/g,"")})});
  mk.sources=userSrc;
  const off=mk.sources.length, remap=s=>String(s||"").replace(/S(\d+)/g,(m,n)=>"S"+(Number(n)+off));
  (r.sources||[]).forEach(s=>mk.sources.push({title:s.title||"",publisher:s.publisher||"",url:s.url||"",published:s.published||"",accessed:s.accessed||todayISO(),note:s.note||"",by:"Claude"}));

  add("comp",["role","level","geo","currency","low","mid","high","period","basis","dataDate","evidence","limits"]);
  add("factors",["factor","effect","evidence"]);
  ["findings","context","supply","demand","mobility"].forEach(k=>add(k,["text","evidence"]));
  add("recs",["text"]);
  (r.alternatives||[]).forEach(a=>mk.alternatives.push({...LISTS["market.alternatives"].blank(),...pick(a,["alt","forSkill","gain","risk"]),hm:"pending",by:"Claude"}));
  (r.toConfirm||[]).forEach(q=>mk.toConfirm.push({question:String(q.question||q),answer:"",s:"open",by:"Claude"}));

      btn:rs==="ready"?["Add findings","importResearch"]:rs==="requested"||rs==="in-progress"?null:[rs==="failed"?"Try again":rs==="added"?"Run again":"Start research","requestResearch"]},
    {k:"plan",t:"Tentative plan",done:planned,sub:planned?`${pkg.plan.schedule.filter(r=>r.from).length} stages dated`:"Gantt built from the market difficulty",btn:[planned?"Rebuild plan":"Build plan","stepBuild"]},

    {k:"send",t:"Send to hiring manager",done:!!pkg.sentToHM,sub:pkg.sentToHM?"Sent "+fmtDate(pkg.sentToHM):"Download or copy the Tentative Hiring Plan",btn:pkg.sentToHM?["Undo",'unmarkSent']:["Mark as sent","markSent"]}

/* ---------- Gantt chart of the tentative plan ---------- */
function ganttRows(){return pkg.plan.schedule.filter(r=>r.stage&&r.from).map(r=>({...r,to:r.to&&r.to>=r.from?r.to:r.from})).sort((a,b)=>a.from===b.from?a.to.localeCompare(b.to):a.from.localeCompare(b.from))}
function shortD(iso){const [y,m,d]=iso.split("-").map(Number);return d+" "+MON[m-1]}
function chartGantt(){
  const rows=ganttRows(), b=marketBasis(), cl=pkg.meta.closureDate.v, today=todayISO();
  const headTxt=chartHead("Tentative hiring plan",b.level?"Gantt · based on market difficulty: "+b.level:"Gantt · market not yet assessed")+`<p class="help" style="margin:6px 0 4px">${esc(pkg.plan.basisNote||b.note)}</p>`;
  if(!rows.length)return headTxt+`<p class="help">No dated stages yet. Select “Build the tentative plan” or add stages with dates in the interview schedule.</p><div class="toolbar"><button class="btn" type="button" data-act="goBuild">Build the tentative plan</button></div>`;
  const ds=[...rows.flatMap(r=>[r.from,r.to]),cl].filter(Boolean).sort();
  const start=parseISO(ds[0]);start.setDate(start.getDate()-((start.getDay()+6)%7));// back to Monday
  const end=parseISO(ds[ds.length-1]);end.setDate(end.getDate()+(7-((end.getDay()+6)%7)));// to next Monday
  const span=end-start, X=iso=>(parseISO(iso)-start)/span*100, DAY=86400000/span*100;
  const weeks=[];const w=new Date(start);while(w<end){weeks.push(toISO(w));w.setDate(w.getDate()+7)}
  const every=Math.ceil(weeks.length/10);
  const months=[];weeks.forEach((x,i)=>{const mo=x.slice(0,7);if(!months.length||months[months.length-1].mo!==mo)months.push({mo,i})});
  const grid=`<div class="gx">${weeks.map((x,i)=>`<span class="gw" style="left:${X(x).toFixed(2)}%">${i%every?"":`<em>${shortD(x)}</em>`}</span>`).join("")}</div>`;
  const lines=(today>=toISO(start)&&today<=toISO(end)?`<span class="gv today" style="left:${X(today).toFixed(2)}%"><em>Today</em></span>`:"")+(cl?`<span class="gv close" style="left:${(X(cl)+DAY).toFixed(2)}%"><em>Closure</em></span>`:"");
  const body=rows.map(r=>{const one=r.from===r.to, l=X(r.from), wd=X(r.to)+DAY-l, late=cl&&r.from>cl&&r.stage!=="Tentative onboarding";
    const cls=r.s==="confirmed"?"c-confirmed":r.s==="tbc"?"c-tbc":"c-proposed";
    const tip=`${schedWhen(r)}|${r.stage}${r.detail?" · "+r.detail:""}${r.who?" · "+r.who:""} · ${ST_LABEL[r.s]||r.s}${late?" · after closure date":""}`;
    return `<div class="gr"><span class="gl">${esc(r.stage)}</span><span class="gt">${one?`<span class="gm ${cls}${late?" late":""}" style="left:${(l+DAY/2).toFixed(2)}%" data-tip="${esc(tip)}" tabindex="0"></span>`:`<span class="gb ${cls}${late?" late":""}" style="left:${l.toFixed(2)}%;width:${wd.toFixed(2)}%" data-tip="${esc(tip)}" tabindex="0"></span>`}</span><span class="gd">${one?shortD(r.from):shortD(r.from)+"–"+shortD(r.to)}</span></div>`}).join("");
  return headTxt+`<div class="gantt" style="--gh:${rows.length*29+6}px"><div class="gr gh"><span class="gl"></span><span class="gt">${grid}${lines}</span><span class="gd"></span></div>${body}<div class="gr ga"><span class="gl"></span><span class="gt gaxis">${weeks.map((x,i)=>i%every?"":`<em style="left:${X(x).toFixed(2)}%">${shortD(x)}</em>`).join("")}</span><span class="gd"></span></div></div>`
   +`<div class="lg"><span><i class="sw c-proposed"></i>Proposed</span><span><i class="sw c-confirmed"></i>Confirmed</span><span><i class="sw c-tbc"></i>To confirm</span><span><i class="sw gmsw"></i>Single date</span><span><i class="sw vsw"></i>Closure date</span><span><i class="sw todaysw"></i>Today</span></div>`
   +`<div class="toolbar"><button class="btn2" type="button" data-act="goBuild">Rebuild the tentative plan</button><button class="btn3" type="button" data-tab="plan">Edit dates</button></div>`;
}
function ganttBlock(){
  const rows=ganttRows();if(!rows.length)return null;
  const s0=parseISO(rows[0].from);s0.setDate(s0.getDate()-((s0.getDay()+6)%7));
  const last=rows.reduce((m,r)=>r.to>m?r.to:m,rows[0].to);const e0=parseISO(last);
  let weeks=Math.ceil(((e0-s0)/86400000+1)/7);const per=Math.max(1,Math.ceil(weeks/16));const n=Math.ceil(weeks/per);
  const cols=[];for(let i=0;i<n;i++){const d=new Date(s0);d.setDate(d.getDate()+i*7*per);cols.push(toISO(d))}
  const colEnd=i=>{const d=parseISO(cols[i]);d.setDate(d.getDate()+7*per-1);return toISO(d)};
  return {t:"gantt",per,cols:cols.map(c=>{const [y,m,d]=c.split("-").map(Number);return d+"/"+m}),rows:rows.map(r=>({label:r.stage,when:schedWhen(r),status:r.s,cells:cols.map((c,i)=>r.from<=colEnd(i)&&r.to>=c?(r.from===r.to?2:1):0)}))};
}

/* ---------- confirmation tracker ---------- */
const META_LABELS={role:"Role title",reqId:"Requisition ID",businessUnit:"Business unit / company",department:"Department / function",grade:"Grade / level",positions:"Number of positions",reportsTo:"Reports to",reasonForHire:"Reason for hire",location:"Location",workArrangement:"Work arrangement",relocation:"Relocation / visa support",hiringMarket:"Geographic hiring market",travel:"Travel",hiringManager:"Hiring manager",taPartner:"TA Partner",pcPartner:"P&C partner",decisionMaker:"Final decision maker",kickoffDate:"Kickoff date",closureDate:"Tentative closure date",closureDefinition:"Definition of closure"};
const CRITICAL=["role","location","workArrangement","hiringMarket","hiringManager","taPartner","pcPartner","closureDate"];
function tracker(){
  const items=[];const push=(area,item,status,detail)=>items.push({area,item,status,detail:detail||""});
  for(const k in META_LABELS){const f=pkg.meta[k];if(!f)continue;const v=String(f.v||"").trim();push("Role details",META_LABELS[k],v?f.s:"missing",v)}
  push("Interview plan","First resumes: number",pkg.plan.resumeCount.v?pkg.plan.resumeCount.s:"missing",pkg.plan.resumeCount.v);
  push("Interview plan","First resumes: date",pkg.plan.resumeDate.v?pkg.plan.resumeDate.s:"missing",fmtDate(pkg.plan.resumeDate.v));
  push("Offer and onboarding","Tentative offer date",pkg.plan.offerDate.v?pkg.plan.offerDate.s:"missing",fmtDate(pkg.plan.offerDate.v));
  push("Offer and onboarding","Tentative onboarding / start date",pkg.plan.onboardingDate.v?pkg.plan.onboardingDate.s:"missing",fmtDate(pkg.plan.onboardingDate.v));
  push("Interview plan","Feedback turnaround",pkg.plan.feedbackSla.v?pkg.plan.feedbackSla.s:"missing",pkg.plan.feedbackSla.v);
  pkg.skills.forEach(r=>r.name&&push("Skills",r.name,r.s,label(TIERS,r.tier)));
  pkg.prefs.forEach(r=>r.detail&&push("Hiring manager preferences",r.area,r.s,r.detail));
  pkg.success.forEach(r=>r.measure&&push("Success measures",r.measure,r.s,r.timeframe));
  pkg.interviewers.forEach(r=>push("Interviewers",r.level||"Interviewer",r.name?r.s:"missing",r.name));
  pkg.plan.stages.forEach(r=>r.name&&push("Interview stages",r.name,r.s,r.owner));
  pkg.plan.schedule.forEach(r=>r.stage&&push("Interview schedule",r.stage,r.from?r.s:"missing",schedWhen(r)));
  pkg.plan.milestones.forEach(r=>r.name&&push("Milestones",r.name,r.s,fmtDate(r.date)));
  pkg.plan.assessments.forEach(r=>r.name&&push("Assessments",r.name,r.s==="confirmed"?"confirmed":r.s==="declined"?"declined":"proposed",""));
  pkg.market.alternatives.forEach(r=>r.alt&&push("Alternative skills",r.alt,r.hm==="accept"?"confirmed":r.hm==="reject"?"declined":"tbc",label(HM_ALT,r.hm)));
  pkg.hmDecisions.forEach(r=>r.decision&&push("Decisions for hiring manager",r.decision,r.s==="decided"?"confirmed":"tbc",r.answer));
  pkg.questions.forEach(r=>r.question&&push("Open questions",r.question,r.s==="answered"?"confirmed":"tbc",r.owner));
  const c={confirmed:0,tbc:0,proposed:0,missing:0};items.forEach(i=>{if(c[i.status]!=null)c[i.status]++});
  const critMissing=CRITICAL.filter(k=>!String(pkg.meta[k].v||"").trim()||pkg.meta[k].s!=="confirmed").map(k=>META_LABELS[k]);
  if(!pkg.skills.some(s=>s.tier==="primary"&&s.name))critMissing.push("At least one primary skill");
  if(!pkg.market.comp.some(r=>r.low||r.mid||r.high))critMissing.push("Sourced compensation range");
  return {items,c,critMissing};
}

/* ---------- rendering primitives ---------- */
function opts(list,v){return list.map(([k,l])=>`<option value="${esc(k)}"${String(v)===k?" selected":""}>${esc(l)}</option>`).join("")}
function statusSel(path,v){return `<select class="st st-${esc(v)}" data-path="${path}" aria-label="Status">${opts(STATUS,v)}</select>`}
function field(path,lab,o={}){
  const f=getPath(pkg,path)||F();const id="f_"+path.replace(/\./g,"_");
  let inp;
  if(o.type==="select")inp=`<select id="${id}" data-path="${path}.v">${opts(o.opts,f.v)}</select>`;
  else if(o.type==="area")inp=`<textarea id="${id}" rows="${o.rows||3}" data-path="${path}.v" placeholder="${esc(o.ph||"")}">${esc(f.v)}</textarea>`;
  else inp=`<input id="${id}" type="${o.type||"text"}" data-path="${path}.v" value="${esc(f.v)}" placeholder="${esc(o.ph||"")}"${o.type==="date"?" "+DATTR:""}>`;

}
function plainField(path,lab,o={}){
  const v=getPath(pkg,path)||"";const id="f_"+path.replace(/\./g,"_");
  const inp=o.type==="area"?`<textarea id="${id}" rows="${o.rows||4}" data-path="${path}" placeholder="${esc(o.ph||"")}">${esc(v)}</textarea>`

function cell(path,r,c,i){
  const p=path+"."+i+"."+c.k, v=r[c.k];
  switch(c.type){
    case "select":return `<select data-path="${p}"${c.cls?` class="st st-${esc(v)}"`:""} aria-label="${esc(c.l)}">${opts(c.opts,v)}</select>`;
    case "status":return statusSel(p,v);
    case "area":return `<textarea rows="2" data-path="${p}" aria-label="${esc(c.l)}">${esc(v)}</textarea>`;
    case "date":return `<input type="date" data-path="${p}" value="${esc(v)}" aria-label="${esc(c.l)}" ${DATTR}>`;
    case "url":return `<input type="url" data-path="${p}" value="${esc(v)}" placeholder="https://" aria-label="${esc(c.l)}">`;
    case "check":return `<input type="checkbox" data-path="${p}"${v?" checked":""} aria-label="${esc(c.l)}">`;
    case "rowid":return `<b style="font-variant-numeric:tabular-nums">S${i+1}</b>`;

function setSave(t,isDirty){const el=$("#saveState");el.textContent=t;el.classList.toggle("dirty",!!isDirty)}
function scheduleSave(){if(!S.canWrite)return;dirty=true;editSeq++;setSave("Unsaved changes",true);clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,900)}
function saveNow(){
  clearTimeout(saveTimer);if(!pkg||!S.canWrite)return Promise.resolve();
  const seq=editSeq;pkg.updatedAt=new Date().toISOString();pkg.rev=uid();myRevs.add(pkg.rev);
  const body=clone(pkg);packages[body.id]=body;lsSet(LS_LAST,body.id);
  const size=JSON.stringify(body).length;
  if(S.mode==="db"){
    if(size>250000){setSave("Too large to save",true);toast("This package is too large to save (over 250 KB). Shorten the JD text or long notes.");return Promise.resolve()}
    setSave("Saving…",true);
    writeChain=writeChain.then(()=>S.db.collection("packages").doc(body.id).set(body)).then(()=>{if(seq===editSeq){dirty=false;setSave("Saved "+timeNow())}}).catch(e=>dbFail(e));
    return writeChain;
  }
  const all=lsGet(LS_KEY)||{};all[body.id]=body;
  if(lsSet(LS_KEY,all)){if(seq===editSeq){dirty=false;setSave("Saved in this browser "+timeNow())}}else setSave("Not saved: browser storage unavailable",true);
  return Promise.resolve();
}
function dbFail(e){const c=e&&e.code;
  if(c==="invalid_argument"&&S.user){S.canWrite=false;renderNotices();render();setSave("Read-only",true);return}
  if(c==="quota_exceeded")toast("The shared store is full. Delete old packages or snapshots, then try again.");
  else toast("Could not save ("+(c||"error")+"). Your changes are still on this page; edit again to retry.");
  setSave("Save failed",true)}
const timeNow=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};

async function saveSnapshot(labelText){
  if(!pkg)return;await saveNow();
  const lastMeet=pkg.meetings.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
  const ver={id:uid(),at:new Date().toISOString(),label:labelText||(lastMeet?`${lastMeet.type||"Meeting"} · ${fmtDate(lastMeet.date)}`:"Snapshot"),data:clone(pkg)};
  try{
    if(S.mode==="db"){const col=S.db.collection(`packages/${pkg.id}/versions`);await col.doc(ver.id).set(ver);
      const all=await col.orderBy("at","desc").get();const extra=all.docs.slice(MAX_VERSIONS);for(const d of extra){await col.doc(d.id).delete()}}
    else{const k=LS_VER+pkg.id;const arr=lsGet(k)||[];arr.unshift(ver);if(!lsSet(k,arr.slice(0,MAX_VERSIONS)))throw {code:"storage"}}
    toast("Snapshot saved: "+ver.label);if(cur==="history")loadVersions();
  }catch(e){toast("Could not save the snapshot ("+(e.code||"error")+").")}
}

  const box=$("#verList");if(!box||!pkg)return;
  try{
    if(S.mode==="db"){const snap=await S.db.collection(`packages/${pkg.id}/versions`).orderBy("at","desc").limit(MAX_VERSIONS).get();versionsCache=snap.docs.map(d=>d.data())}
    else versionsCache=lsGet(LS_VER+pkg.id)||[];
  }catch(e){box.innerHTML=`<p class="help">Snapshots could not be loaded (${esc(e.code||"error")}).</p>`;return}
  if(!$("#verList"))return;
  box.innerHTML=versionsCache.length?`<div class="tbl-wrap"><table class="ed"><tr><th>Saved</th><th>Label</th><th>Confirmed / to confirm</th><th></th></tr>${versionsCache.map((v,i)=>{const d=new Date(v.at);const c=countStatus(v.data);return `<tr><td style="white-space:nowrap">${fmtDate(toISO(d))} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</td><td>${esc(v.label)}</td><td>${c.confirmed} / ${c.tbc}</td><td style="white-space:nowrap"><button class="btn2" type="button" data-act="diffVer" data-idx="${i}">Compare</button> <button class="btn2" type="button" data-act="restoreVer" data-idx="${i}"${S.canWrite?"":" disabled"}>Restore…</button><span id="rv-${i}"></span></td></tr>`}).join("")}</table></div><div id="verDiff"></div>`
    :`<p class="help">No snapshots yet. Save one at the end of each meeting with “Save meeting snapshot”.</p>`;
}
function countStatus(p){const keep=pkg;try{pkg=normalize(p);return tracker().c}finally{pkg=keep}}
function diffVersions(a,b){
  const out=[];const walk=(x,y,path)=>{
    if(typeof x!=="object"||x===null||typeof y!=="object"||y===null){if(JSON.stringify(x)!==JSON.stringify(y))out.push([path,x,y]);return}
    if(Array.isArray(x)||Array.isArray(y)){if(JSON.stringify(x)!==JSON.stringify(y)){const ax=Array.isArray(x)?x.length:0,ay=Array.isArray(y)?y.length:0;out.push([path,ax+" row(s)",ay+" row(s), changed"])}return}
    new Set([...Object.keys(x),...Object.keys(y)]).forEach(k=>{if(["updatedAt","rev","createdAt"].includes(k))return;walk(x[k],y[k],path?path+"."+k:k)})};
  walk(a,b,"");return out;
}
function prettyPath(p){return p.replace(/^meta\.(\w+)\.v$/,(m,k)=>META_LABELS[k]||k).replace(/^meta\.(\w+)\.s$/,(m,k)=>(META_LABELS[k]||k)+" (status)").replace(/^text\./,"Text: ").replace(/^plan\./,"Plan: ").replace(/^market\./,"Market: ")}

/* ---------- proposed timeline ---------- */
function buildTimeline(silent){
  const B0=marketBasis();let k=pkg.meta.kickoffDate.v||todayISO();if(k<DMIN)k=DMIN;const lead=Math.max(1,parseInt(pkg.plan.daysToResumes,10)||B0.lead), X=B0.extra;
  if(pkg.plan.resumeCount.s!=="confirmed"&&B0.level)pkg.plan.resumeCount={v:String(RESUME_SUGGEST[B0.level]),s:"proposed"};
  const sla=Math.max(1,parseInt(String(pkg.plan.feedbackSla.v).match(/\d+/)?.[0]||"2",10));
  const r=addBD(k,lead), fb=addBD(r,sla), l1s=addBD(fb,1), l1e=addBD(l1s,4+X), sh=addBD(l1e,sla), l2s=addBD(sh,1), l2e=addBD(l2s,3+X), hrS=addBD(l2s,1), hrE=addBD(l2e,1), fd=addBD(hrE,sla), ref=addBD(fd,2), off=addBD(ref,1), acc=addBD(off,3);
  const L1=pkg.interviewers.find(i=>/L1/i.test(i.level)),L2=pkg.interviewers.find(i=>/L2/i.test(i.level)),PC=pkg.interviewers.find(i=>/P&C/i.test(i.level));
  const nm=(x,d)=>x&&x.name?x.name:d;
  if(pkg.plan.resumeDate.s!=="confirmed")pkg.plan.resumeDate={v:r,s:"proposed"};pkg.plan.basisNote=B0.note;
  pkg.plan.milestones=[
    {name:"Kickoff held; package shared with hiring manager",owner:"TA Partner",date:addBD(k,1),dependency:"Kickoff notes",decision:false,s:"proposed"},
    {name:"JD and comp range confirmed; sourcing live",owner:"TA Partner, P&C",date:addBD(k,2),dependency:"HM sign-off on JD; P&C range",decision:true,s:"proposed"},
    {name:`First ${pkg.plan.resumeCount.v||5} resumes submitted`,owner:"TA Partner",date:r,dependency:"Sourcing live",decision:false,s:"proposed"},
    {name:"Hiring manager resume feedback",owner:"Hiring manager",date:fb,dependency:"Resumes submitted",decision:true,s:"proposed"},
    {name:"L1 interviews completed",owner:nm(L1,"L1 interviewer"),date:l1e,dependency:"Interviewer availability",decision:false,s:"proposed"},
    {name:"Shortlist for L2 agreed",owner:"Hiring manager",date:sh,dependency:"L1 scorecards",decision:true,s:"proposed"},
    {name:"L2 interviews completed",owner:nm(L2,"Hiring manager"),date:l2e,dependency:"Shortlist",decision:false,s:"proposed"},
    {name:"HR interviews completed",owner:nm(PC,"P&C partner"),date:hrE,dependency:"L2 interviews",decision:false,s:"proposed"},
    {name:"Final selection decision",owner:nm(pkg.interviewers.find(i=>/decision/i.test(i.level)),"Final decision maker"),date:fd,dependency:"All scorecards",decision:true,s:"proposed"},
    {name:"References and offer approval",owner:"TA Partner, P&C",date:ref,dependency:"Selection decision",decision:false,s:"proposed"},
    {name:"Tentative offer date",owner:"TA Partner",date:off,dependency:"Approvals",decision:false,s:"proposed"},
    {name:"Offer accepted (hiring closure)",owner:"Candidate",date:acc,dependency:"Offer",decision:true,s:"proposed"}
  ];
  const cvN=pkg.plan.resumeCount.v||"5";
  pkg.plan.schedule=[
    {stage:"First set of CVs to hiring manager",from:r,to:"",detail:`${cvN} CVs`,who:"TA Partner",s:"proposed"},
    {stage:"Hiring manager CV feedback",from:fb,to:"",detail:"Shortlist for L1",who:nm(pkg.interviewers.find(i=>/decision/i.test(i.level)),"Hiring manager"),s:"proposed"},
    {stage:"TA screening calls",from:addBD(k,2),to:r,detail:"30 min each",who:"TA Partner",s:"proposed"},
    {stage:"First-level (L1) interviews",from:l1s,to:l1e,detail:"60 min · slots to confirm",who:nm(L1,TBC),s:"proposed"},
    {stage:"Second-level (L2) interviews",from:l2s,to:l2e,detail:"60 min · slots to confirm",who:nm(L2,TBC),s:"proposed"},
    {stage:"HR interview",from:hrS,to:hrE,detail:"30–45 min · values and culture",who:nm(PC,TBC),s:"proposed"},
    {stage:"Final selection decision",from:fd,to:"",detail:"",who:nm(pkg.interviewers.find(i=>/decision/i.test(i.level)),"Final decision maker"),s:"proposed"},
    {stage:"Tentative offer",from:off,to:"",detail:"After references and approvals",who:"TA Partner, P&C",s:"proposed"}
  ];
  if(pkg.plan.offerDate.s!=="confirmed")pkg.plan.offerDate={v:off,s:"proposed"};
  const nw=parseFloat(pkg.plan.noticeWeeks);
  if(pkg.plan.onboardingDate.s!=="confirmed"){if(nw>0){const d=parseISO(acc);d.setDate(d.getDate()+Math.round(nw*7));while(d.getDay()!==1)d.setDate(d.getDate()+1);pkg.plan.onboardingDate={v:toISO(d),s:"proposed"};

  if(late){toast("Some dates fall after 2035. Choose an earlier kickoff date.");}
  scheduleSave();if(silent)return;render();if(late)return;toast(nw>0?"Tentative plan built, including offer and start dates. All dates are proposals until agreed.":"Proposed timeline built. Add the notice period to estimate the start date.");

/* ---------- executive summary draft ---------- */
function draftExec(){
  const m=pkg.meta, t=tracker();
  const prim=pkg.skills.filter(s=>s.tier==="primary"&&s.name).map(s=>s.name);
  const hard=pkg.market.availability.map(r=>({r,sc:scoreOf(r)})).filter(x=>x.sc&&x.r.skill).sort((a,b)=>b.sc.avg-a.sc.avg);
  const pend=pkg.hmDecisions.filter(d=>d.s!=="decided"&&d.decision).length;
  const p=[];
  p.push(`Hiring need: ${fv(m.positions)} × ${fv(m.role)} for ${fv(m.businessUnit)}, based in ${fv(m.location)} (${fv(m.workArrangement)}). Tentative closure: ${m.closureDate.v?fmtDate(m.closureDate.v)+(m.closureDate.s==="confirmed"?"":" "+TBC):TBC}.`);
  p.push(`Priority skills: ${prim.length?prim.join("; "):TBC}.`);
  p.push(hard.length?`Market outlook: the hardest area to hire is ${hard[0].r.skill} (${hard[0].sc.lvl.toLowerCase()} difficulty${hard[0].r.market?", "+hard[0].r.market:""}). ${pkg.text.marketSummary||""}`.trim():"Market outlook: research in progress. Availability, difficulty and pay ranges will be added with sources.");
  p.push(`Plan: ${pkg.plan.stages.filter(s=>s.name).length} interview stages. The TA Partner proposes to submit the first ${pkg.plan.resumeCount.v||5} resumes by ${pkg.plan.resumeDate.v?fmtDate(pkg.plan.resumeDate.v):TBC}${pkg.plan.resumeCount.s==="confirmed"&&pkg.plan.resumeDate.s==="confirmed"?" (agreed)":" (proposed)"}.`);
  p.push(`Open items: ${t.c.tbc+t.c.missing} item(s) still to confirm${pend?`, including ${pend} decision(s) needed from the hiring manager (section 7)`:""}.`);
  return p.join("\n\n");
}

/* ---------- document model ---------- */
const DOCS={

};
function defaultSubject(kind){kind=kind||pkg.email.kind||"full";return `${DOCS[kind].short} for review: ${pkg.meta.role.v||"[Role]"}${pkg.meta.location.v?" · "+pkg.meta.location.v:""}${pkg.meta.reqId.v?" · "+pkg.meta.reqId.v:""}`}
function defaultNote(kind){kind=kind||pkg.email.kind||"full";return {
  full:"Thank you for the kickoff. Below is the hiring package: what we agreed, what still needs confirming, the market picture and the proposed plan. Please review the decisions I need from you and reply with any corrections.",
  minutes:"Thank you for the meeting. Below are the minutes: what we agreed, the open questions and the action items. Please reply with any corrections, especially for items marked [To confirm].",
  market:"Below is the talent availability and market intelligence for this role. Figures are indicative and sourced as listed. The alternative skills are options for your decision, not changes to the role.",
  plan:"Below is the tentative hiring plan for this role, built on the market intelligence we gathered. It covers the interview stages, the first resume commitment, the interview schedule, tentative offer and onboarding dates, and the decisions I need from you. All dates are proposals until we agree them."}[kind]}

function fd(f){return f&&f.v?fmtDate(f.v)+(f.s==="confirmed"?"":f.s==="proposed"?" (proposed)":" "+TBC):TBC}
function st2(ev){return {text:label(EVIDENCE,ev),status:ev==="verified"?"confirmed":ev==="estimate"?"proposed":ev==="assumption"?"declined":"tbc"}}
const stc=s=>({text:ST_LABEL[s]||s,status:s});

function buildDoc(kind){
  kind=kind||pkg.email.kind||"full";
  const m=pkg.meta,e=pkg.email,t=tracker(),B=[];let n=0;
  const H1=x=>B.push({t:"h1",text:(++n)+". "+x}), H2=x=>B.push({t:"h2",text:x});
  const role=m.role.v||TBC;
  B.push({t:"title",text:`${DOCS[kind].name}: ${role}`});
  B.push({t:"sub",text:`${m.org.v||"Volvo Group"} · Talent Acquisition · Prepared ${fmtDate(m.prepDate)}`});
  if(e.recipient||m.hiringManager.v)B.push({t:"p",text:`Dear ${e.recipient||m.hiringManager.v},`});
  B.push({t:"p",text:(kind===(e.kind||"full")&&e.note)?e.note:defaultNote(kind)});
  const lastMeet=pkg.meetings.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
  const kv=[["Role",fv(m.role)],["Requisition",fv(m.reqId)],["Business unit",fv(m.businessUnit)],["Location",fv(m.location)]];
  if(kind!=="market")kv.push(["Work arrangement",fv(m.workArrangement)]);
  if(kind==="market")kv.push(["Geographic hiring market",fv(m.hiringMarket)]);
  kv.push(["Hiring manager",fv(m.hiringManager)],["TA Partner",fv(m.taPartner)]);
  if(kind!=="market")kv.push(["P&C partner",fv(m.pcPartner)]);
  if(kind==="minutes")kv.push(["Latest meeting",lastMeet?`${label(MEET_TYPES,lastMeet.type)}, ${fmtDate(lastMeet.date)}`:TBC]);
  kv.push(["Preparation date",fmtDate(m.prepDate)]);
  if(kind!=="market")kv.push(["Tentative closure date",fd(m.closureDate)]);
  if(kind==="full"||kind==="plan")kv.push(["Tentative offer date",fd(pkg.plan.offerDate)],["Tentative onboarding date",fd(pkg.plan.onboardingDate)]);
  kv.push(["Information status",`${label(INFO,m.infoStatus)}: ${t.c.confirmed} confirmed, ${t.c.tbc+t.c.missing} to confirm, ${t.c.proposed} proposed`]);
  B.push({t:"kv",rows:kv});
  B.push({t:"note",text:kind==="market"?"Evidence types: “Verified fact” is confirmed from a primary source. “Sourced estimate” is a figure from a cited third party. “Internal assumption” is TA judgement. “Not yet verified” has no source yet.":`How to read this: “Confirmed” means agreed with the hiring manager. ${TBC} means missing or not yet verified. “Proposed” and “Recommended” are TA Partner suggestions that have not been agreed.`});

  if(kind==="full"){H1("Executive summary");B.push({t:"p",text:pkg.text.exec||`${TBC} Executive summary not yet written.`})}

  /* ---- minutes ---- */
  const minutes=()=>{
    if(kind==="minutes"){
      H1("Meeting summary");
      if(lastMeet){B.push({t:"kv",rows:[["Date",fmtDate(lastMeet.date)||TBC],["Meeting",label(MEET_TYPES,lastMeet.type)],["Attendees",txt(lastMeet.attendees)]]});B.push({t:"p",text:lastMeet.notes||"No notes recorded."})}else B.push({t:"p",text:`${TBC} No meeting recorded yet.`});
      if(pkg.meetings.length>1){H2("Meeting log");B.push({t:"table",head:["Date","Meeting","Attendees","Key notes"],rows:pkg.meetings.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(r=>[fmtDate(r.date)||TBC,label(MEET_TYPES,r.type),txt(r.attendees),txt(r.notes)])})}
      H1("Role and hiring context");
    }else{
      H1("Kickoff meeting summary and minutes");
      if(e.includeMeetings){H2("Meeting log");B.push(pkg.meetings.length?{t:"table",head:["Date","Meeting","Attendees","Key notes"],rows:pkg.meetings.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(r=>[fmtDate(r.date)||TBC,label(MEET_TYPES,r.type),txt(r.attendees),txt(r.notes)])}:{t:"p",text:`${TBC} No meetings recorded.`})}
      H2("Role and hiring context");
    }
    B.push({t:"p",text:pkg.text.context||TBC});
    B.push({t:"kv",rows:[["Department / function",fv(m.department)],["Grade / level",fv(m.grade)],["Number of positions",fv(m.positions)],["Reports to",fv(m.reportsTo)],["Reason for hire",fv(m.reasonForHire)]]});
    const S=kind==="minutes"?H1:H2;
    S("Skills: primary, secondary and good to have");
    const sk=pkg.skills.filter(s=>s.name).sort((a,b)=>TIERS.findIndex(x=>x[0]===a.tier)-TIERS.findIndex(x=>x[0]===b.tier));
    B.push(sk.length?{t:"table",head:["Priority","Skill","Depth expected","How assessed","Status"],rows:sk.map(s=>[label(TIERS,s.tier),s.name,txt(s.level),txt(s.assess),stc(s.s)])}:{t:"p",text:`${TBC} Skills not yet captured.`});
    S("Location, work arrangement and hiring market");
    B.push({t:"kv",rows:[["Location",fv(m.location)],["Work arrangement",fv(m.workArrangement)],["Geographic hiring market",fv(m.hiringMarket)],["Relocation / visa support",fv(m.relocation)],["Travel",fv(m.travel)]]});
    S("Hiring manager's preferences");
    B.push(pkg.prefs.some(p=>p.detail)?{t:"table",head:["Area","Preference","Status"],rows:pkg.prefs.filter(p=>p.detail).map(p=>[p.area,p.detail,stc(p.s)])}:{t:"p",text:TBC});
    S("Success measures and key outcomes");
    B.push(pkg.success.some(p=>p.measure)?{t:"table",head:["Measure / outcome","Target or evidence","By when","Status"],rows:pkg.success.filter(p=>p.measure).map(p=>[p.measure,txt(p.target),txt(p.timeframe),stc(p.s)])}:{t:"p",text:TBC});
    S("Selection process and decision-making");
    B.push({t:"kv",rows:[["Agreed selection process",pkg.text.selection||TBC],["Decision-making responsibilities",pkg.text.decisionRights||TBC],["Feedback turnaround",fv(pkg.plan.feedbackSla)]]});

    S("Tentative dates");
    B.push({t:"kv",rows:[["Tentative closure date",fd(m.closureDate)],["What counts as closure",fv(m.closureDefinition)],["Tentative offer date",fd(pkg.plan.offerDate)],["Tentative onboarding date",fd(pkg.plan.onboardingDate)]]});
    S("Decisions agreed");

    S("Open questions");

    B.push(oq.length?{t:"table",head:["Question","Owner","Due","Status","Answer"],rows:oq.map(q=>[q.question,txt(q.owner),fmtDate(q.due)||TBC,stc(q.s==="answered"?"confirmed":"tbc"),q.answer||"—"])}:{t:"p",text:"None recorded."});
    S("Action items");
    const ai=pkg.actions.filter(a=>a.action);
    B.push(ai.length?{t:"table",head:["Action","Owner","Due","Status"],rows:ai.map(a=>[a.action,`${a.owner||TBC} (${a.ownerRole})`,fmtDate(a.due)||TBC,label(ACT_ST,a.status)])}:{t:"p",text:"None recorded."});
  };
  const confirm=()=>{
    H1(kind==="minutes"?"Items requiring confirmation":"Confirmed requirements and items requiring confirmation");
    if(t.critMissing.length)B.push({t:"note",warn:true,text:"Critical inputs not yet confirmed: "+t.critMissing.join("; ")+"."});
    const conf=t.items.filter(i=>i.status==="confirmed"), open=t.items.filter(i=>i.status==="tbc"||i.status==="missing"), prop=t.items.filter(i=>i.status==="proposed");
    if(kind!=="minutes"){H2(`Confirmed (${conf.length})`);B.push(conf.length?{t:"table",head:["Area","Item","Detail"],rows:conf.map(i=>[i.area,i.item,i.detail||"—"])}:{t:"p",text:"Nothing confirmed yet."});H2(`To confirm (${open.length})`)}
    B.push(open.length?{t:"table",head:["Area","Item","Status"],rows:open.map(i=>[i.area,i.item,stc(i.status)])}:{t:"p",text:"Nothing outstanding."});
    if(prop.length&&kind!=="minutes"){H2(`Proposed, awaiting agreement (${prop.length})`);B.push({t:"table",head:["Area","Item","Detail"],rows:prop.map(i=>[i.area,i.item,i.detail||"—"])})}
  };
  /* ---- market ---- */
  const market=()=>{
    const mk=pkg.market, S=kind==="market"?H1:H2, ref=r=>String(r.sources||"").trim()?` [${String(r.sources).trim()}]`:"";

    S("Scope and methodology");

    B.push({t:"note",text:"Evidence types: “Verified fact” is confirmed from a primary source. “Sourced estimate” is a figure from a cited third party. “TA judgement” is professional assessment. “Not yet verified” has no source yet. Numbers in [brackets] refer to the References section."});
    const sec=(title,list,extra)=>{const p=pts(list);if(!p.length&&!extra)return;S(title);if(p.length)B.push({t:"bullets",items:p});if(extra)extra()};
    sec("Market context",mk.context);
    sec("Talent supply",mk.supply,()=>{const rows=mk.availability.filter(r=>r.skill);if(rows.length)B.push({t:"table",head:["Skill / combination","Market","Talent pool","Evidence of pool","Evidence type","Sources"],rows:rows.map(r=>[r.skill,txt(r.market),r.pool||TBC,txt(r.poolEvidence),st2(r.evidence),r.sources||"—"])})});
    sec("Talent demand and competition",mk.demand,()=>{const f=mk.factors.filter(r=>r.factor);if(f.length)B.push({t:"table",head:["Market factor","Effect on availability, pay or speed","Evidence type","Sources"],rows:f.map(r=>[r.factor,txt(r.effect),st2(r.evidence),r.sources||"—"])})});
    if(mk.comp.some(r=>r.role||r.low||r.mid||r.high)){S("Compensation benchmarks");
      B.push({t:"table",head:["Benchmark","Level","Geography","Low – mid – high","Period / basis","Data date","Evidence","Sources","Limitations"],rows:mk.comp.filter(r=>r.role||r.low||r.mid||r.high).map(r=>[txt(r.role),txt(r.level),txt(r.geo),`${r.currency||"[currency?]"} ${r.low?fmtNum(num(r.low)):"–"} – ${r.mid?fmtNum(num(r.mid)):"–"} – ${r.high?fmtNum(num(r.high)):"–"}`,`${label(PERIOD,r.period)}, ${r.basis}`,r.dataDate||TBC,st2(r.evidence),r.sources||"—",r.limits||"—"])});
      B.push({t:"note",text:"External, indicative ranges only (k = thousand, M = million). They are not the approved offer range, which P&C sets."})}
    const dif=mk.availability.filter(r=>r.skill).map(r=>({r,sc:scoreOf(r)})).filter(x=>x.sc);
    if(dif.length){S("Hiring difficulty index");
      B.push({t:"table",head:["Skill / combination","Supply scarcity","Competing demand","Pay pressure","Location","Niche / seniority","Index"],rows:dif.map(({r,sc})=>[r.skill,r.supply||"–",r.competition||"–",r.pay||"–",r.location||"–",r.niche||"–",{text:`${sc.lvl} ${sc.avg.toFixed(1)}`,status:sc.avg>=3?"tbc":sc.avg>=2?"proposed":"confirmed"}])});
      B.push({t:"note",text:"Each factor is scored 1 (easy) to 5 (hard) by the TA Partner from the evidence in this report. Index = average: below 2 Low, 2–2.9 Moderate, 3–3.9 High, 4+ Very high."})}
    sec("Talent mobility: notice periods, time to hire, attrition",mk.mobility);
    if(mk.alternatives.some(r=>r.alt)){S("Alternative talent pools and adjacent skills");B.push({t:"note",text:"Options for the hiring manager to accept, reject or discuss. They are not approved changes to the role."});
      B.push({t:"table",head:["Option","Instead of / alongside","Expected effect","Risk and how to close the gap","Decision"],rows:mk.alternatives.filter(r=>r.alt).map(r=>[r.alt,txt(r.forSkill),txt(r.gain),txt(r.risk),{text:label(HM_ALT,r.hm),status:r.hm==="accept"?"confirmed":r.hm==="reject"?"declined":"tbc"}])})}
    const recs=mk.recs.filter(r=>r.text).map(r=>r.text+ref(r));if(recs.length){S("Recommendations and sourcing strategy");B.push({t:"bullets",items:recs})}
    const tc=mk.toConfirm.filter(q=>q.question);
    S("Data gaps: items to confirm");
    B.push(tc.length?{t:"table",head:["Question","Answer","Status"],rows:tc.map(q=>[q.question,q.answer||TBC,stc(q.s==="answered"?"confirmed":"tbc")])}:{t:"p",text:"No open data gaps."});
    if(kind==="market"||e.includeSources){S("References");const ss=srcIdx().filter(s=>s.title||s.url);
      B.push(ss.length?{t:"table",head:["ID","Reference","Data date","Accessed"],rows:ss.map(s=>[s._id,{text:`${s.publisher?s.publisher+". ":""}${s.title||s.url}`,url:s.url},s.published||"—",fmtDate(s.accessed)||TBC])}:{t:"p",text:"No references recorded yet. Findings without a reference should be read as unverified."})}
    if(kind==="market"&&pkg.market.researchLimitations){S("Limitations");B.push({t:"p",text:pkg.market.researchLimitations})}
  };
  /* ---- plan ---- */
  const plan=()=>{
    const S=kind==="plan"?H1:H2;
    if(kind!=="plan")H1("Recommended interview and hiring plan (tentative)");
    S("Basis of this plan");
    B.push({t:"p",text:(pkg.plan.basisNote||marketBasis().note)+" All dates are tentative until the hiring manager confirms them."});
    if(kind==="plan"){const dif=pkg.market.availability.filter(r=>r.skill).map(r=>({r,sc:scoreOf(r)})).filter(x=>x.sc);
      if(dif.length)B.push({t:"table",head:["Skill / combination","Market","Difficulty","Evidence type"],rows:dif.map(({r,sc})=>[r.skill,txt(r.market),`${sc.lvl} (${sc.avg.toFixed(1)}/5)`,st2(r.evidence)])});
      if(pkg.text.marketSummary)B.push({t:"note",text:"Market summary: "+pkg.text.marketSummary});}
    S("Interview stages");
    B.push({t:"table",head:["Stage","Format / length","Focus areas","Interviewer / owner","Evaluation criteria","Status"],rows:pkg.plan.stages.filter(s=>s.name).map(s=>[s.name,[s.format,s.duration].filter(Boolean).join(" · ")||"—",txt(s.focus),txt(s.owner),txt(s.criteria),stc(s.s)])});
    S("First resume commitment");
    B.push({t:"kv",rows:[["Number of resumes",fv(pkg.plan.resumeCount)],["Committed date",fd(pkg.plan.resumeDate)],["Conditions",pkg.text.resumeNote||"—"]]});
    S("Proposed interview schedule");
    B.push(pkg.plan.schedule.length?{t:"table",head:["Stage","Tentative date","Details","Interviewers / owner","Status"],rows:pkg.plan.schedule.slice().sort((a,b)=>(a.from||"9").localeCompare(b.from||"9")).map(s=>[txt(s.stage),schedWhen(s)||TBC,s.detail||"—",txt(s.who),stc(s.s)])}:{t:"p",text:`${TBC} Interview dates not yet agreed. The TA Partner will propose slots once interviewers are confirmed.`});
    {const g=ganttBlock();if(g){S("Tentative plan (Gantt)");B.push(g);B.push({t:"note",text:`Each column is ${g.per===1?"a week":g.per+" weeks"} starting on the date shown (day/month). ■ = stage window, ◆ = single date. All dates are tentative until confirmed.`})}}
    S("Assessments");
    B.push({t:"table",head:["Assessment","Type","Used for","Rationale","Status"],rows:pkg.plan.assessments.filter(a=>a.name).map(a=>[a.name,txt(a.type),txt(a.purpose),txt(a.rationale),{text:label(ASSESS_ST,a.s),status:a.s==="confirmed"?"confirmed":a.s==="declined"?"declined":"proposed"}])});
    S("Offer and onboarding");
    B.push({t:"kv",rows:[["Tentative offer date",fd(pkg.plan.offerDate)],["Expected notice period",pkg.plan.noticeWeeks?pkg.plan.noticeWeeks+" week(s) [estimate]":TBC],["Tentative onboarding / start date",fd(pkg.plan.onboardingDate)],["Onboarding notes",pkg.plan.onboardingNote||"—"]]});
    S("Milestones and decision points");
    const ms=pkg.plan.milestones.filter(x=>x.name).slice().sort((a,b)=>(a.date||"9").localeCompare(b.date||"9"));
    B.push(ms.length?{t:"table",head:["Milestone","Owner","Date","Depends on","Decision point","Status"],rows:ms.map(x=>[x.name,txt(x.owner),fmtDate(x.date)||TBC,txt(x.dependency),x.decision?"Yes":"—",stc(x.s)])}:{t:"p",text:`${TBC} Milestones not yet planned.`});
    const lastMs=ms.filter(x=>x.date&&!/onboarding|start date/i.test(x.name)).pop();if(lastMs&&m.closureDate.v){const gap=bdBetween(lastMs.date,m.closureDate.v);B.push({t:"note",warn:gap<0,text:gap>=0?`The hiring milestones end ${gap} business day(s) before the tentative closure date (${fmtDate(m.closureDate.v)}).`:`The hiring milestones end ${-gap} business day(s) after the tentative closure date (${fmtDate(m.closureDate.v)}). We need to compress the plan or agree a new date.`})}
    S("Risks to the timeline");
    B.push({t:"table",head:["Risk","Likelihood","Impact","Mitigation","Owner"],rows:pkg.plan.risks.filter(r=>r.risk).map(r=>[r.risk,r.likelihood||TBC,r.impact||TBC,txt(r.mitigation),txt(r.owner)])});
  };
  const hm=()=>{H1("Decisions requested from you");const hd=pkg.hmDecisions.filter(d=>d.decision);
    B.push(hd.length?{t:"table",head:["Decision needed","Options","TA recommendation","Needed by","Status / answer"],rows:hd.map(d=>[d.decision,d.options||"—",d.recommendation||"—",fmtDate(d.needBy)||TBC,d.s==="decided"?{text:"Decided: "+(d.answer||""),status:"confirmed"}:{text:"Pending",status:"tbc"}])}:{t:"p",text:"No decisions requested."})};
  const ta=()=>{H1("TA Partner action list");
    const rows=[...pkg.taActions.filter(a=>a.action).map(a=>[a.action,fmtDate(a.due)||TBC,label(ACT_ST,a.status),a.note||"—"]),...pkg.actions.filter(a=>a.ownerRole==="TA Partner"&&a.action).map(a=>[a.action,fmtDate(a.due)||TBC,label(ACT_ST,a.status),"From the minutes"])];
    B.push(rows.length?{t:"table",head:["Action","Due","Status","Note"],rows}:{t:"p",text:"No actions listed."})};

  if(kind==="full"){minutes();confirm();market();plan();hm();ta()}
  else if(kind==="minutes"){minutes();confirm()}
  else if(kind==="market"){market()}
  else if(kind==="plan"){plan();hm();ta()}
  B.push({t:"sig",text:`Kind regards,\n${m.taPartner.v||"[TA Partner]"}\nTalent Acquisition Partner, ${m.org.v||"Volvo Group"}`});
  B.push({t:"foot",text:`Generated ${fmtDate(todayISO())} from Hiring Package Studio. Proposed and recommended items are suggestions until the hiring manager confirms them.${kind==="full"||kind==="market"?" Market figures are indicative and depend on the sources listed.":""}`});
  return B;
}

/* ---------- email HTML (inline styles for mail clients) ---------- */
const EC={navy:"#001433",slate:"#4A5568",line:"#D9E1EA",paper:"#F7FAFC",amber:"#B7791F",ok:"#22704A",okb:"#E3F2EA",tbc:"#B42318",tbcb:"#FCE9E7",pr:"#2B4C7E",prb:"#E6EDF7",grey:"#EDF1F5"};
const EF="font-family:'Segoe UI','Helvetica Neue',Inter,Arial,sans-serif;";
function chipHTML(c){const s=c.status;const [fg,bg]=s==="confirmed"?[EC.ok,EC.okb]:s==="proposed"?[EC.pr,EC.prb]:s==="declined"?[EC.slate,EC.grey]:[EC.tbc,EC.tbcb];return `<span style="${EF}display:inline-block;font-size:11px;font-weight:600;color:${fg};background:${bg};border-radius:10px;padding:1px 8px;white-space:nowrap">${esc(c.text)}</span>`}
function cellHTML(c){if(c&&typeof c==="object"){if(c.status)return chipHTML(c);if(c.url)return `<a href="${esc(c.url)}" style="color:${EC.pr}">${esc(c.text)}</a>`;return esc(c.text)}return hiTBC(esc(c==null?"":c)).replace(/\n/g,"<br>")}
const hiTBC=s=>s.replace(/\[To confirm\]/g,`<span style="color:${EC.tbc};font-weight:600">[To confirm]</span>`);
function toEmailHTML(B){
  const P=`${EF}font-size:14px;line-height:1.55;color:#1A202C;margin:0 0 10px`;
  let h=`<div style="${EF}color:#1A202C;max-width:860px">`;
  B.forEach(b=>{switch(b.t){
    case "title":h+=`<div style="border-top:4px solid ${EC.amber};padding-top:12px"><h1 style="${EF}font-size:22px;color:${EC.navy};margin:0 0 4px">${esc(b.text)}</h1></div>`;break;
    case "sub":h+=`<p style="${EF}font-size:12px;color:${EC.slate};margin:0 0 16px;letter-spacing:.02em">${esc(b.text)}</p>`;break;
    case "h1":h+=`<h2 style="${EF}font-size:17px;color:${EC.navy};margin:26px 0 8px;padding-bottom:5px;border-bottom:2px solid ${EC.amber}">${esc(b.text)}</h2>`;break;
    case "h2":h+=`<h3 style="${EF}font-size:14px;color:${EC.navy};margin:16px 0 6px">${esc(b.text)}</h3>`;break;
    case "h3":h+=`<p style="${EF}font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:${EC.slate};margin:12px 0 4px">${esc(b.text)}</p>`;break;
    case "bullets":h+=`<ul style="${EF}margin:4px 0 12px;padding-left:20px">${b.items.map(x=>`<li style="${EF}font-size:13.5px;line-height:1.5;color:#1A202C;margin:0 0 5px">${hiTBC(esc(x)).replace(/\[(S\d+(?:,\s*S\d+)*)\]/g,`<span style="color:${EC.pr};font-weight:600">[$1]</span>`)}</li>`).join("")}</ul>`;break;
    case "p":h+=String(b.text).split(/\n{2,}/).map(par=>`<p style="${P}">${hiTBC(esc(par)).replace(/\n/g,"<br>")}</p>`).join("");break;
    case "sig":h+=`<p style="${P};margin-top:20px">${esc(b.text).replace(/\n/g,"<br>")}</p>`;break;
    case "note":h+=`<p style="${EF}font-size:12.5px;line-height:1.5;color:${b.warn?EC.tbc:EC.slate};background:${b.warn?EC.tbcb:EC.paper};border-left:3px solid ${b.warn?EC.tbc:EC.amber};padding:8px 10px;margin:8px 0 12px">${hiTBC(esc(b.text))}</p>`;break;
    case "foot":h+=`<p style="${EF}font-size:11px;color:${EC.slate};border-top:1px solid ${EC.line};padding-top:8px;margin-top:20px">${esc(b.text)}</p>`;break;
    case "gantt":{const fill=s=>s==="confirmed"?EC.ok:s==="tbc"?EC.tbc:EC.pr;
      h+=`<table cellpadding="0" cellspacing="0" style="border-collapse:collapse;width:100%;margin:6px 0 10px;border:1px solid ${EC.line};table-layout:fixed"><tr><th style="${EF}font-size:11px;color:#FFFFFF;background:${EC.navy};text-align:left;padding:5px 6px;width:30%">Stage</th>${b.cols.map(c=>`<th style="${EF}font-size:9.5px;font-weight:600;color:#FFFFFF;background:${EC.navy};padding:5px 1px;text-align:center">${esc(c)}</th>`).join("")}</tr>${b.rows.map(r=>`<tr><td style="${EF}font-size:11.5px;color:#1A202C;padding:5px 6px;border-top:1px solid ${EC.line}">${esc(r.label)}<br><span style="color:${EC.slate};font-size:10.5px">${esc(r.when)}</span></td>${r.cells.map(v=>`<td style="border-top:1px solid ${EC.line};border-left:1px solid ${EC.line};padding:0;text-align:center;${v===1?`background:${fill(r.status)};`:""}font-size:11px;color:${fill(r.status)}">${v===2?"◆":"&nbsp;"}</td>`).join("")}</tr>`).join("")}</table>`;break}
    case "kv":h+=`<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;width:100%;margin:6px 0 12px">${b.rows.map(([k,v])=>`<tr><td style="${EF}font-size:12.5px;color:${EC.slate};padding:5px 12px 5px 0;border-bottom:1px solid ${EC.line};width:34%;vertical-align:top">${esc(k)}</td><td style="${EF}font-size:13px;color:#1A202C;padding:5px 0;border-bottom:1px solid ${EC.line};vertical-align:top">${cellHTML(v)}</td></tr>`).join("")}</table>`;break;
    case "table":h+=`<table cellpadding="0" cellspacing="0" style="border-collapse:collapse;width:100%;margin:6px 0 14px;border:1px solid ${EC.line}"><tr>${b.head.map(x=>`<th style="${EF}font-size:11.5px;font-weight:600;color:#FFFFFF;background:${EC.navy};text-align:left;padding:6px 8px;vertical-align:bottom">${esc(x)}</th>`).join("")}</tr>${b.rows.map((r,i)=>`<tr>${r.map(c=>`<td style="${EF}font-size:12.5px;line-height:1.45;color:#1A202C;padding:6px 8px;border-top:1px solid ${EC.line};vertical-align:top;background:${i%2?EC.paper:"#FFFFFF"}">${cellHTML(c)}</td>`).join("")}</tr>`).join("")}</table>`;break;
  }});
  return h+"</div>";
}
function toText(B){
  const c=x=>x&&typeof x==="object"?(x.url?`${x.text} (${x.url})`:x.text):String(x==null?"":x);
  return B.map(b=>{switch(b.t){
    case "h3":return b.text.toUpperCase();
    case "bullets":return b.items.map(x=>"• "+x).join("\n");
    case "title":return b.text.toUpperCase();case "h1":return "\n"+b.text.toUpperCase()+"\n"+"-".repeat(Math.min(60,b.text.length));case "h2":return "\n"+b.text;
    case "kv":return b.rows.map(([k,v])=>`${k}: ${c(v)}`).join("\n");
    case "table":return b.rows.map(r=>"- "+r.map((x,i)=>`${b.head[i]}: ${c(x)}`).join(" | ")).join("\n");
    case "gantt":return b.rows.map(r=>`- ${r.label}: ${r.when}`).join("\n");
    default:return b.text}}).join("\n\n").replace(/\n{3,}/g,"\n\n");
}

/* ---------- .docx writer (WordprocessingML in a stored zip) ---------- */
const xe=s=>String(s==null?"":s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function runs(text,rpr){const parts=String(text==null?"":text).split("\n");return parts.map((t,i)=>{const segs=t.split(/(\[To confirm\])/);return (i?`<w:r><w:br/></w:r>`:"")+segs.filter(s=>s!=="").map(s=>`<w:r><w:rPr>${s===TBC?'<w:b/><w:color w:val="B42318"/>':""}${rpr||""}</w:rPr><w:t xml:space="preserve">${xe(s)}</w:t></w:r>`).join("")}).join("")}
function para(inner,style,ppr){return `<w:p><w:pPr>${style?`<w:pStyle w:val="${style}"/>`:""}${ppr||""}</w:pPr>${inner}</w:p>`}
function toDocx(B){
  const rels=[];let body="";
  const link=(text,url)=>{const id="rIdL"+(rels.length+1);rels.push(`<Relationship Id="${id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="${xe(url)}" TargetMode="External"/>`);return `<w:hyperlink r:id="${id}"><w:r><w:rPr><w:color w:val="2B4C7E"/><w:u w:val="single"/></w:rPr><w:t xml:space="preserve">${xe(text)}</w:t></w:r></w:hyperlink>`};
  const cellXML=(c,hdr,w,shade)=>{let inner;
    if(c&&typeof c==="object"){if(c.status){const col=c.status==="confirmed"?"22704A":c.status==="proposed"?"2B4C7E":c.status==="declined"?"4A5568":"B42318";inner=para(runs(c.text,`<w:b/><w:color w:val="${col}"/>`),"Cell")}else if(c.url)inner=para(link(c.text,c.url),"Cell");else inner=para(runs(c.text),"Cell")}
    else inner=para(runs(c,hdr?'<w:b/><w:color w:val="FFFFFF"/>':""),"Cell");
    return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="pct"/>${hdr?'<w:shd w:val="clear" w:color="auto" w:fill="001433"/>':shade?'<w:shd w:val="clear" w:color="auto" w:fill="F7FAFC"/>':""}</w:tcPr>${inner}</w:tc>`};
  const tbl=(rowsXML,grid)=>`<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders><w:top w:val="single" w:sz="4" w:color="D9E1EA"/><w:left w:val="single" w:sz="4" w:color="D9E1EA"/><w:bottom w:val="single" w:sz="4" w:color="D9E1EA"/><w:right w:val="single" w:sz="4" w:color="D9E1EA"/><w:insideH w:val="single" w:sz="4" w:color="D9E1EA"/><w:insideV w:val="single" w:sz="4" w:color="D9E1EA"/></w:tblBorders><w:tblCellMar><w:top w:w="50" w:type="dxa"/><w:left w:w="90" w:type="dxa"/><w:bottom w:w="50" w:type="dxa"/><w:right w:w="90" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${rowsXML}</w:tbl>`+para("","Spacer");
  B.forEach(b=>{switch(b.t){
    case "title":body+=para(runs(b.text),"Title");break;
    case "sub":body+=para(runs(b.text),"Subtle");break;
    case "h1":body+=para(runs(b.text),"Heading1");break;
    case "h2":body+=para(runs(b.text),"Heading2");break;
    case "h3":body+=para(runs(b.text,'<w:b/><w:caps/><w:color w:val="4A5568"/><w:sz w:val="17"/>'),null,'<w:keepNext/><w:spacing w:before="160" w:after="60"/>');break;
    case "bullets":b.items.forEach(x=>body+=para(runs("•\t"+x),null,'<w:tabs><w:tab w:val="left" w:pos="300"/></w:tabs><w:ind w:left="300" w:hanging="300"/><w:spacing w:after="80"/>'));break;
    case "p":String(b.text).split(/\n{2,}/).forEach(p=>body+=para(runs(p)));break;
    case "sig":body+=para(runs(b.text),null,'<w:spacing w:before="240"/>');break;
    case "note":body+=para(runs(b.text,b.warn?'<w:color w:val="B42318"/>':'<w:color w:val="4A5568"/>'),"Note");break;
    case "foot":body+=para(runs(b.text),"Subtle",'<w:pBdr><w:top w:val="single" w:sz="4" w:space="4" w:color="D9E1EA"/></w:pBdr><w:spacing w:before="240"/>');break;
    case "gantt":{const n=b.cols.length, lw=1500, cw=Math.floor(3500/n), fill=s=>s==="confirmed"?"22704A":s==="tbc"?"B42318":"2B4C7E";
      const hc=t=>`<w:tc><w:tcPr><w:tcW w:w="${cw}" w:type="pct"/><w:shd w:val="clear" w:color="auto" w:fill="001433"/></w:tcPr>${para(runs(t,'<w:b/><w:color w:val="FFFFFF"/><w:sz w:val="13"/>'),"Cell",'<w:jc w:val="center"/>')}</w:tc>`;
      const hdr=`<w:tr><w:trPr><w:tblHeader/></w:trPr><w:tc><w:tcPr><w:tcW w:w="${lw}" w:type="pct"/><w:shd w:val="clear" w:color="auto" w:fill="001433"/></w:tcPr>${para(runs("Stage",'<w:b/><w:color w:val="FFFFFF"/>'),"Cell")}</w:tc>${b.cols.map(hc).join("")}</w:tr>`;
      const rowsX=b.rows.map(r=>`<w:tr><w:trPr><w:cantSplit/></w:trPr><w:tc><w:tcPr><w:tcW w:w="${lw}" w:type="pct"/></w:tcPr>${para(runs(r.label,'<w:b/>')+`<w:r><w:br/></w:r>`+runs(r.when,'<w:color w:val="4A5568"/><w:sz w:val="14"/>'),"Cell")}</w:tc>${r.cells.map(v=>`<w:tc><w:tcPr><w:tcW w:w="${cw}" w:type="pct"/>${v===1?`<w:shd w:val="clear" w:color="auto" w:fill="${fill(r.status)}"/>`:""}<w:vAlign w:val="center"/></w:tcPr>${para(v===2?runs("◆",`<w:color w:val="${fill(r.status)}"/>`):"","Cell",'<w:jc w:val="center"/>')}</w:tc>`).join("")}</w:tr>`).join("");

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  entries.forEach(([name,str])=>{const nb=enc.encode(name),data=enc.encode(str),crc=crc32(data);

    chunks.push(new Uint8Array(lh.buffer),nb,data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,time,true);ch.setUint16(14,date,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nb);off+=30+nb.length+data.length});

$("#bSnap").addEventListener("click",()=>saveSnapshot());
$("#importFile").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const data=JSON.parse(await f.text());if(!data||!data.meta)throw 0;const p=normalize(data);p.id=uid();pkg=p;packages[p.id]=clone(p);dirty=true;editSeq++;await saveNow();cur="overview";render();toast("Package imported")}catch(err){toast("That file is not a hiring package export.")}});
window.addEventListener("beforeunload",()=>{if(dirty)saveNow()});

/* ---------- boot ---------- */
function bootLocal(){
  const all=lsGet(LS_KEY)||{};packages={};for(const k in all)packages[k]=all[k];
  const last=lsGetRaw(LS_LAST);const pick=packages[last]?last:Object.values(packages).sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""))[0]?.id;
  pkg=pick?normalize(packages[pick]):null;if(!RENDER[cur])cur="overview";renderNotices();render();setSave(pkg?"Saved in this browser":"");
}
bootLocal();
if(location.protocol==="file:")window.__hpsTest={setResearch:(r)=>{researchMap[pkg.id]=r;renderResearchSpots();renderNotices()}};
if(S.inViewer){
  window.claude.use("downloads").then(d=>S.dl=d,()=>{});
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(async([db,user])=>{
    S.user=user;
    if(user){try{const c=await user.can("data.write");if(c===false)S.canWrite=false}catch(e){}}
    if(!db){renderNotices();render();return}
    S.db=db;S.mode="db";packages={};let first=true;
    db.doc("config/research").onSnapshot(d=>{researchCfg=d.exists?d.data():null},()=>{});
    db.collection("research").onSnapshot(snap=>{const prev=pkg?researchState():null;researchMap={};snap.docs.forEach(d=>researchMap[d.id]=d.data());
      if(pkg){const now=researchState();renderResearchSpots();if(now!==prev){renderNotices();if(cur==="dash")refreshDash();if(now==="ready")toast("Claude's market research is ready to review.")}}},()=>{});
    db.collection("packages").onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{const id=ch.doc.id;
        if(ch.type==="removed"){delete packages[id];if(pkg&&pkg.id===id&&!first){pkg=null;toast("This package was deleted by someone else.")}return}
        const data=clone(ch.doc.data());packages[id]=data;
        if(!first&&pkg&&pkg.id===id&&data.rev!==pkg.rev&&!myRevs.has(data.rev)){if(dirty){remotePending=data;renderNotices()}else{pkg=normalize(data);render();setSave("Updated by a colleague "+timeNow())}}
      });
      if(first){first=false;const last=lsGetRaw(LS_LAST);const pick=packages[last]?last:Object.values(packages).sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""))[0]?.id;
        if(pkg&&!packages[pkg.id])pkg=null;pkg=pick?normalize(packages[pick]):null;renderNotices();render();setSave(pkg?"Saved":"")}
      else{renderPkgSel();if(!pkg)render()}
    },err=>{toast("Live updates stopped ("+err.code+"). Reload the page to reconnect.")});
  }).catch(()=>{});
}
})();
</script>
