    +sty("Cell","Table text",'<w:spacing w:after="0" w:line="252" w:lineRule="auto"/>','<w:sz w:val="17"/>')
    +sty("Spacer","Spacer",'<w:spacing w:after="80"/>','<w:sz w:val="8"/>')
    +`</w:styles>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`;
  const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`;
  const docRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${rels.join("")}</Relationships>`;
  const now=new Date().toISOString().replace(/\.\d+Z$/,"Z");
  const core=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xe(B[0].text)}</dc:title><dc:creator>${xe(pkg.meta.taPartner.v||"Talent Acquisition")}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`;
  return zip([["[Content_Types].xml",ct],["_rels/.rels",rootRels],["docProps/core.xml",core],["word/document.xml",doc],["word/styles.xml",styles],["word/_rels/document.xml.rels",docRels]]);
}
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(entries){
  const enc=new TextEncoder(),d=new Date();const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  const chunks=[],central=[];let off=0;
  entries.forEach(([name,str])=>{const nb=enc.encode(name),data=enc.encode(str),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,time,true);lh.setUint16(12,date,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer),nb,data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,time,true);ch.setUint16(14,date,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nb);off+=30+nb.length+data.length});
  const cdSize=central.reduce((a,c)=>a+c.length,0);const eo=new DataView(new ArrayBuffer(22));eo.setUint32(0,0x06054b50,true);eo.setUint16(8,entries.length,true);eo.setUint16(10,entries.length,true);eo.setUint32(12,cdSize,true);eo.setUint32(16,off,true);
  return new Blob([...chunks,...central,new Uint8Array(eo.buffer)],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

/* ---------- files, clipboard, toast ---------- */
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4200)}
async function saveFile(filename,data,mime){
  if(S.inViewer){const dl=S.dl||await window.claude.use("downloads");
    if(!dl){toast("Downloads are not available in this view. Use “Copy formatted email” instead.");return}
    try{const r=await dl.save({filename,data});if(r&&r.status==="saved")toast("Saved "+filename)}catch(e){toast(e&&e.code==="declined"?"Download cancelled":"Could not save the file ("+((e&&e.code)||"error")+").")}return}
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Saved "+filename);
}
function copyPlain(text){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast("Copied"),()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?"Copied":"Copy was blocked. Select the text and copy it manually.")}
function copyRich(html,text){
  const sel=()=>{let el=$("#copyBuf");if(!el){el=document.createElement("div");el.id="copyBuf";el.style.cssText="position:fixed;left:-9999px;top:0;width:800px;background:#fff";document.body.appendChild(el)}el.innerHTML=html;if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);let ok=false;try{ok=document.execCommand("copy")}catch(e){}
    toast(ok?"Formatted email copied. Paste it into your email.":"The document is selected. Press Ctrl/Cmd+C to copy it.")};
  try{if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([text],{type:"text/plain"})})]).then(()=>toast("Formatted email copied. Paste it into your email."),sel);return}}catch(e){}
  sel();
}

/* ---------- events ---------- */
$("#main").addEventListener("input",onEdit);$("#main").addEventListener("change",onEdit);
function onEdit(ev){
  const el=ev.target;const p=el.dataset&&el.dataset.path;if(!p||!pkg||!S.canWrite)return;
  if(ev.type==="input"&&(el.tagName==="SELECT"||el.type==="checkbox"))return;
  if(ev.type==="change"&&(el.tagName==="TEXTAREA"||(el.tagName==="INPUT"&&el.type!=="checkbox"&&el.type!=="date")))return;
  const v=el.type==="checkbox"?el.checked:el.value;setPath(pkg,p,v);
  if(el.classList.contains("st")){el.className="st st-"+v}
  const m=p.match(/^market\.availability\.(\d+)\./);if(m){const d=document.getElementById("diff-"+m[1]);if(d)d.innerHTML=diffHTML(pkg.market.availability[+m[1]])}
  if(p==="meta.role.v"){renderPkgSel()}
  if(/\.s$|\.status$|\.hm$/.test(p)||p.startsWith("email.include"))renderRail();
  if(cur==="email"&&p.startsWith("email."))refreshPreview();
  if(cur==="dash")refreshDash();
  scheduleSave();
}
let dashT;function refreshDash(){clearTimeout(dashT);dashT=setTimeout(()=>{const el=$("#dashLive");if(el)el.innerHTML=dashLive()},200)}
let prevT;function refreshPreview(){clearTimeout(prevT);prevT=setTimeout(()=>{const el=$("#docPreview");if(el)el.innerHTML=toEmailHTML(buildDoc(pkg.email.kind))},250)}

document.addEventListener("click",async ev=>{
  const tab=ev.target.closest("[data-tab]");if(tab){cur=tab.dataset.tab;lsSet("hps.v1.tab",cur);render();window.scrollTo({top:0});return}
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  const need=["addInput","delInputYes","loadInputFile","add","del","newMeeting","draftExec","buildTimeline","snap","del-pkg","restoreVer","migrate","newPkg"];
  if(need.includes(a)&&!S.canWrite){toast("You have view access only.");return}
  switch(a){
    case "add":{const list=getPath(pkg,b.dataset.list);list.push(LISTS[b.dataset.list].blank());scheduleSave();render();break}
    case "del":{const list=getPath(pkg,b.dataset.list);list.splice(+b.dataset.idx,1);scheduleSave();render();break}
    case "newMeeting":{pkg.meetings.push(LISTS.meetings.blank());if(pkg.meetings.length>1)pkg.meetings[pkg.meetings.length-1].type="Follow-up";scheduleSave();render();toast("Meeting added. Update the sections below, then save a snapshot.");break}
    case "draftExec":{if(!pkg.text.exec.trim()){pkg.text.exec=draftExec();scheduleSave();render()}else $("#execConfirm").innerHTML=`<span class="inline-confirm">Replace the current summary? <button class="btn" type="button" data-act="draftExecYes">Replace</button><button class="btn3" type="button" data-act="clearConfirm" data-target="execConfirm">Cancel</button></span>`;break}
    case "draftExecYes":pkg.text.exec=draftExec();scheduleSave();render();break;
    case "buildTimeline":{if(pkg.plan.milestones.length||pkg.plan.schedule.length)$("#tlConfirm").innerHTML=`<span class="inline-confirm">This replaces the current milestones and schedule. <button class="btn" type="button" data-act="buildYes">Replace</button><button class="btn3" type="button" data-act="clearConfirm" data-target="tlConfirm">Cancel</button></span>`;else buildTimeline();break}
    case "buildYes":buildTimeline();break;
    case "clearConfirm":{const t=document.getElementById(b.dataset.target);if(t)t.innerHTML="";break}
    case "snap":saveSnapshot();break;
    case "addInput":{const t=$("#newInputType");pkg.inputs.push(newInput(t?t.value:"Other",""));scheduleSave();render();const ta=document.getElementById("in_c_"+(pkg.inputs.length-1));if(ta){ta.focus();ta.scrollIntoView({block:"center"})}break}
    case "delInput":{const i=+b.dataset.idx;$("#di-"+i).innerHTML=`<span class="inline-confirm">Remove this input? <button class="btn danger" type="button" data-act="delInputYes" data-idx="${i}">Remove</button><button class="btn3" type="button" data-act="clearConfirm" data-target="di-${i}">Cancel</button></span>`;break}
    case "delInputYes":pkg.inputs.splice(+b.dataset.idx,1);scheduleSave();render();break;
    case "loadInputFile":{inputFileTarget=+b.dataset.idx;$("#inputFile").click();break}
    case "newPkg":createPkg();break;
    case "setKind":pkg.email.kind=b.dataset.kind;scheduleSave();render();break;
    case "preview":pkg.email.kind=b.dataset.kind;scheduleSave();cur="email";lsSet("hps.v1.tab",cur);render();window.scrollTo({top:0});break;
    case "copyDoc":{const B=buildDoc(b.dataset.kind);copyRich(toEmailHTML(B),toText(B));break}
    case "copyText":copyPlain(toText(buildDoc()));break;
    case "copySubject":copyPlain(pkg.email.subject||defaultSubject());break;
    case "docx":{const k=b.dataset.kind;saveFile(`${DOCS[k].file}-${slug(pkg.meta.role.v)}-${todayISO()}.docx`,toDocx(buildDoc(k)));break}
    case "html":{const k=b.dataset.kind;const B=buildDoc(k);const html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(B[0].text)}</title></head><body style="margin:0;padding:24px;background:#FFFFFF">${toEmailHTML(B)}</body></html>`;saveFile(`${DOCS[k].file}-${slug(pkg.meta.role.v)}-${todayISO()}.html`,html,"text/html");break}
    case "exportJson":saveFile(`hiring-package-${slug(pkg.meta.role.v)}-${todayISO()}.json`,JSON.stringify(pkg,null,2),"application/json");break;
    case "importJson":$("#importFile").click();break;
    case "del-pkg":$("#delConfirm").innerHTML=`<span class="inline-confirm">Delete “${esc(pkg.meta.role.v||"Untitled role")}” for everyone? This cannot be undone. <button class="btn danger" type="button" data-act="delYes">Delete</button><button class="btn3" type="button" data-act="clearConfirm" data-target="delConfirm">Cancel</button></span>`;break;
    case "delYes":deletePkg();break;
    case "diffVer":{const v=versionsCache[+b.dataset.idx];const ch=diffVersions(normalize(v.data),pkg);$("#verDiff").innerHTML=blk(`Changes since “${esc(v.label)}”`,`${ch.length} change(s)`,ch.length?`<div class="tbl-wrap"><table class="ed"><tr><th>Field</th><th>Then</th><th>Now</th></tr>${ch.slice(0,200).map(([p,x,y])=>`<tr><td>${esc(prettyPath(p))}</td><td>${esc(typeof x==="object"?JSON.stringify(x):x)}</td><td>${esc(typeof y==="object"?JSON.stringify(y):y)}</td></tr>`).join("")}</table></div>`:`<p class="help">No differences.</p>`);break}
    case "restoreVer":{const i=+b.dataset.idx;$("#rv-"+i).innerHTML=`<span class="inline-confirm">Replace the current package with this snapshot? <button class="btn" type="button" data-act="restoreYes" data-idx="${i}">Restore</button><button class="btn3" type="button" data-act="clearConfirm" data-target="rv-${i}">Cancel</button></span>`;break}
    case "restoreYes":{const v=versionsCache[+b.dataset.idx];await saveSnapshot("Before restoring “"+v.label+"”");const id=pkg.id;pkg=normalize(v.data);pkg.id=id;scheduleSave();cur="overview";render();toast("Snapshot restored. The previous version was saved as a snapshot first.");break}
    case "loadRemote":{pkg=normalize(remotePending);remotePending=null;dirty=false;renderNotices();render();setSave("Loaded latest");break}
    case "keepMine":remotePending=null;renderNotices();scheduleSave();break;
    case "migrate":{const loc=lsGet(LS_KEY)||{};let n=0;for(const k in loc){if(!packages[k]){try{await S.db.collection("packages").doc(k).set(normalize(loc[k]));n++}catch(e){toast("Copy stopped ("+(e.code||"error")+").");break}}}localDraftsOffered=true;renderNotices();toast(n+" package(s) copied to the shared store.");break}
    case "dismissMigrate":localDraftsOffered=true;renderNotices();break;
  }
});
let inputFileTarget=-1;
$("#inputFile").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f||inputFileTarget<0||!pkg.inputs[inputFileTarget])return;
  if(/\.(pdf|docx?|xlsx?|pptx?)$/i.test(f.name)){toast("This file type cannot be read here. Open it, copy the text and paste it into the Content box.");return}
  if(f.size>200000){toast("That file is over 200 KB. Paste the relevant part instead.");return}
  let t=await f.text();if(/\.html?$/i.test(f.name)){const d=new DOMParser().parseFromString(t,"text/html");t=d.body?d.body.innerText||d.body.textContent:t}
  const x=pkg.inputs[inputFileTarget];x.content=(x.content?x.content+"\n\n":"")+t.trim();if(!x.title)x.title=f.name;scheduleSave();render();toast("Loaded "+f.name)});
$("#pkgSel").addEventListener("change",e=>openPkg(e.target.value));
function showTip(el,x,y){const tp=$("#tip");const [v,l]=(el.dataset.tip||"").split("|");tp.querySelector("b").textContent=v||"";tp.querySelector("span").textContent=l||"";tp.hidden=false;
  const w=tp.offsetWidth,h=tp.offsetHeight;let left=x+14,top=y-h-10;if(left+w>innerWidth-8)left=x-w-14;if(left<8)left=8;if(top<8)top=y+16;tp.style.left=left+"px";tp.style.top=top+"px"}
document.addEventListener("pointermove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)showTip(el,e.clientX,e.clientY);else $("#tip").hidden=true});
document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el){const r=el.getBoundingClientRect();showTip(el,r.left+r.width/2,r.top)}else $("#tip").hidden=true});
document.addEventListener("scroll",()=>{$("#tip").hidden=true},{passive:true});
$("#bNew").addEventListener("click",()=>createPkg());
$("#bDup").addEventListener("click",()=>pkg&&createPkg(pkg));
$("#bSnap").addEventListener("click",()=>saveSnapshot());
$("#importFile").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const data=JSON.parse(await f.text());if(!data||!data.meta)throw 0;const p=normalize(data);p.id=uid();pkg=p;packages[p.id]=clone(p);dirty=true;editSeq++;await saveNow();cur="overview";render();toast("Package imported")}catch(err){toast("That file is not a hiring package export.")}});
window.addEventListener("beforeunload",()=>{if(dirty)saveNow()});

/* ---------- boot ---------- */
function bootLocal(){
  const all=lsGet(LS_KEY)||{};packages={};for(const k in all)packages[k]=all[k];
  const last=lsGetRaw(LS_LAST);const pick=packages[last]?last:Object.values(packages).sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""))[0]?.id;
  pkg=pick?normalize(packages[pick]):null;if(!RENDER[cur])cur="overview";renderNotices();render();setSave(pkg?"Saved in this browser":"");
}
bootLocal();
if(S.inViewer){
  window.claude.use("downloads").then(d=>S.dl=d,()=>{});
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(async([db,user])=>{
    S.user=user;
    if(user){try{const c=await user.can("data.write");if(c===false)S.canWrite=false}catch(e){}}
    if(!db){renderNotices();render();return}
    S.db=db;S.mode="db";packages={};let first=true;
    db.collection("packages").onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{const id=ch.doc.id;
        if(ch.type==="removed"){delete packages[id];if(pkg&&pkg.id===id&&!first){pkg=null;toast("This package was deleted by someone else.")}return}
        const data=clone(ch.doc.data());packages[id]=data;
        if(!first&&pkg&&pkg.id===id&&data.rev!==pkg.rev&&!myRevs.has(data.rev)){if(dirty){remotePending=data;renderNotices()}else{pkg=normalize(data);render();setSave("Updated by a colleague "+timeNow())}}
      });
      if(first){first=false;const last=lsGetRaw(LS_LAST);const pick=packages[last]?last:Object.values(packages).sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""))[0]?.id;
        if(pkg&&!packages[pkg.id])pkg=null;pkg=pick?normalize(packages[pick]):null;renderNotices();render();setSave(pkg?"Saved":"")}
      else{renderPkgSel();if(!pkg)render()}
    },err=>{toast("Live updates stopped ("+err.code+"). Reload the page to reconnect.")});
  }).catch(()=>{});
}
})();
</script>
