<style>
/* Layout: project header + phase rail, sticky module tabs, one module visible at a time; summary first, detail below. */
:root{
  --coral:#E5A094; --peach:#F5D6BC; --cream:#F8F4E8; --sage:#D7E6B7;          /* supplied brand palette */
  --bg:#FFFFFF; --surface:#FFFFFF; --tint:#F8F4E8; --ink:#2B2B2B; --ink-soft:#5C5852; --rule:#E2DCD0;
  --mark:#3F3B35; --mark-soft:#B9B1A3; --signal:#A8584B;
  --st-bad:#E5A094; --st-warn:#F5D6BC; --st-ok:#D7E6B7; --st-na:#F1ECE0;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Calibri,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1A17; --surface:#23211D; --tint:#2B2823; --ink:#EEE9DF; --ink-soft:#B8B0A2; --rule:#3A362F;
  --mark:#DDD5C7; --mark-soft:#6E675C; --signal:#E5A094;
  --st-bad:#6E3A33; --st-warn:#5C4530; --st-ok:#3E4A2B; --st-na:#2E2B25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1A17; --surface:#23211D; --tint:#2B2823; --ink:#EEE9DF; --ink-soft:#B8B0A2; --rule:#3A362F;
  --mark:#DDD5C7; --mark-soft:#6E675C; --signal:#E5A094;
  --st-bad:#6E3A33; --st-warn:#5C4530; --st-ok:#3E4A2B; --st-na:#2E2B25; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:700} h2{font-size:1.2rem;font-weight:600} h3{font-size:.95rem;font-weight:600}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft)} .num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
header.top{padding-block:20px 12px;display:grid;gap:12px}
.idrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.banner{background:var(--st-warn);border-radius:6px;padding:8px 12px;font-size:.88rem}
.rail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.rail div{padding:6px 8px;border-radius:4px;background:var(--st-na);font-size:.78rem;min-width:0}
.rail b{display:block;font-family:var(--display);font-size:.85rem}
.rail .cur{background:var(--st-warn);outline:2px solid var(--ink);outline-offset:-2px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs a{flex:none;padding:10px 10px;color:var(--ink-soft);text-decoration:none;font-size:.85rem;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink);font-weight:600}
nav.tabs a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
main{padding-block:20px 48px}
section.mod{display:grid;gap:20px}
.sechead{display:grid;gap:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px;min-width:0;display:grid;gap:10px;align-content:start}
.kpi{display:grid;gap:4px}
.kpi .v{font-family:var(--display);font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-size:.9rem;font-weight:500;color:var(--ink-soft);margin-left:4px}
.kpi dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:4px 0 0;font-size:.78rem}
.kpi dt{color:var(--ink-soft)} .kpi dd{margin:0;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--st-na);white-space:nowrap;font-weight:600}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink);background:transparent}
.chip.ok{background:var(--st-ok)} .chip.ok::before{background:var(--ink)}
.chip.warn{background:var(--st-warn)} .chip.warn::before{border-style:dashed}
.chip.bad{background:var(--st-bad)} .chip.bad::before{border-radius:1px;background:var(--ink)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--ink-soft);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;background:var(--tint)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.finding{display:grid;gap:6px;padding:14px 16px;border:1px solid var(--rule);border-radius:8px}
.finding .row{display:grid;grid-template-columns:120px 1fr;gap:8px;font-size:.88rem}
.finding .row span:first-child{color:var(--ink-soft);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:12px 16px;background:var(--tint);border-radius:8px}
.filters label{display:grid;gap:2px;font-size:.75rem;color:var(--ink-soft)}
select,input,button{font:inherit;font-size:.88rem;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink)}
button{cursor:pointer;font-weight:600}
svg{display:block}
svg text{fill:var(--ink-soft);font-family:var(--mono);font-size:11px}
svg .lbl{fill:var(--ink)}
.empty{padding:20px;border:1.5px dashed var(--rule);border-radius:8px;color:var(--ink-soft);display:grid;gap:6px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow .step{flex:1 1 140px;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;display:grid;gap:2px;min-width:0}
.flow .step.hot{background:var(--st-warn)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;padding:6px 8px;border-radius:4px;z-index:20;max-width:260px}
ul.clean{margin:0;padding-left:18px} ul.clean li{margin-block:3px}
@media (max-width:640px){.rail{grid-template-columns:repeat(5,minmax(56px,1fr));overflow-x:auto}.finding .row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- baseline filtering ---------- */
const REC = B.records;
const SEGS = Object.keys(B.charts.segments||{});
const SEGLBL = k => (B.segment_labels||{})[k] || k.replace(/_/g," ").replace(/^./,c=>c.toUpperCase());
function opts(id, vals){ $(id).innerHTML = `<option value="">All</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join(""); }
function compute(f){
  const rs = REC.filter(r=>SEGS.every((k,i)=>!f["s"+i]||String(r[k])===f["s"+i])&&(!f.from||r.week>=f.from)&&(!f.to||r.week<=f.to));
  const done = rs.filter(r=>r.outcome_days!==null).map(r=>r.outcome_days);
  const stages = B.process_stages.map(s=>{const v=rs.filter(r=>r[s]!==null).map(r=>r[s]); return {s, median:median(v), n:v.length}});
  return {rs, done, med:median(done), p90:pct(done,90), stages};
}
function renderBaseline(){
  const f={from:$("#f-from").value, to:$("#f-to").value}; SEGS.forEach((k,i)=>f["s"+i]=$("#f-s"+i).value);
  const c=compute(f), filtered=Object.values(f).some(Boolean);
  const card=(t,v,u,sub)=>`<div class="panel kpi"><span class="eyebrow">${filtered?"Filtered":"All cases"}</span><h3>${t}</h3><div class="v">${v===null?'<span class="muted" style="font-size:1rem">Insufficient data</span>':fmt(v,u==="cases"?0:1)+`<small>${u}</small>`}</div><span class="muted num">${sub}</span></div>`;
  $("#fk").innerHTML = card("Median "+B.outcome_label.toLowerCase(), c.done.length>=10?c.med:null, B.unit, `n = ${c.done.length} completed of ${c.rs.length} in scope`)
    + card("P90 "+B.outcome_label.toLowerCase(), c.done.length>=10?c.p90:null, B.unit, `n = ${c.done.length}`)
    + card("Still open", c.rs.length-c.done.length, "cases", `denominator ${c.rs.length} (excludes cancelled)`)
    + card("Completion share", c.rs.length?100*c.done.length/c.rs.length:null, "%", "completed / in scope");
  $("#hist").innerHTML = histSVG(c.done, c.p90||0);
  $("#stg").innerHTML = barsH(c.stages.map(s=>({...s, tip:"n="+s.n})), "median", "s", " d", c.stages.reduce((bi,s,i,a)=>s.median>(a[bi].median||0)?i:bi,0));
  tipOn($("#main"));
}
function initBaseline(){
  const ids=[...SEGS.map((k,i)=>"#f-s"+i),"#f-from","#f-to"];
  SEGS.forEach((k,i)=>opts("#f-s"+i,[...new Set(REC.map(r=>String(r[k])))].sort()));
  ids.forEach(s=>$(s).addEventListener("change",renderBaseline));
  $("#f-reset").addEventListener("click",()=>{ids.forEach(s=>$(s).value="");renderBaseline()});
  renderBaseline();
}
function reconcile(){
  const c=compute({}); const rows=[
    {m:"Median (K1)", d:+c.med.toFixed(2), b:K.K1.current, n1:c.done.length, n2:K.K1.n},
    {m:"P90 (K3)", d:+c.p90.toFixed(2), b:K.K3.current, n1:c.done.length, n2:K.K3.n}];
  rows.forEach(r=>r.ok=Math.abs(r.d-r.b)<0.01&&r.n1===r.n2);
  window.__RECON__=rows.every(r=>r.ok);
  return table(rows,[{h:"Measure",k:"m"},{h:"Dashboard",k:"d",n:1},{h:"Results bundle",k:"b",n:1},{h:"n dash",k:"n1",n:1},{h:"n bundle",k:"n2",n:1},{h:"Result",k:r=>chip(r.ok?"Reconciled – approved method":"Requires review: mismatch"),raw:1}]);
}

/* ---------- shell ---------- */
function header(){
  const stages=["Define","Measure","Analyze","Improve","Control"], cur=stages.indexOf(B.config.dmaic_stage);
  $("#hdr").innerHTML = `${B.synthetic?'<div class="banner"><b>Synthetic demonstration data.</b> The organisation and all figures are fictitious. They exist only to show how the workspace works.</div>':""}
  <div class="idrow"><div><span class="eyebrow">${esc(B.config.project_id)} · ${esc(B.config.client)}</span><h1>${esc(B.config.process)}: ${esc(B.outcome_label)}</h1></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${chip(B.status)}<span class="eyebrow">results ${esc(B.version)} · data to ${esc(B.extract_date)}</span></div></div>
  <div class="rail" role="list" aria-label="DMAIC phases">${stages.map((s,i)=>`<div role="listitem" class="${i===cur?'cur':''}"><b>${s}</b>${i<cur?'Evidence gathered – gate approval pending':i===cur?'Current phase':'Pending'}</div>`).join("")}</div>`;
}
function route(){
  const id=(location.hash||"#home").slice(1), mod=MODULES.find(m=>m[0]===id)||MODULES[0];
  $("#tabs").innerHTML = MODULES.map(([k,l],i)=>`<a href="#${k}" ${k===mod[0]?'aria-current="page"':''}>${i+1}. ${l}</a>`).join("");
  $("#main").innerHTML = `<section class="mod">${mod[2]()}</section>`;
  if(mod[0]==="baseline") initBaseline();
  if(mod[0]==="export") $("#recon").innerHTML=reconcile();
  tipOn($("#main"));
}
header(); route(); addEventListener("hashchange",()=>{route();scrollTo(0,0)});
reconcile();
