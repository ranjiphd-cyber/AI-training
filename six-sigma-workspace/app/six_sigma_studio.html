<style>
/* Layout: project bar on top; module rail on the left (tabs on phones); one module at a time, summary before detail. */
:root{
  --coral:#E5A094; --peach:#F5D6BC; --cream:#F8F4E8; --sage:#D7E6B7;
  --bg:#FFFFFF; --surface:#FFFFFF; --tint:#F8F4E8; --ink:#2B2B2B; --ink-soft:#5C5852; --rule:#E2DCD0;
  --mark:#3F3B35; --mark-soft:#B9B1A3; --signal:#A8584B; --input:#FFFFFF;
  --st-bad:#E5A094; --st-warn:#F5D6BC; --st-ok:#D7E6B7; --st-na:#F1ECE0;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Calibri,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1A17; --surface:#23211D; --tint:#2B2823; --ink:#EEE9DF; --ink-soft:#B8B0A2; --rule:#3A362F; --input:#1F1D1A;
  --mark:#DDD5C7; --mark-soft:#6E675C; --signal:#E5A094;
  --st-bad:#6E3A33; --st-warn:#5C4530; --st-ok:#3E4A2B; --st-na:#2E2B25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1A17; --surface:#23211D; --tint:#2B2823; --ink:#EEE9DF; --ink-soft:#B8B0A2; --rule:#3A362F; --input:#1F1D1A;
  --mark:#DDD5C7; --mark-soft:#6E675C; --signal:#E5A094;
  --st-bad:#6E3A33; --st-warn:#5C4530; --st-ok:#3E4A2B; --st-na:#2E2B25; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.15rem;font-weight:700} h2{font-size:1.25rem;font-weight:600} h3{font-size:.98rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft)} .small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar .in{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .grow{flex:1 1 200px;min-width:0}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 60px)}
nav.rail{border-right:1px solid var(--rule);padding:14px 10px;display:grid;align-content:start;gap:2px;position:sticky;top:60px;max-height:calc(100vh - 60px);overflow:auto;padding-left:max(10px,env(safe-area-inset-left,0px))}
nav.rail .ph{margin-top:10px;padding:0 8px}
nav.rail a{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.9rem}
nav.rail a[aria-current="page"]{background:var(--tint);font-weight:600}
nav.rail a .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-soft);flex:none;margin-top:6px}
nav.rail a .dot.done{background:var(--ink);border-color:var(--ink)}
main{padding-block:20px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:grid;gap:18px;align-content:start;max-width:1180px}
.sechead{display:grid;gap:4px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px;min-width:0;display:grid;gap:10px;align-content:start}
.panel.tint{background:var(--tint);border-color:transparent}
.kpi .v{font-family:var(--display);font-size:1.8rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-size:.85rem;font-weight:500;color:var(--ink-soft);margin-left:4px}
.kpi dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:4px 0 0;font-size:.78rem}
.kpi dt{color:var(--ink-soft)} .kpi dd{margin:0;min-width:0;overflow-wrap:anywhere}
.panel,.finding,.rec{overflow-wrap:break-word}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--st-na);white-space:nowrap;font-weight:600;color:var(--ink)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink)}
.chip.ok{background:var(--st-ok)} .chip.ok::before{background:var(--ink)}
.chip.warn{background:var(--st-warn)} .chip.warn::before{border-style:dashed}
.chip.bad{background:var(--st-bad)} .chip.bad::before{border-radius:1px;background:var(--ink)}
label.f{display:grid;gap:3px;font-size:.8rem;color:var(--ink-soft);min-width:0}
label.f span.req::after{content:" *";color:var(--signal)}
input,select,textarea,button{font:inherit;font-size:.9rem;color:var(--ink)}
input,select,textarea{padding:7px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--input);width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:auto}
button{padding:7px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:600}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:6px 7px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--ink-soft);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;background:var(--tint);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
table.edit td{padding:3px}
table.edit input,table.edit select,table.edit textarea{padding:5px 6px;font-size:.84rem;min-width:110px}
table.edit textarea{min-height:34px}
.finding{display:grid;gap:5px;padding:12px 14px;border:1px solid var(--rule);border-radius:8px}
.finding .r{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:.87rem}
.finding .r span:first-child{color:var(--ink-soft);font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.empty{padding:16px;border:1.5px dashed var(--rule);border-radius:8px;color:var(--ink-soft);display:grid;gap:6px}
.steps{display:grid;gap:6px}
.step{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:start;padding:8px 10px;border:1px solid var(--rule);border-radius:6px}
.step .box{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:3px;margin-top:4px}
.step.done .box{background:var(--ink)}
.step.done .t{color:var(--ink-soft);text-decoration:line-through}
.rec{display:grid;gap:6px;padding:12px 14px;border-radius:8px;border:1px solid var(--rule)}
.rec.hi{background:var(--tint)}
.preview{white-space:pre-wrap;font-family:var(--body);font-size:.88rem;background:var(--tint);border-radius:6px;padding:12px;max-height:420px;overflow:auto}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;z-index:30;max-width:340px;font-size:.88rem}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;padding:6px 8px;border-radius:4px;z-index:20;max-width:260px}
svg{display:block;max-width:100%;height:auto}
svg text{fill:var(--ink-soft);font-family:var(--mono);font-size:11px}
svg .lbl{fill:var(--ink)}
.banner{background:var(--st-warn);border-radius:6px;padding:8px 12px;font-size:.86rem}
.phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.phases div{padding:6px 8px;border-radius:4px;background:var(--st-na);font-size:.76rem;min-width:0}
.phases b{display:block;font-family:var(--display);font-size:.85rem}
.phases .cur{background:var(--st-warn);outline:2px solid var(--ink);outline-offset:-2px}
.phases .ok{background:var(--st-ok)}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  nav.rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);display:flex;overflow-x:auto;gap:4px;padding:8px max(16px,env(safe-area-inset-left,0px))}
  nav.rail .ph{display:none} nav.rail a{white-space:nowrap;flex:none} nav.rail a .dot{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .finding .r{grid-template-columns:1fr}
  .phases{grid-template-columns:repeat(5,minmax(64px,1fr));overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="bar"><div class="in">
  <div class="grow"><span class="eyebrow">Six Sigma Studio</span><h1 id="ptitle">Loading…</h1></div>
  <label class="f" for="proj-sel" style="min-width:200px">Project<select id="proj-sel"></select></label>
  <button id="btn-new">New project</button>
  <button id="btn-example">Load example</button>

</div></div>

<script>
"use strict";
/* =====================================================================
   Six Sigma Studio - department-agnostic DMAIC workspace (prototype v0.2)
   Charter -> CTQs -> data requirements -> upload & map -> analysis ->
   recommendations & next steps -> registers -> PowerPoint.
   Raw uploaded data stays in this browser tab; projects save without it.
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => v === null || v === undefined ? "" : String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nid = () => Math.random().toString(36).slice(2, 10);
const nowISO = () => new Date().toISOString().slice(0, 19).replace("T", " ");
const fmt = (v, d = 1) => v === null || v === undefined || Number.isNaN(v) ? "–" : Number(v).toFixed(d);
const fmtP = p => p === null || p === undefined || Number.isNaN(p) ? "n/a" : p < 0.001 ? "p < 0.001" : "p = " + p.toFixed(3);
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3800); }

/* ------------------------------------------------------------------ constants */
const DEPARTMENTS = ["Talent Acquisition", "HR Operations", "Employee Experience", "Learning & Development", "Finance", "Procurement", "Supply Chain", "Manufacturing", "Sales", "Marketing", "Customer Service", "IT", "Healthcare Operations", "Other"];
const MODES = ["RUN PROJECT", "REFRESH PROJECT", "BUILD TEMPLATE"];
const DMAIC = ["Define", "Measure", "Analyze", "Improve", "Control"];
const LABELS = ["Verified fact", "Calculated result", "Stakeholder opinion", "Hypothesis", "Assumption", "Proposed target", "Approved decision", "Unresolved question"];
const CAUSE_STATUS = ["Hypothesized", "Supported", "Validated for stated context", "Rejected", "Unresolved"];
const APPROVAL = ["Pending", "Approved", "Approved with conditions", "Rejected", "Requires revalidation"];
const STATUS = ["Not started", "In progress", "Complete", "Blocked"];
const BSTAGE = ["Forecast", "Pilot estimate", "Realized benefit", "Annualized projection"];
const BTYPE = ["Hard savings", "Cost avoidance", "Released capacity", "Revenue opportunity", "Intangible benefit"];
const GATE = ["Not started", "In progress", "Evidence ready", "Approved"];
const CTQ_TYPES = {
  duration: "Time between two events (cycle / lead time)",
  proportion: "Yes/No outcome per unit (defect, success, compliance rate)",
  continuous: "Measured value per unit (dimension, cost, score on a continuous scale)",
  rating: "Survey rating (Likert 1–5 / 1–7, or 0–10 eNPS)",
};

/* Metric library: suggestions only - every CTQ stays editable. */
const LIB = {
  "Talent Acquisition": [["Time to offer", "duration", "days", "Requisition approved", "First offer extended", "lower"], ["Offer acceptance rate", "proportion", "%", "", "", "higher", "Offers accepted", "Offers extended"], ["Hiring manager satisfaction", "rating", "score", "", "", "higher"]],
  "HR Operations": [["HR query resolution time", "duration", "days", "Query logged", "Query resolved", "lower"], ["First contact resolution", "proportion", "%", "", "", "higher", "Queries resolved without reopening", "Queries resolved"], ["Payroll accuracy", "proportion", "%", "", "", "higher", "Error-free payslips", "Payslips issued"]],
  "Employee Experience": [["Onboarding eNPS (0–10)", "rating", "score", "", "", "higher"], ["Day-1 readiness", "proportion", "%", "", "", "higher", "New joiners with equipment, access and buddy on day 1", "New joiners"], ["Time to productivity", "duration", "days", "Start date", "Signed-off as productive", "lower"], ["Engagement item (1–5)", "rating", "score", "", "", "higher"]],
  "Learning & Development": [["Completion rate", "proportion", "%", "", "", "higher", "Completions", "Enrolments (same cohort)"], ["Time to competence", "duration", "days", "Enrolment", "Competence sign-off", "lower"], ["Post-assessment score", "continuous", "points", "", "", "higher"]],
  "Finance": [["Invoice processing time", "duration", "days", "Invoice received", "Invoice paid", "lower"], ["First-time match rate", "proportion", "%", "", "", "higher", "Invoices matched without exception", "Invoices processed"], ["Month-end close duration", "duration", "days", "Period end", "Close sign-off", "lower"]],
  "Procurement": [["PR-to-PO cycle time", "duration", "days", "Requisition raised", "PO issued", "lower"], ["Contract compliance", "proportion", "%", "", "", "higher", "On-contract purchases", "Purchases"]],
  "Supply Chain": [["On time in full", "proportion", "%", "", "", "higher", "Order lines delivered on time and in full", "Order lines due"], ["Order cycle time", "duration", "days", "Order received", "Order shipped", "lower"]],
  "Manufacturing": [["Defect rate", "proportion", "%", "", "", "lower", "Defective units", "Units inspected"], ["CTQ dimension", "continuous", "mm", "", "", "nominal"], ["Changeover time", "duration", "minutes", "Last good part", "First good part", "lower"]],
  "Sales": [["Win rate", "proportion", "%", "", "", "higher", "Opportunities won", "Opportunities closed"], ["Sales cycle length", "duration", "days", "Opportunity created", "Opportunity closed", "lower"]],
  "Marketing": [["Lead-to-MQL conversion", "proportion", "%", "", "", "higher", "MQLs", "Leads"], ["Campaign launch lead time", "duration", "days", "Brief approved", "Campaign live", "lower"]],
  "Customer Service": [["Resolution time", "duration", "hours", "Case opened", "Case closed", "lower"], ["Customer satisfaction (CSAT)", "rating", "score", "", "", "higher"], ["Repeat contact rate", "proportion", "%", "", "", "lower", "Customers contacting again within 7 days", "Customers contacting"]],
  "IT": [["Time to restore service", "duration", "hours", "Incident logged", "Service restored", "lower"], ["SLA attainment", "proportion", "%", "", "", "higher", "Incidents resolved within SLA", "Incidents resolved"]],
  "Healthcare Operations": [["Door-to-clinician time", "duration", "minutes", "Arrival", "Seen by clinician", "lower"], ["Length of stay", "duration", "hours", "Admission", "Discharge", "lower"]],
  "Other": [["Cycle time", "duration", "days", "Process start", "Process end", "lower"], ["Defect rate", "proportion", "%", "", "", "lower", "Defective units", "Units"]],
};

/* Register column definitions [field, header, type, options] */
const REG = {
  sipoc: [["s", "Suppliers"], ["i", "Inputs"], ["p", "Process step"], ["o", "Outputs"], ["c", "Customers"]],
  stakeholder: [["role", "Contributor role"], ["group", "Group", "sel", ["Process owner", "Frontline", "Customer", "Upstream", "Downstream", "System owner", "Control function"]], ["method", "Method", "sel", ["Silent ideation", "Interview", "Survey", "Workshop", "Gemba"]], ["issue", "Issue observed"], ["idea", "Possible cause (hypothesis)"], ["evidence", "Evidence that would confirm"], ["label", "Label", "sel", LABELS]],
  causes: [["issue", "Issue"], ["cause", "Hypothesized cause"], ["by", "Raised by (role)"], ["evidence", "Evidence required"], ["method", "Validation method"], ["result", "Result"], ["owner", "Owner"], ["status", "Status", "sel", CAUSE_STATUS]],
  improvements: [["change", "Change"], ["link", "CTQ → finding → cause"], ["mechanism", "Expected mechanism"], ["impact", "Customer impact 1–5", "num"], ["evid", "Evidence strength 1–5", "num"], ["cost", "Cost (5=low) 1–5", "num"], ["effort", "Effort (5=low) 1–5", "num"], ["risk", "Risk (5=low) 1–5", "num"], ["decision", "Decision", "sel", APPROVAL]],
  pilots: [["owner", "Owner"], ["population", "Population"], ["intervention", "Intervention"], ["comparison", "Comparison approach"], ["duration", "Duration rationale"], ["success", "Success criteria"], ["guardrails", "Guardrails"], ["stop", "Stop rule"], ["approval", "Approval", "sel", APPROVAL]],
  actions: [["action", "Action"], ["owner", "Owner"], ["due", "Due"], ["evidence", "Completion evidence"], ["status", "Status", "sel", STATUS]],
  benefits: [["desc", "Benefit"], ["stage", "Stage", "sel", BSTAGE], ["type", "Type", "sel", BTYPE], ["formula", "Formula"], ["value", "Net value", "num"], ["currency", "Currency"], ["horizon", "Time horizon"], ["finance", "Finance approval", "sel", APPROVAL]],
  controls: [["metric", "Metric / CTQ"], ["owner", "Owner"], ["freq", "Review frequency"], ["method", "Monitoring method"], ["trigger", "Trigger"], ["response", "Response"], ["timing", "Response time"], ["escalation", "Escalation"], ["where", "Evidence location"]],
  approvals: [["item", "Item"], ["role", "Approver role"], ["name", "Approver name"], ["status", "Status", "sel", APPROVAL], ["date", "Date"]],
  risks: [["desc", "Risk / issue"], ["severity", "Severity", "sel", ["Low", "Medium", "High", "Critical"]], ["owner", "Owner"], ["mitigation", "Mitigation"], ["status", "Status", "sel", STATUS]],
  assumptions: [["statement", "Statement"], ["label", "Label", "sel", LABELS], ["owner", "Owner"], ["status", "Status", "sel", STATUS]],
  decisions: [["decision", "Decision"], ["rationale", "Rationale"], ["by", "Decided by"], ["date", "Date"], ["label", "Label", "sel", LABELS]],
  questions: [["q", "Question"], ["priority", "Priority", "sel", ["High", "Medium", "Low"]], ["owner", "Owner"], ["status", "Status", "sel", ["Open", "Answered", "Closed"]]],
  datareq: [["q", "Question"], ["field", "Required field"], ["def", "Operational definition"], ["source", "Source"], ["method", "Collection method"], ["sampling", "Sampling / precision rationale"], ["owner", "Owner"], ["freq", "Frequency"], ["validation", "Validation"], ["evidence", "Completion evidence"], ["status", "Status", "sel", STATUS]],
};

/* ------------------------------------------------------------------ project model */
function blankProject(id) {
  const p = {
    id: id || "P-" + nid().toUpperCase(), schema: 2, created: nowISO(), updated: nowISO(),
    org: { organization: "", industry: "", department: "", process: "", site: "", mode: "RUN PROJECT", dmaic: "Define", observationUnit: "" },
    team: { sponsor: "", owner: "", lead: "", members: "", stakeholders: "" },
    charter: { businessCase: "", voc: "", vob: "", ps: { process: "", population: "", gap: "", period: "", impact: "" }, goal: "", scope: "", exclusions: "", constraints: "", milestones: "", deliverables: "", deadline: "", platform: "", privacy: "", invited: "" },
    ctqs: [], primary: null, weights: { impact: .30, evid: .25, cost: .15, effort: .15, risk: .15 },
    mapping: { id: "", start: "", end: "", time: "", value: "", flag: "", flagYes: "", rating: "", category: "", stages: [], segments: [], excludeCol: "", excludeVals: "" },
    options: { dayFirst: false, asOf: "", measurementVerified: false, specApproved: false },
    fileMeta: null, results: null, versions: [], gates: Object.fromEntries(DMAIC.map(g => [g, { status: "Not started", by: "", date: "" }])),
    log: [], example: false,
  };
  for (const k of Object.keys(REG)) p[k] = [];
  return p;
}
function newCTQ(type = "duration") {
  return { id: "CTQ-" + nid().slice(0, 4).toUpperCase(), name: "", type, definition: "", unit: type === "proportion" ? "%" : type === "rating" ? "score" : "days", numerator: "", denominator: "", population: "", start: "", stop: "", direction: "lower", source: "", owner: "", requirement: "", target: "", targetStatus: "Not set", lsl: "", usl: "", scaleMin: "1", scaleMax: "5", minGroup: "", practical: "" };
}

/* ------------------------------------------------------------------ app state */
const S = { projects: {}, cur: null, data: null, store: null, dirty: false, ai: null, sample: null, downloads: null };

/* ------------------------------------------------------------------ persistence: private db (per viewer) or browser storage */
const Store = {
  mode: "memory", db: null, uid: null,
  async init() {
    try { const ls = window.localStorage; ls.setItem("_t", "1"); ls.removeItem("_t"); this.mode = "local"; } catch (e) { this.mode = "memory"; }
    if (window.claude && claude.use) {
      try {
        const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
        const uid = user ? await user.id() : null;
        if (db && uid) { this.db = db; this.uid = uid; this.mode = "cloud"; }
      } catch (e) { /* stay local */ }
      claude.use("downloads").then(d => S.downloads = d).catch(() => {});
      claude.use("sample").then(s => { S.sample = s; if (S.cur && route() === "recs") render(); }).catch(() => {});
    }
  },
  col() { return this.db.collection("data/users/" + this.uid); },
  async list() {
    if (this.mode === "cloud") {
      try { const snap = await this.col().get(); const out = {}; snap.docs.forEach(d => { const b = d.data(); if (b && b.project) out[d.id] = JSON.parse(b.project); }); return out; }
      catch (e) { this.mode = "local"; }
    }
    if (this.mode === "local") { try { return JSON.parse(localStorage.getItem("ss-studio-projects") || "{}"); } catch (e) { return {}; } }
    return {};
  },
  async save(p) {

/* ---------------- recommendations (rule-based, traceable) */

  const defectShare = (R.dq.chron + R.dq.dupIds) / Math.max(1, R.dq.rows);
  if (highMiss.length || defectShare >= .01) add(1, "Fix the measurement system first", `${highMiss.length ? "High missingness: " + highMiss.join(", ") + ". " : ""}${R.dq.chron ? R.dq.chron + " chronology errors. " : ""}${R.dq.dupIds ? R.dq.dupIds + " repeated IDs." : ""}`, "Operational definitions, timestamp verification, attribute agreement", "Measure");
  else if (R.dq.chron || R.dq.dupIds || R.dq.exactDup) add(3, "Correct the data defects found", `${R.dq.exactDup} duplicate rows, ${R.dq.dupIds} repeated IDs, ${R.dq.chron} chronology errors (under 1% of rows; excluded and logged).`, "Data owner correction, entry rules", "Measure");
  if (!p.options.measurementVerified) add(2, "Verify a sample of records against source evidence", "Measurement accuracy is not yet confirmed.", "Measurement_Check sheet, 20–30 random records", "Measure");
  const c = R.charts.ctrl; if (c && c.signals && c.signals.length) add(1, "Investigate special causes before setting the baseline", `${c.signals.length} signal(s) on the ${c.kind}.`, "Event log review, Five Whys on the flagged periods", "Measure");
  if (!ct.requirement || /not/i.test(ct.targetStatus || "Not set")) add(2, "Capture VOC and get the requirement approved", "The CTQ has no approved requirement; targets must come from customers, not the baseline.", "Interviews, Kano, CTQ tree", "Define");
  if (R.type === "duration" && K("K1") && K("K2") && K("K2").value / K("K1").value > 1.5) add(2, "Attack the long tail, not the average", `P90 is ${fmt(K("K2").value / K("K1").value)}× the median.`, "Triage rules, standard work, WIP limits, escalation trigger", "Improve");

improve(p) {
  const w = p.weights, score = r => { const v = ["impact", "evid", "cost", "effort", "risk"].map(k => parseNum(r[k])); if (v.some(x => x === null || Number.isNaN(x))) return "Incomplete"; return fmt(w.impact * v[0] + w.evid * v[1] + w.cost * v[2] + w.effort * v[3] + w.risk * v[4], 2); };
  const sum = Object.values(w).reduce((a, b) => a + Number(b), 0);
  return `<div class="sechead"><span class="eyebrow">Improve · Step 9</span><h2>Improvement options, pilots and actions</h2><p class="muted">Trace each option: CTQ → finding → cause → change → expected mechanism. Nothing is implemented or communicated without approval.</p></div>

governance(p) {

function dqView(R) {
  const dq = R.dq; const miss = Object.entries(dq.missing).map(([k, v]) => ({ f: k + (v.scope ? ` (${v.scope})` : ""), n: v.n, pct: v.pct }));
  return `<div class="grid g4"><div class="kpi"><span class="eyebrow">Rows</span><div class="v">${dq.rows}</div></div><div class="kpi"><span class="eyebrow">Duplicate rows / IDs</span><div class="v">${dq.exactDup} / ${dq.dupIds}</div></div><div class="kpi"><span class="eyebrow">Chronology errors</span><div class="v">${dq.chron}</div></div><div class="kpi"><span class="eyebrow">Possible personal-data columns</span><div class="v">${dq.pii.length}</div>${dq.pii.length ? `<span class="small">${esc(dq.pii.join(", "))} – remove before sharing</span>` : ""}</div></div>
  ${table(miss, [{ h: "Mapped field", k: "f" }, { h: "Missing (kept blank, never 0)", k: "n", n: 1 }, { h: "%", k: r => fmt(r.pct), n: 1 }])}
  ${table([...R.transforms.map(t => ({ a: t.step, b: t.removed })), ...R.exclusions.map(e => ({ a: e.rule, b: e.rows }))], [{ h: "Transformation / exclusion (logged)", k: "a" }, { h: "Rows", k: "b", n: 1 }])}`;
}
function compareVersions(a, b) {
  const rows = b.kpis.map(k => { const o = a.kpis.find(x => x.id === k.id); const rel = o && o.value ? Math.abs(k.value - o.value) / Math.abs(o.value) * 100 : null; return { name: k.name, old: o ? o.value : null, new: k.value, rel, on: o ? o.n : "–", nn: k.n, material: !o || (rel !== null && rel >= 5) }; });
  return { from: a.v, to: b.v, rows, material: rows.some(r => r.material) };
}

  const act = b.dataset.act; if (!act) return;
  if (act === "run") { if (!S.data) { toast("Load a data file first"); return; } const R = analyze(); if (R && R.error) { toast(R.error); return; } p.results = R; touch(`Analysis run on ${S.data.name}`); location.hash = "#analyze"; render(); return; }
  if (act === "automap") { autoMap(true); touch("Mapping re-suggested"); render(); return; }
  if (act === "snapshot") { const R = p.results; const v = { v: "v" + String(p.versions.length + 1).padStart(3, "0"), at: nowISO(), file: R.file ? R.file.name : "", status: "Draft – pending review", kpis: R.kpis.map(k => ({ id: k.id, name: k.name, value: k.value, n: k.n })) }; p.versions.push(v); if (p.versions.length >= 2) { const cmp = compareVersions(p.versions[p.versions.length - 2], v); if (cmp.material) p.approvals.forEach(a => { if (a.status === "Approved") a.status = "Requires revalidation"; }); } touch("Saved results version " + v.v); toast("Saved " + v.v + " (Draft – pending review)"); render(); return; }
  if (act === "tpl-xlsx") { if (typeof XLSX === "undefined") { toast("Spreadsheet library not loaded"); return; } const { wb } = templateWorkbook(); const out = XLSX.write(wb, { bookType: "xlsx", type: "array" }); await saveFile(`${(p.org.process || "project").replace(/[^\w-]+/g, "_")}_data_collection_template.xlsx`, new Blob([out])); return; }
  if (act === "tpl-csv") { const { heads } = templateWorkbook(); await saveFile("data_collection_template.csv", heads.join(",") + "\n"); return; }
  if (act === "plan-from-roles") { requiredRoles(primaryCTQ()).forEach(r => p.datareq.push({ q: `Capture ${r[1].toLowerCase()}`, field: r[1], def: r[2], sampling: "Set from required precision (see calculator)", status: "Not started" })); touch("Collection plan pre-filled"); render(); return; }
  if (act === "ppt") { b.disabled = true; b.textContent = "Building…"; try { await buildDeck(); } catch (err) { console.error(err); toast("Could not build the deck: " + err.message); } b.disabled = false; b.textContent = "Create PowerPoint"; return; }
  if (act === "export-json") { await saveFile(`${p.id}_${(p.org.process || "project").replace(/[^\w-]+/g, "_")}.json`, JSON.stringify(p, null, 2)); return; }
  if (act === "comm-copy") { const t = $("#comm-out").textContent; try { await navigator.clipboard.writeText(t); toast("Copied"); } catch (err) { const r = document.createRange(); r.selectNodeContents($("#comm-out")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Text selected – press Ctrl/Cmd+C"); } return; }
  if (act === "comm-save") { await saveFile(currentComm.replace(/\W+/g, "_") + ".md", $("#comm-out").textContent); return; }
  if (act === "del-arm") { $("#del-confirm").hidden = false; return; }
  if (act === "del-no") { $("#del-confirm").hidden = true; return; }
  if (act === "del-yes") { await Store.remove(p.id); delete S.projects[p.id]; const next = Object.values(S.projects)[0]; if (next) openProject(next); else { const [np, rows] = examples()["HR query resolution (HR Operations)"](); np.example = true; openProject(np, rows); } toast("Project deleted"); return; }
  if (act === "ai") { askAI(b); return; }
  if (act === "ai-stop") { if (askAI.ctl) askAI.ctl.abort(); return; }
});
VIEWS.examples = () => `<div class="sechead"><span class="eyebrow">Examples</span><h2>Load an example project</h2><p class="muted">Each one uses synthetic data generated in your browser, so you can see how the same method works across departments.</p></div><div class="grid g3">${Object.keys(examples()).map(k => `<div class="panel"><h3>${esc(k)}</h3><button class="primary" data-ex="${esc(k)}">Open example</button></div>`).join("")}</div>`;
async function askAI(btn) {
  const p = S.cur, R = p.results, out = $("#ai-out"), stop = $("#ai-stop");
  const brief = { organisation: p.org.organization, department: p.org.department, process: p.org.process, phase: p.org.dmaic, problem: problemText(p), goal: p.charter.goal, scope: p.charter.scope, voc: p.charter.voc, ctq: primaryCTQ(), kpis: R ? R.kpis.map(k => ({ name: k.name, value: k.value, unit: k.unit, n: k.n, ci: k.ci })) : null, findings: R ? R.findings.map(f => f.finding) : null, recommendations: R ? R.recs.map(r => r.title) : null, causes: p.causes, stakeholderInputs: p.stakeholder.length, openChecklist: checklist(p).filter(x => !x.done).map(x => x.t) };
  const prompt = `You are coaching an experienced Lean Six Sigma Black Belt. Using ONLY the project summary below, give:\n1) Three to five recommended next steps for this DMAIC project, each with: step, why (cite the evidence given), tool/method, owner role, observable completion evidence.\n2) Two or three cause hypotheses worth testing (clearly labelled Hypothesis) and the data that would confirm or reject each.\n3) The main risks to the validity of the conclusions.\nRules: do not invent data or stakeholder views; do not present hypotheses as causes; do not claim savings; flag anything needing HR, legal or privacy review. Plain text, short headings, no markdown tables.\n\nPROJECT SUMMARY (JSON):\n${JSON.stringify(brief)}`;
  btn.disabled = true; stop.hidden = false; out.hidden = false; out.textContent = "Thinking…";
  askAI.ctl = new AbortController();
  try { const { text } = await S.sample(prompt, { onText: ({ text }) => { out.textContent = text; }, signal: askAI.ctl.signal, modelTier: "default" }); S.ai = "AI SUGGESTION – HYPOTHESIS, REVIEW BEFORE USE\n\n" + text; out.textContent = S.ai; }
  catch (err) { if (err && err.code === "not_granted") { $("#ai-panel").hidden = true; } else out.textContent = (err && err.text ? err.text + "\n\n" : "") + "The AI coach is unavailable right now (" + (err && err.code || "error") + ")."; }
  finally { btn.disabled = false; stop.hidden = true; }
}
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });

/* ================================================================== BOOT */
(async function boot() {
  const [np, rows] = examples()["HR query resolution (HR Operations)"](); np.example = true; openProject(np, rows);
  await Store.init();
  S.projects = await Store.list();
  const list = Object.values(S.projects).sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
  if (list.length && (!S.cur || S.cur.example) && !S.cur._touched) openProject(list[0]); else fillProjectSelect();
  $("#save-state").textContent = { cloud: "Projects save privately to your account", local: "Projects save in this browser", memory: "No storage available – export to keep work" }[Store.mode] + (S.cur.example ? " · example not saved" : "");
})();
</script>
