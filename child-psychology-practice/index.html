};


</script>
<script>
(() => {
"use strict";

const MODS = [
  { id: "m1", num: "I", title: "Introduction to Developmental Psychology",
    subs: { intro: "Introduction & research strategies", psycho: "Freud & Erikson", learning: "Watson, Skinner & Bandura", cognitive: "Piaget, Vygotsky & information processing", ethology: "Ethology", kohlberg: "Kohlberg" } },
  { id: "m2", num: "II", title: "Biological Foundations of Development",
    subs: { heredity: "Heredity", prenatal: "Prenatal development & birth", infancy: "Infancy: reflexes, sensation & perception", physical: "Physical, brain & motor development", puberty: "Puberty & its psychological impact", influences: "Causes & environmental influences" } },
  { id: "m3", num: "III", title: "Cognitive Development",
    subs: { intel: "Intelligence & cognitive schemes", piaget: "Piaget's theory & stages", vygotsky: "Vygotsky, ZPD & applications", infoproc: "Information processing", language: "Language & communication" } },
  { id: "m4", num: "IV", title: "Social and Personality Development",
    subs: { emotion: "Emotional development", temperament: "Temperament", attachment: "Attachment", self: "Self & social cognition", gender: "Sex differences & gender roles", moral: "Aggression, altruism & morality" } },
  { id: "m5", num: "V", title: "The Context of Development",
    subs: { family: "Family", media: "Television & computers", school: "School", peers: "Peers" },
    note: "Built from standard developmental psychology knowledge on these syllabus topics." }
];
const MOD = Object.fromEntries(MODS.map(m => [m.id, m]));

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = seed => () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const shuffle = (arr, rand = Math.random) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const live = msg => { const l = $("#live"); l.textContent = ""; setTimeout(() => { l.textContent = msg; }, 30); };
const store = {
  get(k, d) { try { const v = localStorage.getItem("cpl:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("cpl:" + k, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep working in memory */ } },
  del(k) { try { localStorage.removeItem("cpl:" + k); } catch (e) {} }
};

/* ---------- question banks: fixed, varied answer positions ---------- */
const BANK = {};
for (const m of MODS) {
  BANK[m.id] = MCQ[m.id].map((r, i) => {
    const [s, q, correct, wrong, e] = r;
    const opts = shuffle([correct, ...wrong], rng(hash(m.id + q)));
    return { id: `${m.id}-${i + 1}`, m: m.id, s, q, opts, ans: opts.indexOf(correct), e };
  });
}
const DBANK = {};
for (const m of MODS) {
  DBANK[m.id] = DESC[m.id].map((r, i) => ({ id: `${m.id}-d${i + 1}`, m: m.id, s: r[0], marks: r[1], q: r[2], pts: r[3] }));
}
const TOTAL_MCQ = MODS.reduce((n, m) => n + BANK[m.id].length, 0);
const TOTAL_DESC = MODS.reduce((n, m) => n + DBANK[m.id].length, 0);

/* ---------- persistent progress ---------- */
// mcq: { qid: true|false } latest result per question; best: { modId: pct }; desc: { qid: {text, checks, rub, done} }
let prog = store.get("progress", { mcq: {}, best: {}, desc: {} });
prog.mcq ||= {}; prog.best ||= {}; prog.desc ||= {};
const saveProg = () => store.set("progress", prog);

/* ---------- app state ---------- */
let view = "home";
let setup = { m: "m1", sub: "all", mode: "mcq", count: "all", shuffle: true };
let quiz = null;   // { m, sub, items:[qid], answers:[{c, done}], idx, finished }
let dsess = null;  // { m, sub, items:[qid], idx, checked:{} }
const byId = {};
for (const m of MODS) { BANK[m.id].forEach(q => byId[q.id] = q); DBANK[m.id].forEach(q => byId[q.id] = q); }

const savedQuiz = store.get("quiz", null);
if (savedQuiz && savedQuiz.items && savedQuiz.items.every(id => byId[id])) quiz = savedQuiz;
const saveQuiz = () => quiz ? store.set("quiz", quiz) : store.del("quiz");

const app = $("#app");
function go(v, focus = true) {
  view = v; render();
  if (focus) { app.focus({ preventScroll: true }); window.scrollTo({ top: 0, behavior: "smooth" }); }
}

/* ---------- stats in masthead ---------- */
function renderStats() {
  const ids = Object.keys(prog.mcq);
  const right = ids.filter(id => prog.mcq[id]).length;
  const dDone = Object.values(prog.desc).filter(d => d.done).length;
  $("#stats").innerHTML = `
    <div class="stat"><b>${ids.length}<small class="muted">/${TOTAL_MCQ}</small></b><span>MCQs attempted</span></div>
    <div class="stat"><b>${ids.length ? pct(right, ids.length) + "%" : "—"}</b><span>MCQ accuracy</span></div>
    <div class="stat"><b>${dDone}<small class="muted">/${TOTAL_DESC}</small></b><span>Answers self-checked</span></div>`;
}

/* ---------- HOME ---------- */
function modProgress(mid) {
  const qs = BANK[mid];
  const tried = qs.filter(q => q.id in prog.mcq).length;
  const right = qs.filter(q => prog.mcq[q.id]).length;
  const dDone = DBANK[mid].filter(d => prog.desc[d.id]?.done).length;
  return { tried, right, dDone };
}
function renderHome() {
  const resume = quiz && !quiz.finished ? (() => {
    const done = quiz.answers.filter(a => a.done).length;
    return `<div class="resume" data-m="${quiz.m}"><p><strong>Test in progress:</strong> Module ${MOD[quiz.m].num} · ${done} of ${quiz.items.length} answered.</p>
      <div class="btn-row"><button class="btn btn-primary" data-act="resume">Resume test</button><button class="btn btn-quiet" data-act="discard">Discard</button></div></div>`;
  })() : "";
  app.innerHTML = `
    ${resume}
    <section class="intro" aria-labelledby="h-home">
      <h2 id="h-home">Choose a module to practise</h2>
      <p class="muted">Each module has ${BANK.m1.length} MCQs and ${DBANK.m1.length} exam-style descriptive questions. Every test ends with the key concepts of the chapter. Pick a module, narrow it to one topic if you like, and choose MCQ or descriptive practice.</p>
    </section>
    <section class="modgrid" aria-label="Modules">
      ${MODS.map(m => {
        const p = modProgress(m.id); const best = prog.best[m.id];
        return `<article class="modcard" data-m="${m.id}">
          <div class="modcard-head"><span class="modnum" aria-hidden="true">${m.num}</span><p class="eyebrow">Module ${m.num}</p><h3>${esc(m.title)}</h3></div>
          <div class="modcard-body">
            <ul class="topics">${Object.values(m.subs).map(t => `<li>${esc(t)}</li>`).join("")}</ul>
            ${m.note ? `<p class="note">${esc(m.note)}</p>` : ""}
          </div>
          <div class="modcard-foot">
            <div class="meter"><div class="meter-row"><span>MCQs answered correctly</span><span class="mono">${p.right}/${BANK[m.id].length}</span></div>
              <div class="bar" role="progressbar" aria-label="Module ${m.num} MCQs answered correctly" aria-valuemin="0" aria-valuemax="${BANK[m.id].length}" aria-valuenow="${p.right}"><i style="width:${pct(p.right, BANK[m.id].length)}%"></i></div></div>
            <div class="meter-row meter"><span>Best test score: <b class="mono">${best != null ? best + "%" : "—"}</b></span><span>Descriptive: <b class="mono">${p.dDone}/${DBANK[m.id].length}</b></span></div>
            <button class="btn btn-primary" data-act="pick" data-id="${m.id}">Practise Module ${m.num}</button>
          </div>
        </article>`;
      }).join("")}
    </section>
    <div class="btn-row"><button class="btn btn-quiet" data-act="reset-all">Clear all saved progress</button><span id="reset-confirm"></span></div>`;
}

/* ---------- SETUP ---------- */
function filtered(bank, sub) { return sub === "all" ? bank : bank.filter(q => q.s === sub); }
function renderSetup() {
  const m = MOD[setup.m];
  const mcqN = filtered(BANK[m.id], setup.sub).length;
  const dN = filtered(DBANK[m.id], setup.sub).length;
  const counts = [10, 20, 30, 50].filter(n => n < mcqN);
  if (setup.count !== "all" && !counts.includes(+setup.count)) setup.count = "all";
  app.innerHTML = `
  <section class="panel" data-m="${m.id}" aria-labelledby="h-setup">
    <div class="panel-head">
      <p class="eyebrow">Module ${m.num} · Set up your practice</p>
      <h2 id="h-setup">${esc(m.title)}</h2>
      ${m.note ? `<p class="note">${esc(m.note)}</p>` : ""}
    </div>
    <fieldset>
      <legend>1 · Topic</legend>
      <div class="chips" role="radiogroup">
        <label class="chip"><input type="radio" name="sub" value="all" ${setup.sub === "all" ? "checked" : ""}><span>All topics <small>${BANK[m.id].length}</small></span></label>
        ${Object.entries(m.subs).map(([k, t]) => `<label class="chip"><input type="radio" name="sub" value="${k}" ${setup.sub === k ? "checked" : ""}><span>${esc(t)} <small>${BANK[m.id].filter(q => q.s === k).length}</small></span></label>`).join("")}
      </div>
    </fieldset>
    <fieldset>
      <legend>2 · Practice type</legend>
      <div class="modes">
        <label class="mode"><input type="radio" name="mode" value="mcq" ${setup.mode === "mcq" ? "checked" : ""}>
          <span class="mode-box"><strong>MCQ practice</strong><span class="muted">${mcqN} questions, one at a time, with instant feedback and explanations.</span></span></label>
        <label class="mode"><input type="radio" name="mode" value="desc" ${setup.mode === "desc" ? "checked" : ""} ${dN ? "" : "disabled"}>
          <span class="mode-box"><strong>Descriptive practice</strong><span class="muted">${dN ? `${dN} exam-style question${dN > 1 ? "s" : ""}. Write your answer, then check it against a model outline and rubric.` : "No descriptive questions for this topic. Choose ‘All topics’ to see them."}</span></span></label>
      </div>
    </fieldset>
    <fieldset ${setup.mode === "mcq" ? "" : "hidden"}>
      <legend>3 · Test options</legend>
      <div class="opts-row">
        <div class="field"><label for="count">Number of questions</label>
          <select id="count">${counts.map(n => `<option value="${n}" ${+setup.count === n ? "selected" : ""}>${n} questions</option>`).join("")}<option value="all" ${setup.count === "all" ? "selected" : ""}>All ${mcqN} questions</option></select></div>
        <label class="check"><input type="checkbox" id="shuf" ${setup.shuffle ? "checked" : ""}> Shuffle question order</label>
      </div>
    </fieldset>
    <div class="btn-row">
      <button class="btn btn-primary" data-act="start">Start ${setup.mode === "mcq" ? "MCQ test" : "descriptive practice"}</button>
      <button class="btn" data-act="home">Back to modules</button>
    </div>
  </section>`;
}

/* ---------- MCQ QUIZ ---------- */
function startQuiz(ids, m, sub) {
  quiz = { m, sub, items: ids, answers: ids.map(() => ({ c: null, done: false })), idx: 0, finished: false };
  saveQuiz(); go("quiz");
}
function startFromSetup() {
  if (setup.mode === "desc") return startDesc();
  let pool = filtered(BANK[setup.m], setup.sub);
  if (setup.shuffle) pool = shuffle(pool);
  if (setup.count !== "all") pool = pool.slice(0, +setup.count);

    if (!r.checks) { const lower = r.text.toLowerCase(); r.checks = d.pts.map(p => termsIn(p).some(x => termFound(lower, x))); }
    r.checks[+t.dataset.i] = t.checked; saveProg(); const y = window.scrollY; render(); window.scrollTo(0, y);
    app.querySelector(`input[data-act="kp"][data-i="${t.dataset.i}"]`)?.focus({ preventScroll: true });
  }
  else if (t.dataset.act === "rub") {
    descRec().rub[t.dataset.k] = +t.value; saveProg(); const y = window.scrollY; render(); window.scrollTo(0, y);
    app.querySelector(`input[name="rub-${t.dataset.k}"][value="${t.value}"]`)?.focus({ preventScroll: true });
  }
});
let saveTimer;
app.addEventListener("input", e => {
  if (e.target.id !== "ans") return;
  const r = descRec(); r.text = e.target.value;
  const w = (r.text.trim().match(/\S+/g) || []).length;
  $("#wc").textContent = `${w} word${w === 1 ? "" : "s"}`;
  const cb = $("#checkBtn"); if (cb) cb.disabled = w < 5;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveProg(); const s = $("#saved"); if (s) s.textContent = "Draft saved"; }, 500);
});
// Roving arrow keys inside the option radiogroup, plus quiz shortcuts
document.addEventListener("keydown", e => {
  if (view !== "quiz" || !quiz) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "select" || (tag === "input" && e.target.type !== "radio")) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const a = quiz.answers[quiz.idx];
  const k = e.key.toLowerCase();
  const map = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 };
  if (k in map && !a.done) { e.preventDefault(); choose(map[k]); return; }
  if (e.target.classList?.contains("opt") && (k === "arrowdown" || k === "arrowup")) {
    e.preventDefault(); if (a.done) return;
    const cur = +e.target.dataset.i; choose((cur + (k === "arrowdown" ? 1 : 3)) % 4); return;
  }
  if (k === "enter") {
    if (e.target.tagName === "BUTTON" && !e.target.classList.contains("opt")) return; // let real buttons work
    e.preventDefault();
    if (e.target.classList?.contains("opt") && !a.done && a.c !== +e.target.dataset.i) { choose(+e.target.dataset.i); return; }
    if (!a.done && a.c != null) submit();
    else if (a.done) quiz.idx < quiz.items.length - 1 ? move(1) : finish(false);
    return;
  }
  if (k === "arrowright") { e.preventDefault(); move(1); }
  else if (k === "arrowleft") { e.preventDefault(); move(-1); }
});
$(".mast-home").addEventListener("click", () => go("home"));

render();
})();

</script>
