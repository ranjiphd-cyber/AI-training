["intel","A child with a mental age of 10 and a chronological age of 8 has a ratio IQ of:","125",["80","100","118"],"Ratio IQ = (MA ÷ CA) × 100 = (10 ÷ 8) × 100 = 125."],
["intel","On modern intelligence tests, the deviation IQ is scaled so that:","The mean is 100 and the standard deviation is about 15",["The mean is 50 and the standard deviation is 10","Everyone scores 100 at every age","Scores range only from 0 to 100"],"About 68% of people score between 85 and 115, and about 95% between 70 and 130."],
["intel","Spearman proposed that intelligence consists of:","A general mental ability (g) plus specific abilities (s)",["Seven completely separate primary abilities","Eight independent intelligences","Fluid and crystallised abilities only"],"Spearman noticed that scores on different tests are correlated, so he inferred a general factor underlying them."],
["intel","Cattell and Horn distinguished between fluid intelligence and crystallised intelligence. Crystallised intelligence refers to:","Knowledge and skills gained from culture and experience, such as vocabulary",["The ability to solve novel problems quickly","Speed of neural transmission","Musical and bodily skills"],"Fluid intelligence is reasoning with novel material. Crystallised intelligence reflects accumulated knowledge."],
["intel","Howard Gardner's theory of multiple intelligences proposes that:","People have several relatively independent intelligences, such as linguistic, spatial and interpersonal",["Intelligence is a single general ability","IQ tests measure all forms of intelligence","Intelligence is fixed at birth"],"Gardner described at least eight intelligences, some of which traditional IQ tests do not measure."],
["intel","Sternberg's triarchic theory describes intelligence in terms of:","Analytic, creative and practical abilities",["Verbal, numerical and spatial factors","Id, ego and superego","Fluid, crystallised and emotional intelligence"],"Sternberg's ‘successful intelligence’ also stresses fitting into and shaping one's environment."],
["intel","Infant tests such as the Bayley Scales are generally:","Poor predictors of later IQ, though useful for screening developmental problems",["Excellent predictors of adult IQ","Measures of crystallised intelligence","Identical to the Stanford–Binet"],"Infant tests emphasise sensorimotor skills. Infant habituation speed predicts childhood IQ somewhat better."],
["intel","The Flynn effect refers to:","A rise in average IQ test scores across generations in many countries",["The decline of IQ with age","Higher IQ in first-born children","Differences between fluid and crystallised intelligence"],"Gains this rapid point to environmental causes such as better nutrition, schooling and test familiarity."],
["intel","Creativity is most closely associated with:","Divergent thinking, meaning many novel ideas from one prompt",["Convergent thinking toward one correct answer","High scores on memory tests","Speed of reflex responses"],"IQ tests mostly assess convergent thinking. Creativity tests ask for many original responses."],
["piaget","In Piaget's sensorimotor stage, a 3-month-old who repeatedly sucks her thumb because it is pleasurable is showing:","Primary circular reactions",["Secondary circular reactions","Tertiary circular reactions","Deferred imitation"],"Primary circular reactions (1–4 months) are repeated actions centred on the infant's own body."],
["piaget","A 6-month-old repeatedly shakes a rattle to hear the sound. This is a:","Secondary circular reaction",["Primary circular reaction","Tertiary circular reaction","Reflex activity"],"Secondary circular reactions (4–8 months) repeat actions that produce interesting effects on external objects."],
["piaget","A 15-month-old drops different toys from different heights to see what happens. This is a:","Tertiary circular reaction",["Secondary circular reaction","Primary circular reaction","Symbolic problem solving"],"Tertiary circular reactions (12–18 months) are active experiments that vary actions to discover new results."],
["piaget","The understanding that objects continue to exist when they cannot be seen is called:","Object permanence",["Conservation","Egocentrism","Animism"],"Piaget believed that object permanence develops gradually through the sensorimotor stage and is complete at about 18–24 months."],
["piaget","An 8–12-month-old searches for a toy where it was found before (A), even after watching it being hidden in a new place (B). This is the:","A-not-B error",["Conservation error","Imaginary audience","Overregularisation error"],"Piaget took this error as a sign that object permanence is still incomplete."],
["piaget","A toddler imitates a tantrum she saw a playmate throw the day before. Piaget called this:","Deferred imitation",["Primary circular reaction","Centration","Reversibility"],"Deferred imitation shows that the child can store mental representations. Piaget placed it around 18–24 months, though later research finds it earlier."],
["piaget","In the three-mountains task, a preschooler chooses a picture of her own view rather than the doll's view. This shows:","Egocentrism",["Animism","Conservation","Hypothetico-deductive reasoning"],"Piaget argued that preoperational children struggle to take another person's perspective."],
["piaget","A 4-year-old says that the sun is following him because it wants to see where he is going. This is:","Animism",["Seriation","Transitivity","Object permanence"],"Animism means attributing life or intentions to inanimate objects. It is typical of preoperational thought."],
["piaget","A preschooler thinks a tall, thin glass holds more juice than a short, wide one after the juice is poured. The child fails to conserve because of:","Centration and lack of reversibility",["Object permanence","Hypothetical reasoning","Deferred imitation"],"The child focuses on one dimension (height) and cannot mentally reverse the pouring."],
["piaget","Arranging sticks in order from shortest to longest is called:","Seriation",["Conservation","Animism","Assimilation"],"Seriation is a concrete operational skill. It is related to transitive inference."],
["piaget","A child masters conservation of number before conservation of weight. Piaget called this uneven development:","Horizontal décalage",["Vertical décalage","Equilibration","Scaffolding"],"Horizontal décalage means skills within the same stage appear at different ages across tasks."],
["piaget","The ability to reason systematically about hypothetical possibilities, as in the pendulum problem, appears in the:","Formal operational stage",["Concrete operational stage","Preoperational stage","Sensorimotor stage"],"Formal operations bring hypothetico-deductive and abstract reasoning, usually from about age 11–12."],
["piaget","An adolescent believes everyone at school will notice a small pimple. Elkind called this:","The imaginary audience",["The personal fable","Animism","Centration"],"The imaginary audience is a form of adolescent egocentrism: the belief that one is the focus of others' attention."],
["piaget","Baillargeon's violation-of-expectation studies challenged Piaget by suggesting that:","Infants may understand object permanence earlier than Piaget claimed",["Object permanence does not develop until age 4","Infants cannot perceive depth","Conservation appears in infancy"],"Infants looked longer at ‘impossible’ events, which suggests that they expected hidden objects to continue existing."],
["vygotsky","Adjusting the amount of help to match a child's current level of performance, and withdrawing it as competence grows, is called:","Scaffolding",["Assimilation","Habituation","Fast mapping"],"The term was introduced by Wood, Bruner and Ross. It applies Vygotsky's ZPD."],
["vygotsky","Vygotsky viewed children's private speech (talking aloud to themselves) as:","A tool for guiding their own thinking and behaviour, which later becomes inner speech",["A sign of egocentrism that disappears without purpose","Evidence of language delay","Communication aimed only at others"],"Piaget called it egocentric speech. Vygotsky saw it as self-regulatory, and children use it more on difficult tasks."],
["vygotsky","Children learn cultural skills by taking part in shared activities with more skilled partners. Rogoff called this:","Guided participation",["Discovery learning","Operant conditioning","Equilibration"],"Guided participation includes informal, everyday learning, such as helping to cook or weave alongside an adult."],
["vygotsky","According to Vygotsky, higher mental functions such as voluntary attention and logical memory develop through:","Social interaction and the use of cultural tools such as language",["Biological maturation alone","Reinforcement of reflexes","Solitary exploration only"],"Elementary functions are biological. Higher functions are shaped by culture and social interaction."],
["vygotsky","A classroom built on Vygotsky's ideas would most likely include:","Cooperative learning and teacher-guided tasks just beyond children's current independent level",["Strictly individual work with no peer help","Waiting until children are maturationally ready to learn","Rewards for repeating answers by rote"],"Vygotskian education emphasises collaboration, scaffolding and teaching within the ZPD."],
["vygotsky","Dynamic assessment, inspired by Vygotsky, differs from traditional testing because it:","Measures how much a child improves with hints and guidance",["Gives the same test twice without help","Compares only mental age and chronological age","Relies on timed multiple-choice items"],"Dynamic assessment estimates the child's ZPD, meaning their potential with support."],
["vygotsky","Reciprocal teaching, in which students and teacher take turns leading discussions about a text, is an application of:","Vygotsky's sociocultural theory",["Freud's psychosexual theory","Skinner's operant conditioning","Gesell's maturational theory"],"Students learn strategies such as questioning, summarising, clarifying and predicting with scaffolded support."],
["vygotsky","Compared with Piaget, Vygotsky placed more emphasis on:","Culture, language and social interaction as sources of cognitive growth",["Universal, invariant stages","Independent discovery without adult help","Biological maturation as the main cause of change"],"Piaget's child is a lone scientist. Vygotsky's child is a social apprentice."],
["vygotsky","A common criticism of Vygotsky's theory is that:","The zone of proximal development is vague and hard to measure precisely",["It ignores culture","It proposes rigid universal stages","It denies the role of language in thought"],"Critics also note that it underplays biological and individual factors."],
["infoproc","In the multistore model, information is held briefly before it is processed further in the:","Sensory register",["Long-term store","Executive control","Semantic memory"],"Sensory memory holds raw input for a very short time. Attended information moves into working (short-term) memory."],
["infoproc","Repeating a phone number over and over to remember it is the memory strategy called:","Rehearsal",["Organisation","Elaboration","Retrieval"],"Rehearsal appears in early school years. Organisation and elaboration usually develop later."],
["infoproc","A child can be taught a memory strategy but does not use it spontaneously. This is called a:","Production deficiency",["Utilisation deficiency","Mediation deficiency","Retrieval failure"],"In a utilisation deficiency, the child uses the strategy but it does not yet improve recall."],
["infoproc","Knowledge about one's own memory and how to improve it is called:","Metamemory",["Working memory","Semantic memory","Episodic buffer"],"Metamemory is part of metacognition, and it grows substantially during middle childhood."],
["infoproc","Adults' general inability to recall events from their first two or three years of life is called:","Infantile amnesia",["Retrograde amnesia","Production deficiency","Proactive interference"],"Explanations include immature brain structures, limited language and the lack of a stable sense of self."],
["infoproc","Siegler's overlapping waves model proposes that children:","Use several problem-solving strategies at once, gradually favouring the more effective ones",["Use only one strategy at each stage","Never change strategies","Learn strategies only through direct reinforcement"],"Strategy development is variable and adaptive rather than a series of clean stage shifts."],
["infoproc","Preschoolers' eyewitness memory is especially vulnerable to:","Leading questions and suggestion from adults",["Too much rehearsal","Strong metamemory","Excessive organisation"],"Young children can give accurate reports, but repeated suggestive interviewing can distort what they recall."],
["infoproc","General knowledge of the sequence of events in familiar situations, such as going to a restaurant, is called a:","Script",["Schema of conservation","Phoneme","Holophrase"],"Even preschoolers form scripts, and these help them organise and remember routine events."],
["language","The rules governing how words are combined into sentences are called:","Syntax",["Phonology","Semantics","Pragmatics"],"Syntax is grammatical structure. Semantics is meaning, and pragmatics is the social use of language."],
["language","Knowing how to adjust speech to the listener, for example speaking simply to a toddler, reflects:","Pragmatics",["Morphology","Phonology","Syntax"],"Pragmatics covers the social rules of language use, such as taking turns and being polite."],
["language","Noam Chomsky proposed that children acquire language with the help of an innate:","Language acquisition device (LAD)",["Zone of proximal development","Primary circular reaction","Reinforcement schedule"],"Nativists argue that children are biologically prepared to detect universal grammar."],
["language","Which sequence of early language milestones is correct?","Cooing, babbling, one-word holophrases, telegraphic speech",["Babbling, cooing, telegraphic speech, holophrases","Holophrases, cooing, babbling, telegraphic speech","Cooing, holophrases, babbling, telegraphic speech"],"Cooing starts at about 2 months, babbling at about 6 months, first words at about 12 months, and two-word telegraphic speech at about 18–24 months."],
["language","A toddler says ‘Daddy go car.’ This is an example of:","Telegraphic speech",["A holophrase","Overregularisation","Babbling"],"Telegraphic speech keeps the content words and leaves out grammatical words such as ‘is’, ‘in’ or ‘the’."],
["language","A child calls every four-legged animal ‘doggie’. This is:","Overextension",["Underextension","Overregularisation","Fast mapping"],"Overextension is using a word too broadly. Underextension is using it too narrowly, for example ‘doggie’ only for the family dog."],
["language","A 4-year-old says ‘I goed to the park’ and ‘two foots’. This is:","Overregularisation of grammatical rules",["Telegraphic speech","Underextension","A pragmatic error"],"The child is applying the regular rules for the past tense (-ed) and plurals (-s) to irregular words. This shows rule learning, not simple imitation."],
["language","Children's ability to learn a new word after only one or two exposures is called:","Fast mapping",["Babbling drift","Expansion","Habituation"],"Fast mapping helps explain the vocabulary spurt in the preschool years."],
["language","The interactionist view of language development holds that:","Biological readiness and supportive social experience both contribute to language",["Language is learned only by reinforcement","Language unfolds entirely from an innate device without input","Children learn language only by imitating adults"],"Child-directed speech, expansions and recasts support an innate capacity for learning language."]
];

// Module IV — Social and Personality Development
MCQ.m4 = [
["emotion","Which of the following is a primary (basic) emotion present in the first months of life?","Interest",["Embarrassment","Guilt","Pride"],"Primary emotions such as interest, joy, distress, anger, surprise and fear appear early. Self-conscious emotions come later."],
["emotion","Self-conscious emotions such as shame, guilt and pride emerge at around 18–24 months because they require:","Self-recognition and an awareness of standards for behaviour",["Object permanence only","Formal operational thought","The ability to walk"],"A child must first see herself as a separate person, and later understand rules, before she can feel embarrassed or proud."],
["emotion","The social smile, directed at people, usually first appears at about:","6–10 weeks",["1 day","6 months","12 months"],"Early reflexive smiles occur during sleep. Smiles directed at people emerge around 6–10 weeks."],
["emotion","An 8-month-old cries and clings to his mother when an unfamiliar adult approaches. This is:","Stranger anxiety",["Separation anxiety only","Social referencing","Reactive aggression"],"Stranger anxiety commonly appears at around 8–10 months, alongside the formation of specific attachments."],
["emotion","A 12-month-old looks at her mother's face before deciding whether to approach a new toy. This is:","Social referencing",["Stranger anxiety","Imprinting","Deferred imitation"],"In social referencing, infants use a caregiver's emotional expressions to judge uncertain situations."],
["emotion","A child smiles and says ‘thank you’ for a disappointing gift. She is following:","Emotional display rules",["Primary emotions","Emotional contagion","Empathic distress"],"Display rules are cultural norms about which emotions to show in which situations. Children learn to apply them gradually."],
["emotion","The ability to manage and adjust one's emotional arousal to an appropriate level is called:","Emotion regulation",["Social referencing","Temperament","Imprinting"],"Emotion regulation starts with infant strategies such as looking away and later moves to cognitive strategies such as reinterpreting a situation."],
["emotion","Parents who talk with children about feelings and help them understand and cope with emotions tend to have children who:","Show better emotional understanding and social competence",["Become more anxious","Show more aggressive behaviour","Develop slower language"],"Talking about emotions within the family supports emotional understanding and good peer relationships."],
["emotion","Emotional competence includes:","Expressing emotions appropriately, understanding others' emotions, and regulating one's own",["Hiding all emotions at all times","Only recognising facial expressions","Avoiding emotional situations"],"These skills together predict positive peer relations and adjustment."],
["temperament","Temperament is best defined as:","A person's characteristic, biologically based tendencies to respond emotionally and behaviourally to events",["Moral values learned from parents","Intelligence measured at birth","The quality of attachment to a caregiver"],"Temperament is the early-appearing foundation of later personality."],
["temperament","In Thomas and Chess's study, about 40% of infants were even-tempered, regular in habits and adapted easily. They were classified as:","Easy children",["Difficult children","Slow-to-warm-up children","Inhibited children"],"About 10% were difficult and 15% slow-to-warm-up, and the remaining 35% did not fit any category."],
["temperament","An infant who is inactive, somewhat moody and slow to adapt to new situations would be classified as:","Slow-to-warm-up",["Easy","Difficult","Securely attached"],"Slow-to-warm-up children adapt gradually when they are given time and patience."],
["temperament","The idea that development is best when the child's temperament matches the demands of the environment is called:","Goodness-of-fit",["Reciprocal determinism","Equilibration","Canalization"],"For example, a difficult child with patient, consistent parents often becomes well adjusted."],
["temperament","Jerome Kagan described children who are shy, cautious and wary of novelty as showing:","Behavioural inhibition",["Disorganised attachment","Learned helplessness","Hostile attribution bias"],"Inhibited children show greater physiological arousal to novelty. The trait is moderately stable."],
["temperament","Mary Rothbart's model of temperament includes the dimension of effortful control, which refers to:","The ability to focus attention and inhibit impulses",["The intensity of positive emotion","The tendency to cry when frustrated","Sensitivity to pain"],"Effortful control is linked to self-regulation and later social competence."],
["temperament","Twin studies indicate that temperament is:","Moderately heritable, and also influenced by the environment",["Entirely determined by genes","Entirely shaped by parenting","Unrelated to biology"],"Identical twins are more alike in temperament than fraternal twins, but shared and nonshared environments also matter."],
["attachment","In Schaffer and Emerson's phases of attachment, infants first show protest at separation from one particular person at about:","7–9 months, the phase of specific attachment",["0–6 weeks, the asocial phase","6 weeks to 6 months, the phase of indiscriminate attachment","2 years, the phase of multiple attachments"],"After forming a first specific attachment, most infants go on to form multiple attachments."],
["attachment","Harlow's studies of infant monkeys raised with wire and cloth surrogate mothers showed that:","Contact comfort matters more than feeding for attachment",["Feeding is the main basis of attachment","Monkeys prefer the wire mother that provides milk","Attachment is learned only through reinforcement"],"The monkeys clung to the soft cloth mother, especially when frightened, even when the wire mother fed them."],
["attachment","Bowlby proposed that through early experiences with caregivers, children form mental representations of themselves and others. He called these:","Internal working models",["Schemes","Scripts","Display rules"],"Working models shape expectations about relationships in later life."],
["attachment","In Ainsworth's Strange Situation, an infant who is upset when the mother leaves and is quickly comforted when she returns is classified as:","Securely attached",["Resistant","Avoidant","Disorganised"],"Securely attached infants use the mother as a secure base for exploration."],
["attachment","An infant who shows little distress at separation and ignores or turns away from the mother at reunion is classified as:","Avoidant",["Secure","Resistant","Disorganised"],"Avoidant attachment has been linked with caregivers who are impatient, unresponsive or rejecting."],
["attachment","An infant who stays close to the mother, is very distressed when she leaves, and both seeks and resists contact when she returns is classified as:","Resistant (ambivalent)",["Avoidant","Secure","Disorganised"],"Resistant attachment has been linked with inconsistent caregiving."],
["attachment","Dazed, confused or contradictory behaviour at reunion in the Strange Situation is typical of:","Disorganised/disoriented attachment",["Secure attachment","Avoidant attachment","Resistant attachment"],"Main and Solomon identified this pattern. It is especially common among maltreated infants."],
["attachment","Ainsworth's caregiving hypothesis proposes that secure attachment is fostered mainly by:","Sensitive, responsive caregiving",["Strict feeding schedules","Constant physical contact without responsiveness","The infant's genes alone"],"Parental sensitivity is a consistent predictor of security, although infant characteristics also contribute."],
["attachment","Cross-cultural Strange Situation studies found higher rates of resistant attachment in Japan. One explanation is that:","Japanese infants rarely experience separations, so the procedure is unusually stressful for them",["Japanese parents are generally insensitive","Attachment cannot be measured outside the USA","Japanese infants have difficult temperaments"],"Cultural childrearing practices affect how infants respond to the Strange Situation, so classifications must be interpreted with care."],
["attachment","Research on children adopted from deprived institutions suggests that:","Early, prolonged deprivation can have lasting effects, but sensitive later care brings substantial recovery",["Deprivation has no effects at all","Children cannot form any attachment after infancy","Effects disappear completely in every case"],"Children adopted early typically do best. Those deprived for longer often show persisting difficulties."],
["self","In the rouge (mirror) test, toddlers who touch the mark on their own nose are showing:","Self-recognition",["Object permanence","Conservation","Theory of mind"],"Self-recognition typically emerges between 18 and 24 months."],
["self","When asked to describe themselves, preschoolers typically mention:","Concrete characteristics such as appearance, possessions and activities",["Abstract values and beliefs","Psychological traits compared across situations","Integrated philosophies of life"],"Self-descriptions move from concrete to psychological in middle childhood and become abstract in adolescence."],
["self","A child who understands that others can hold false beliefs, as in the Sally–Anne task, has developed a:","Theory of mind",["Gender schema","Secure base","Script"],"Most children pass false-belief tasks at around age 4."],
["self","An adolescent has explored several career and value options and made firm commitments. In Marcia's terms, this is:","Identity achievement",["Identity foreclosure","Identity moratorium","Identity diffusion"],"Achievement involves both exploration and commitment. Foreclosure involves commitment without exploration."],
["self","An adolescent who has committed to the career his parents chose, without exploring alternatives, is in:","Identity foreclosure",["Identity achievement","Identity moratorium","Identity diffusion"],"Foreclosed individuals adopt identities given by others without questioning them."],
["self","A student who believes her abilities can grow with effort, and so persists after failure, has what Dweck calls:","An incremental (growth) theory of ability",["An entity theory of ability","Learned helplessness","Identity diffusion"],"Entity theorists see ability as fixed and are more prone to helplessness after failure."],
["self","Selman's research on role-taking describes children's growing ability to:","Understand others' perspectives and coordinate them with their own",["Recognise themselves in a mirror","Conserve number and volume","Classify objects hierarchically"],"Role-taking moves from egocentric views to mutual and societal perspective-taking."],
["self","In middle childhood, social comparison becomes important for self-esteem because children:","Begin to judge their abilities against those of their peers",["Lose interest in peers","Base self-worth only on parents' praise","Stop evaluating themselves"],"Children's self-evaluations become more realistic, and sometimes lower, as they compare themselves with classmates."],
["gender","According to Kohlberg's cognitive-developmental theory of gender, which is the correct sequence?","Gender identity, gender stability, gender consistency",["Gender consistency, gender identity, gender stability","Gender stability, gender consistency, gender identity","Gender identity, gender consistency, gender stability"],"Children first label their gender, then understand that it is stable over time, and finally that it stays the same across situations."],
["gender","Martin and Halverson's gender schema theory proposes that children:","Organise information into ‘for boys’ and ‘for girls’ categories and attend to what fits their own gender",["Learn gender roles only through reinforcement","Develop gender identity by resolving the Oedipus complex","Have no gender concepts until adolescence"],"Once children have a basic gender identity, they actively seek information that fits their own-sex schema."],
["gender","Which sex difference is best supported by research?","Males on average are more physically aggressive than females",["Females have higher general intelligence","Males are more sociable","Females are more physically active from birth"],"Maccoby and Jacklin also noted verbal advantages for girls and visual–spatial advantages for boys. These are average differences with much overlap."],
["gender","A person who shows high levels of both masculine and feminine traits is described by Bem as:","Androgynous",["Undifferentiated","Gender-typed","Gender-inconsistent"],"Androgyny has been associated with flexibility and, in some studies, higher self-esteem."],
["gender","Social learning theory explains gender typing mainly through:","Differential reinforcement and observational learning",["Innate gender schemas","Resolution of psychosexual conflicts","Hormones alone"],"Children are rewarded for gender-appropriate behaviour and imitate same-sex models."],
["gender","The strong preference of children in early and middle childhood to play with same-sex peers is called:","Gender segregation",["Androgyny","Gender consistency","Identity foreclosure"],"Gender segregation peaks in middle childhood and supports the development of different interaction styles."],
["gender","Money and Ehrhardt's biosocial theory emphasises that gender development depends on:","Biological factors interacting with social labelling and how the child is treated",["Biology alone","Social learning alone","Unconscious identification only"],"Prenatal hormones and social labelling after birth both contribute to gender development."],
["moral","A child pushes another child off a swing in order to get a turn. This is:","Instrumental aggression",["Hostile aggression","Relational aggression","Altruism"],"Instrumental aggression is a means to an end, here a toy or turn. Hostile aggression aims to hurt."],
["moral","Dodge found that reactive-aggressive children tend to:","Overattribute hostile intent to others in ambiguous situations",["Accurately read others' intentions","Avoid all conflict","Have a strong theory of mind"],"This hostile attributional bias leads them to retaliate even when harm was accidental."],
["moral","Spreading rumours or excluding a peer to damage their friendships is called:","Relational aggression",["Instrumental aggression","Physical aggression","Prosocial behaviour"],"Relational aggression is more common among girls than physical aggression is."],
["moral","Patterson described families in which members try to control one another through negative and aggressive tactics. He called these:","Coercive home environments",["Authoritative homes","Androgynous homes","Inductive homes"],"Coercive cycles reinforce aggression in children and parents alike."],
["moral","Helping or comforting someone without expecting a reward is called:","Altruism",["Instrumental aggression","Conformity","Social referencing"],"Altruism is a prosocial behaviour often motivated by empathy."],
["moral","According to Piaget, a 6-year-old who believes rules are fixed and that bad deeds will always be punished is in the stage of:","Heteronomous morality",["Autonomous morality","Postconventional morality","Premoral period"],"Heteronomous children believe in immanent justice and judge acts by their consequences rather than intentions."],
["moral","Explaining to a child how their behaviour has hurt someone else is the discipline technique Hoffman called:","Induction",["Power assertion","Love withdrawal","Time-out"],"Induction promotes empathy and moral internalisation better than power assertion or love withdrawal."],
["moral","Turiel showed that even young children distinguish between:","Moral rules, which protect welfare and rights, and social-conventional rules, which are arbitrary customs",["Primary and secondary emotions","Assimilation and accommodation","Secure and insecure attachment"],"Children judge hitting as wrong even if no rule forbids it, but they see wearing pyjamas to school as wrong only because of convention."],
["moral","Eisenberg found that young children's prosocial moral reasoning is often:","Hedonistic, focusing on personal consequences",["Based on universal ethical principles","Focused on social contracts","Based on empathy from the start"],"With age, children move toward needs-oriented, approval-oriented and then internalised, empathic reasoning."]
];

// Module V — The Context of Development (standard developmental psychology knowledge)
MCQ.m5 = [
["family","Viewing the family as a social system means recognising that:","Members influence one another both directly and indirectly, and the family changes over time",["Only parents influence children","Each relationship in the family is independent of the others","Families do not change once children are born"],"For example, a father's support for the mother can indirectly improve her parenting. That is an indirect effect within the system."],
["family","Baumrind's authoritative parents are:","Warm and responsive, while setting clear limits and explaining their rules",["Strict and demanding, with little warmth","Warm but making few demands","Low in both warmth and demands"],"Authoritative parenting is consistently linked to the most positive outcomes, such as competence, self-control and achievement."],
["family","Parents who demand obedience, use power-assertive discipline and rarely explain their rules show which style?","Authoritarian",["Authoritative","Permissive","Uninvolved"],"Authoritarian parenting is high in demands and low in responsiveness. It is linked to anxiety, low self-esteem or hostility in children."],
["family","Parents who are accepting but make few demands and seldom control their children's behaviour show which style?","Permissive",["Authoritarian","Authoritative","Uninvolved"],"Children of permissive parents are often impulsive and less self-controlled, and they may do less well at school."],
["family","Which parenting style is generally associated with the poorest outcomes for children?","Uninvolved (neglectful)",["Authoritative","Permissive","Authoritarian"],"Low warmth combined with low demands is linked to difficulties in attachment, school and behaviour, and to delinquency."],
["family","Maccoby and Martin described parenting styles using two dimensions:","Acceptance/responsiveness and demandingness/control",["Strictness and income","Discipline and education level","Love and religion"],"Crossing these two dimensions produces the four parenting styles."],
["family","Behavioural control (monitoring and limit-setting) differs from psychological control in that psychological control:","Manipulates the child's feelings, for example through guilt or love withdrawal",["Sets clear rules about behaviour","Involves warm encouragement","Promotes autonomy"],"Psychological control is linked to anxiety and depression. Reasonable behavioural control is linked to positive adjustment."],
["family","The idea that children's characteristics also shape how parents treat them is known as:","Bidirectional (reciprocal) influence",["Unidirectional parental effect","The secular trend","Canalization"],"For example, a difficult, impulsive child may elicit more controlling parenting, which in turn affects the child."],
["family","Compared with higher-SES parents, economically stressed lower-SES parents are, on average, more likely to:","Emphasise obedience and use power-assertive discipline",["Use more reasoning and explanations","Be uniformly more permissive","Show no differences in parenting"],"Economic stress can strain parents' well-being and parenting. Strong social support reduces these effects."],
["family","The birth of a sibling often leads the first-born child to:","Show some distress or attention-seeking, which usually eases with parental support",["Become permanently less attached to parents","Show no reaction at all","Immediately become a full caregiver"],"Parents who keep the first-born involved and continue giving them attention help the child adjust."],
["family","Research on children of divorce suggests that:","Most children show distress during an initial crisis period, and many adjust well within about two years",["All children suffer permanent harm","Divorce has no effects on children","Conflict between parents does not matter"],"Outcomes depend heavily on parental conflict, economic stress and the quality of parenting after the divorce."],
["family","After divorce, children generally adjust better when:","Parents keep conflict low and maintain warm, consistent parenting",["Contact with the non-residential parent stops","Children take sides in disputes","Discipline becomes very lax"],"Ongoing conflict between parents is one of the strongest predictors of poor adjustment."],
["family","A family formed by a parent, a step-parent and children from earlier relationships is called a:","Blended (reconstituted) family",["Extended family","Nuclear family","Single-parent family"],"Adjusting to a blended family takes time, and it is often harder for adolescents."],

MCQ.m1.push(
["intro","Watching children on a school playground without interfering, to record how often they share, is an example of:","Naturalistic observation",["Structured observation","A laboratory experiment","A self-report survey"],"Naturalistic observation records behaviour in everyday settings. It shows real behaviour, but the researcher cannot control what happens."],
["intro","In structured observation, the researcher:","Sets up a laboratory situation designed to bring out the behaviour of interest",["Watches children only in their homes","Asks children to fill in questionnaires","Studies a single child for many years"],"Structured observation creates the same situation for every child, which is useful for behaviour that rarely occurs naturally."],
["intro","A key limitation of interviews and questionnaires with young children is that:","Young children may not understand the questions or may give socially desirable answers",["They cannot be used with adolescents","They always take years to complete","They require brain-imaging equipment"],"Self-report depends on children's verbal ability and their honesty, both of which are limited in early childhood."],
["intro","Piaget's clinical method involved:","Flexible questioning that followed up each child's answers",["Identical standardised questions for every child","Measuring heart rate and brain waves","Random assignment to experimental groups"],"The clinical method gives rich information, but because each interview differs, children's answers are hard to compare."],
["intro","A detailed study of one child, drawing on interviews, observations and records, is a:","Case study",["Cross-sectional study","Correlational study","Field experiment"],"Case studies give depth, but their findings may not generalise to other children."],
["intro","Researchers measure infants' heart rate and brain activity to study attention. These are:","Psychophysiological methods",["Self-report methods","Clinical interviews","Ethnographic methods"],"Psychophysiological measures are valuable with infants, who cannot answer questions."],
["intro","A test that gives similar scores when the same child is retested a few days later is said to be:","Reliable",["Valid","Biased","Correlational"],"Reliability means consistency. Validity means the test measures what it claims to measure."],
["intro","Which is an essential ethical safeguard in research with children?","Informed consent from parents, and the child's right to stop taking part",["Hiding the study's purpose from parents in every case","Paying children to stay in the study","Allowing harm if the findings are important"],"Ethical codes require informed consent, protection from harm, confidentiality and the freedom to withdraw."],
["intro","Observing the same children intensively over a short period while a new skill is emerging is a:","Microgenetic design",["Cross-sectional design","Case study","Cross-cultural design"],"Microgenetic studies capture change as it happens, for example how children discover a new problem-solving strategy."],
["psycho","Freud's oral stage centres on pleasure from:","Sucking, chewing and feeding",["Toilet training","Genital stimulation","Peer relationships"],"In the oral stage (0–1 year), the mouth is the main source of pleasure, and weaning is the key conflict."],
["psycho","In Freud's anal stage, the main conflict involves:","Toilet training",["Weaning","The Oedipus complex","Forming adult sexual relationships"],"Harsh or overly lenient toilet training was thought to leave lasting traits, such as excessive orderliness or messiness."],
["psycho","Freud's latency stage (about 6–11 years) is characterised by:","Repressed sexual urges, with energy directed into schoolwork and same-sex friendships",["Intense conflict with parents over toileting","The start of mature sexual relationships","Pleasure through feeding"],"During latency, the superego develops further and children focus on learning skills."],
["psycho","Freud's genital stage begins at:","Puberty",["Birth","Age 3","Age 6"],"Sexual urges reawaken at puberty and are directed toward mature relationships."],
["psycho","According to Freud, the ego uses defence mechanisms, such as repression, to:","Protect itself from anxiety",["Increase the id's demands","Strengthen reflexes","Store memories permanently"],"Defence mechanisms distort or deny reality to reduce anxiety caused by conflicts between the id, the superego and reality."],
["psycho","Freud built his theory mainly from:","Free association and dream analysis with adult patients",["Experiments with young children","Observations of animals","Large-scale surveys"],"Because his evidence came from adults recalling their childhoods, critics question how far it applies to development in general."],
["psycho","A 2-year-old insists, ‘Me do it!’ when dressing. In Erikson's terms, she is working on:","Autonomy versus shame and doubt",["Trust versus mistrust","Initiative versus guilt","Industry versus inferiority"],"Toddlers (1–3 years) need chances to make choices. Overly harsh control can produce shame and doubt."],
["psycho","A 5-year-old eagerly plans games and takes on new tasks, but feels bad when scolded for overstepping. This is Erikson's crisis of:","Initiative versus guilt",["Autonomy versus shame and doubt","Industry versus inferiority","Identity versus role confusion"],"Preschoolers (3–6 years) develop a sense of purpose. Too much criticism can create guilt."],
["psycho","Erikson's final psychosocial stage, in late adulthood, is:","Integrity versus despair",["Generativity versus stagnation","Intimacy versus isolation","Identity versus role confusion"],"Older adults look back on their lives with either a sense of fulfilment (integrity) or regret (despair)."],
["psycho","A lasting contribution of psychoanalytic theory to developmental psychology is its emphasis on:","The importance of early relationships and unconscious motives",["Precise laboratory measurement","Reinforcement schedules","Information-processing capacity"],"Psychoanalytic ideas shaped later research on attachment and on early parent–child relationships."],
["learning","Mary Cover Jones removed a child's fear of rabbits by pairing the rabbit with something pleasant. This technique is:","Counterconditioning",["Negative reinforcement","Observational learning","Imprinting"],"Counterconditioning replaces a fear response with a pleasant one. It is the basis of later therapies for phobias."],
["learning","Little Albert came to fear other white, furry objects, not only the rat. This is:","Stimulus generalisation",["Extinction","Shaping","Accommodation"],"Stimulus generalisation means that a conditioned response spreads to stimuli similar to the conditioned stimulus."],
["learning","Sending a misbehaving child to a quiet corner, away from toys and attention, is a form of:","Punishment by removing access to reinforcement (time-out)",["Positive reinforcement","Negative reinforcement","Classical conditioning"],"Time-out reduces behaviour by temporarily removing the child from rewarding activities."],
["learning","Rewarding successive approximations of a desired behaviour, as when teaching a child to write letters step by step, is called:","Shaping",["Generalisation","Extinction","Modelling"],"Shaping builds complex behaviours gradually by reinforcing closer and closer approximations."],
["learning","Behaviour that is reinforced only some of the time (partial reinforcement) tends to be:","More resistant to extinction",["Learned faster but forgotten immediately","Impossible to extinguish","Weaker than behaviour that is never reinforced"],"This is why giving in to a tantrum occasionally can make tantrums very persistent."],
["learning","Parents consistently ignore a child's attention-seeking whining, and the whining gradually stops. This illustrates:","Extinction",["Positive punishment","Negative reinforcement","Stimulus generalisation"],"Extinction is the weakening of a behaviour when it is no longer reinforced."],
["learning","A child is more likely to imitate a model she has seen being rewarded. Bandura called this:","Vicarious reinforcement",["Negative reinforcement","Counterconditioning","Self-efficacy"],"Observed consequences to the model affect whether the learner performs the behaviour."],
["learning","According to Bandura, observational learning requires:","Attention, retention, reproduction and motivation",["Assimilation, accommodation, organisation and equilibration","Id, ego, superego and conscience","Sensation, perception, imitation and maturation"],"A learner must notice the model, remember the behaviour, be able to perform it, and have a reason to do so."],
["learning","John Locke's idea that the infant's mind is a tabula rasa (blank slate) is a philosophical forerunner of:","Learning (behaviourist) theories",["Ethological theory","Psychoanalytic theory","Nativist theories of language"],"Locke emphasised experience and environment, as Watson and Skinner later did."],
["cognitive","Piaget's two basic, lifelong intellectual functions are:","Organisation and adaptation",["Assimilation and reinforcement","Maturation and imprinting","Rehearsal and elaboration"],"Organisation combines schemes into coherent systems. Adaptation (assimilation plus accommodation) adjusts schemes to the environment."],
["cognitive","In Piaget's theory, a mismatch between a child's schemes and new information creates disequilibrium, which motivates:","Equilibration, a search for a better balance between thought and experience",["Repression of the new information","Imprinting","Extinction of all schemes"],"Equilibration drives children to accommodate, which produces more advanced understanding."],
["cognitive","Piaget and Vygotsky differed on language and thought in that:","Piaget saw thought as preceding language, while Vygotsky saw language as shaping thought",["Both believed language has no role in thinking","Piaget saw language as the main source of thought","Vygotsky believed thought develops completely without language"],"For Vygotsky, language is the most important cultural tool for thinking."],

["cognitive","In information-processing theory, the processes that plan, monitor and coordinate thinking are called:","Executive control processes",["Sensory registers","Reflexes","Psychosexual stages"],"Executive control, or metacognition, improves markedly during childhood and adolescence."],
["cognitive","A common criticism of the information-processing approach is that:","The computer analogy neglects creativity, emotion and social context",["It cannot be tested experimentally","It is a stage theory with rigid ages","It ignores memory"],"Real minds are influenced by motivation, culture and emotion in ways that computers are not."],
["cognitive","Piaget claimed that his cognitive stages:","Occur in an invariant sequence, although the age of reaching each may vary",["Can occur in any order","Are reached at exactly the same age by every child","Appear only in Western cultures"],"No stage can be skipped, because each builds on the one before."],
["cognitive","Information-processing theorists explain faster thinking in older children partly by:","Brain maturation, such as myelination, and practice that makes processes automatic",["Moving to the formal operational stage","Resolving psychosexual conflicts","Imprinting"],"Gains in processing speed free up working-memory capacity for more complex thinking."],
["ethology","The theory that most influenced ethology is:","Darwin's theory of evolution by natural selection",["Freud's psychosexual theory","Skinner's operant conditioning","Piaget's constructivism"],"Ethologists ask how behaviours helped species survive and reproduce."],
["ethology","Ethologists study behaviour mainly by:","Observing members of a species in their natural environments",["Questioning adults about their childhood","Testing IQ","Using only computer simulations"],"Natural observation shows the adaptive functions of behaviour."],
["ethology","An innate, species-typical sequence of behaviour triggered by a specific stimulus is a:","Fixed action pattern",["Conditioned response","Scheme","Script"],"In some birds, for example, a red spot on the parent's beak triggers pecking in the chicks."],
["ethology","Lorenz suggested that infants' ‘baby-faced’ features, such as large eyes and round cheeks, are adaptive because they:","Elicit affection and caregiving from adults",["Help infants see better","Reduce crying","Speed up language learning"],"Babyish features are thought to evoke nurturing responses, which promotes infant survival."],
["ethology","Evolutionary developmental psychology suggests that the long period of human immaturity:","Is adaptive, because it gives time to learn the complex skills human societies require",["Has no purpose","Is a sign of weak genes","Prevents learning"],"An extended childhood allows the brain to be shaped by social and cultural experience."],
["ethology","Imprinting in birds is limited to a critical period, which means that:","It occurs only during a short early window and not afterward",["It can happen at any age","It depends entirely on reinforcement","It happens only in humans"],"Lorenz's goslings imprinted only within a short time after hatching."],
["ethology","An important contribution of ethology to child development is that it:","Inspired Bowlby's theory of attachment and the study of behaviour in natural settings",["Proved that learning plays no role","Replaced all other theories","Showed that infants are blank slates"],"Ethology reminds us that some behaviours have biological roots and adaptive value."],
["kohlberg","‘Heinz should steal the drug because his wife can do things for him later.’ This reasoning reflects Kohlberg's:","Stage 2: naive hedonism (instrumental exchange)",["Stage 1: punishment and obedience","Stage 3: good boy/good girl","Stage 5: social contract"],"Stage 2 reasoning focuses on self-interest and fair exchange: ‘you scratch my back, I'll scratch yours’."],
["kohlberg","‘Heinz should steal it; a good husband would, and people would think he was heartless if he didn't.’ This reflects Kohlberg's:","Stage 3: good boy/good girl morality",["Stage 2: naive hedonism","Stage 4: social-order-maintaining morality","Stage 6: universal ethical principles"],"Stage 3 reasoning centres on approval, loyalty and being seen as a good person."],

["kohlberg","Kohlberg argued that advances in moral reasoning require, among other things:","Cognitive development and role-taking (perspective-taking) skills",["Only strict punishment by parents","Reaching puberty","Imprinting on a moral model"],"Cognitive growth is necessary but not sufficient. Exposure to higher-level reasoning also stimulates moral growth."],

["heredity","Compared with amniocentesis, chorionic villus sampling (CVS) has the advantage that it:","Can be performed earlier in pregnancy",["Carries no risk at all","Can detect every possible disorder","Is done only after birth"],"CVS can be done in the first trimester. Amniocentesis is usually done from about 15–16 weeks."],

["heredity","Musical parents pass on genes for musical talent and also fill the home with music. Scarr and McCartney called this:","A passive gene–environment correlation",["An active gene–environment correlation","An evocative gene–environment correlation","Nonshared environment"],"In passive correlations, parents provide both the genes and an environment that fits those genes. This is most influential in early childhood."],
["heredity","A cheerful baby draws more smiles and attention from adults than a fussy baby does. This is:","An evocative gene–environment correlation",["A passive gene–environment correlation","Niche-picking","Canalization"],"Children's inherited traits evoke particular responses from others, and these responses reinforce the traits."],

["prenatal","The age of viability, the point at which a fetus has some chance of surviving if born early, is roughly:","22–28 weeks",["8–10 weeks","14–16 weeks","38–40 weeks"],"With intensive care, survival becomes possible from about 22–28 weeks, as the lungs and nervous system mature."],

["infancy","Compared with adults, newborns spend:","Much more of their sleep in REM (active) sleep, about half",["Less time sleeping","No time in REM sleep","Most of the day fully alert"],"Newborns sleep 16–18 hours a day, and about 50% of that sleep is REM, compared with about 20% in adults."],

MCQ.m3.push(
["intel","Thurstone argued that intelligence consists of:","Seven primary mental abilities, such as verbal meaning, spatial ability and reasoning",["One general factor only","Three components: analytic, creative and practical","Fluid and crystallised abilities"],"Thurstone's abilities were later found to be correlated, which supports the idea of some general factor as well."],
["intel","Guilford's structure-of-intellect model describes intelligence in terms of:","Combinations of contents, operations and products",["A single g factor","Eight independent intelligences","Mental age divided by chronological age"],"Guilford proposed many distinct abilities. He also introduced the idea of divergent thinking."],

["intel","The HOME inventory is used to assess:","The quality of stimulation and support in a child's home environment",["Children's reflexes","Teachers' expectations","Adolescent identity status"],"Higher HOME scores, for example parental involvement and play materials, are linked to higher IQ."],

["intel","Terman's long-term study of intellectually gifted children found that, as adults, they were generally:","Healthy, well-adjusted and successful",["Socially isolated and unhappy","Physically weak","Prone to serious mental illness"],"The study challenged the stereotype of the gifted child as socially odd."],

["piaget","In the first sensorimotor substage (birth to 1 month), infants' behaviour consists mainly of:","Reflex activity",["Tertiary circular reactions","Symbolic problem solving","Deferred imitation"],"Infants exercise and slightly modify inborn reflexes such as sucking."],

["piaget","At 18–24 months, a toddler figures out how to get a toy without trial and error, by thinking first. Piaget called this:","Inventing new means by mental combinations",["Secondary circular reactions","Reflex activity","Horizontal décalage"],"This final sensorimotor substage marks the beginning of symbolic thought."],

["piaget","An adolescent believes that nobody has ever loved as deeply as she does and that bad things won't happen to her. Elkind called this:","The personal fable",["The imaginary audience","Animism","Transductive reasoning"],"The personal fable is a belief in one's own uniqueness and invulnerability. It can contribute to risk-taking."],

["vygotsky","According to Vygotsky, basic abilities such as attention, sensation and simple memory that infants are born with are:","Elementary mental functions",["Higher mental functions","Cultural tools","Formal operations"],"Culture transforms these elementary functions into higher mental functions."],

["vygotsky","Children learn to count using fingers, to tell time with clocks, and to calculate on an abacus. Vygotsky would see these as examples of:","Cultural tools that shape thinking",["Primary circular reactions","Reflexes","Defence mechanisms"],"Different cultures provide different tools, and so they produce different patterns of thinking."],

["infoproc","Inhibition, working memory and cognitive flexibility together are known as:","Executive functions",["Primary circular reactions","Reflexes","Display rules"],"Executive functions predict school readiness and academic achievement."],

["language","The word ‘dogs’ contains two:","Morphemes",["Phonemes only","Holophrases","Pragmatic rules"],"‘Dog’ and the plural ‘-s’ are both meaningful units, or morphemes."],

["psycho",10,"Explain Freud's psychosexual theory of development and critically evaluate its contribution to developmental psychology.",["Structure of personality: *id* (pleasure principle), *ego* (reality principle), *superego*","Stages: *oral*, *anal*, *phallic*, *latency*, *genital*","*Oedipus* / Electra conflict and *identification*","*Fixation* and *defence mechanisms*","Contributions: role of *early* experience, *unconscious* motives, influence on attachment research","Criticisms: hard to *test*, adult patient data, overemphasis on sexuality"]],
["learning",5,"Distinguish between classical conditioning, operant conditioning and observational learning, with an example of each from childhood.",["*Classical conditioning*: neutral stimulus paired with an unconditioned stimulus (*Little Albert*)","*Operant conditioning*: consequences (*reinforcement*, *punishment*) change behaviour","*Observational learning*: imitation of *models* (*Bobo doll*)","*Vicarious reinforcement*","A suitable *example* for each"]]

DESC.m2.push(

["infancy",5,"What methods do researchers use to study infant sensation and perception? Explain any three.",["*Preference* method (Fantz)","*Habituation* and dishabituation","*Evoked potentials* (brain responses)","*High-amplitude sucking*","*Visual cliff* for depth perception"]]
);
DESC.m3.push(
["vygotsky",5,"Explain the concepts of scaffolding and private speech with suitable examples.",["*Scaffolding* defined (Wood, Bruner & Ross)","*Contingent* help: more when struggling, less when succeeding","*Private speech* as self-guidance","Becomes *inner speech*","Contrast with Piaget's *egocentric speech*"]],
["infoproc",5,"Describe the development of memory strategies and metamemory during childhood.",["*Rehearsal* emerges early in school years","*Organization* and *elaboration* develop later","*Production* and *utilization* deficiencies","*Metamemory* grows in middle childhood","Role of *knowledge base* (Chi)"]]
);
DESC.m4.push(
["self",5,"What is theory of mind? Describe how it develops and the factors that promote it.",["Defines *theory of mind*: understanding mental states","*Desire* psychology before *belief* psychology","*False-belief* task (Sally–Anne) passed around age 4","Promoted by *pretend play*, *siblings*, talk about mental states","Links to social competence; difficulty in *autism*"]],
["gender",5,"Explain gender schema theory and compare it with Kohlberg's cognitive-developmental theory of gender.",["*Gender schema* theory (Martin & Halverson)","*In-group/out-group* schema and *own-sex* schema","Starts once *gender identity* is established","Kohlberg: *identity*, *stability*, *consistency*","Kohlberg says *constancy* comes before gender-typing; schema theory says identity is enough"]]
);
DESC.m5.push(
["family",5,"Describe the role of siblings in children's development.",["Arrival of a sibling and *first-born* adjustment","*Sibling rivalry* and *differential treatment*","Older siblings as *teachers* and *caregivers*","Emotional *support* and attachment","Benefits for *perspective-taking* and theory of mind"]],
["school",5,"Explain teacher expectancy effects and the effects of ability tracking on students.",["*Pygmalion* study (Rosenthal & Jacobson)","*Self-fulfilling prophecy*","How expectations change *teacher behaviour*","*Ability tracking* helps high tracks","Disadvantages *low-track* students"]]
);

// Key concepts per module and subtopic. "Term: explanation" — the term is shown in bold.
const KEY = {
m1: {
  intro: ["Development: systematic continuities and changes from conception to death","Maturation vs learning: biological unfolding vs change through experience","Big issues: nature–nurture, continuity–discontinuity, active–passive child, holistic view","Designs: cross-sectional (cohort effects), longitudinal (attrition, practice effects), sequential (combines both), microgenetic","Methods: correlation shows relationship, not cause; experiments manipulate an independent variable with random assignment","Ethics: informed consent, protection from harm, confidentiality, right to withdraw"],
  psycho: ["Freud's structure: id (pleasure principle), ego (reality principle), superego (conscience)","Psychosexual stages: oral → anal → phallic → latency → genital; fixation means arrested development","Phallic stage: Oedipus/Electra conflict, identification with the same-sex parent","Erikson's crises: trust → autonomy → initiative → industry → identity (then intimacy, generativity, integrity)","Erikson vs Freud: social and cultural, lifespan, active ego","Criticism: difficult to test; based on adult patients' recollections"],
  learning: ["Watson: behaviourism; Little Albert showed classical conditioning of fear","Skinner: operant conditioning; reinforcement increases, punishment decreases behaviour","Negative reinforcement: removing something unpleasant increases behaviour (it is not punishment)","Bandura: observational learning (Bobo doll); attention, retention, reproduction, motivation","Reciprocal determinism: person, behaviour and environment influence each other; self-efficacy","Criticism: underplays biology and cognition"],
  cognitive: ["Piaget: child as constructivist; schemes; assimilation and accommodation; equilibration","Stages: sensorimotor → preoperational → concrete operational → formal operational (invariant order)","Vygotsky: sociocultural; ZPD; scaffolding; language shapes thought","Information processing: mind as a limited-capacity computer; gradual gains in speed, capacity and strategies","Critique of Piaget: underestimated infants and preschoolers"],
  ethology: ["Ethology: evolutionary, adaptive roots of behaviour, studied in natural settings","Lorenz: imprinting during a critical period","Humans: sensitive periods rather than strict critical periods","Bowlby: crying and smiling are innate signals that promote attachment","Criticism: evolutionary claims are hard to test"],
  kohlberg: ["Method: moral dilemmas (Heinz); the reasoning is scored, not the choice","Preconventional: (1) punishment-obedience, (2) naive hedonism","Conventional: (3) good boy/good girl, (4) law and social order","Postconventional: (5) social contract, (6) universal ethical principles","Invariant sequence; most adults reach stages 3–4","Criticism: Gilligan's ethic of care; cultural bias"]
},
m2: {
  heredity: ["Zygote: 46 chromosomes (23 pairs); meiosis forms gametes, mitosis copies body cells","Twins: monozygotic share 100% of genes, dizygotic about 50%; the father's sperm decides sex (XY)","Inheritance: dominant–recessive (carrier × carrier = 25%), codominance, X-linked, polygenic","Abnormalities: Down (trisomy 21), Turner (XO), Klinefelter (XXY), fragile X","Genotype vs phenotype; heritability applies to populations, not individuals","Gene–environment correlations: passive, evocative, active (niche-picking)"],
  prenatal: ["Periods: germinal (0–2 weeks) → embryonic (3–8 weeks, most vulnerable) → fetal (9 weeks to birth)","Support: placenta (exchange without mixing blood), amnion, umbilical cord; viability at about 22–28 weeks","Teratogens: effects depend on timing and dose; thalidomide, alcohol (FAS), rubella, smoking","Maternal factors: folic acid (neural tube), age, stress, Rh incompatibility","Birth: dilation → delivery → afterbirth; Apgar at 1 and 5 minutes; anoxia","Preterm vs small-for-date; kangaroo care helps"],
  infancy: ["Survival reflexes: rooting, sucking; primitive: Moro, Babinski, grasp, stepping","Reflexes that persist too long may signal neurological problems","Sleep: 16–18 hours, about 50% REM (autostimulation); back-to-sleep reduces SIDS","Methods: preference (Fantz), habituation/dishabituation, evoked potentials","Vision is weakest at birth; prefers faces and patterns; visual cliff shows depth perception","Hearing: prefers mother's voice; sweet taste preferred; intermodal perception"],
  physical: ["Growth trends: cephalocaudal (head down), proximodistal (centre out)","Brain: synaptogenesis → pruning (use it or lose it); myelination speeds signals","Lateralization: language usually left hemisphere; plasticity greatest early","Prefrontal cortex matures last, into adolescence","Motor: sit at about 6–7 months, walk at about 12 months, pincer grasp at 9–12 months; dynamical systems (Thelen)","Experience matters: cultural practice, crawling → fear of heights"],
  puberty: ["Girls begin the growth spurt about 2 years before boys; menarche and spermarche","Hypothalamus → pituitary → gonads trigger puberty","Early-maturing girls: body image and depression risk; early-maturing boys: social advantage","Late-maturing boys: less confident during adolescence","Secular trend: earlier and taller over generations","Risks: anorexia (self-starvation), bulimia (binge-purge), shifted sleep rhythm"],
  influences: ["Heredity sets growth potential; hormones (GH, thyroxine) drive growth","Malnutrition: marasmus (all nutrients), kwashiorkor (protein)","Nonorganic failure to thrive: emotional neglect stunts growth","Catch-up growth after illness or deprivation","Obesity: genes plus diet, inactivity and screens; iron-deficiency anaemia affects attention"]
},

  intel: ["Binet: mental age; IQ = MA/CA × 100; deviation IQ mean 100, SD 15","Spearman g; Thurstone 7 abilities; Guilford structure of intellect","Cattell–Horn: fluid vs crystallised; Gardner: multiple intelligences; Sternberg: triarchic","Infant tests predict later IQ poorly; novelty preference predicts better","Flynn effect: rising IQ across generations; home environment (HOME) matters","Schemes: organised patterns of thought adapted via assimilation and accommodation"],
  piaget: ["Sensorimotor: circular reactions (primary → secondary → tertiary), object permanence, A-not-B error","Preoperational: symbolic function, egocentrism, animism, centration, no conservation","Concrete: conservation, seriation, transitivity, class inclusion, reversibility; horizontal décalage","Formal: hypothetico-deductive reasoning; imaginary audience and personal fable","Criticism: underestimated young children (Baillargeon); formal operations not universal"],

  infoproc: ["Multistore: sensory register → working memory (7 ± 2) → long-term memory","Strategies: rehearsal → organisation → elaboration; production and utilisation deficiencies","Metamemory and executive functions improve with age","Knowledge base boosts memory (Chi: chess experts)","Infantile amnesia; scripts; suggestible eyewitness memory in preschoolers","Siegler: overlapping waves of strategies"],
  language: ["Components: phonology, morphology, semantics, syntax, pragmatics","Milestones: cooing (2 months) → babbling (6 months) → holophrase (12 months) → telegraphic speech (18–24 months)","Errors: overextension, underextension, overregularisation (‘goed’)","Fast mapping, mutual exclusivity, vocabulary spurt","Theories: learning (Skinner), nativist (Chomsky's LAD), interactionist","Support: child-directed speech, expansions, recasts; sensitive period (Genie)"]
},

  emotion: ["Primary emotions early; self-conscious emotions (shame, pride) at 18–24 months","Social smile at 6–10 weeks; stranger anxiety at 8–10 months; separation anxiety","Social referencing: reading a caregiver's face in uncertain situations","Display rules and emotion regulation develop with age and culture","Emotion coaching by parents → better understanding and competence"],

  attachment: ["Phases: asocial → indiscriminate → specific (7–9 months) → multiple","Harlow: contact comfort beats feeding; Bowlby: secure base, internal working models","Strange Situation: secure, resistant, avoidant, disorganised","Caregiving hypothesis: sensitive responsiveness → security","Culture affects classifications (Japan, Germany)","Secure attachment predicts later social competence; quality day care is not harmful"],
  self: ["Self-recognition (rouge test) at 18–24 months; extended self at about age 4","Self-descriptions: concrete → psychological → abstract","Self-esteem: Harter's domains; social comparison; dips at school transitions","Marcia: diffusion, foreclosure, moratorium, achievement","Theory of mind: false belief at about 4; Selman's role-taking","Dweck: incremental vs entity theories; learned helplessness"],

},

  family: ["Family as a system: direct and indirect effects; bidirectional influences","Baumrind: authoritative (best), authoritarian, permissive, uninvolved (worst)","Two dimensions: acceptance/responsiveness × demandingness/control","Behavioural control helps; psychological control harms","Divorce: crisis then adjustment; low conflict and good parenting protect","Siblings, grandparents, SES and culture shape parenting"],
