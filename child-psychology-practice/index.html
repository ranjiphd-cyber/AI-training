<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Child Psychology Practice Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a study-desk masthead, then one working view at a time (Home · Set up · MCQ · Results · Descriptive).
   Each module carries its own ink colour, like tabbed dividers in a revision binder.
   Ground palette is the learner-supplied #F4F2EE / #F0E7D0 / #E8D6C1. */
:root {
  --bg: #F4F2EE;
  --sand: #F0E7D0;
  --tan: #E8D6C1;
  --card: #FBFAF7;
  --ink: #2B2621;
  --muted: #5F554A;
  --line: #D9CBB6;
  --accent: #2F5E5A;
  --accent-ink: #FBFAF7;
  --good: #356A35;
  --good-soft: #E0EBD8;
  --bad: #9B3B2E;
  --bad-soft: #F4DED6;
  --focus: #1F4E8C;
  --m1: #2F5E5A; --m1-soft: #DCE7E2;
  --m2: #8A4A2E; --m2-soft: #F1DFD3;
  --m3: #3B5277; --m3-soft: #DEE3EE;
  --m4: #6A4462; --m4-soft: #ECDEE8;
  --m5: #4D5B2A; --m5-soft: #E3E7D1;
  --shadow: 0 1px 2px rgba(70, 52, 30, .06), 0 6px 18px rgba(70, 52, 30, .07);
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1915; --sand: #29241D; --tan: #3A3228; --card: #231F1A;
    --ink: #F0E7D0; --muted: #C3B6A3; --line: #463D32;
    --accent: #93C4BB; --accent-ink: #1C1915;
    --good: #A5D29B; --good-soft: #2B3A28; --bad: #EFA696; --bad-soft: #452A24; --focus: #9CC2F5;
    --m1: #93C4BB; --m1-soft: #24332F;
    --m2: #E3A88A; --m2-soft: #3B2A21;
    --m3: #A9BDE0; --m3-soft: #262D3B;
    --m4: #D7AACB; --m4-soft: #352734;
    --m5: #BFCB8E; --m5-soft: #2D3220;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1915; --sand: #29241D; --tan: #3A3228; --card: #231F1A;
  --ink: #F0E7D0; --muted: #C3B6A3; --line: #463D32;
  --accent: #93C4BB; --accent-ink: #1C1915;
  --good: #A5D29B; --good-soft: #2B3A28; --bad: #EFA696; --bad-soft: #452A24; --focus: #9CC2F5;
  --m1: #93C4BB; --m1-soft: #24332F;
  --m2: #E3A88A; --m2-soft: #3B2A21;
  --m3: #A9BDE0; --m3-soft: #262D3B;
  --m4: #D7AACB; --m4-soft: #352734;
  --m5: #BFCB8E; --m5-soft: #2D3220;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 64px; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); letter-spacing: -.01em; }
h2 { font-size: clamp(1.35rem, 2.6vw, 1.7rem); }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.eyebrow { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button, select, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Module theming: any element with data-m picks up its module ink */
[data-m="m1"] { --mod: var(--m1); --mod-soft: var(--m1-soft); }
[data-m="m2"] { --mod: var(--m2); --mod-soft: var(--m2-soft); }
[data-m="m3"] { --mod: var(--m3); --mod-soft: var(--m3-soft); }
[data-m="m4"] { --mod: var(--m4); --mod-soft: var(--m4-soft); }
[data-m="m5"] { --mod: var(--m5); --mod-soft: var(--m5-soft); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; font-weight: 700; font-size: .95rem; text-decoration: none; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--mod, var(--accent)); border-color: var(--mod, var(--accent)); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--mod, var(--accent)); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 12px; }
.btn-quiet:hover { color: var(--ink); background: var(--sand); border-color: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Masthead */
.mast { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; padding-block: 8px 18px; border-bottom: 1.5px solid var(--line); }
.mast-title { display: grid; gap: 6px; min-width: 0; }
.mast-title .code { font-family: var(--f-mono); font-size: .82rem; color: var(--muted); }
.mast-home { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--sand); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; min-width: 112px; }
.stat b { display: block; font-family: var(--f-mono); font-size: 1.25rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat span { font-size: .78rem; color: var(--muted); }
@media (max-width: 720px) { .mast { grid-template-columns: 1fr; } .stat { flex: 1 1 100px; } }

/* Resume banner */
.resume { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: var(--tan); border-radius: var(--r); padding: 14px 18px; }

/* Home: module cards */
.intro { display: grid; gap: 6px; max-width: 70ch; }
.modgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.modcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; min-width: 0; }
.modcard-head { background: var(--mod-soft); padding: 16px 18px 14px; display: grid; gap: 4px; border-bottom: 3px solid var(--mod); }
.modnum { font-family: var(--f-display); font-size: 2rem; line-height: 1; color: var(--mod); }
.modcard-body { padding: 14px 18px; display: grid; gap: 12px; align-content: start; }
.topics { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
.topics li { padding-left: 14px; position: relative; }
.topics li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--mod); }
.modcard-foot { padding: 12px 18px 16px; display: grid; gap: 10px; border-top: 1px dashed var(--line); }
.note { font-size: .82rem; color: var(--muted); background: var(--sand); padding: 8px 10px; border-radius: 8px; }
.meter { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); }
.meter-row { display: flex; justify-content: space-between; gap: 8px; }
.bar { height: 8px; border-radius: 99px; background: var(--tan); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--mod, var(--accent)); border-radius: 99px; transition: width .3s; }

/* Setup panel */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: clamp(18px, 3vw, 28px); display: grid; gap: 22px; }
.panel-head { display: grid; gap: 6px; padding-bottom: 14px; border-bottom: 3px solid var(--mod); }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-weight: 700; margin-bottom: 8px; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; min-height: 40px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg); font-size: .92rem; }
.chip span small { font-family: var(--f-mono); color: var(--muted); font-size: .75rem; }
.chip input:checked + span { background: var(--mod-soft); border-color: var(--mod); font-weight: 700; }
.chip input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.mode { position: relative; }
.mode input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.mode .mode-box { display: grid; gap: 4px; padding: 16px 18px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--bg); height: 100%; }
.mode .mode-box strong { font-size: 1.05rem; }
.mode input:checked + .mode-box { border-color: var(--mod); background: var(--mod-soft); box-shadow: inset 0 0 0 1px var(--mod); }
.mode input:focus-visible + .mode-box { outline: 3px solid var(--focus); outline-offset: 2px; }
.opts-row { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: .92rem; }
select { min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); }
.check { display: inline-flex; gap: 10px; align-items: center; cursor: pointer; font-size: .95rem; }
.check input { width: 20px; height: 20px; accent-color: var(--mod, var(--accent)); }

/* Quiz */
.qtop { display: grid; gap: 12px; }
.qtop-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--mod-soft); color: var(--ink); font-size: .85rem; font-weight: 700; border: 1px solid var(--mod); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mod); }
.counters { display: flex; gap: 18px; flex-wrap: wrap; font-size: .92rem; }
.counters b { font-family: var(--f-mono); font-weight: 500; }
.qlayout { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 20px; align-items: start; }
@media (max-width: 860px) { .qlayout { grid-template-columns: 1fr; } }
.qcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: clamp(18px, 3vw, 30px); display: grid; gap: 18px; min-width: 0; border-top: 4px solid var(--mod); }
.qtext { font-family: var(--f-display); font-size: clamp(1.2rem, 2.4vw, 1.45rem); line-height: 1.35; }
.options { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 12px 14px; min-height: 52px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover:not([disabled]) { border-color: var(--mod); }
.opt .key { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: .85rem; border: 1.5px solid var(--line); background: var(--card); }
.opt[aria-checked="true"] { border-color: var(--mod); background: var(--mod-soft); box-shadow: inset 0 0 0 1px var(--mod); }
.opt[aria-checked="true"] .key { background: var(--mod); border-color: var(--mod); color: var(--accent-ink); }
.opt[disabled] { cursor: default; }
.opt.is-correct { border-color: var(--good); background: var(--good-soft); box-shadow: inset 0 0 0 1px var(--good); }
.opt.is-correct .key { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: inset 0 0 0 1px var(--bad); }
.opt.is-wrong .key { background: var(--bad); border-color: var(--bad); color: var(--accent-ink); }
.opt .tag { font-size: .78rem; font-weight: 700; white-space: nowrap; }
.opt.is-correct .tag { color: var(--good); }
.opt.is-wrong .tag { color: var(--bad); }
.feedback { border-radius: 10px; padding: 16px 18px; display: grid; gap: 8px; }
.feedback.good { background: var(--good-soft); border: 1.5px solid var(--good); }
.feedback.bad { background: var(--bad-soft); border: 1.5px solid var(--bad); }
.feedback .fb-title { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 1.08rem; }
.feedback .face { font-size: 1.6rem; line-height: 1; }
.feedback.good .fb-title { color: var(--good); }
.feedback.bad .fb-title { color: var(--bad); }
.qnav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding-top: 6px; border-top: 1px dashed var(--line); }
.hint { font-size: .8rem; color: var(--muted); }
kbd { font-family: var(--f-mono); font-size: .75rem; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--card); }
.side { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
.navgrid button { height: 36px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); font-family: var(--f-mono); font-size: .8rem; cursor: pointer; padding: 0; }
.navgrid button.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.navgrid button.no { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.navgrid button.cur { box-shadow: 0 0 0 2px var(--mod); border-color: var(--mod); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .75rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; border: 1.5px solid var(--line); }
.legend i.ok { background: var(--good-soft); border-color: var(--good); }
.legend i.no { background: var(--bad-soft); border-color: var(--bad); }
@media (max-width: 860px) { .side { position: static; } }

/* Results */
.res-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; }
@media (max-width: 640px) { .res-top { grid-template-columns: 1fr; justify-items: start; } }
.ring { width: 150px; height: 150px; max-width: 100%; }
.ring text { font-family: var(--f-mono); fill: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.tile { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile b { display: block; font-family: var(--f-mono); font-size: 1.5rem; font-weight: 500; }
.tile span { font-size: .8rem; color: var(--muted); }
.tile.good b { color: var(--good); }
.tile.bad b { color: var(--bad); }
.breakdown { display: grid; gap: 10px; }
.bd-row { display: grid; grid-template-columns: minmax(0, 1fr) 80px; gap: 6px 12px; align-items: center; font-size: .9rem; }
.bd-row .bar { grid-column: 1 / -1; }
.review-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.review-list li { background: var(--bg); border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; font-size: .92rem; }
.review-list li b { color: var(--good); }

/* Descriptive */
.dlayout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .dlayout { grid-template-columns: 1fr; } .dlayout .side { order: 2; } }
.dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.dlist button { width: 100%; text-align: left; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; font-size: .88rem; line-height: 1.35; }
.dlist button .n { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); padding-top: 1px; }
.dlist button.cur { border-color: var(--mod); background: var(--mod-soft); }
.dlist button.done .n { color: var(--good); font-weight: 700; }
.marks { font-family: var(--f-mono); font-size: .8rem; padding: 3px 9px; border-radius: 999px; background: var(--tan); }
textarea { width: 100%; min-height: 300px; resize: vertical; padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); line-height: 1.6; font-size: 1rem; }
textarea:focus { border-color: var(--mod); }
.wc { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: .82rem; color: var(--muted); }
.assess { display: grid; gap: 18px; padding-top: 18px; border-top: 2px solid var(--mod); }
.kp { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.kp label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); cursor: pointer; font-size: .93rem; }
.kp input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--good); }
.kp .found { display: inline-block; margin-left: 6px; font-size: .72rem; font-weight: 700; color: var(--good); background: var(--good-soft); padding: 1px 7px; border-radius: 99px; }
.kp em { font-style: normal; font-weight: 700; }
.rubric { display: grid; gap: 10px; }
.rub-row { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 8px 14px; align-items: center; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
@media (max-width: 640px) { .rub-row { grid-template-columns: 1fr; } }
.rub-row .desc { font-size: .8rem; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: inline-block; padding: 6px 11px; border-radius: 8px; border: 1.5px solid var(--line); font-size: .82rem; background: var(--card); }
.seg input:checked + span { background: var(--mod); border-color: var(--mod); color: var(--accent-ink); font-weight: 700; }
.seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.callout { background: var(--sand); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; }
.callout.good { background: var(--good-soft); border-color: var(--good); }
.empty { padding: 18px; border: 1.5px dashed var(--line); border-radius: var(--r); color: var(--muted); }
footer { font-size: .82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 4px; max-width: 80ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="mast-title">
      <p class="eyebrow">Jain University · MSc Psychology · Semester III</p>
      <button class="mast-home" type="button" data-act="home" aria-label="Go to dashboard home"><h1>Child Psychology Practice Lab</h1></button>
      <p class="code">23MSPSY3CNOD01 · Child Psychology</p>
    </div>
    <div class="stats" id="stats" aria-label="Your overall progress"></div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer>
    <p>Modules I–IV follow the course syllabus topics. Module V questions use standard developmental psychology knowledge on the listed syllabus topics.</p>
    <p>Your progress and draft answers are saved in this browser only.</p>
  </footer>
</div>
<div class="sr-only" aria-live="polite" id="live"></div>
<script>
const MCQ = {}, DESC = {};
// Module I — Introduction to Developmental Psychology
// Row format: [subtopic, question, correct answer, [three distractors], explanation]
MCQ.m1 = [
["intro","Developmental psychology is best described as the scientific study of:","Systematic continuities and changes in individuals from conception to death",["Abnormal behaviour that appears only in childhood","Differences in behaviour between animal species","Changes in intelligence test scores during schooling"],"Developmental psychology studies how people change, and how they stay the same, across the whole lifespan, from conception to death."],
["intro","Changes that come from the biological unfolding of a species-typical genetic plan are called:","Maturation",["Learning","Socialization","Habituation"],"Maturation is biologically programmed change, such as walking or puberty. Learning, by contrast, is change that comes from experience."],
["intro","A relatively permanent change in thoughts, feelings or behaviour that results from experience is called:","Learning",["Maturation","Canalization","Imprinting"],"Learning is change produced by experience or practice. It is set against maturation, which is change produced by biology."],
["intro","The nature–nurture issue asks about the relative contributions of:","Heredity and environment to development",["Conscious and unconscious motives","Childhood and adult experiences","Thinking and feeling"],"Nature refers to heredity and biology, and nurture refers to environment and experience. Most modern theorists see the two as interacting."],
["intro","A theorist who describes development as a series of distinct stages, each qualitatively different from the one before, holds which view?","Discontinuity",["Continuity","Nativism","Passivity"],"Stage theories such as those of Freud, Erikson and Piaget treat development as discontinuous, with abrupt qualitative changes. Continuity theorists see gradual, quantitative change."],
["intro","The holistic perspective in developmental psychology emphasises that:","Physical, cognitive, social and emotional development are interrelated",["Each domain of development should be studied in isolation","Development is complete by the end of adolescence","Only heredity determines the course of development"],"The holistic view treats the child as a whole person, in whom change in one domain (for example, motor skills) affects the others (for example, social interaction)."],
["intro","A researcher tests 4-, 8- and 12-year-olds at the same time to compare their memory. This is a:","Cross-sectional design",["Longitudinal design","Sequential design","Microgenetic design"],"A cross-sectional design compares people of different ages at one point in time. It is quick, but it cannot show individual change and it can confuse age effects with cohort effects."],
["intro","A major weakness of the cross-sectional design is that age differences may actually reflect:","Cohort effects",["Practice effects from repeated testing","Selective attrition over many years","Observer influence on participants"],"People of different ages grew up in different historical periods (cohorts), so differences between age groups may reflect generation rather than age."],
["intro","Which problem is most typical of longitudinal designs?","Participant attrition and practice effects from repeated testing",["Inability to measure change within individuals","Cohort effects between different age groups","Lack of any information about stability of traits"],"Following the same people over years is costly. Participants drop out, and repeated testing can improve scores for reasons that have nothing to do with development."],
["intro","A design that combines cross-sectional and longitudinal approaches by following several age groups over time is a:","Sequential design",["Case study","Correlational design","Cross-cultural design"],"Sequential designs follow different cohorts over time. This lets researchers separate true age changes from cohort effects."],
["intro","A correlation of −.80 between hours of television and reading scores indicates:","A strong negative relationship, but not necessarily that television causes lower reading",["A weak relationship with no practical meaning","That television causes lower reading scores","That reading causes children to watch less television"],"The size (.80) shows a strong relationship and the sign shows its direction. Correlation alone cannot establish cause and effect."],
["intro","The defining feature of a true experiment is that the researcher:","Manipulates an independent variable and randomly assigns participants to conditions",["Observes children in their natural settings without interfering","Studies a single child in great depth","Measures two variables and computes their relationship"],"Manipulation plus random assignment lets researchers draw cause-and-effect conclusions about the effect of the independent variable on the dependent variable."],
["psycho","According to Freud, the part of the personality that is present at birth and operates on the pleasure principle is the:","Id",["Ego","Superego","Conscience"],"The id is the inborn, instinctual part of the personality. It seeks immediate gratification of biological needs."],
["psycho","Freud's ego operates mainly on the:","Reality principle",["Pleasure principle","Morality principle","Principle of equilibration"],"The ego is the rational part of the personality. It finds realistic ways to satisfy the id's demands."],
["psycho","Which sequence lists Freud's psychosexual stages in the correct order?","Oral, anal, phallic, latency, genital",["Oral, phallic, anal, genital, latency","Anal, oral, phallic, latency, genital","Oral, anal, latency, phallic, genital"],"Freud proposed five psychosexual stages: oral (0–1), anal (1–3), phallic (3–6), latency (6–11) and genital (12 onward)."],
["psycho","Freud placed the Oedipus and Electra conflicts in which stage?","Phallic",["Oral","Anal","Latency"],"In the phallic stage (about 3–6 years), children resolve these conflicts by identifying with the same-sex parent, and the superego develops."],
["psycho","In Freud's theory, fixation refers to:","Arrested development at a stage because needs were over- or under-gratified",["Moving forward to a later stage early","Forming a strong attachment to the mother","Storing information permanently in memory"],"Fixation means some psychic energy stays tied to an earlier stage, and this can show up later as adult personality traits."],
["psycho","Compared with Freud, Erikson placed more emphasis on:","Social and cultural influences and development across the whole lifespan",["Sexual urges as the main driver of development","The id as the most important part of personality","Development ending in adolescence"],"Erikson's psychosocial theory sees the ego as active and adaptive. It describes eight stages that continue across the lifespan."],
["psycho","Erikson's first psychosocial crisis, during infancy, is:","Trust versus mistrust",["Autonomy versus shame and doubt","Initiative versus guilt","Industry versus inferiority"],"Infants learn to trust others when caregivers are responsive and dependable."],
["psycho","A 9-year-old who works hard to master school tasks and compares her skills with her classmates' is facing which Eriksonian crisis?","Industry versus inferiority",["Initiative versus guilt","Identity versus role confusion","Autonomy versus shame and doubt"],"In middle childhood (about 6–12 years), children must master academic and social skills. Failure can lead to feelings of inferiority."],
["psycho","According to Erikson, the central task of adolescence is:","Identity versus role confusion",["Intimacy versus isolation","Industry versus inferiority","Generativity versus stagnation"],"Adolescents try to form a coherent sense of who they are and where they are heading in life."],
["psycho","A frequent criticism of psychoanalytic theory is that:","Many of its concepts are difficult to test or falsify",["It ignores early childhood experiences","It focuses only on observable behaviour","It underestimates unconscious motives"],"Concepts such as the id or the Oedipus complex are hard to measure, so many claims cannot be tested scientifically."],
["learning","John B. Watson argued that development is determined mainly by:","Learning experiences provided by the environment",["Innate stages that unfold automatically","Unconscious sexual conflicts","The child's own active construction of knowledge"],"Watson, the founder of behaviourism, believed that children's development depends on environmental conditioning."],
["learning","In the ‘Little Albert’ study, the white rat that later produced fear became a(n):","Conditioned stimulus",["Unconditioned stimulus","Unconditioned response","Negative reinforcer"],"The rat was first neutral. After it was paired with a loud noise (the unconditioned stimulus), it came to elicit fear on its own, so it became a conditioned stimulus."],
["learning","In Skinner's operant conditioning, a reinforcer is any consequence that:","Increases the likelihood that a behaviour will be repeated",["Decreases the likelihood of a behaviour","Is paired with a neutral stimulus before a response","Is presented before the behaviour occurs"],"Reinforcers, whether positive or negative, strengthen behaviour. Punishers weaken it."],
["learning","A parent stops nagging as soon as the child tidies the room, and the child tidies more often afterwards. This illustrates:","Negative reinforcement",["Positive punishment","Extinction","Observational learning"],"Removing something unpleasant (the nagging) increases the behaviour (tidying). That is negative reinforcement, not punishment."],
["learning","Bandura's Bobo doll studies demonstrated that children can learn aggression through:","Observational learning",["Classical conditioning of fear","Direct reinforcement only","Maturation of aggressive instincts"],"Children who watched a model hit the Bobo doll imitated the behaviour without being reinforced themselves."],
["learning","In Bandura's social cognitive theory, reciprocal determinism means that:","The person, their behaviour and the environment all influence one another",["The environment alone shapes behaviour","Children determine their environments completely","Heredity and maturation determine behaviour"],"Bandura described a two-way (reciprocal) interplay. Children are shaped by their environments, and they also act on and change those environments."],
["learning","A child's belief that she can succeed at a particular task is what Bandura called:","Self-efficacy",["Self-esteem","Identity achievement","Ego integrity"],"Self-efficacy is a belief about one's capability in a specific area. It affects how much effort and persistence a child shows."],
["learning","A common criticism of learning theories is that they:","Pay too little attention to biological and cognitive contributions to development",["Cannot be tested scientifically","Focus too heavily on unconscious motives","Ignore the effects of the environment"],"Learning theories are testable and practical, but they are said to oversimplify development by underplaying maturation, biology and the child's own thinking."],
["learning","A teacher gives a gold star every time a child reads a page aloud, and reading increases. This applies:","Positive reinforcement",["Negative reinforcement","Classical conditioning","Punishment"],"Adding a pleasant consequence after a behaviour, which then increases, is positive reinforcement."],
["cognitive","Piaget viewed children as:","Active ‘constructivists’ who build their own understanding of the world",["Passive recipients of environmental influence","Driven mainly by unconscious urges","Miniature adults who think the same way as adults"],"Piaget believed that children learn by acting on the world and constructing increasingly complex mental structures (schemes)."],
["cognitive","A toddler sees a cow for the first time and calls it ‘doggie’. In Piaget's terms, the child is:","Assimilating the cow into an existing scheme",["Accommodating a new scheme","Showing object permanence","Using private speech"],"Assimilation means interpreting new experiences in terms of existing schemes. Here the child uses the ‘four-legged animal = doggie’ scheme."],
["cognitive","Changing an existing scheme to fit a new experience is called:","Accommodation",["Assimilation","Organization","Centration"],"Accommodation means modifying schemes in response to new information, for example forming a separate scheme for ‘cow’."],
["cognitive","Which is the correct order of Piaget's cognitive stages?","Sensorimotor, preoperational, concrete operational, formal operational",["Preoperational, sensorimotor, formal operational, concrete operational","Sensorimotor, concrete operational, preoperational, formal operational","Preoperational, concrete operational, sensorimotor, formal operational"],"Piaget proposed four invariant stages: sensorimotor (0–2), preoperational (2–7), concrete operational (7–11) and formal operational (11+)."],
["cognitive","Vygotsky's theory is described as sociocultural because it emphasises that:","Cognitive growth comes from social interaction within a cultural context",["Cognitive stages are the same in every culture","Language is unrelated to thought","Development is driven mainly by biological maturation"],"For Vygotsky, children acquire the tools of thought, such as language, through collaboration with more skilled members of their culture."],
["cognitive","The zone of proximal development is the gap between:","What a child can do alone and what the child can do with guidance",["A child's mental age and chronological age","Short-term and long-term memory capacity","Preoperational and concrete operational thought"],"The ZPD covers tasks that are too hard to do alone but achievable with help from an adult or a more skilled peer."],
["cognitive","Information-processing theorists compare the human mind to a:","Computer with limited capacity",["Blank slate","Steam engine","Biological clock"],"Information is taken in, stored, retrieved and processed. Development involves gains in capacity, speed and strategy use."],
["cognitive","Unlike Piaget, information-processing theorists generally describe cognitive development as:","Gradual, continuous change rather than abrupt stages",["A series of four universal stages","Driven by psychosexual conflicts","Determined only by culture"],"Information-processing views explain cognitive growth through small, continuous improvements in processing rather than qualitative stage shifts."],
["cognitive","A widely accepted criticism of Piaget's theory is that it:","Underestimated the cognitive abilities of infants and young children",["Overestimated the role of culture","Ignored children's active role in learning","Relied too heavily on laboratory experiments with animals"],"Later research using simpler tasks shows that infants and preschoolers often have abilities earlier than Piaget proposed."],
["ethology","Ethology is the study of:","The bioevolutionary bases of behaviour and development",["Unconscious motives in personality","Reinforcement schedules in learning","Cultural tools of intellectual adaptation"],"Ethologists study behaviour in natural settings to understand its evolutionary, adaptive value."],
["ethology","Konrad Lorenz showed that newly hatched goslings follow the first moving object they see. This is called:","Imprinting",["Habituation","Scaffolding","Classical conditioning"],"Imprinting is an innate form of learning in which young animals follow and become attached to a moving object during an early critical period."],
["ethology","A limited period during which a child is especially susceptible to particular experiences, but in which change is still possible later, is called a:","Sensitive period",["Critical period","Latency period","Period of the zygote"],"Human development usually shows sensitive periods (optimal but not absolute windows) rather than strict critical periods."],
["ethology","Bowlby applied ethological ideas to argue that infant crying and smiling:","Are innate signals that evolved to attract care from adults",["Are learned only through reinforcement","Show unconscious oral conflicts","Have no adaptive value"],"Bowlby saw these behaviours as built-in signals that promote closeness to a caregiver and therefore survival."],
["ethology","A key criticism of ethological theory is that:","Its claims about evolutionary origins are difficult to test directly",["It ignores biological influences","It is based only on laboratory studies","It denies that behaviour has adaptive value"],"It is hard to prove that a behaviour evolved for a particular purpose. Ethology also says less about how learning and culture modify innate tendencies."],
["kohlberg","Kohlberg assessed moral reasoning mainly by:","Presenting moral dilemmas such as the Heinz dilemma and analysing the reasons given",["Observing children cheat on tests","Measuring how often children share toys","Asking parents to rate their children's honesty"],"Kohlberg was interested in the structure of reasoning (why an action is right or wrong), not the choice itself."],
["kohlberg","Kohlberg's three levels of moral reasoning are:","Preconventional, conventional and postconventional",["Heteronomous, autonomous and universal","Concrete, formal and postformal","Premoral, moral and amoral"],"Each level contains two stages, giving six stages in total."],
["kohlberg","A child says, ‘Heinz shouldn't steal the drug because he'll be put in jail.’ This reasoning reflects:","Stage 1: punishment-and-obedience orientation",["Stage 3: good boy/good girl orientation","Stage 4: social-order-maintaining morality","Stage 5: social-contract orientation"],"At the preconventional level, stage 1 judges right and wrong by whether an act will be punished."],
["kohlberg","At Kohlberg's conventional level, moral judgements are based mainly on:","Gaining approval and upholding laws and social rules",["Avoiding punishment and getting rewards","Self-chosen universal ethical principles","Pure self-interest"],"Stage 3 seeks approval from others. Stage 4 focuses on maintaining law and social order."],
["kohlberg","Carol Gilligan criticised Kohlberg's theory for:","Underrating a morality of care that is often emphasised by women",["Overemphasising emotions in moral reasoning","Using only female participants","Ignoring the role of justice in morality"],"Gilligan argued that Kohlberg's justice-based scoring undervalues care-based reasoning. Later research found only small sex differences."]
];

MCQ.m2 = [

["heredity","Monozygotic (identical) twins develop when:","A single fertilised zygote splits into two",["Two ova are fertilised by two sperm","One ovum is fertilised by two sperm","Two zygotes fuse into one"],"Because they come from one zygote, monozygotic twins share the same genotype. Dizygotic twins share about 50% of their genes, like ordinary siblings."],
["heredity","A child's genetic sex is determined by:","Whether the father's sperm carries an X or a Y chromosome",["Whether the mother's ovum carries an X or a Y chromosome","The number of autosomes inherited","The mother's hormone levels during pregnancy"],"Ova always carry an X. A sperm carrying Y produces a male (XY), and one carrying X produces a female (XX)."],
["heredity","Two parents are both carriers of the recessive gene for phenylketonuria (PKU). The chance that each of their children will have PKU is:","25%",["50%","75%","0%"],"Each carrier parent (Pp) passes on the recessive gene half the time, so the chance of a pp child is ½ × ½ = ¼."],

["heredity","The difference between genotype and phenotype is that:","Genotype is the genes inherited; phenotype is the observable traits produced by genes and environment together",["Genotype is observable; phenotype is hidden","Genotype applies only to physical traits; phenotype only to behaviour","They mean the same thing"],"The phenotype, meaning observable characteristics, comes from the genotype interacting with the environment."],
["heredity","A heritability coefficient estimates:","The proportion of variation in a trait within a population that is linked to genetic differences",["How much of one person's trait is caused by genes","Whether a trait can be changed by the environment","The number of genes involved in a trait"],"Heritability applies to differences among people in a population, not to individuals. A heritable trait can still be changed by the environment."],
["heredity","A sociable child seeks out parties and friends, which further strengthens her sociability. Scarr and McCartney called this:","An active (niche-picking) gene–environment correlation",["A passive gene–environment correlation","An evocative gene–environment correlation","Canalization"],"In active correlations, children choose environments that fit their genetic predispositions. This becomes more common with age."],
["prenatal","The correct order of the prenatal periods is:","Germinal (zygote), embryonic, fetal",["Embryonic, germinal, fetal","Fetal, embryonic, germinal","Germinal, fetal, embryonic"],"The germinal period lasts about 2 weeks, the embryonic period runs from week 3 to week 8, and the fetal period runs from week 9 to birth."],
["prenatal","The prenatal period during which the organism is most vulnerable to teratogens is the:","Embryonic period (weeks 3–8)",["Germinal period","Third trimester","Period immediately before birth"],"Most major organs and structures form during the embryonic period, so it is the most critical time for structural defects."],
["prenatal","A teratogen is:","Any external agent that can harm a developing embryo or fetus",["A gene that causes a disorder","A hormone that triggers labour","A reflex present at birth"],"Teratogens include drugs, diseases, chemicals and radiation. Their effects depend on timing, dose and genetic susceptibility."],
["prenatal","Mothers who took thalidomide early in pregnancy often had babies with:","Malformed or missing limbs",["Fetal alcohol syndrome","Rh incompatibility","Excess growth"],"The thalidomide tragedy showed that a drug harmless to adults could cause severe structural defects when taken during critical periods."],
["prenatal","Microcephaly, distinctive facial features and intellectual disability in a newborn are characteristic of:","Fetal alcohol syndrome",["Turner syndrome","Sickle-cell anaemia","Phenylketonuria"],"Heavy prenatal alcohol exposure causes FAS. There is no known safe level of drinking during pregnancy."],
["prenatal","Rubella contracted during the first trimester is most likely to cause:","Blindness, deafness and heart defects",["Excessive birth weight","Early onset of puberty","Rh disease"],"Rubella (German measles) is especially damaging early in pregnancy, when the eyes, ears and heart are forming."],
["prenatal","Adequate folic acid in early pregnancy helps prevent:","Neural tube defects such as spina bifida",["Down syndrome","Colour blindness","Turner syndrome"],"The neural tube becomes the brain and spinal cord. Folic acid lowers the risk of it failing to close properly."],
["prenatal","The Apgar scale assesses a newborn's:","Heart rate, respiratory effort, muscle tone, colour and reflex irritability",["Intelligence and temperament","Sensory preferences and learning","Attachment security"],"Each sign is scored 0–2 at 1 and 5 minutes after birth. A score of 7 or above indicates good condition."],
["prenatal","The longest stage of childbirth is usually:","The first stage, when the cervix dilates",["The second stage, delivery of the baby","The third stage, delivery of the placenta","The stage after the placenta is delivered"],"The first stage, with contractions that dilate the cervix, can last many hours, especially with a first baby."],
["prenatal","A baby who weighs less than expected for the time spent in the uterus is described as:","Small-for-date",["Preterm","Post-term","Viable"],"Preterm babies are born early but may be a normal weight for their age. Small-for-date babies are underweight for their gestational age and often face more risk."],

["infancy","Stroking the sole of a newborn's foot makes the toes fan out and curl. This is the:","Babinski reflex",["Swimming reflex","Sucking reflex","Moro reflex"],"The Babinski reflex is a primitive reflex. It usually fades by the end of the first year."],

["infancy","In the habituation paradigm, an infant who looks again after a new stimulus replaces a familiar one is showing:","Dishabituation, meaning the infant can tell the stimuli apart",["Habituation to both stimuli","A reflex response only","Object permanence"],"A drop in attention to a repeated stimulus (habituation) followed by renewed attention to a new one (dishabituation) shows discrimination."],
["infancy","Fantz's preference method showed that very young infants prefer to look at:","Patterned stimuli such as faces over plain stimuli",["Plain coloured discs over patterns","Dim lights over bright lights","Still objects over moving ones"],"Fantz found that newborns look longer at patterned and face-like displays, which suggests early perceptual preferences."],
["infancy","The visual cliff studies of Gibson and Walk showed that:","Most crawling infants avoid the apparent drop, indicating depth perception",["Newborns cannot see colour","Infants prefer the deep side","Depth perception develops only after age 3"],"Most infants of crawling age refused to cross the ‘deep’ side. Crawling experience appears to strengthen fear of drop-offs."],
["infancy","At birth, the least developed sense is:","Vision",["Hearing","Taste","Smell"],"Newborn vision is blurry (acuity of roughly 20/400 to 20/600) and improves rapidly over the first year. Hearing, taste and smell work quite well at birth."],
["infancy","DeCasper's studies found that newborns prefer:","Their mother's voice, and stories heard in the womb",["Any female voice equally","Silence to speech","Male voices to female voices"],"This preference suggests that some auditory learning happens before birth."],
["infancy","The ability to combine information from two or more senses, for example matching a voice to a face, is called:","Intermodal perception",["Habituation","Size constancy","Visual acuity"],"Infants show surprising early ability to coordinate sight, sound and touch."],
["infancy","Perceiving an object as the same size even though its image on the retina changes with distance is called:","Size constancy",["Depth perception","Object permanence","Intermodal perception"],"Size constancy is present in a basic form early in infancy and improves over the first year."],

["physical","A child controls trunk and arm movements before hand and finger movements. This illustrates the:","Proximodistal principle",["Cephalocaudal principle","Principle of plasticity","Secular trend"],"Proximodistal means ‘near to far’: development proceeds from the centre of the body outward."],
["physical","Synapses that are rarely used are eliminated in a process known as:","Synaptic pruning",["Myelination","Synaptogenesis","Lateralization"],"The brain overproduces synapses and then prunes unused ones, following a ‘use it or lose it’ pattern."],

["physical","Brain plasticity means that:","The young brain is flexible and can partly recover from injury or reorganise with experience",["Brain structures are fixed at birth","The brain stops growing after infancy","The left hemisphere controls all functions"],"Plasticity is greatest early in life, which is why young children often recover more fully from brain injury."],

["physical","Esther Thelen's dynamical systems theory describes motor development as:","Active reorganisation of existing skills into more complex systems, shaped by goals, body and environment",["The automatic unfolding of a genetic timetable only","The result of reinforcement alone","A process unrelated to perception"],"Infants combine and refine motor abilities to reach goals. Maturation, experience and motivation all contribute."],
["physical","Picking up a small object between the thumb and forefinger, usually by about 9–12 months, is the:","Pincer grasp",["Ulnar grasp","Palmar reflex","Moro reflex"],"The pincer grasp is a fine-motor milestone that replaces the earlier, clumsy ulnar grasp."],
