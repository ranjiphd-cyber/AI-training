<title>TA Vendor Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy masthead, left rail of views (top tabs on phones), working canvas, right-hand vendor profile drawer. */
:root {
  --navy: #001433;
  --slate: #4A5568;
  --paper: #F7FAFC;
  --surface: #FFFFFF;
  --sunk: #EEF3F7;
  --fg: #0F1C2E;
  --muted: #4A5568;
  --faint: #718096;
  --line: #DCE3EA;
  --accent: #2B8A99;
  --accent-ink: #1D6672;
  --accent-soft: #E1F1F3;
  --web: #6E52A3;
  --web-soft: #EFEAF7;
  --pass: #2F7D4F; --pass-soft: #E3F2E8;
  --hold: #A8650F; --hold-soft: #FBEEDB;
  --fail: #B23A3A; --fail-soft: #F8E3E3;
  --na: #64748B; --na-soft: #EDF1F5;
  --mast-fg: #F7FAFC;
  --shadow: 0 10px 30px rgba(0, 20, 51, .14);
  --font: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #07101D; --surface: #0D1A2C; --sunk: #12233A; --fg: #E7EDF4; --muted: #AEB9C7; --faint: #8492A6;
  --line: #22344D; --accent: #5DB7C5; --accent-ink: #8AD0DA; --accent-soft: #123A44; --web: #B49BE0; --web-soft: #2A2142;
  --pass: #6CC08F; --pass-soft: #14321F; --hold: #E5A95A; --hold-soft: #3A2A12; --fail: #EE8A8A; --fail-soft: #3D1A1D;
  --na: #9AA8BA; --na-soft: #1B2A3E; --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #07101D; --surface: #0D1A2C; --sunk: #12233A; --fg: #E7EDF4; --muted: #AEB9C7; --faint: #8492A6;
  --line: #22344D; --accent: #5DB7C5; --accent-ink: #8AD0DA; --accent-soft: #123A44; --web: #B49BE0; --web-soft: #2A2142;
  --pass: #6CC08F; --pass-soft: #14321F; --hold: #E5A95A; --hold-soft: #3A2A12; --fail: #EE8A8A; --fail-soft: #3D1A1D;
  --na: #9AA8BA; --na-soft: #1B2A3E; --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }

/* masthead */
.mast { background: var(--navy); color: var(--mast-fg); padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.mast h1 { font-size: 18px; font-weight: 700; letter-spacing: .01em; }
.mast .sub { font-size: 12px; color: #A9B8CC; }
.mast .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mast .mode { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid #2C4468; color: #C9D6E6; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #04121A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #04121A; } }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--fail); border-color: var(--fail); background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.mast .btn { background: transparent; color: var(--mast-fg); border-color: #2C4468; }
.mast .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* frame */
.frame { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100% - 64px); }
.rail { border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); }
.rail .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 14px 10px 4px; }
.rail button { text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
.rail button:hover { background: var(--sunk); color: var(--fg); }
.rail button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.rail .ct { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; align-self: center; }
main { padding-block: 22px 60px; padding-inline: 24px; min-width: 0; }
.vhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
.vhead h2 { font-size: 22px; font-weight: 700; }
.vhead p { margin: 4px 0 0; color: var(--muted); max-width: 72ch; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; }

@media (max-width: 860px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 16px; gap: 4px; }
  .rail .grp { display: none; }
  .rail button { white-space: nowrap; flex: none; }
  main { padding-inline: 16px; }
  .mast { padding: 12px 16px; }
}

/* panels & tiles */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.panel h3 small { font-weight: 400; color: var(--faint); font-size: 12px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer; text-align: left; }
.tile:hover { border-color: var(--accent); }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .s { font-size: 11px; color: var(--faint); }
.tile.pass .v { color: var(--pass); } .tile.hold .v { color: var(--hold); } .tile.fail .v { color: var(--fail); } .tile.web .v { color: var(--web); }

/* bar lists */
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr 40px; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; border: 0; background: none; padding: 2px 0; text-align: left; }
.bar:hover .lbl { color: var(--accent-ink); }
.bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
.bar .trk, .bar .fil { display: block; }
.bar .trk { height: 10px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar .fil { height: 100%; background: var(--accent); border-radius: 3px; }
.bar .fil.pass { background: var(--pass); } .bar .fil.hold { background: var(--hold); } .bar .fil.fail { background: var(--fail); } .bar .fil.na { background: var(--na); } .bar .fil.web { background: var(--web); }
.bar .n { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--muted); }

/* chips & badges */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; letter-spacing: .02em; }
.b-PASS { background: var(--pass-soft); color: var(--pass); }
.b-HOLD { background: var(--hold-soft); color: var(--hold); }
.b-FAIL { background: var(--fail-soft); color: var(--fail); }
.b-NA { background: var(--na-soft); color: var(--na); }
.b-web { background: var(--web-soft); color: var(--web); }
.b-fit { background: var(--accent-soft); color: var(--accent-ink); }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.q { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.q-provided { color: var(--pass); background: var(--pass-soft); }
.q-verify { color: var(--hold); background: var(--hold-soft); }
.q-conflict { color: var(--fail); background: var(--fail-soft); }
.q-missing { color: var(--na); background: var(--na-soft); }
.q-web { color: var(--web); background: var(--web-soft); }
.q-edited { color: var(--accent-ink); background: var(--accent-soft); }
.src { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.webmark { border-left: 3px solid var(--web); }
tr.webrow td:first-child { box-shadow: inset 3px 0 0 var(--web); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); align-items: center; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filters input[type="search"] { flex: 1 1 260px; min-width: 0; }
.inp, select.inp, textarea.inp { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 10px; min-width: 0; max-width: 100%; }
.filters select.inp { flex: 0 1 auto; }
.count { color: var(--muted); font-size: 13px; }

/* tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); background: var(--sunk); padding: 8px 10px; white-space: nowrap; position: sticky; top: 0; }
th button { border: 0; background: none; font-weight: 600; cursor: pointer; padding: 0; color: inherit; }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--sunk); }
td .nm { font-weight: 600; color: var(--fg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.scrow { display: grid; grid-template-columns: minmax(0, 1fr) 92px 64px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.scrow label { font-size: 13px; color: var(--fg); }
.scrow .na { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.scrow input[type=number] { width: 92px; text-align: center; }
.wbl { border-top: 1px solid var(--line); }
.wbl > summary { padding: 12px 16px; cursor: pointer; background: var(--sunk); }
.sm-sel { font-size: 12px; padding: 4px 6px; max-width: 100%; }
.sel { user-select: all; overflow-wrap: anywhere; }
td .al { font-size: 11px; color: var(--faint); }
td.wrap { max-width: 360px; }
.clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

/* shortlist cards */
.ctx { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.ctx button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--muted); }
.ctx button[aria-pressed="true"] { background: var(--navy); color: #F7FAFC; }
.rank { display: grid; grid-template-columns: 44px minmax(0, 1fr) 150px; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--line); align-items: start; cursor: pointer; }
.rank:first-of-type { border-top: 0; }
.rank:hover { background: var(--sunk); }
.rank .pos { font-family: var(--mono); font-size: 20px; color: var(--faint); }
.rank .title { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rank .title b { font-size: 15px; }
.rank .why { margin: 6px 0 4px; color: var(--fg); }
.rank .meta { font-size: 12px; color: var(--muted); }
.meter { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.score { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.gaps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.gap { font-size: 11px; color: var(--na); border: 1px dashed var(--na); border-radius: 4px; padding: 0 6px; }
@media (max-width: 640px) { .rank { grid-template-columns: 30px minmax(0, 1fr); } .rank .side { grid-column: 2; } }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(0, 20, 51, .35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--surface); z-index: 41; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dh { padding: 16px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.dh .row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.dh h2 { font-size: 19px; }
.db { overflow-y: auto; padding: 8px 20px 40px; }
.sec { padding: 14px 0; border-bottom: 1px solid var(--line); }
.sec h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.kv { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv dd .line { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.kv dd .val { white-space: pre-line; }
.kv dd .alt { font-size: 12px; color: var(--fail); margin-top: 2px; }
.kv dd .note { font-size: 12px; color: var(--muted); }
.copy { border: 0; background: none; color: var(--accent-ink); cursor: pointer; font-size: 11px; padding: 0 2px; }
.flag { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; font-size: 13px; padding: 5px 0; }
.parts { display: grid; gap: 4px; font-size: 13px; }
.parts .p { display: grid; grid-template-columns: minmax(0,1fr) 60px; gap: 8px; }
.parts .p span:last-child { text-align: right; font-family: var(--mono); font-size: 12px; }
@media (max-width: 560px) { .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; } .kv dt { margin-top: 8px; font-size: 12px; } .db, .dh { padding-inline: 16px; } }

/* modal */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(0, 20, 51, .45); }
.mbox { background: var(--surface); border-radius: 10px; width: min(860px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); min-height: 0; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.mbody { min-height: 0; }
.mbox header, .mbox footer { padding: 14px 18px; display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.mbox header { border-bottom: 1px solid var(--line); }
.mbox footer { border-top: 1px solid var(--line); }
.mbody { overflow-y: auto; padding: 14px 18px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 14px; }
.form label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.form .full { grid-column: 1 / -1; }
.form fieldset { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 0; }
.form legend { font-size: 12px; color: var(--muted); padding: 0 4px; }
.form .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.form .checks label { display: flex; gap: 6px; align-items: center; color: var(--fg); font-size: 13px; }
.fh { grid-column: 1 / -1; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin-top: 8px; }
textarea.inp { min-height: 64px; resize: vertical; }

.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--navy); color: #F7FAFC; padding: 9px 16px; border-radius: 6px; z-index: 60; font-size: 13px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.note-box { border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--surface); padding: 10px 14px; border-radius: 6px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.note-box.warn { border-left-color: var(--hold); }
.note-box.web { border-left-color: var(--web); }
.list { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.sugg { border: 1px solid var(--line); border-left: 3px solid var(--web); border-radius: 6px; padding: 12px 14px; background: var(--surface); display: grid; gap: 6px; }
.sugg .top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.sugg .srcs a { font-size: 12px; margin-right: 10px; overflow-wrap: anywhere; }
.cmp th:first-child, .cmp td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.cmp th { position: static; }
.cmp td { min-width: 200px; cursor: default; }
.cmp tbody tr { cursor: default; }
.cmp tbody tr:hover td { background: transparent; }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>

/* One adapter for every collection the page keeps: the shared artifact
   database when the viewer grants it, otherwise this browser's storage. */
const COLLS = ["vendorEdits", "webDecisions", "evaluations", "engagements", "perf", "assessments"];
const Store = {
  mode: "local", db: null, user: null, canWrite: true, uid: null, names: {},
  data: Object.fromEntries(COLLS.map(c => [c, {}])),
  get edits() { return this.data.vendorEdits; },
  get decisions() { return this.data.webDecisions; },
  async init() {
    try { COLLS.forEach(c => { this.data[c] = JSON.parse(localStorage.getItem("taVR." + c + ".v1") || "{}"); }); } catch (e) {}
    setMode();
    const c = window.claude;
    if (!c || typeof c.use !== "function") return;
    let db = null, user = null;
    try { [db, user] = await Promise.all([c.use("db"), c.use("user")]); } catch (e) { db = null; }
    if (!db) return;
    this.db = db; this.user = user; this.mode = "shared"; COLLS.forEach(k => { this.data[k] = {}; });
    try { if (user) { this.uid = await user.id(); const w = await user.can("data.write"); this.canWrite = w !== false; } } catch (e) {}
    setMode();
    COLLS.forEach(k => db.collection(k).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); }); this.data[k] = m;
      if (k === "vendorEdits" || k === "evaluations") resolveNames();
      render();
    }, () => { if (k === "vendorEdits") { this.mode = "error"; setMode(); } }));
  },
  async put(coll, id, body) {
    body = Object.assign({}, body, { updatedAt: NOW_ISO(), updatedBy: this.uid || "this browser" });
    id = safeId(id);
    if (this.mode === "shared") {
      try { await this.db.collection(coll).doc(id).set(JSON.parse(JSON.stringify(body))); }
      catch (e) { if (e && e.code === "invalid_argument") { this.canWrite = false; setMode(); toast("You have view-only access, so changes cannot be saved."); } else toast("Save failed: " + (e && e.message || "unknown error")); return false; }
    } else { this.data[coll][id] = body; this.persist(coll); }
    return true;
  },
  async del(coll, id) {
    id = safeId(id);
    if (this.mode === "shared") { try { await this.db.collection(coll).doc(id).delete(); } catch (e) { toast("Delete failed."); return false; } }
    else { delete this.data[coll][id]; this.persist(coll); }
    return true;
  },
  putEdit(id, body) { return this.put("vendorEdits", id, body); },
  dropEdit(id) { return this.del("vendorEdits", id); },
  decide(sid, decision) { return this.put("webDecisions", sid, { decision, at: NOW_ISO(), by: this.uid || "this browser" }); },
  persist(coll) { try { localStorage.setItem("taVR." + coll + ".v1", JSON.stringify(this.data[coll])); } catch (e) { toast("This browser blocked local storage; changes last only until reload."); } },
};
const safeId = id => String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g, "-").slice(0, 180) || "vendor";
function setMode() {
  const el = $("#modeChip");
  if (Store.mode === "shared") el.textContent = Store.canWrite ? "Shared · changes saved for all viewers" : "Shared · view only";
  else if (Store.mode === "error") el.textContent = "Storage unavailable";
  else el.textContent = "Local · changes saved in this browser";
  $("#btnAdd").disabled = !Store.canWrite; $("#btnImport").disabled = !Store.canWrite;
}
async function resolveNames() {
  const u = Store.user; if (!u || typeof u.profiles !== "function") return;
  const ids = [...new Set(Object.values(Store.edits).concat(Object.values(Store.data.evaluations), Object.values(Store.data.engagements)).map(e => e.updatedBy).filter(x => x && x !== "this browser"))];
  if (!ids.length) return;
  try { const ps = await u.profiles(ids); ids.forEach(id => { Store.names[id] = (ps[id] && ps[id].name) || ""; }); } catch (e) {}
}
const who = id => !id ? "" : id === "this browser" ? "this browser" : (Store.names[id] || "a team member");

let VENDORS = [], BY_ID = {};
function assemble() {
  const out = [];
  const base = RAW.vendors.concat(WEB_VENDORS.filter(w => (Store.decisions[w.id] || {}).decision !== "dismissed").map(webVendorRecord));
  const seen = new Set();
  for (const b of base) {
    const e = Store.edits[safeId(b.id)];
    seen.add(safeId(b.id));
    if (e && e.deleted) continue;
    const v = e && e.record ? Object.assign(clone(e.record), { _edited: e.updatedAt, _editedBy: e.updatedBy }) : b;
    if (b.origin === "web" && (Store.decisions[b.id] || {}).decision === "approved") v._approved = true;
    out.push(v);
  }
  for (const [id, e] of Object.entries(Store.edits)) {
    if (seen.has(id) || e.deleted || !e.record) continue;
    out.push(Object.assign(clone(e.record), { _edited: e.updatedAt, _editedBy: e.updatedBy }));
  }
  out.forEach(v => { if (v.vendorType && LEGACY_TYPE[v.vendorType.v]) v.vendorType = Object.assign({}, v.vendorType, { v: LEGACY_TYPE[v.vendorType.v] }); });

const deletedBase = () => {

  return base.filter(b => (Store.edits[safeId(b.id)] || {}).deleted).map(b => Object.assign({}, b, { _del: Store.edits[safeId(b.id)] }))
    .concat(Object.entries(Store.edits).filter(([id, e]) => e.deleted && e.record && !ids.has(id)).map(([, e]) => Object.assign({}, e.record, { _del: e })));
};
async function deleteVendor(id) {
  const v = BY_ID[id]; if (!v) return false;

}

const CTX = { exec: ["A", "Executive / CXO"], lead: ["B", "Senior leadership"], mid: ["C", "Junior–mid level"], all: [null, "All levels"] };
function rank(v, ctx) {
  const parts = [], gaps = [];
  const fit = ((v.shortlist && v.shortlist.fit) || "").trim().toLowerCase();
  const fitPts = { excellent: 30, "very good": 20, good: 12 }[fit] || 0;
  parts.push({ k: "CXO-fit rating", pts: fitPts, max: 30, c: "var(--accent)", ev: v.shortlist ? `${v.shortlist.fit} · ${v.shortlist.tier} (${v.shortlist.src})` : "Not on the CXO / leadership shortlist" });
  if (!v.shortlist) gaps.push("No CXO-fit rating");
  const st = v.status.stage1, pend = /additional information/i.test(v.status.reason || "");
  const stPts = st === "PASS" ? (pend ? 12 : 20) : st === "HOLD" ? 5 : 0;
  parts.push({ k: "Stage 1 assessment", pts: stPts, max: 20, c: "var(--pass)", ev: st + (v.status.reason ? " — " + v.status.reason : "") });
  if (st === "Not assessed") gaps.push("Stage 1 not assessed"); if (pend) gaps.push("Stage 1 info pending");
  const [mod] = CTX[ctx];
  let mPts = 0, mEv;
  const mv = m => (v.modules[m] || {}).v;
  if (mod) { mPts = mv(mod) === "yes" ? 18 : 0; mEv = `Module ${mod}: ${mv(mod) || "not recorded"}`; if (!mv(mod)) gaps.push(`Module ${mod} not recorded`); }
  else { mPts = ["A", "B", "C"].filter(m => mv(m) === "yes").length * 6; mEv = ["A", "B", "C"].map(m => `${m}: ${mv(m) || "—"}`).join(" · "); if (!Object.keys(v.modules).length) gaps.push("Modules not recorded"); }
  parts.push({ k: "Module coverage", pts: mPts, max: 18, c: "var(--navy)", ev: mEv });
  const la = latestAssessment(v);
  const sc = la ? la.five : parseFloat(fv(v, "score"));
  const scPts = sc >= 1 && sc <= 5 ? sc * 3 : 0;
  parts.push({ k: la ? "Assessment score" : "Workbook score", pts: scPts, max: 15, c: "var(--slate)", ev: la ? `${la.s.score.toFixed(2)} / ${la.s.scale.max} (${la.a.stage}, ${la.a.date})` : isNaN(sc) ? "No score in Base Data" : sc < 1 ? `${sc} recorded (outside 1–5; treated as not scored)` : `${sc} / 5` });
  if (isNaN(sc) || sc < 1) gaps.push("No assessment score");
  const ref = (v.clientRefs || []).find(r => r.q === "provided");
  parts.push({ k: "Client reference", pts: ref ? 7 : 0, max: 7, c: "var(--hold)", ev: ref ? `${ref.company} — ${ref.person || "contact"}` : "None provided" });
  if (!ref) gaps.push("No client reference");
  const dk = ["closureTimeline", "positionsClosed12m", "joiningRatio"].filter(k => has(v, k));
  parts.push({ k: "Delivery evidence", pts: dk.length * 10 / 3, max: 10, c: "var(--web)", ev: dk.length ? dk.map(k => FIELD_LABEL[k]).join(", ") : "No delivery metrics" });
  ["closureTimeline", "positionsClosed12m", "joiningRatio"].filter(k => !has(v, k)).forEach(k => gaps.push("Missing " + FIELD_LABEL[k].toLowerCase()));
  return { total: Math.round(parts.reduce((s, p) => s + p.pts, 0)), parts, gaps, excluded: st === "FAIL" };
}

async function submitFees(form) {

/* ----------------------------------------------------------- directory */
function filtered() {
  const q = UI.q.trim().toLowerCase();
  let list = VENDORS.filter(v => {
    if (UI.cat && !v.categories[UI.cat]) return false;
    if (UI.slcat === "any" && !slCat(v)) return false;
    if (UI.slcat === "none" && slCat(v)) return false;
    if (UI.slcat && SLCATS[UI.slcat] && slCat(v) !== UI.slcat) return false;
    if (UI.slcat && UI.slcat.startsWith("wb:") && !inList(v, UI.slcat.slice(3))) return false;
    if (UI.svc === "permanent" && !v.categories.permanent) return false;
    if (UI.svc === "staffAug" && !v.categories.staffAug) return false;
    if (UI.svc === "both" && !(v.categories.permanent && v.categories.staffAug)) return false;
    if (UI.svc === "none" && (v.categories.permanent || v.categories.staffAug)) return false;
    if (UI.status && v.status.stage1 !== UI.status) return false;
    if (UI.type === "recruit" && !isRecruiter(v)) return false;
    if (UI.type && UI.type !== "recruit" && UI.type !== "all" && v.vendorType.v !== UI.type) return false;
    if (UI.loc && locBucket(v) !== UI.loc) return false;
    if (UI.spec && !specBuckets(v).includes(UI.spec)) return false;
    if (UI.origin === "web" && v.origin !== "web") return false;
    if (UI.origin === "source" && v.origin !== "source") return false;
    if (UI.origin === "edited" && !v._edited) return false;
    if (UI.minScore && !(parseFloat(fv(v, "score")) >= +UI.minScore)) return false;
    if (UI.perf || UI.evYear) {
      const w = perfWindow(v.id);
      if (UI.perf === "evaluated" && w.summary === null) return false;
      if (UI.perf === "notEvaluated" && w.summary !== null) return false;
      if (UI.perf === "partial" && perfStatus(w) !== "partial") return false;
      if (UI.perf === "ge4" && !(w.summary >= 4)) return false;
      if (UI.perf === "lt3" && !(w.summary !== null && w.summary < 3)) return false;
      if (UI.evYear && !w.evs.some(e => +e.year === +UI.evYear)) return false;
    }
    if (UI.dq === "conflict" && !(Object.values(v.fields).some(f => f.q === "conflict") || v.flags.some(f => f.kind === "conflict"))) return false;
    if (UI.dq === "nocontact" && (has(v, "spocPhone") || has(v, "spocEmail"))) return false;
    if (UI.dq === "flagged" && !v.flags.length) return false;
    if (q) {
      const hay = [v.name, ...(v.aliases || []), ...Object.values(v.fields).map(f => f.v), ...(v.contacts || []).flatMap(c => [c.name, c.email, c.phone]), v.status.reason, v.shortlist && v.shortlist.why].join(" ").toLowerCase();
      if (!q.split(/\s+/).every(t => hay.includes(t))) return false;
    }
    return true;
  });
  const order = { PASS: 0, HOLD: 1, "Not assessed": 2, FAIL: 3 };
  const key = {
    name: v => v.name.toLowerCase(), status: v => order[v.status.stage1] ?? 9, score: v => { const la = latestAssessment(v); return -(la ? la.five : parseFloat(fv(v, "score")) || -1); },
    rank: v => -rank(v, UI.ctx).total, perf: v => -(perfWindow(v.id).summary ?? -1), loc: v => locBucket(v), updated: v => -(new Date(v._edited || v.lastUpdated || 0).getTime() || 0),
  }[UI.sort] || (v => v.name);
  return list.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * UI.dir || a.name.localeCompare(b.name); });

function originChip(v) { return v.origin === "web" ? `<span class="badge b-web">${v._approved ? "Web · approved" : "Web-suggested"}</span>` : v.origin === "added" ? `<span class="badge b-fit">Added</span>` : ""; }

function readEval(form) {

}
function liveEval(form) {

async function submitEval(form) {

  { const chk = readScores(form, (old && old.scaleSnapshot) || cfg.scale); if (chk.bad) { $("#evErr").textContent = chk.bad; return; } }

  if ((focusId === "fq" || focusId === "pq" || focusId === "cq") && $("#" + focusId)) { const el = $("#" + focusId); el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }

/* -------------------------------------------------------------- events */
document.addEventListener("click", async e => {
  if (e.target.closest("[data-stop]") && !e.target.closest("button")) return;
  const t = e.target.closest("button, [data-open], [data-close], input[type=checkbox]");
  if (t && t.matches("input[type=checkbox]") && !t.dataset.cmp) return;
  if (!t) return;
  const d = t.dataset;
  if (t.matches("input[data-cmp]")) { e.stopPropagation(); toggleCmp(d.cmp); return; }
  if (d.go !== undefined) return go(d.go, d.cat ? { cat: d.cat } : d.sltab ? { slTab: d.sltab } : d.type ? { type: d.type } : {});
  if (d.act) {
    const a = d.arg;
    if (d.act === "go") return a ? go(a) : null;
    if (d.act === "goDir") return go("directory", { type: "all" });
    if (d.act === "goStatus") { UI.stTab = a; return go("status"); }
    if (d.act === "goCat") return go("directory", { cat: a, type: "all" });
    if (d.act === "goSl") return go("shortlist", { slTab: a });
    if (d.act === "goSvc") return go("directory", { svc: a, type: "all" });
    if (d.act === "goType") return go("directory", { type: a });
    if (d.act === "goLoc") return go("directory", { loc: a });
    if (d.act === "goSpec") return go("directory", { spec: a, type: "all" });
    if (d.act === "clearCmp") { UI.compare = []; return render(); }
    if (d.act === "readyAll") { UI.readyAll = !UI.readyAll; return render(); }
    if (d.act === "feeCfg") { $("#layer").insertAdjacentHTML("beforeend", feeForm()); return; }
    if (d.act === "resetFees") { if (await Store.del("perf", "fees")) { t.closest(".modal").remove(); render(); toast("Default fee bands restored"); } return; }
    if (d.act === "perfCfg") { $("#layer").insertAdjacentHTML("beforeend", cfgForm()); return; }
    if (d.act === "addEval") { $("#layer").insertAdjacentHTML("beforeend", evalForm(null, "")); return; }
    if (d.act === "perfBand") { UI.pband = a; return render(); }
    if (d.act === "addCrit") { $("#critTable tbody").insertAdjacentHTML("beforeend", critRow({ id: "c-" + Date.now().toString(36), name: "", desc: "", weight: 5, active: true })); $("#critTable tbody tr:last-child .cr_name").focus(); return; }
    if (d.act === "resetCfg") { if (await Store.del("perf", "config")) { t.closest(".modal").remove(); render(); toast("Default criteria restored for new evaluations"); } return; }
  }
  if (d.sort) { UI.dir = UI.sort === d.sort ? -UI.dir : 1; UI.sort = d.sort; saveUI(); return render(); }
  if (d.ctx) { UI.ctx = d.ctx; saveUI(); return render(); }
  if (d.sltab) { UI.slTab = d.sltab; return render(); }
  if (d.readycat) { UI.readyCat = d.readycat; UI.readyAll = false; return render(); }
  if (d.st) { UI.stTab = d.st; return render(); }
  if (d.close !== undefined) return closeDrawer();
  if (d.assess) { $("#layer").insertAdjacentHTML("beforeend", assessForm(null, d.assess)); return; }
  if (d.editassess) { const a = Store.data.assessments[d.editassess]; if (a) $("#layer").insertAdjacentHTML("beforeend", assessForm(Object.assign({ _id: d.editassess }, a))); return; }
  if (d.delassess) { t.outerHTML = `<span class="count">Delete this assessment?</span> <button class="copy" type="button" data-delassessok="${esc(d.delassess)}">Yes, delete</button> <button class="copy" type="button" data-delno>Keep</button>`; return; }
  if (d.delassessok) { const vid = (Store.data.assessments[d.delassessok] || {}).vendorId; if (await Store.del("assessments", d.delassessok)) { render(); openDrawer(vid, "assess"); toast("Assessment deleted"); } return; }
  if (d.fill) { $("#layer").insertAdjacentHTML("beforeend", missingForm(d.fill)); const f = d.focus && $("#mf_" + d.focus); (f || $("#missingForm input, #missingForm textarea")).focus(); return; }
  if (d.addeval) { $("#layer").insertAdjacentHTML("beforeend", evalForm(null, d.addeval)); return; }
  if (d.editeval) { const ev = Store.data.evaluations[d.editeval]; if (ev) $("#layer").insertAdjacentHTML("beforeend", evalForm(Object.assign({ _id: d.editeval }, ev))); return; }
  if (d.deleval) { t.outerHTML = `<span class="count">Delete this evaluation?</span> <button class="copy" type="button" data-delevalok="${esc(d.deleval)}">Yes, delete</button> <button class="copy" type="button" data-delno>Keep</button>`; return; }
  if (d.delevalok) { const vid = (Store.data.evaluations[d.delevalok] || {}).vendorId; if (await Store.del("evaluations", d.delevalok)) { render(); openDrawer(vid, "perf"); toast("Evaluation deleted"); } return; }
  if (d.eng) { $("#layer").insertAdjacentHTML("beforeend", engForm(d.eng)); return; }
  if (d.engclear) { if (await Store.del("engagements", d.engclear)) { t.closest(".modal").remove(); render(); openDrawer(d.engclear, "perf"); toast("Engagement cleared"); } return; }
  if (d.rmcrit !== undefined) { t.closest("tr").remove(); return; }
  if (d.edit) return openEdit(d.edit);
  if (d.cmpBtn) { toggleCmp(d.cmpBtn); return; }
  if (d.uncmp) { toggleCmp(d.uncmp); return; }
  if (d.del) { $("#delZone").innerHTML = `<span class="count">Delete this vendor for everyone? You can restore it later.</span> <button class="btn sm danger" type="button" data-delok="${esc(d.del)}">Delete</button> <button class="btn sm" type="button" data-delno>Keep</button>`; return; }
  if (d.delno !== undefined) return openDrawer(openId, t.closest("#perfSec") ? "perf" : undefined);
  if (d.delok) { if (await deleteVendor(d.delok)) { closeDrawer(); render(); toast("Vendor deleted. Restore it from Deleted vendors."); } return; }
  if (d.rowdel) { const cell = t.closest("td"); cell.innerHTML = `<span class="al">Delete?</span> <button class="btn sm danger" type="button" data-rowdelok="${esc(d.rowdel)}">Yes</button> <button class="btn sm" type="button" data-rowdelno>No</button>`; return; }
  if (d.rowdelno !== undefined) return render();
  if (d.rowdelok) { if (await deleteVendor(d.rowdelok)) { UI.compare = UI.compare.filter(x => x !== d.rowdelok); render(); toast("Vendor deleted. Restore it from Deleted vendors."); } return; }
  if (d.restore) { if (await restoreVendor(d.restore)) { render(); toast("Restored"); } return; }
  if (d.copy) { try { await navigator.clipboard.writeText(d.copy); toast("Copied"); } catch (err) { const r = document.createRange(); r.selectNodeContents(t.previousElementSibling || t); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Press Ctrl+C to copy."); } return; }
  if (d.approve) return decide(d.approve, "approved");
  if (d.dismiss) return decide(d.dismiss, "dismissed");
  if (d.undo) return undoDecision(d.undo);
  if (d.cancel !== undefined) { t.closest(".modal").remove(); return; }
  if (d.x === "xlsx") return exportXlsx();
  if (d.x) return doExport(d.x);
  if (d.open) return openDrawer(d.open, d.tab);
  if (t.id === "btnAdd") return openEdit(null);
  if (t.id === "btnExport") return exportMenu();
  if (t.id === "btnImport") return $("#fileIn").click();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { const m = $("#layer .modal"); if (m) m.remove(); else if (openId) closeDrawer(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".rank[data-open], tr[data-open]")) { e.preventDefault(); openDrawer(e.target.dataset.open, e.target.dataset.tab); }
});
document.addEventListener("submit", e => {
  const f = e.target; if (!["editForm", "evalForm", "engForm", "cfgForm", "feeForm", "assessForm", "missingForm"].includes(f.id)) return;
  e.preventDefault();
  ({ editForm: submitEdit, evalForm: submitEval, engForm: submitEng, cfgForm: submitCfg, feeForm: submitFees, assessForm: submitAssess, missingForm: submitMissing })[f.id](f);
});
let qTimer;
document.addEventListener("input", e => {
  const id = e.target.id;
  const af = e.target.closest && e.target.closest("#assessForm"); if (af) { liveAssess(af); return; }
  const evf = e.target.closest && e.target.closest("#evalForm"); if (evf) { liveEval(evf); return; }
  if (id === "fq" || id === "pq" || id === "cq") { clearTimeout(qTimer); qTimer = setTimeout(() => { UI[{ fq: "q", pq: "pq", cq: "cq" }[id]] = e.target.value; render(); }, 160); }
});
document.addEventListener("change", e => {
  const map = { fcat: "cat", fsvc: "svc", fst: "status", ftype: "type", floc: "loc", fspec: "spec", fscore: "minScore", forig: "origin", fdq: "dq", fperf: "perf", fevy: "evYear", fslcat: "slcat", cscope: "cscope", ckind: "ckind", pscope: "pscope", psvc: "psvc", pcomp: "pcomp", pyear: "pyear", pband: "pband" };
  if (e.target.dataset && e.target.dataset.na) { const inp = e.target.closest(".scrow").querySelector("input[data-crit]"); inp.disabled = e.target.checked; if (e.target.checked) inp.value = ""; const fm = e.target.closest("form"); if (fm.id === "assessForm") liveAssess(fm); else liveEval(fm); return; }
  if (e.target.dataset && e.target.dataset.move) { moveVendor(e.target.dataset.move, e.target.value); return; }
  const ef = e.target.closest("#evalForm");
  if (ef && e.target.id === "ev_vendor" && !ef.dataset.id) { const vid = e.target.value; ef.closest(".modal").remove(); $("#layer").insertAdjacentHTML("beforeend", evalForm(null, vid)); return; }
  if (ef) { if (e.target.id === "ev_year") $("#ev_period").value = periodLabel(+e.target.value); liveEval(ef); return; }
  if (e.target.id === "cf_profile") { const f = e.target.closest("form"); CFG_DRAFT.profiles[CFG_DRAFT.cur].criteria = readCritTable(f); CFG_DRAFT.cur = e.target.value; $("#critTable tbody").innerHTML = CFG_DRAFT.profiles[CFG_DRAFT.cur].criteria.map((k, i) => critRow(k, i)).join(""); return; }
  if (e.target.id === "cf_min" || e.target.id === "cf_max") { const old = {}; document.querySelectorAll(".sc_def").forEach(i => { old[i.dataset.pt] = i.value; }); $("#scaleDefs").innerHTML = scaleDefs({ min: +$("#cf_min").value, max: +$("#cf_max").value, labels: old }); return; }
  if (map[e.target.id]) { UI[map[e.target.id]] = e.target.value; if (e.target.id === "ftype") saveUI(); render(); }
  if (e.target.id === "fileIn" && e.target.files[0]) { importFile(e.target.files[0]); e.target.value = ""; }
});
function toggleCmp(id) {
  const i = UI.compare.indexOf(id);
  if (i >= 0) UI.compare.splice(i, 1); else if (UI.compare.length >= 4) { toast("Compare holds four vendors. Remove one first."); render(); return; } else UI.compare.push(id);
  render();
}

render();
Store.init().then(render);
</script>
