    const merit = (meritLevel ? meritLevel + " programme merit. " : "Programme merit provisional (criteria not yet scored). ") + "The proposal would train " + scope + (pt.total !== null ? " at " + fmtINR(Math.round(pt.total)) + " per trainee" + (pt.public !== null ? " (" + fmtINR(Math.round(pt.public)) + " public)" : "") : "") + "." + (strengths.length ? " Strengths: " + strengths.slice(0, 3).join("; ") + "." : "") + (!comp.withheld ? " Composite " + comp.value.toFixed(2) + "/5." : "");

    // outcome rules (transparent)
    const crit = concerns.filter((x) => x.severity === "Critical");
    const blockMajor = concerns.filter((x) => x.severity === "Major" && x.blocking);
    const verifyOnly = concerns.filter((x) => x.blocking).length === 0 && concerns.some((x) => x.basis === "Verification" && x.severity === "Major");
    const why = [];
    let outcome;
    if (!comp.withheld && comp.value < 2.0) { outcome = "Do not recommend/reject"; why.push("Composite " + comp.value.toFixed(2) + " is below 2.00 (fundamental design gaps)."); }
    else if (crit.length || blockMajor.length >= 3) { outcome = "Return for revision/resubmission"; why.push(crit.length + " critical and " + blockMajor.length + " major blocking concern(s) must be resolved before shortlisting; these are fixable by resubmission."); }
    else if (blockMajor.length) { outcome = "Conditionally recommend subject to specified evidence"; why.push(blockMajor.length + " blocking concern(s) can be closed with specific evidence before shortlisting."); }
    else if (verifyOnly) { outcome = "Defer pending essential verification"; why.push("No design blockers remain, but independent verification is outstanding."); }
    else { outcome = "Recommend for approval"; why.push("No critical or blocking concerns remain open."); }
    if (comp.withheld) why.push("Scores are not complete, so merit is provisional.");
    if (!policyConfirmed(c)) why.push("Policy basis is provisional.");

    const blockers = concerns.filter((x) => x.blocking);
    const readiness = blockers.length
      ? "Not ready for shortlisting: " + blockers.length + " blocking item(s), led by: " + blockers.slice(0, 3).map((x) => trunc(x.text.split(" — ")[0].replace(/\.$/, ""), 150)).join("; ") + "."
      : "Ready to proceed" + (concerns.some((x) => x.basis === "Verification") ? " once independent verification is completed." : " subject to the standard agreement conditions.");
    const rationale =
      (outcome === "Return for revision/resubmission"
        ? "The programme concept has merit, but it is not ready. The gaps are mainly evidence and drafting issues rather than adverse findings, so revision and resubmission is proportionate. "
        : outcome === "Conditionally recommend subject to specified evidence"
        ? "The programme is sound and the remaining gaps can be closed with specific evidence before shortlisting. "
        : outcome === "Defer pending essential verification"
        ? "The design is acceptable, but a funding decision should wait for independent verification. "
        : outcome === "Do not recommend/reject"
        ? "The design has fundamental gaps that a resubmission is unlikely to close without a new proposal. "
        : "The proposal is complete and consistent on the evidence reviewed. ") +
      (crit.length ? "Critical: " + crit.slice(0, 2).map((x) => trunc(x.text.split(" — ")[0].replace(/\.$/, ""), 150)).join("; ") + ". " : "") +
      "A resubmission should be re-scored on the evidence supplied, without assuming a higher score.";
    const conditions = [];
    for (const x of concerns) {
      if (!x.action || !(x.blocking || x.severity === "Critical" || x.severity === "Major")) continue;
      if (!conditions.some((y) => norm(y) === norm(x.action))) conditions.push(x.action);
      if (conditions.length >= 7) break;
    }
    return { concerns, outcome, outcomeWhy: why, merit, readiness, rationale, conditions, generatedAt: new Date().toISOString() };
  }

  // Turns the rule-based draft into findings, strengths, compliance rows and a verification checklist, so the
  // report is substantive without a language model. Advisor- and Claude-written items are never replaced.
  const AREA_RULES = [
    [/fund|tranche|release|budget|cost|co-?fund|contribut|commitment/i, "Cost realism, financial capacity & co-funding"],
    [/placement|employer|salary/i, "Employment outcomes & employer commitments"],
    [/hours|curriculum|module|syllab/i, "Curriculum, practical training & certification"],
    [/certif|assess/i, "Assessment integrity & attendance"],
    [/women|inclusion|eligib|bengaluru|geograph/i, "Geographic & social inclusion"],
    [/entity|registration|cin|signatory/i, "Programme compliance"],
    [/batch|trainer|location|centre|calendar|duration/i, "Delivery experience, trainers & infrastructure"],
    [/grievance|protection|privacy|fee/i, "Trainee protection, grievance & privacy"],
    [/job role|labour/i, "Labour-market demand & target roles"],
    [/conflicting|instruction/i, "Internal consistency"],
  ];
  function seedRuleAnalysis(c, now) {
    const existing = (c.findings || []).filter((f) => f.origin !== "rule");
    const draft = buildAdvisoryDraft(Object.assign({}, c, { findings: existing }));
    const propText = (c.documents || []).filter((d) => PROPOSAL_ROLES.includes(d.role)).map((d) => textOf(d)).join("\n");
    const titles = new Set(existing.map((f) => norm(f.title)));
    const fresh = [];
    let n = 0;
    for (const x of draft.concerns) {
      if (["Finding", "Policy", "Extraction"].includes(x.basis)) continue;
      const title = x.text.split(" — ")[0].replace(/\.$/, "");
      if (titles.has(norm(title))) continue;
      const area = (AREA_RULES.find(([re]) => re.test(x.text)) || [null, "Internal consistency"])[1];
      fresh.push({
        id: "R" + ++n, kind: "weakness", area, title: trunc(title, 140), detail: x.text.length > 140 ? x.text : "",
        label: x.basis === "Evaluator calculation" ? "Evaluator calculation" : x.basis === "Proposal text" ? "Evaluator judgment" : "Missing/unverifiable evidence",
        severity: x.severity, evidence: (x.evidence || []).map((e) => ({ ...e, verified: e.excerpt ? verifyExcerpt(c, e).verified : undefined })),
        impact: "", action: x.action, party: /KDEM/.test(x.action) ? "KDEM" : /commitment letter from/i.test(x.action) ? "Co-funder" : "Applicant",
        actionStage: x.blocking ? "Before shortlisting/approval" : x.basis === "Missing information" && !/grievance|fees/i.test(x.text) ? "Missing information" : /grievance|fees/i.test(x.text) ? "Before disbursement" : "Implementation safeguard",
        basis: x.basis === "Benchmark" ? "Historical benchmark" : "Advisory safeguard", closureEvidence: "", status: "Open", origin: "rule",
      });
    }
    const b = analyseBudget(c.budget), fu = analyseFunding(c.funding);
    const strengths = [];
    const S = (title, detail, evidence, area) => { if (!titles.has(norm(title))) strengths.push({ id: "RS" + (strengths.length + 1), kind: "strength", area: area || "Cost realism, financial capacity & co-funding", title, detail, label: "Evaluator calculation", severity: "Observation", evidence: (evidence || []).filter((e) => e && e.doc), impact: "", action: "", party: "", actionStage: "Implementation safeguard", basis: "", closureEvidence: "", status: "Open", origin: "rule" }); };
    if (b.lines.length >= 5 && !b.issues.length && b.subtotals.length) S("Itemised budget recomputes exactly", b.lines.length + " budget lines and " + b.subtotals.length + " totals recompute without discrepancy.", [b.subtotals[b.subtotals.length - 1].cite]);
    const pt = perTrainee(factNumber(c, "totalCost"), fu.publicSum || factNumber(c, "publicFunding"), factNumber(c, "trainees"));
    if (pt.total !== null && (c.funding.sources || []).some((s2) => !s2.isPublic)) S("Private co-funding reduces the public cost per trainee", "Total " + fmtINR(Math.round(pt.total)) + " per trainee, of which " + fmtINR(Math.round(pt.public || 0)) + " is public funding (subject to the co-funder's commitment).", []);
    if (/\b(PF|EPF|ESI|offer letters?)\b/.test(propText)) S("Placement verification by documentary evidence", "The proposal refers to offer letters and/or PF/ESI records for placement verification.", [], "Employment outcomes & employer commitments");
    const places = ((c.facts.locations || {}).values || []).map((v) => v.value).join(" ");
    const beyond = KA_PLACES.some(([nm, re]) => nm !== "Bengaluru" && re.test(places));
    if (beyond) S("Delivery reaches beyond Bengaluru", "Places named include " + trunc(places.replace(/\s*\(mentioned[^)]*\)/g, ""), 120) + ".", [], "Geographic & social inclusion");
    c.findings = existing.concat(fresh, strengths);

    c.compliance = (c.compliance || []).filter((r) => r.origin !== "rule");
    const have = new Set(c.compliance.map((r) => norm(r.requirement)));
    const R = (category, requirement, status, evidence, action) => { if (!have.has(norm(requirement))) c.compliance.push({ id: uid("cmp"), category, requirement, clause: "", status, evidence, action, origin: "rule" }); };
    const pl = ((c.facts.placement || {}).values || []).map((v) => v.value).join("; ");
    const plPct = Math.max(0, ...(pl.match(/\d{2,3}(?=\s?%)/g) || []).map(Number));
    R("B", "70% placement commitment", !pl ? "Not addressed" : plPct >= 70 ? (/(within|month|salary|ctc|retention)/i.test(pl) ? "Met" : "Partially met") : "Not met", pl ? "Stated: " + trunc(pl, 120) : "No placement target found.", "Confirm denominator, window, salary floor and retention if KDEM confirms the norm.");
    R("B", "Self-funded 2–3 month refresher if target missed", /refresher|additional\s+skill\s+training/i.test(propText) ? "Partially met" : "Not addressed", /refresher|additional\s+skill\s+training/i.test(propText) ? "Further training for unplaced candidates is mentioned; terms to be checked." : "No refresher commitment found.", "Confirm applicability with KDEM.");
    R("B", "40% post-refresher placement floor", /post[- ]refresher/i.test(propText) ? "Partially met" : "Not addressed", "", "Confirm applicability with KDEM.");
    R("B", "70/20/10 trainee mix (freshers / unemployed / employed)", /70\s*\/\s*20\s*\/\s*10/.test(propText) ? "Met" : "Not addressed", "", "Confirm applicability with KDEM.");
    R("B", "Beyond-Bengaluru geographic focus", !places ? "Unable to verify" : beyond ? "Met" : "Not met", places ? trunc(places.replace(/\s*\(mentioned[^)]*\)/g, ""), 120) : "No places found.", beyond ? "Retain." : "Confirm geography requirement with KDEM.");
    const incons = factConflicts(c).length + b.issues.length + fu.issues.length + (c.checks || []).filter((k) => /discrepancy|Contradictory/.test(runCheck(k).verdict)).length;
    R("C", "Internal consistency of figures", incons ? "Inconsistent" : "Unable to verify", incons ? incons + " conflicting statement(s) or arithmetic discrepancy(ies) found." : "No conflicts found by the automatic checks; a full reading (or Claude analysis) is still needed.", incons ? "Single reconciled version of all figures." : "Advisor to confirm on full reading.");
    const priv = (c.funding.sources || []).filter((s2) => !s2.isPublic);
    if (priv.length) R("C", "Documented co-funder commitment", "Unable to verify", priv.map((s2) => s2.name + " " + fmtINR(parseINR(s2.amount))).join("; ") + " stated; no signed commitment on file.", "Signed commitment letter and CSR-plan confirmation.");
    R("C", "Funder-wise release schedule", (c.funding.tranches || []).length ? (fu.issues.some((i) => /Release/.test(i.type)) ? "Inconsistent" : "Met") : "Not addressed", (c.funding.tranches || []).length ? c.funding.tranches.length + " tranche(s) stated." : "No tranches or milestones stated.", "Release schedule per funder tied to verifiable milestones.");
    const cert = ((c.facts.certification || {}).values || []).map((v) => v.value).join("; ");
    R("C", "Certifying body and assessment standard", cert ? (/(NSQF|SSC|NASSCOM|NCVET)/i.test(cert) ? "Met" : "Partially met") : "Not addressed", trunc(cert, 140) || "Not stated.", "Name the assessor and certifying body.");
    R("C", "Trainee protection, grievance and data privacy", /grievance/i.test(propText) ? "Partially met" : "Not addressed", /grievance/i.test(propText) ? "Grievance mentioned; check scope." : "Not stated.", "Written commitments before disbursement.");
    R("C", "Monitoring and reporting cadence", /monthly|quarterly|\bMIS\b/i.test(propText) ? "Met" : "Not addressed", /monthly|quarterly|\bMIS\b/i.test(propText) ? "Periodic reporting / MIS described." : "Not stated.", "Retain.");

    if (!(c.verificationChecklist || []).length) c.verificationChecklist = [
      { area: "Entity and Registration", claim: "Confirm the contracting entity, CIN and status on MCA21.", howToCheck: "mca.gov.in master data" },
      { area: "Track Record and Reputation", claim: "Check MSDE/NSDC/state-mission blacklists and request completion/placement results of past projects.", howToCheck: "SIDH / NSDC notices; funder letters" },
      { area: "Placement and Salary Claims", claim: "Obtain programme-specific employer letters of intent.", howToCheck: "Applicant submission" },
      { area: "Financial Capacity", claim: "Obtain audited financial statements and the co-funder's signed commitment.", howToCheck: "Applicant and co-funder" },
    ];
    c.ruleAnalysisAt = (now || new Date()).toISOString();
    audit(c, "Rule-based analysis", "Findings and compliance drafted", fresh.length + " findings, " + strengths.length + " strengths, compliance rows refreshed");
    return { findings: fresh.length, strengths: strengths.length };
  }

  // What the report will contain, and what is still missing.
  function reportCompleteness(c) {
    const comp = composite(c.scores, c.policy && c.policy.compositeOverride);
    const scored = CRITERIA.filter((cr) => effectiveScore(c.scores[cr.id]) !== null).length;
    const weak = (c.findings || []).filter((f) => f.kind !== "strength");
    const items = [

      { id: "S1", kind: "weakness", area: "Cost realism, financial capacity & co-funding", title: "Other Expenses summary does not match itemised lines", detail: "", label: "Evaluator calculation", severity: "Critical", evidence: [cite("p.3", "Other Expenses (summary) ₹1,20,00,000")], impact: "", action: "Reconcile the budget.", party: "Applicant", actionStage: "Before shortlisting/approval", basis: "Advisory safeguard", closureEvidence: "", status: "Open", origin: "advisor" },

<script>
/* report.js */
/*
 * report.js — builds the editable Word report from a case using the `docx` library.
 * buildReport(docx, NWB, caseObj) and buildAnnex(docx, NWB, caseObj) return docx.Document objects.
 */
(function (root) {
  "use strict";

  const FONT = "Times New Roman";
  const BODY = 20; // 10 pt
  const SMALL = 18; // 9 pt (tables)
  const BLUE = "1F3864";
  const HEAD_FILL = "DCE3EE";
  const GROUP_FILL = "F1F4F8";

  function make(docx, N) {
    const { Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType, ShadingType, BorderStyle, ExternalHyperlink, Footer, PageNumber, HeadingLevel } = docx;
    const border = { style: BorderStyle.SINGLE, size: 4, color: "8A94A6" };
    const borders = { top: border, bottom: border, left: border, right: border, insideHorizontal: border, insideVertical: border };

    function runs(text, o) {
      o = o || {};

      const out = [];
      parts.forEach((p, i) => {

      });
      return out;
    }
    function P(text, o) {
      o = o || {};
      return new Paragraph({
        children: o.children || runs(text, o),
        alignment: o.align,
        spacing: { before: o.before || 0, after: o.after === undefined ? 80 : o.after, line: 252 },
        heading: o.heading,
        keepNext: o.keepNext,
        numbering: o.numbering,
        bullet: o.bullet ? { level: 0 } : undefined,
      });
    }
    function H1(text) {
      return new Paragraph({
        heading: HeadingLevel.HEADING_1,
        keepNext: true,
        spacing: { before: 200, after: 80 },
        border: { bottom: { style: BorderStyle.SINGLE, size: 6, color: BLUE, space: 2 } },
        children: [new TextRun({ text, bold: true, size: 24, font: FONT, color: BLUE })],
      });
    }
    function H2(text) {
      return new Paragraph({ keepNext: true, spacing: { before: 120, after: 60 }, children: [new TextRun({ text, bold: true, size: 21, font: FONT, color: BLUE })] });
    }
    function cell(content, o) {
      o = o || {};
      const children = Array.isArray(content) ? content : [new Paragraph({ children: content instanceof TextRun || content instanceof ExternalHyperlink ? [content] : runs(content, { size: SMALL, bold: o.bold, italics: o.italics }), alignment: o.align, spacing: { after: 0, line: 240 } })];
      return new TableCell({
        children,
        width: o.w ? { size: o.w, type: WidthType.DXA } : undefined,
        columnSpan: o.span,
        shading: o.fill ? { fill: o.fill, type: ShadingType.CLEAR, color: "auto" } : undefined,
        margins: { top: 40, bottom: 40, left: 80, right: 80 },
      });
    }
    function table(widths, header, rows) {
      const trs = [];
      if (header)
        trs.push(new TableRow({ tableHeader: true, cantSplit: true, children: header.map((h, i) => cell(h, { bold: true, fill: HEAD_FILL, w: widths[i] })) }));
      rows.forEach((r) => {
        if (!Array.isArray(r) && r.group) trs.push(new TableRow({ cantSplit: true, children: [cell(r.group, { bold: true, fill: GROUP_FILL, span: widths.length, w: widths.reduce((a, b) => a + b, 0) })] }));
        else trs.push(new TableRow({ cantSplit: true, children: r.map((v, i) => (v instanceof TableCell ? v : cell(v, { w: widths[i], align: typeof v === "string" && /^(₹|-?₹|\d)/.test(v) && v.length < 18 ? AlignmentType.RIGHT : undefined }))) }));
      });
      return new Table({ width: { size: widths.reduce((a, b) => a + b, 0), type: WidthType.DXA }, columnWidths: widths, borders, rows: trs });
    }
    function link(text, url) {
      return new ExternalHyperlink({ link: url, children: [new TextRun({ text, style: "Hyperlink", size: SMALL, font: FONT, color: "1F4E9A", underline: {} })] });
    }
    function cite(e) {
      if (!e) return "";
      const d = e.docName || e.doc;
      return (d ? d + ", " : "") + (e.loc || "");
    }
    function spacer() {
      return new Paragraph({ children: [], spacing: { after: 60 } });
    }
    function footer(label) {
      return new Footer({
        children: [
          new Paragraph({
            alignment: AlignmentType.CENTER,
            children: [
              new TextRun({ text: label + "  ·  Page ", size: 16, font: FONT, color: "555555" }),
              new TextRun({ children: [PageNumber.CURRENT], size: 16, font: FONT, color: "555555" }),
              new TextRun({ text: " of ", size: 16, font: FONT, color: "555555" }),
              new TextRun({ children: [PageNumber.TOTAL_PAGES], size: 16, font: FONT, color: "555555" }),
            ],
          }),
        ],
      });
    }
    const page = { size: { width: 11906, height: 16838 }, margin: { top: 1000, right: 1000, bottom: 1000, left: 1000 } }; // A4
    const FULL = 9906;
    const styles = {
      default: { document: { run: { font: FONT, size: BODY } } },
      characterStyles: [{ id: "Hyperlink", name: "Hyperlink", run: { color: "1F4E9A", underline: {} } }],
    };
    return { P, H1, H2, cell, table, link, cite, spacer, footer, page, FULL, styles, runs, TextRun, Paragraph, AlignmentType };
  }

  function docName(c, id) {
    const d = (c.documents || []).find((x) => x.id === id);
    return d ? d.shortName || d.name : id;
  }

  function cites(c, list, max) {
    return (list || [])
      .slice(0, max || 3)
      .map((e) => docName(c, e.doc) + " " + e.loc + (e.verified === false ? " [unverified]" : ""))
      .join("; ");
  }

  // full=true lists every calculation (annex); otherwise only material results for the main report.
  function arithmeticRows(N, c, full) {
    const rows = [];
    const b = N.analyseBudget(c.budget);
    const f = N.analyseFunding(c.funding);
    b.issues.forEach((i) => rows.push([i.label, N.fmtINR(i.stated), i.type === "Line arithmetic" ? "Qty × unit × frequency" : "Sum of components", N.fmtINR(i.computed), "Arithmetic error: " + N.fmtINR(i.diff)]));
    if (c.budget && c.budget.lines && c.budget.lines.length && !b.issues.length) {
      const total = b.subtotals.length ? b.subtotals[b.subtotals.length - 1] : null;
      rows.push(["Itemised budget (" + c.budget.lines.length + " lines, " + b.subtotals.length + " totals)", total ? N.fmtINR(total.statedN) : "—", "Qty × unit × frequency; each total = sum of components", total ? N.fmtINR(total.computed) : "—", "Consistent"]);
    }
    const pctRows = f.sources.filter((s) => s.statedPct !== "" && s.statedPct !== undefined && s.statedPct !== null);
    const pctBad = pctRows.filter((s) => s.status !== "Consistent");
    if (full) pctRows.forEach((s) => rows.push([s.name + " share", s.statedPct + "% / " + N.fmtINR(s.amountN), "Amount ÷ total project cost", s.calcPct === null ? "—" : s.calcPct.toFixed(2) + "%", s.status]));
    else pctBad.forEach((s) => rows.push([s.name + " share", s.statedPct + "% / " + N.fmtINR(s.amountN), "Amount ÷ total project cost", s.calcPct === null ? "—" : s.calcPct.toFixed(2) + "%", s.status]));
    if (f.reconDiff !== null && f.reconDiff !== undefined) {
      const ok = Math.abs(f.reconDiff) <= 0.5;
      if (full || !ok || pctRows.length)
        rows.push(["Funding sources" + (pctRows.length && !pctBad.length && !full ? " and stated shares" : ""), N.fmtINR(f.total), "Sum of sources" + (pctRows.length && !full ? "; each share ÷ total" : ""), N.fmtINR(f.sourceSum), ok ? "Consistent" : "Gap " + N.fmtINR(f.reconDiff)]);
    }
    f.tranches.filter((t) => t.summary).forEach((t) => {
      const bad = t.diff !== null && Math.abs(t.diff) > 0.5;
      let basis = "";
      if (bad && f.total !== null) {
        const firsts = f.tranches.filter((x) => !x.summary && x.funder === t.funder && x.amountN !== null && x.statedPct);
        if (firsts.length && firsts.every((x) => Math.abs((f.total * x.statedPct) / 100 - x.amountN) <= 0.5)) basis = " Tranche percentages were applied to the total project cost, not to this funder's share.";
      }
      rows.push(["Release schedule — " + t.funder, N.fmtINR(t.sum) + " (sum of tranches)", "Σ tranches vs funder's stated contribution", N.fmtINR(t.commitment), bad ? "Discrepancy: exceeds share by " + N.fmtINR(t.diff) + "." + basis : "Consistent"]);
    });
    const pt = N.perTrainee(N.factNumber(c, "totalCost"), N.factNumber(c, "publicFunding"), N.factNumber(c, "trainees"));
    if (pt.total !== null) {
      const stated = N.factNumber(c, "statedCostPerTrainee");
      rows.push(["Cost per trainee (total / public)", stated === null ? "Not stated" : N.fmtINR(stated) + " (total)", "Total cost ÷ trainees; public funding ÷ trainees", N.fmtINR(pt.total) + " / " + (pt.public === null ? "—" : N.fmtINR(pt.public)), stated === null ? "Evaluator calculation" : Math.abs(stated - pt.total) <= 0.5 ? "Consistent; public share is an evaluator calculation" : "Differs by " + N.fmtINR(N.round2(stated - pt.total))]);
    }
    (c.checks || []).forEach((ch) => {
      const r = N.runCheck(ch);
      const material = r.verdict === "Arithmetic discrepancy" || r.verdict === "Contradictory statements" || r.verdict === "Cannot compute";
      if (!full && !material && !ch.showInReport) return;
      rows.push([ch.label, r.applicant === null ? "—" : N.fmtNum(r.applicant), ch.formula.replace(/\*/g, "×"), r.computed === null ? "Cannot compute" : N.fmtNum(r.computed), r.verdict + (r.discrepancy ? " (" + N.fmtNum(r.discrepancy) + ")" : "") + (r.error ? ": " + r.error : "")]);
    });
    N.factConflicts(c).forEach((fc) => {
      const seen = [];
      fc.values.forEach((v) => {
        const key = String(v.value).trim().toLowerCase();
        const loc = (v.cite && v.cite.loc) || "";
        const ex = seen.find((x) => x.key === key);
        if (ex) { if (loc && !ex.locs.includes(loc)) ex.locs.push(loc); } else seen.push({ key, value: v.value, locs: loc ? [loc] : [] });
      });
      rows.push([fc.label, seen.map((s) => s.value + (s.locs.length ? " (" + s.locs.join(", ") + ")" : "")).join(" vs "), "Cross-check of statements", "—", "Contradictory statements — both retained"]);
    });
    return rows;
  }

  // Blank template — used whenever no usable proposal document is on file (no scores, no outcome).
  function buildTemplate(docx, N, c) {
    const K = make(docx, N);
    const ch = [];
    ch.push(K.P("NIPUNA KARNATAKA — PROPOSAL EVALUATION", { bold: true, size: 30, align: K.AlignmentType.CENTER, after: 20, color: "1F3864" }));
    ch.push(K.P("Karnataka Digital Economy Mission (KDEM)", { size: 22, align: K.AlignmentType.CENTER, after: 40 }));
    ch.push(K.P("BLANK TEMPLATE — no proposal has been evaluated. This document contains no scores, findings or recommendation.", { bold: true, color: "9C2A00", align: K.AlignmentType.CENTER, after: 120 }));
    const blank = "[to be completed]";
    ch.push(K.table([2600, K.FULL - 2600], null, ["Proposal title", "Submitting organisation", "Date submitted", "Evaluator", "Evaluation date", "Policy basis"].map((l) => [K.cell(l, { bold: true, fill: "F1F4F8", w: 2600 }), l === "Evaluator" ? N.ADVISOR + ", Independent Advisor / Evaluator" : l === "Evaluation date" ? N.fmtDate(c.meta.evalDate) : l === "Policy basis" ? N.complianceBasisStatement(c) : blank])));
    ch.push(K.H1("Section A: Quantitative Scoring"));
    ch.push(K.table([3000, 1000, K.FULL - 4000], ["Criterion", "Score", "Rationale and evidence"], N.CRITERIA.map((cr, i) => [(i + 1) + ". " + cr.name, "—", blank]).concat([["Composite (sum of four scores ÷ 4)", "—", "Not computed"]])));
    ch.push(K.H1("Section B: Qualitative / Conditional Compliance Checklist"));
    ch.push(K.P("Policy basis: " + N.complianceBasisStatement(c), { bold: true }));
    ch.push(K.table([2400, 1000, 1150, 2900, K.FULL - 7450], ["Requirement", "Basis", "Status", "Proposal evidence", "Required action"], [[blank, "—", "—", "—", "—"]]));
    ch.push(K.H1("Independent Verification Notes (Web/Reputation Check)"));
    ch.push(K.P(N.NO_VERIFICATION));
    N.VERIFY_AREAS.forEach((a) => { ch.push(K.H2(a)); ch.push(K.P(blank, { italics: true })); });
    ch.push(K.H1("Section C: Shortlisting Recommendation and Sign-off"));
    ch.push(K.P("Advisory outcome: [not available — no proposal evaluated]", { bold: true }));
    ch.push(K.P(N.ADVISOR + " — Advisor / Evaluator", { before: 160, after: 20 }));
    ch.push(K.P("Evaluation date: " + N.fmtDate(c.meta.evalDate), { after: 20 }));
    ch.push(K.P("Document status: " + c.meta.status, { italics: true }));
    return new docx.Document({ creator: N.ADVISOR, title: "NIPUNA Karnataka — Proposal Evaluation (blank template)", styles: K.styles, sections: [{ properties: { page: K.page }, footers: { default: K.footer("Blank template") }, children: ch }] });
  }

  function buildReport(docx, N, c) {
    if (!c.synthetic && !N.hasUsableProposal(c)) return buildTemplate(docx, N, c);
    const K = make(docx, N);
    const comp = N.composite(c.scores, c.policy.compositeOverride);
    const ch = [];

    ch.push(K.P("NIPUNA KARNATAKA — PROPOSAL EVALUATION", { bold: true, size: 30, align: K.AlignmentType.CENTER, after: 20, color: "1F3864" }));
    ch.push(K.P("Karnataka Digital Economy Mission (KDEM)", { size: 22, align: K.AlignmentType.CENTER, after: 40 }));
    const O = N.reportOptions ? N.reportOptions(c) : {};
    ch.push(K.P("Independent advisory evaluation" + (O.statusLine ? " · Document status: " + c.meta.status : ""), { italics: true, size: 18, align: K.AlignmentType.CENTER, after: 120, color: "444444" }));
    if (c.synthetic) ch.push(K.P("SYNTHETIC DEMONSTRATION — NOT A REAL APPLICANT", { bold: true, color: "B00020", align: K.AlignmentType.CENTER }));

    const tc = N.factNumber(c, "totalCost"), pf = N.factNumber(c, "publicFunding"), tr = N.factNumber(c, "trainees");
    const pt = N.perTrainee(tc, pf, tr);
    const meta = [
      ["Proposal title", N.factDisplay(c, "title")],
      ["Submitting organisation", N.factDisplay(c, "legalEntity")],
      ["Programme and roles", N.factDisplay(c, "programmeType") + (N.factDisplay(c, "jobRoles") !== "Not stated" ? " — " + N.factDisplay(c, "jobRoles") : "")],
      ["Proposal stage / version", c.meta.stage + (N.factDisplay(c, "versionStage") !== "Not stated" ? " — " + N.factDisplay(c, "versionStage") : "")],
      ["Date submitted", N.factDisplay(c, "submissionDate")],
      ["Project cost and funding", "Total " + N.fmtINR(tc) + "; public funding requested " + N.fmtINR(pf) + (N.factDisplay(c, "otherFunding") !== "Not stated" ? "; other: " + N.factDisplay(c, "otherFunding") : "")],
      ["Trainees and unit cost", (tr === null ? N.factDisplay(c, "trainees") : N.fmtNum(tr)) + " trainees; " + (N.factDisplay(c, "statedCostPerTrainee") === "Not stated" ? "cost per trainee not stated by applicant" : "stated " + N.factDisplay(c, "statedCostPerTrainee") + " per trainee") + "; recalculated " + N.fmtINR(pt.total) + " total and " + N.fmtINR(pt.public) + " public per trainee"],
      ["Evaluator", N.ADVISOR],
      ["Evaluation date", N.fmtDate(c.meta.evalDate)],
      ["Policy basis", N.policyConfirmed(c) ? "Current approved policy supplied and confirmed" : N.PROVISIONAL_BANNER],
    ];
    ch.push(K.table([2600, K.FULL - 2600], null, meta.map(([a, b]) => [K.cell(a, { bold: true, fill: "F1F4F8", w: 2600 }), b])));

    // Section A
    ch.push(K.H1("Section A: Quantitative Scoring"));
    ch.push(K.P("Each criterion is scored from 1.00 to 5.00 against fixed anchors (1 = fundamental gap or almost no evidence; 3 = adequate with material clarifications required; 5 = comprehensive, consistent and well-substantiated). Scores rate programme design and evidence; they do not by themselves determine the recommendation.", { size: 18 }));
    const scoreRows = N.CRITERIA.map((cr, i) => {
      const e = c.scores[cr.id] || {};
      const s = N.effectiveScore(e);
      let rationale = (e.human && e.human.rationale) || (e.ai && e.ai.rationale) || "";
      const flags = [];
      if (e.notScored) flags.push("Not scored — insufficient evidence for a defensible score.");
      else if (e.ai && e.ai.insufficient) flags.push("Insufficient evidence — provisional score.");
      if (e.human && e.ai && e.ai.score !== null && Number(e.human.score) !== Number(e.ai.score)) flags.push("Advisor-adjusted from draft " + Number(e.ai.score).toFixed(2) + (e.human.reason ? ": " + e.human.reason : "") + ".");
      const src = cites(c, e.ai && e.ai.cites, 3);
      return [(i + 1) + ". " + cr.name, s === null ? "Not scored" : s.toFixed(2), [rationale, flags.join(" "), src ? "Sources: " + src : ""].filter(Boolean).join("\n")];
    });
    scoreRows.push([K.cell("Composite (sum of four scores ÷ 4)", { bold: true, fill: "F1F4F8", w: 3000 }), K.cell(comp.withheld ? "Withheld" : comp.value.toFixed(2) + " / 5", { bold: true, fill: "F1F4F8", w: 1000 }), K.cell(comp.withheld ? comp.display + ": " + comp.missing.join(", ") + ". A full composite is not shown while any criterion is unscored." : "Unweighted mean. Composite is one input to the recommendation, not an approval threshold.", { fill: "F1F4F8", w: K.FULL - 4000 })]);
    ch.push(K.table([3000, 1000, K.FULL - 4000], ["Criterion", "Score", "Rationale and evidence"], scoreRows));

    const ar = O.arithmetic ? arithmeticRows(N, c, false) : [];
    if (ar.length) {
      ch.push(K.H2(O.arithmetic ? "Arithmetic and consistency checks" : "Discrepancies and conflicting statements"));
      ch.push(K.P("Calculated by the workbench from figures stated in the proposal. No tax, calendar or utilisation assumptions were added. Amounts rounded to the nearest paisa.", { size: 17, italics: true }));
      ch.push(K.table([2300, 1700, 2500, 1500, K.FULL - 8000], ["Item", "Applicant figure", "Formula / basis", "Calculated", "Result"], ar));
    }

    // Section B
    ch.push(K.H1("Section B: Qualitative / Conditional Compliance Checklist"));
    ch.push(K.P("Policy basis: " + N.complianceBasisStatement(c), { bold: !N.policyConfirmed(c), size: 19 }));
    const rows = [];
    for (const cat of O.safeguards ? ["A", "B", "C"] : ["A", "B"]) {
      rows.push({ group: cat + ". " + N.COMPLIANCE_CATS[cat] + (cat === "B" ? (O.explanatoryNotes ? "s (from earlier review practice; not current rules until confirmed by KDEM)" : "s") : "s") });
      const items = (c.compliance || []).filter((r) => r.category === cat);
      if (!items.length) rows.push([cat === "A" ? "No current approved policy requirement can be listed: no confirmed policy pack is on file." : "None recorded.", "—", "—", "—", "—"]);
      items.forEach((r) => rows.push([r.requirement + (r.clause ? " (" + r.clause + ")" : ""), cat === "A" ? "Policy" : cat === "B" ? "Benchmark" : "Safeguard", r.status, r.evidence, r.action]));
    }
    ch.push(K.table([2400, 1000, 1150, 2900, K.FULL - 7450], ["Requirement", "Basis", "Status", "Proposal evidence", "Required action"], rows));

    const weak = (c.findings || []).filter((f) => f.kind !== "strength" && f.status !== "Closed");
    const cond = weak.filter((f) => f.actionStage === "Before shortlisting/approval" || f.actionStage === "Before disbursement");
    cond.sort((a, b) => N.ACTION_STAGES.indexOf(a.actionStage) - N.ACTION_STAGES.indexOf(b.actionStage) || N.SEVERITIES.indexOf(a.severity) - N.SEVERITIES.indexOf(b.severity));
    if (cond.length) {
      ch.push(K.H2("Priority corrections and conditions"));
      ch.push(
        K.table(
          [380, 3600, 4126, K.FULL - 8106],
          ["#", "Finding and evidence", "Required submission / correction", "Responsible · stage"],
          cond.map((f, i) => [String(i + 1), f.title + " [" + f.severity + (f.basis && f.basis !== "Advisory safeguard" ? "; " + f.basis : "") + "]" + (f.evidence && f.evidence.length ? " — " + cites(c, f.evidence, 2) : ""), f.action + (f.closureEvidence ? "\nClosure evidence: " + f.closureEvidence : ""), f.party + " · " + (f.actionStage === "Before shortlisting/approval" ? "before shortlisting" : "before disbursement")])
        )
      );
    }
    const missing = weak.filter((f) => f.actionStage === "Missing information");
    if (missing.length) {
      ch.push(K.H2("Missing information (to be supplied by the applicant)"));
      missing.forEach((f, i) => ch.push(K.P((i + 1) + ". " + f.title + (f.action ? " — " + f.action : ""), { size: 19, after: 30 })));
    }
    const safe = weak.filter((f) => f.actionStage === "Implementation safeguard");
    if (safe.length) {
      ch.push(K.H2("Non-blocking improvements and implementation safeguards"));
      safe.forEach((f, i) => ch.push(K.P((i + 1) + ". " + f.title + (f.action ? " — " + f.action : ""), { size: 19, after: 30 })));
    }

    // Verification
    ch.push(K.H1("Independent Verification Notes (Web/Reputation Check)"));
    const ver = c.verification || [];
    if (!ver.length) {
      ch.push(K.P(N.NO_VERIFICATION, { bold: true }));
      ch.push(K.P("Checks required before a funding decision:", { size: 19 }));
      (c.verificationChecklist || []).forEach((v, i) => ch.push(K.P((i + 1) + ". [" + v.area + "] " + v.claim + (v.howToCheck ? " — " + v.howToCheck : ""), { size: 19, after: 30 })));
    } else {
      ch.push(K.P("Each note states the claim checked, the result, the source and its type, and the limitations. Search-result summaries and applicant-controlled sources are not treated as independent confirmation. Absence of public information is not treated as an adverse finding.", { size: 17, italics: true }));
      for (const area of N.VERIFY_AREAS) {
        const recs = ver.filter((v) => v.area === area);
        if (!O.allVerificationAreas && !/Entity|Track/.test(area)) continue;
        ch.push(K.H2(area));
        if (!recs.length) {
          ch.push(K.P("Not checked. " + ((c.verificationChecklist || []).filter((v) => v.area === area).map((v) => v.claim).join("; ") || ""), { size: 19, italics: true }));
          continue;
        }
        recs.forEach((v) => {
          const kids = K.runs("Claim checked: ", { bold: true, size: 19 })
            .concat(K.runs(v.claim + " ", { size: 19 }))
            .concat(K.runs("Result: ", { bold: true, size: 19 }))
            .concat(K.runs(v.result + " ", { size: 19 }))
            .concat(K.runs("Source: ", { bold: true, size: 19 }));
          if (v.url && /^https?:\/\//.test(v.url)) kids.push(K.link(v.sourceName || v.url, v.url));
          else kids.push(...K.runs(v.sourceName || "Supplied document", { size: 19 }));
          kids.push(...K.runs(" (" + v.sourceType + "; accessed " + N.fmtDate(v.date) + (O.verificationDetail ? "; " + v.enteredBy : "") + "). ", { size: 19 }));
          if (v.limitations && O.verificationDetail) kids.push(...K.runs("Limitations: " + v.limitations, { size: 19, italics: true }));
          ch.push(K.P("", { children: kids, after: 70 }));
        });
      }
    }

    // Section C
    ch.push(K.H1("Section C: Shortlisting Recommendation and Sign-off"));
    const d = c.decision || {};
    ch.push(K.P("", { children: K.runs("Advisory outcome: ", { bold: true }).concat(K.runs(d.outcome ? d.outcome.toUpperCase() : "NOT YET SELECTED", { bold: true, color: "1F3864" })) }));
    if (d.merit) ch.push(K.P("", { children: K.runs("Programme merit: ", { bold: true }).concat(K.runs(d.merit)) }));
    if (d.readinessNote) ch.push(K.P("", { children: K.runs("Current readiness: ", { bold: true }).concat(K.runs(d.readinessNote)) }));
    const rd = N.readiness(c);
    if (O.readinessWarning) rd.warnings.forEach((w) => ch.push(K.P(w, { bold: true, color: "9C2A00", size: 19 })));
    if (d.rationale) ch.push(K.P(d.rationale));
    const concernLines = String(d.concerns || "").split("\n").map((x) => x.trim()).filter(Boolean);
    if (concernLines.length) {
      ch.push(K.P("Areas of concern and points for the decision-maker:", { bold: true, after: 30 }));
      const main = concernLines.filter((x) => !/^\[(Minor|Observation)/.test(x));
      const rest = concernLines.length - main.length;
      main.slice(0, 12).forEach((x, i) => {
        const m = /^\[([^\]]+)\]\s*(.*)$/.exec(x);
        const kids = m ? K.runs((i + 1) + ". " + m[1].replace(", blocking", " (blocking)") + ": ", { bold: true, size: 18 }).concat(K.runs(m[2].split(" — ")[0].replace(/\.?$/, "."), { size: 18 })) : K.runs((i + 1) + ". " + x, { size: 18 });
        ch.push(K.P("", { children: kids, after: 25 }));
      });
      if (O.explanatoryNotes && (rest || main.length > 12)) ch.push(K.P((rest + Math.max(0, main.length - 12)) + " further minor point(s) and observations are listed in the internal annex.", { italics: true, size: 17 }));
    }
    if (d.principalConditions) {
      ch.push(K.P("Principal conditions:", { bold: true, after: 30 }));
      d.principalConditions.split("\n").filter((x) => x.trim()).forEach((x, i) => ch.push(K.P((i + 1) + ". " + x.replace(/^\s*\d+[.)]\s*/, ""), { after: 30, size: 19 })));
    }
    if (O.authority) ch.push(K.P("Decision authority: This is an independent advisory evaluation prepared for KDEM under the NIPUNA Karnataka initiative. It is not an approval, sanction or funding commitment by the Government of Karnataka or KDEM. The final decision rests with the competent authority, which may weigh considerations outside this review.", { italics: true, size: 18, before: 80 }));
    ch.push(K.P("Sign-off", { bold: true, before: 160, after: 20 }));
    ch.push(K.P(N.ADVISOR + " — Advisor / Evaluator", { after: 20 }));
    ch.push(K.P("Evaluation date: " + N.fmtDate(c.meta.evalDate), { after: 20 }));
    if (O.statusLine) ch.push(K.P("Document status: " + c.meta.status, { italics: true, after: 20 }));

    return new docx.Document({
      creator: N.ADVISOR,
      title: "NIPUNA Karnataka — Proposal Evaluation",
      description: "Advisory evaluation draft generated by the NIPUNA Karnataka Independent Proposal Review Workbench",
      styles: K.styles,
      sections: [{ properties: { page: K.page }, footers: { default: K.footer("NIPUNA Karnataka — Proposal Evaluation · Confidential advisory draft") }, children: ch }],
    });
  }

  function buildAnnex(docx, N, c) {
    const K = make(docx, N);
    const ch = [];
    ch.push(K.P("Evidence & verification notes", { bold: true, size: 28, color: "1F3864", after: 20 }));
    ch.push(K.P("Internal annex to the NIPUNA Karnataka proposal evaluation — " + N.factDisplay(c, "title") + ". Not for circulation to the applicant. Evaluation date " + N.fmtDate(c.meta.evalDate) + ".", { italics: true, size: 18 }));

    ch.push(K.H1("1. Source documents"));
    ch.push(K.table([2600, 1800, 1300, 1100, K.FULL - 6800], ["Document", "Role", "Version / date", "Extraction", "Warnings"],
      (c.documents || []).map((d) => [d.name, d.role, d.version || "—", d.extraction ? d.extraction.status + " (" + N.fmtNum(d.extraction.chars) + " chars)" : "—", ((d.extraction && d.extraction.warnings) || []).concat((d.injection || []).map((h) => "Embedded instruction at " + h.loc + " — treated as data")).join(" ") || "None"])));

    ch.push(K.H1("2. Extracted facts with citations"));
    const fr = [];
    N.FACT_FIELDS.forEach(([k, l]) => {
      const f = c.facts[k] || { values: [] };
      if (!f.values.length) fr.push([l, "Not stated", "—", f.note || ""]);
      f.values.forEach((v, i) => fr.push([i ? "" : l, String(v.value), (v.cite ? docName(c, v.cite.doc) + " " + v.cite.loc + (v.cite.verified === false ? " [excerpt not found]" : "") : "—"), (v.cite && v.cite.excerpt ? "“" + N.trunc(v.cite.excerpt, 160) + "”" : "") + (i === 0 && f.note ? " " + f.note : "")]));
    });
    (c.factsExtra || []).forEach((x) => x.values.forEach((v, i) => fr.push([i ? "" : x.label, String(v.value), v.cite ? docName(c, v.cite.doc) + " " + v.cite.loc : "—", v.cite && v.cite.excerpt ? "“" + N.trunc(v.cite.excerpt, 160) + "”" : ""])));
    ch.push(K.table([2300, 2300, 1500, K.FULL - 6100], ["Field", "Value", "Location", "Excerpt / note"], fr));

    const b = N.analyseBudget(c.budget);
    if (b.lines.length) {
      ch.push(K.H1("3. Budget recomputation"));
      const br = b.lines.map((l) => [l.label, String(l.qty), N.fmtNum(N.parseINR(l.unit)), String(l.freq || 1), N.fmtNum(l.statedN), N.fmtNum(l.computed), l.status]);
      b.subtotals.forEach((s) => br.push([K.cell(s.label, { bold: true, fill: "F1F4F8", w: 3000 }), "", "", "", N.fmtNum(s.statedN), N.fmtNum(s.computed), s.status]));
      ch.push(K.table([3000, 700, 1100, 700, 1350, 1350, K.FULL - 8200], ["Line", "Qty", "Unit (₹)", "Freq.", "Stated (₹)", "Computed (₹)", "Result"], br));
    }

    const allCalc = arithmeticRows(N, c, true);
    if (allCalc.length) {
      ch.push(K.H2("All calculations (applicant figure → formula → result)"));
      ch.push(K.table([2300, 1700, 2500, 1500, K.FULL - 8000], ["Item", "Applicant figure", "Formula / basis", "Calculated", "Result"], allCalc));
    }
    ch.push(K.H1("4. Findings register"));
    ch.push(K.table([400, 2700, 1300, 900, 3000, K.FULL - 8300], ["#", "Finding", "Evidence label", "Severity · status", "Evidence (location and excerpt)", "Origin"],
      (c.findings || []).map((f, i) => [String(i + 1), (f.kind === "strength" ? "[Strength] " : "") + f.title + ". " + f.detail, f.label, f.severity + " · " + f.status, (f.evidence || []).map((e) => docName(c, e.doc) + " " + e.loc + (e.verified === false ? " [excerpt not found]" : "") + ": “" + N.trunc(e.excerpt, 140) + "”").join("\n") || (f.verificationId ? "Verification record " + f.verificationId : "—"), f.origin === "ai" ? "AI draft" : f.origin === "rule" ? "Rule-based draft" : f.origin === "session" ? "Claude session draft" : f.origin === "prior" ? "Earlier review" : "Advisor"])));

    ch.push(K.H1("5. Verification records"));
    if (!(c.verification || []).length) ch.push(K.P(N.NO_VERIFICATION));
    (c.verification || []).forEach((v, i) => {
      const kids = K.runs((i + 1) + ". [" + v.area + "] " + v.claim + " — Result: " + v.result + ". Source: ", { size: 18 });
      if (v.url && /^https?:\/\//.test(v.url)) kids.push(K.link(v.url, v.url));
      else kids.push(...K.runs(v.sourceName || "—", { size: 18 }));
      kids.push(...K.runs(" · " + v.sourceType + " · " + N.fmtDate(v.date) + " · " + v.enteredBy + (v.excerpt ? " · Excerpt: “" + v.excerpt + "”" : "") + (v.limitations ? " · Limitations: " + v.limitations : ""), { size: 18 }));
      ch.push(K.P("", { children: kids, after: 60 }));
    });

    const allConcerns = String((c.decision || {}).concerns || "").split("\n").map((x) => x.trim()).filter(Boolean);
    if (allConcerns.length) {
      ch.push(K.H1("5a. Areas of concern (full list)"));
      allConcerns.forEach((x, i) => ch.push(K.P((i + 1) + ". " + x, { size: 18, after: 30 })));
    }
    ch.push(K.H1("6. Score history"));
    ch.push(K.table([3000, 1200, 1200, K.FULL - 5400], ["Criterion", "AI draft", "Advisor", "Reason for change"],
      N.CRITERIA.map((cr) => {
        const e = c.scores[cr.id] || {};
        return [cr.name, e.ai && e.ai.score !== null && e.ai.score !== undefined ? Number(e.ai.score).toFixed(2) : "—", e.human ? Number(e.human.score).toFixed(2) : e.notScored ? "Not scored" : "—", (e.human && e.human.reason) || ""];
      })));

    ch.push(K.H1("7. Audit trail"));
    ch.push(K.table([2100, 2200, 2000, K.FULL - 6300], ["When (UTC)", "Actor", "Action", "Detail"], (c.audit || []).slice(-60).map((a) => [a.at.replace("T", " ").slice(0, 16), a.actor, a.action, N.trunc(a.detail, 220)])));

    return new docx.Document({
      creator: N.ADVISOR,
      title: "Evidence & verification notes",
      styles: K.styles,
      sections: [{ properties: { page: K.page }, footers: { default: K.footer("Internal annex — Evidence & verification notes") }, children: ch }],
    });
  }

  const api = { buildReport, buildAnnex, arithmeticRows };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.NWBReport = api;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>
/* app.js */
/* app.js — React UI for the NIPUNA Karnataka Independent Proposal Review Workbench (htm, no build step). */
(function () {
  "use strict";
  const N = window.NWB, R = window.NWBReport;
  const { useState, useEffect, useMemo, useRef, useCallback } = React;
  const html = htm.bind(React.createElement);
  const clone = (o) => (typeof structuredClone === "function" ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
  const STAGES = [
    ["A", "Case"], ["B", "Documents"], ["C", "Facts"], ["D", "Analyse"], ["E", "Findings & scores"], ["F", "Decision"], ["G", "Report & save"],
  ];

  // ───────────────────────── capabilities ─────────────────────────
  async function useCap(name) {
    try {
      if (!window.claude || typeof window.claude.use !== "function") return null;
      return await window.claude.use(name);
    } catch (e) {
      return null;
    }
  }

  // ───────────────────────── storage ─────────────────────────
  const CHUNK = 60000;
  function makeStore(db, uid) {
    if (db && uid) {
      const col = () => db.collection("data/users/" + uid);
      return {
        mode: "db",
        label: "Saved to this artifact's private per-user store on claude.ai (only your account can read it).",
        async list() {
          const snap = await col().get();
          return snap.docs.filter((d) => d.id.startsWith("case__")).map((d) => ({ id: d.id.slice(6), ...d.data() })).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
        },
        async load(id) {
          const head = await col().doc("case__" + id).get();
          if (!head.exists) throw new Error("Case not found");
          const h = head.data();
          let s = "";
          for (let i = 0; i < h.parts; i++) {
            const p = await col().doc("part__" + id + "__" + i).get();
            if (!p.exists) throw new Error("Case data incomplete (part " + i + " missing)");
            s += p.data().s;
          }
          return JSON.parse(s);
        },
        async save(c) {
          const s = JSON.stringify(c);
          const parts = Math.ceil(s.length / CHUNK) || 1;
          let old = 0;
          try { const prev = await col().doc("case__" + c.id).get(); if (prev.exists) old = prev.data().parts || 0; } catch (e) { /* first save */ }
          for (let i = 0; i < parts; i++) await col().doc("part__" + c.id + "__" + i).set({ s: s.slice(i * CHUNK, (i + 1) * CHUNK) });
          for (let i = parts; i < old; i++) await col().doc("part__" + c.id + "__" + i).delete();
          await col().doc("case__" + c.id).set({ name: c.meta.caseName, updatedAt: c.updatedAt, parts, schema: N.SCHEMA, synthetic: !!c.synthetic });
        },
        async remove(id) {
          const head = await col().doc("case__" + id).get();
          const parts = head.exists ? head.data().parts || 0 : 0;
          for (let i = 0; i < parts; i++) await col().doc("part__" + id + "__" + i).delete();
          await col().doc("case__" + id).delete();
        },
      };
    }
    let ok = false;
    try { localStorage.setItem("nwb:probe", "1"); localStorage.removeItem("nwb:probe"); ok = true; } catch (e) { ok = false; }
    if (ok)
      return {
        mode: "local",
        label: "Saved in this browser only (the claude.ai store is not available in this view). Export the case file to keep a copy.",
        async list() {
          const out = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith("nwb:case:")) {
              try { const c = JSON.parse(localStorage.getItem(k)); out.push({ id: c.id, name: c.meta.caseName, updatedAt: c.updatedAt, synthetic: c.synthetic }); } catch (e) { /* skip */ }
            }
          }
          return out.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
        },
        async load(id) { return JSON.parse(localStorage.getItem("nwb:case:" + id)); },
        async save(c) { localStorage.setItem("nwb:case:" + c.id, JSON.stringify(c)); },
        async remove(id) { localStorage.removeItem("nwb:case:" + id); },
      };
    return { mode: "none", label: "No storage is available in this view. Use Export case file to keep your work.", async list() { return []; }, async load() { throw new Error("No storage"); }, async save() { throw new Error("No storage available — export the case file instead."); }, async remove() {} };
  }

  // ───────────────────────── document extraction ─────────────────────────
  async function extractPdf(buf) {
    if (!window.pdfjsLib) throw new Error("PDF library did not load.");
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
    const units = [];
    const imagePages = [];
    const OPS = pdfjsLib.OPS || {};
    const imgOps = [OPS.paintImageXObject, OPS.paintInlineImageXObject, OPS.paintImageXObjectRepeat].filter((x) => x !== undefined);
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const text = N.pdfItemsToText(tc.items);
      units.push({ loc: "p." + p, text });
      try {
        const ops = await page.getOperatorList();
        const imgs = ops.fnArray.filter((f) => imgOps.includes(f)).length;
        if (imgs && text.replace(/\s/g, "").length >= 25) imagePages.push("p." + p);
      } catch (e) { /* operator list unavailable */ }
    }
    const extraction = N.assessExtraction(units, "pdf");
    if (imagePages.length) extraction.warnings.push("Pages with embedded images: " + imagePages.join(", ") + ". Text inside images (scanned tables, infographics, logos) is not extracted — check these pages visually and add a transcription if they carry evidence.");
    return { units, extraction, kind: "pdf" };
  }
  async function extractDocx(buf) {
    if (!window.mammoth) throw new Error("DOCX library did not load.");
    const res = await mammoth.convertToHtml({ arrayBuffer: buf });
    const units = N.docxHtmlToUnits(res.value, (h) => new DOMParser().parseFromString(h, "text/html"));
    const extraction = N.assessExtraction(units, "docx");
    const msgs = (res.messages || []).filter((m) => m.type === "warning").map((m) => m.message);
    if (msgs.length) extraction.warnings.push("Converter notes: " + N.trunc(msgs.slice(0, 3).join("; "), 300));
    extraction.warnings.push("DOCX locations are headings, paragraphs and table rows; page numbers are not available. Footnotes, text boxes and headers/footers may be omitted by the converter.");
    return { units, extraction, kind: "docx" };
  }
  // One helper for every upload path: PDF or Word (.docx); plain text as a fallback.
  const ACCEPT = ".pdf,.docx,.doc,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document";
  async function fileToDoc(file, role, version) {
    const lower = file.name.toLowerCase();
    if (lower.endsWith(".doc")) throw new Error("This is the old Word format (.doc), which cannot be read in the browser. Open it in Word, choose File → Save As → Word Document (.docx) or PDF, and upload that file.");
    const buf = await file.arrayBuffer();
    let r;
    if (lower.endsWith(".pdf")) r = await extractPdf(buf);
    else if (lower.endsWith(".docx")) r = await extractDocx(buf);
    else if (lower.endsWith(".txt")) { const units = textToUnits(new TextDecoder().decode(buf)); r = { units, extraction: N.assessExtraction(units, "text"), kind: "text" }; }
    else throw new Error("Unsupported file type. Upload a PDF or a Word document (.docx).");
    const clean = file.name.replace(/^[0-9a-f]{8}-(?=.)/i, "");
    return { id: N.uid("D"), name: clean, shortName: N.trunc(clean.replace(/\.[^.]+$/, ""), 22), role, version: version || "", kind: r.kind, addedAt: N.todayISO(), units: r.units, extraction: r.extraction, injection: N.detectInjection(r.units) };
  }
  function reportFileName(c, kind) {
    const slug = (N.factDisplay(c, "legalEntity") !== "Not stated" ? N.factDisplay(c, "legalEntity").split(/[—(,]/)[0] : c.meta.caseName).replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "Proposal";
    const base = kind === "annex" ? "NIPUNA-Evidence-Annex" : N.hasUsableProposal(c) || c.synthetic ? "NIPUNA-Evaluation" : "NIPUNA-Evaluation-Blank-Template";
    return base + "_" + slug + "_" + c.meta.evalDate + ".docx";
  }

  function textToUnits(text) {
    return String(text)
      .split(/\n\s*\n/)
      .map((t) => t.trim())
      .filter(Boolean)
      .map((t, i) => ({ loc: "¶" + (i + 1), text: t }));
  }

  // ───────────────────────── small UI pieces ─────────────────────────
  function Field({ id, label, children, hint, wide }) {
    return html`<div className=${"field" + (wide ? " wide" : "")}><label htmlFor=${id}>${label}</label>${children}${hint ? html`<div className="hint">${hint}</div>` : null}</div>`;
  }
  function Badge({ tone, children, title }) {
    return html`<span className=${"badge " + (tone || "")} title=${title || ""}>${children}</span>`;
  }
  function Banner({ tone, children }) {
    return html`<div className=${"banner " + (tone || "")} role=${tone === "crit" ? "alert" : "status"}>${children}</div>`;
  }
  function Cite({ c, e, onOpen }) {
    if (!e) return null;
    const d = (c.documents || []).find((x) => x.id === e.doc);
    const name = d ? d.shortName || N.trunc(d.name, 18) : e.doc;
    const ok = e.verified !== false;
    return html`<button type="button" className=${"cite " + (ok ? "" : "bad")} onClick=${() => onOpen({ doc: e.doc, loc: e.loc, excerpt: e.excerpt })} title=${e.excerpt ? "“" + e.excerpt + "”" : "Open source"}>${name} ${e.loc}${ok ? "" : " · excerpt not found"}</button>`;
  }
  function Confirm({ label, confirmLabel, onConfirm, tone }) {
    const [armed, setArmed] = useState(false);
    if (!armed) return html`<button type="button" className=${"btn " + (tone || "")} onClick=${() => setArmed(true)}>${label}</button>`;
    return html`<span className="confirm"><span>${confirmLabel}</span><button type="button" className="btn danger" onClick=${() => { setArmed(false); onConfirm(); }}>Yes, continue</button><button type="button" className="btn ghost" onClick=${() => setArmed(false)}>Cancel</button></span>`;
  }

  // ───────────────────────── App ─────────────────────────
  function App() {
    const [caps, setCaps] = useState({ sample: null, downloads: null, ready: false });
    const [store, setStore] = useState(() => makeStore(null, null));
    const [cases, setCases] = useState([]);
    const [c, setC] = useState(null);
    const [dirty, setDirty] = useState(false);
    const [stage, setStage] = useState("A");
    const [viewer, setViewer] = useState(null);
    const [toast, setToast] = useState(null);
    const [busy, setBusy] = useState("");

    const say = useCallback((msg, tone) => { setToast({ msg, tone: tone || "ok", at: Date.now() }); }, []);
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 6000); return () => clearTimeout(t); }, [toast]);

    useEffect(() => {
      let live = true;
      (async () => {
        const [sample, downloads, db, user] = await Promise.all([useCap("sample"), useCap("downloads"), useCap("db"), useCap("user")]);
        let uid = null;
        try { uid = user ? await user.id() : null; } catch (e) { uid = null; }
        if (!live) return;
        const st = makeStore(db, uid);
        setCaps({ sample, downloads, ready: true });
        setStore(st);
        try { setCases(await st.list()); } catch (e) { say("Could not list saved cases: " + (e.message || e.code), "warn"); }
      })();
      return () => { live = false; };
    }, []);

    const update = useCallback((fn, auditAction, auditDetail) => {
      setC((prev) => {
        const next = clone(prev);
        fn(next);
        if (auditAction) N.audit(next, N.ADVISOR, auditAction, auditDetail);
        next.updatedAt = new Date().toISOString();
        return next;
      });
      setDirty(true);
    }, []);

    async function refreshList() { try { setCases(await store.list()); } catch (e) { /* ignore */ } }
    async function save() {
      if (!c) return;
      setBusy("Saving…");
      try {
        const snap = clone(c);
        N.audit(snap, N.ADVISOR, "Case saved", store.mode);
        await store.save(snap);
        setC(snap);
        setDirty(false);
        say("Saved.");
        refreshList();
        return true;
      } catch (e) {
        say("Save failed: " + (e.message || e.code || e) + ". Export the case file to keep your work.", "crit");
        return false;
      } finally { setBusy(""); }
    }
    async function open(id) {
      setBusy("Opening…");
      try {
        const obj = await store.load(id);
        const errs = N.validateCase(obj);
        if (errs.length) throw new Error(errs.join(" "));
        setC(obj); setDirty(false); setStage("A"); setViewer(null);
      } catch (e) { say("Could not open case: " + (e.message || e), "crit"); } finally { setBusy(""); }
    }
    async function startFromFile(file) {
      if (!file) return;
      setBusy("Reading " + file.name + "…");
      try {
        const doc = await fileToDoc(file, "Proposal (initial)", "");
        const nc = N.newCase("Review — " + doc.name.replace(/\.[^.]+$/, ""));
        nc.documents.push(doc);
        N.audit(nc, N.ADVISOR, "Document added", file.name + " as Proposal (initial) — extraction " + doc.extraction.status + ", " + doc.extraction.chars + " chars");
        const ax = doc.extraction.status === "failed" ? null : N.applyAutoExtract(nc, doc.id);
        if (ax) N.seedRuleAnalysis(nc);
        setC(nc); setDirty(true); setViewer(null);
        setStage(doc.extraction.status === "failed" ? "B" : "C");
        if (doc.extraction.status === "failed") say(file.name + ": the text could not be read reliably (scanned document?). See B. Documents for options.", "crit");
        else say("New case created from " + file.name + " (" + (doc.kind === "pdf" ? "PDF" : "Word") + "). " + (ax ? ax.added + " project details" + (ax.budgetLines ? " and " + ax.budgetLines + " budget lines" : "") + " extracted automatically — review them below, then press Save case." : ""));
      } catch (e) { say(file.name + ": " + (e.message || e), "crit"); } finally { setBusy(""); }
    }
    async function downloadReport(kind) {
      if (!c) return;
      try {
        const doc = kind === "annex" ? R.buildAnnex(docx, N, c) : R.buildReport(docx, N, c);
        const blob = await docx.Packer.toBlob(doc);
        const name = reportFileName(c, kind);
        if (await saveFile(name, blob)) {
          update(() => {}, kind === "annex" ? "Annex downloaded" : "Report downloaded", name);
          say("Downloaded " + name + ". Open it in Word to make final edits before sending to KDEM.");
        }
      } catch (e) { say("Could not build the Word file: " + (e.message || e), "crit"); }
    }
    function startNew() {
      setC(N.newCase("New proposal review")); setDirty(true); setStage("A"); setViewer(null);
    }
    async function loadBundled() {
      setBusy("Loading…");
      try {
        const r = await fetch("cases/bundled.case.json");
        if (!r.ok) throw new Error(r.status === 404 ? "no prepared case is published with this copy of the workbench" : "HTTP " + r.status);
        const obj = await r.json();
        const errs = N.validateCase(obj);
        if (errs.length) throw new Error(errs.join(" "));
        obj.id = N.uid("case");
        N.audit(obj, N.ADVISOR, "Bundled case opened", "Prepared in Claude Code session; saved as a new case copy");
        setC(obj); setDirty(true); setStage("A");
        say("Prepared case loaded as a new, unsaved copy. Review it, then press Save.");
      } catch (e) { say("Could not load the bundled case: " + (e.message || e), "crit"); } finally { setBusy(""); }
    }
    function loadDemo() { setC(N.makeSyntheticDemo()); setDirty(true); setStage("A"); say("Synthetic demonstration loaded. It describes a fictional applicant."); }
    async function importFile(file) {
      try {
        const obj = JSON.parse(await file.text());
        const errs = N.validateCase(obj);
        if (errs.length) throw new Error(errs.join(" "));
        N.audit(obj, N.ADVISOR, "Case imported", file.name);
        setC(obj); setDirty(true); setStage("F"); setViewer(null);
        say("Imported “" + obj.meta.caseName + "”. Press Save case to keep it. Download the Word report from the top bar or stage G.");
      } catch (e) { say("Import failed: " + (e.message || e), "crit"); }
    }
    async function removeCase() {
      if (!c) return;
      try { await store.remove(c.id); } catch (e) { say("Delete failed: " + (e.message || e), "crit"); return; }
      setC(null); setDirty(false); refreshList(); say("Case deleted from " + (store.mode === "db" ? "the claude.ai store" : "this browser") + ". Exported files are not affected.");
    }
    async function saveFile(filename, data) {
      if (!caps.downloads) { say("File saving is not available in this view. Open the artifact on claude.ai to download files.", "warn"); return false; }
      try { await caps.downloads.save({ filename, data }); return true; }
      catch (e) { if (e && e.code === "declined") say("Download declined.", "warn"); else say("Download failed: " + ((e && (e.message || e.code)) || e), "crit"); return false; }
    }

    const [pendingLeave, setPendingLeave] = useState(null);
    const topImportRef = useRef(null);
    const proceed = (p) => { setPendingLeave(null); setDirty(false); if (p.kind === "import") importFile(p.file); else { setC(null); setViewer(null); } };
    const requestLeave = (p) => (dirty ? setPendingLeave(p) : proceed(p));
    const openViewer = useCallback((v) => setViewer(v), []);
    const ctx = { c, update, caps, say, setBusy, openViewer, saveFile, store, setStage };

    return html`
      <div className="shell">
        <header className="top">
          <div className="brand">
            <div className="eyebrow">NIPUNA Karnataka · Independent review</div>
            <div className="title">${c ? c.meta.caseName : "Proposal Review Workbench"}</div>
          </div>
          <div className="top-actions">
            ${c ? html`<${Badge} tone="draft">${c.meta.status}</${Badge}>` : null}
            ${c && c.synthetic ? html`<${Badge} tone="crit">Synthetic demo</${Badge}>` : null}
            ${c ? html`<span className=${"save-state " + (dirty ? "dirty" : "")}>${dirty ? "Unsaved changes" : "Saved"}</span>` : null}
            ${c ? html`<button type="button" className="btn" onClick=${() => downloadReport("report")} disabled=${!!busy} title="Download the evaluation report as an editable Word document">Download Word report</button>` : null}
            ${c ? html`<button type="button" className="btn primary" onClick=${save} disabled=${!!busy || !dirty}>Save case</button>` : null}
            ${c ? html`<button type="button" className="btn" onClick=${() => topImportRef.current && topImportRef.current.click()} title="Open a .case.json file, e.g. one sent to you in chat">Import case file</button>` : null}
            <input ref=${topImportRef} id="top-import" type="file" accept=".json,application/json" hidden onChange=${(e) => { const f = e.target.files[0]; if (f) requestLeave({ kind: "import", file: f }); e.target.value = ""; }} />
            ${c ? html`<button type="button" className="btn ghost" onClick=${() => requestLeave({ kind: "home" })}>All cases</button>` : null}
          </div>
        </header>
        ${busy ? html`<div className="busy" role="status">${busy}</div>` : null}
        ${pendingLeave ? html`<div className="leavebar" role="alertdialog" aria-label="Unsaved changes">
          <span><b>This case has unsaved changes.</b> ${pendingLeave.kind === "import" ? "Opening “" + pendingLeave.file.name + "” will close it." : "Going to All cases will close it."}</span>
          <span className="row gap wrap">
            <button type="button" className="btn primary" onClick=${async () => { if (await save()) proceed(pendingLeave); }}>Save, then continue</button>
            <button type="button" className="btn danger-outline" onClick=${() => proceed(pendingLeave)}>Discard changes and continue</button>
            <button type="button" className="btn ghost" onClick=${() => setPendingLeave(null)}>Cancel</button>
          </span></div>` : null}
        ${!c
          ? html`<${Home} cases=${cases} store=${store} caps=${caps} onOpen=${open} onNew=${startNew} onNewFromFile=${startFromFile} onBundled=${loadBundled} onDemo=${loadDemo} onImport=${importFile} />`
          : html`
          <div className="workspace">
            <nav className="stages" aria-label="Workflow">
              ${STAGES.map(([k, l]) => html`<button type="button" key=${k} className=${"stage " + (stage === k ? "on" : "")} aria-current=${stage === k ? "step" : undefined} onClick=${() => setStage(k)}><span className="sk">${k}</span><span>${l}</span></button>`)}
            </nav>
            <main className="main">
              <${Warnings} c=${c} />
              ${stage === "A" ? html`<${StageCase} ...${ctx} />` : null}
              ${stage === "B" ? html`<${StageDocs} ...${ctx} />` : null}
              ${stage === "C" ? html`<${StageFacts} ...${ctx} />` : null}
              ${stage === "D" ? html`<${StageAnalyse} ...${ctx} />` : null}
              ${stage === "E" ? html`<${StageReview} ...${ctx} />` : null}
              ${stage === "F" ? html`<${StageDecision} ...${ctx} />` : null}
              ${stage === "G" ? html`<${StageReport} ...${ctx} onDelete=${removeCase} onDownload=${downloadReport} />` : null}
            </main>
            ${viewer ? html`<${Viewer} c=${c} v=${viewer} onClose=${() => setViewer(null)} />` : null}
          </div>`}
        ${toast ? html`<div className=${"toast " + toast.tone} role="status">${toast.msg}<button type="button" className="x" aria-label="Dismiss" onClick=${() => setToast(null)}>×</button></div>` : null}
      </div>`;
  }

  function Home({ cases, store, caps, onOpen, onNew, onNewFromFile, onBundled, onDemo, onImport }) {
    const fileRef = useRef(null);
    const propRef = useRef(null);
    return html`
      <main className="home">
        <section className="panel intro">
          <h1>Proposal Review Workbench</h1>
          <p>Prepare an independent advisory evaluation of a NIPUNA Karnataka skilling or employment proposal: source-cited facts, code-checked arithmetic, four-criterion scoring, a provisional compliance checklist, verification notes and an editable Word report. The workbench supports the advisor's judgement. It never issues a government approval.</p>
          <div className="upload-cta">
            <button type="button" className="btn primary big" onClick=${() => propRef.current && propRef.current.click()}>Upload a proposal — PDF or Word (.docx)</button>
            <input ref=${propRef} id="proposal-file" type="file" accept=${ACCEPT} hidden onChange=${(e) => { const f = e.target.files[0]; if (f) onNewFromFile(f); e.target.value = ""; }} />
            <span className="hint">Starts a new case with this file as the proposal. Add annexures, policy documents and earlier evaluations later in B. Documents.</span>
          </div>
          <div className="row gap wrap">
            <button type="button" className="btn" onClick=${onNew}>Empty case</button>
            <button type="button" className="btn" onClick=${onBundled}>Open the prepared case</button>
            <button type="button" className="btn ghost" onClick=${onDemo}>Load synthetic demo</button>
            <button type="button" className="btn ghost" onClick=${() => fileRef.current && fileRef.current.click()}>Import case file (.json)</button>
            <input ref=${fileRef} id="import-file" type="file" accept=".json,application/json" hidden onChange=${(e) => { const f = e.target.files[0]; if (f) onImport(f); e.target.value = ""; }} />
          </div>
        </section>
        <section className="panel">
          <h2>Saved cases</h2>
          <p className="hint">${store.label}</p>
          ${cases.length
            ? html`<ul className="caselist">${cases.map((k) => html`<li key=${k.id}><button type="button" className="linkish" onClick=${() => onOpen(k.id)}>${k.name}</button>${k.synthetic ? html` <${Badge} tone="crit">Synthetic</${Badge}>` : null}<span className="muted"> · updated ${String(k.updatedAt || "").slice(0, 10)}</span></li>`)}</ul>`
            : html`<p className="muted">No saved cases yet. Start a new case, or open the prepared case if one is published with this workbench.</p>`}
        </section>
        <${Privacy} store=${store} caps=${caps} />
      </main>`;
  }

  function Privacy({ store, caps }) {
    return html`<section className="panel privacy">
      <h2>Where your documents go</h2>
      <ul>
        <li><b>Reading files:</b> PDF and DOCX files are parsed in this browser tab. The files themselves are not uploaded; the extracted text is kept in the case.</li>
        <li><b>Saving:</b> ${store.label}</li>
        <li><b>AI analysis:</b> ${caps.sample ? "when you press an analysis button, the extracted text of the proposal documents is sent to Claude under your own claude.ai account. Nothing is sent until you confirm." : "Claude is not available in this view. You can copy the prompt into a Claude chat yourself and paste the JSON answer back."} Text sent to Claude leaves this browser.</li>
        <li><b>Web verification:</b> this workbench cannot browse. Enter verification evidence yourself; such records are labelled “Advisor-entered verification”.</li>
        <li><b>Deletion:</b> Delete case removes it from the store above. It does not remove files you exported, and no guarantee is made about copies held elsewhere.</li>
        <li><b>Personal data:</b> do not upload trainee lists or identity documents; the report should not contain trainee identifiers.</li>
      </ul>
    </section>`;
  }

  function Warnings({ c }) {
    const usable = N.hasUsableProposal(c) || c.synthetic;
    const rd = N.readiness(c);
    const inj = (c.documents || []).flatMap((d) => (d.injection || []).map((h) => d.name + " " + h.loc));
    return html`<div className="warnings">
      ${c.synthetic ? html`<${Banner} tone="crit">Synthetic demonstration — fictional applicant and figures. Not for real decisions.</${Banner}>` : null}
      ${!usable ? html`<${Banner} tone="warn">No usable proposal document on file. Scoring, findings and recommendations are disabled; only a blank template can be exported.</${Banner}>` : null}
      ${!N.policyConfirmed(c) ? html`<${Banner} tone="warn">${N.PROVISIONAL_BANNER}</${Banner}>` : null}
      ${inj.length ? html`<${Banner} tone="crit">Embedded instructions found in applicant documents (${inj.join("; ")}). They are treated as data and never followed.</${Banner}>` : null}
      ${rd.warnings.map((w, i) => html`<${Banner} key=${i} tone="crit">${w}</${Banner}>`)}
    </div>`;
  }

  // ───────────────────────── A. Case ─────────────────────────
  function StageCase({ c, update }) {
    const m = c.meta;
    const set = (k) => (e) => { const v = e.target.type === "checkbox" ? e.target.checked : e.target.value; update((x) => { x.meta[k] = v; }, "Case details edited", k + " → " + v); };
    return html`<section className="panel">
      <h2>A. Case details</h2>
      <div className="grid2">
        <${Field} id="case-name" label="Case name"><input id="case-name" value=${m.caseName} onChange=${set("caseName")} /></${Field}>
        <${Field} id="case-stage" label="Proposal stage"><select id="case-stage" value=${m.stage} onChange=${set("stage")}>${N.STAGES.map((s) => html`<option key=${s}>${s}</option>`)}</select></${Field}>
        <${Field} id="case-date" label="Evaluation date" hint="Defaults to today; dates printed in reference reports are never used."><input id="case-date" type="date" value=${m.evalDate} onChange=${set("evalDate")} /></${Field}>
        <${Field} id="case-policy" label="Current approved policy supplied?"><select id="case-policy" value=${m.policySupplied} onChange=${set("policySupplied")}><option>No</option><option>Yes</option></select></${Field}>
        <${Field} id="case-research" label="External research" hint="This workbench cannot browse. Use “Manual evidence only” unless verification records come from a documented research step."><select id="case-research" value=${m.research} onChange=${set("research")}>${N.RESEARCH.map((s) => html`<option key=${s}>${s}</option>`)}</select></${Field}>
        <${Field} id="case-status" label="Document status"><input id="case-status" value=${m.status} onChange=${set("status")} /></${Field}>
        <${Field} id="case-concerns" label="Special concerns" wide=${true}><textarea id="case-concerns" rows="3" value=${m.concerns} onChange=${set("concerns")}></textarea></${Field}>
      </div>
      <label className="check"><input id="case-ack" type="checkbox" checked=${!!m.confidentialityAck} onChange=${set("confidentialityAck")} /> I will treat the applicant's documents as confidential, and I understand that AI analysis sends their text to Claude under my account.</label>
      ${m.policySupplied === "Yes" ? html`<${PolicyConfirmations} c=${c} update=${update} />` : null}
    </section>`;
  }

  function PolicyConfirmations({ c, update }) {
    const [f, setF] = useState({ name: "", role: "", date: N.todayISO(), scope: "" });
    const add = () => {
      if (!f.name.trim() || !f.role.trim() || !f.scope.trim()) return;
      update((x) => { x.policy.confirmations.push({ ...f }); }, "Officer policy confirmation recorded", f.name + ", " + f.role + ", " + f.date + ", scope: " + f.scope);
      setF({ name: "", role: "", date: N.todayISO(), scope: "" });
    };
    return html`<div className="sub">
      <h3>Officer confirmation of policy currency</h3>
      <p className="hint">Record only a documented confirmation from a KDEM officer (name, role, date, scope). The workbench never creates or assumes one. A document with role “Current approved policy” must also be on file.</p>
      ${(c.policy.confirmations || []).map((p, i) => html`<div className="kv" key=${i}>${p.name} · ${p.role} · ${p.date} · scope: ${p.scope} <button type="button" className="btn tiny ghost" onClick=${() => update((x) => { x.policy.confirmations.splice(i, 1); }, "Policy confirmation removed", p.name)}>Remove</button></div>`)}
      <div className="grid4">
        <input id="pc-name" placeholder="Officer name" value=${f.name} onChange=${(e) => setF({ ...f, name: e.target.value })} />
        <input id="pc-role" placeholder="Role" value=${f.role} onChange=${(e) => setF({ ...f, role: e.target.value })} />
        <input id="pc-date" type="date" value=${f.date} onChange=${(e) => setF({ ...f, date: e.target.value })} />
        <input id="pc-scope" placeholder="Scope (e.g. NIPUNA guidelines v2, clauses 4–7)" value=${f.scope} onChange=${(e) => setF({ ...f, scope: e.target.value })} />
      </div>
      <button type="button" className="btn" onClick=${add}>Record confirmation</button>
    </div>`;
  }

  // ───────────────────────── B. Documents ─────────────────────────
  function StageDocs({ c, update, say, setBusy, openViewer }) {
    const [role, setRole] = useState("Proposal (initial)");
    const [version, setVersion] = useState("");
    const [paste, setPaste] = useState({ name: "", text: "" });
    const fileRef = useRef(null);
    async function addFiles(files) {
      for (const file of Array.from(files)) {
        setBusy("Extracting " + file.name + "…");
        try {
          const doc = await fileToDoc(file, role, version);
          const r = doc;
          let ax = null;
          update((x) => { x.documents.push(doc); if (N.PROPOSAL_ROLES.includes(role) && doc.extraction.status !== "failed") { ax = N.applyAutoExtract(x, doc.id); N.seedRuleAnalysis(x); } }, "Document added", file.name + " as " + role + " — extraction " + r.extraction.status + ", " + r.extraction.chars + " chars");
          if (r.extraction.status === "failed") say(file.name + ": extraction unreliable — see the warnings. Supply an OCR-enabled copy or paste the text.", "crit");
          else say(file.name + " added (" + r.units.length + " locations, " + r.extraction.status + ")." + (N.PROPOSAL_ROLES.includes(role) ? " Project details were extracted automatically — see C. Project details." : ""));
        } catch (e) { say(file.name + ": " + (e.message || e), "crit"); }
      }
      setBusy("");
    }
    function addPaste() {
      if (!paste.text.trim()) return;
      const units = textToUnits(paste.text);
      const name = paste.name.trim() || "Pasted text";
      const doc = { id: N.uid("D"), name, shortName: N.trunc(name, 22), role, version, kind: "text", addedAt: N.todayISO(), units, extraction: N.assessExtraction(units, "text"), injection: N.detectInjection(units) };
      update((x) => { x.documents.push(doc); }, "Pasted text added", name + " as " + role);
      setPaste({ name: "", text: "" });
    }
    return html`<section className="panel">
      <h2>B. Documents</h2>
      <p className="hint">Assign each document a role before adding it. Reference reports are used for format only and are never sent as evidence. Annexures, tables and footnotes must be checked: pages without a text layer are flagged, not skipped silently.</p>
      <div className="grid3">
        <${Field} id="doc-role" label="Role for the next document"><select id="doc-role" value=${role} onChange=${(e) => setRole(e.target.value)}>${N.DOC_ROLES.map((r) => html`<option key=${r}>${r}</option>`)}</select></${Field}>
