<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OB Analysis Master Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky masthead; left curriculum rail (6 units, 12 modules) beside a reading pane.
   Module pane = Deep Dive tabs + Exam & Field Toolkit tabs. Collapses to one column below 880px.
   Palette: cool slate neutrals, university maroon accent, brass for evidence/practice highlights. */
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --sunk: #EAECF1;
  --ink: #1A1F2B;
  --muted: #566073;
  --line: #D7DBE3;
  --accent: #8A1C3A;
  --accent-ink: #FFFFFF;
  --accent-soft: #F6E5EA;
  --brass: #7F5E14;
  --brass-soft: #F4EBD5;
  --good: #1F6B45;
  --good-soft: #E1F1E8;
  --bad: #A2302C;
  --bad-soft: #F8E2E0;
  --ev-est: #2C6A4D;
  --ev-emg: #2A5A9C;
  --ev-int: #6A4A99;
  --ev-crit: #A2302C;
  --ev-prac: #7F5E14;
  --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 6px 18px rgba(20, 24, 40, .06);
  --f-display: "Spectral", Georgia, "Times New Roman", serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111319; --surface: #191C24; --sunk: #21252E; --ink: #E7E9EF; --muted: #A1A8B7; --line: #2E333F;
    --accent: #EB8FA4; --accent-ink: #1C0C12; --accent-soft: #3A1D27; --brass: #DDBA6B; --brass-soft: #372E1C;
    --good: #72D0A0; --good-soft: #193628; --bad: #F2948B; --bad-soft: #3D211F;
    --ev-est: #7BCFA4; --ev-emg: #8DB6F0; --ev-int: #BFA3EC; --ev-crit: #F2948B; --ev-prac: #DDBA6B;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111319; --surface: #191C24; --sunk: #21252E; --ink: #E7E9EF; --muted: #A1A8B7; --line: #2E333F;
  --accent: #EB8FA4; --accent-ink: #1C0C12; --accent-soft: #3A1D27; --brass: #DDBA6B; --brass-soft: #372E1C;
  --good: #72D0A0; --good-soft: #193628; --bad: #F2948B; --bad-soft: #3D211F;
  --ev-est: #7BCFA4; --ev-emg: #8DB6F0; --ev-int: #BFA3EC; --ev-crit: #F2948B; --ev-prac: #DDBA6B;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; font-weight: 600; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--f-mono); }

/* Masthead */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-inner { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; font-weight: 700; letter-spacing: .005em; }
.brand span { font-size: .78rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.topnav { display: flex; gap: 4px; flex-wrap: wrap; }
.topnav a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: .9rem; padding: 6px 10px; border-radius: 6px; }
.topnav a:hover { color: var(--ink); background: var(--sunk); }
.topnav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.search { position: relative; }
.search input { width: 190px; max-width: 60vw; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.score-pill { font-family: var(--f-mono); font-size: .8rem; padding: 5px 9px; border-radius: 999px; background: var(--brass-soft); color: var(--brass); white-space: nowrap; }

/* Frame */
.frame { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); align-self: start; max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 4px; }
.rail .rail-toggle { display: none; }
.rail h2 { font-family: var(--f-body); font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.unit-nav { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 4px; }
.unit-nav > li > .u-head { display: flex; gap: 8px; align-items: baseline; font-weight: 700; font-size: .88rem; color: var(--ink); padding: 8px 6px 2px; line-height: 1.3; }
.u-num { font-family: var(--f-mono); color: var(--accent); font-size: .8rem; flex: none; }
.mod-link { display: flex; gap: 8px; align-items: center; text-decoration: none; color: var(--muted); font-size: .9rem; padding: 6px 8px 6px 26px; border-radius: 6px; line-height: 1.3; }
.mod-link:hover { background: var(--sunk); color: var(--ink); }
.mod-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.mod-link .dots { margin-left: auto; display: flex; gap: 3px; flex: none; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dot.ok { background: var(--good); }
.dot.no { background: var(--bad); }

/* Generic blocks */
main { min-width: 0; }
.eyebrow { font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 68ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; }
.stack { display: grid; gap: 18px; }
.prose { max-width: 72ch; }
.prose ul, .prose ol { padding-left: 1.25em; margin: 0 0 .8em; }
.prose li { margin-bottom: .35em; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: .92rem; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.small { padding: 5px 10px; font-size: .84rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.t { color: var(--muted); border-color: var(--line); background: var(--sunk); font-weight: 600; }
.ev-est { color: var(--ev-est); } .ev-emg { color: var(--ev-emg); } .ev-int { color: var(--ev-int); } .ev-crit { color: var(--ev-crit); } .ev-prac { color: var(--ev-prac); }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
caption { text-align: left; font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; padding: 14px 16px 6px; }
th, td { text-align: left; vertical-align: top; padding: 9px 14px; border-top: 1px solid var(--line); }
th { font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--sunk); font-weight: 700; }
td:first-child { font-weight: 600; }
.matrix-tools { display: flex; justify-content: flex-end; padding: 8px 12px; border-top: 1px solid var(--line); }

/* Overview */
.hero { display: grid; gap: 12px; padding-bottom: 6px; }
.hero h1 { font-size: clamp(1.9rem, 3.4vw, 2.7rem); font-weight: 700; letter-spacing: -.01em; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.how .step { border-top: 3px solid var(--accent); background: var(--surface); padding: 14px 16px; border-radius: 0 0 var(--r) var(--r); border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.how .step b { display: block; font-family: var(--f-display); font-size: 1.02rem; margin-bottom: 4px; }
.how .step span { color: var(--muted); font-size: .93rem; }
.units { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.unit-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.unit-card h3 { font-size: 1.12rem; display: flex; gap: 10px; align-items: baseline; }
.unit-card h3 .u-num { font-size: .9rem; }
.unit-card .lbl { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.unit-card ul { margin: 2px 0 0; padding-left: 1.1em; font-size: .92rem; }
.unit-card .mods { display: grid; gap: 6px; }
.unit-card .mods a { text-decoration: none; font-weight: 600; font-size: .92rem; display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 6px; background: var(--sunk); color: var(--ink); }
.unit-card .mods a:hover { background: var(--accent-soft); color: var(--accent); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; }
.tick { color: var(--good); font-weight: 700; text-align: center; }
.thread-cell { text-align: center; }

/* Module */
.mod-head { display: grid; gap: 8px; }
.mod-head h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); }
.tabs { display: flex; flex-wrap: wrap; gap: 18px; border-bottom: 1px solid var(--line); margin-top: 6px; }
.tabgroup { display: flex; flex-direction: column; gap: 4px; }
.tabgroup > span { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.tabgroup > div { display: flex; flex-wrap: wrap; gap: 2px; }
.tab { border: 0; background: none; padding: 8px 11px; font-weight: 600; font-size: .92rem; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.adv { display: grid; gap: 12px; }
.adv-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; }
.adv-item header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.adv-item h3 { font-size: 1.05rem; }
.case-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.fict { display: inline-block; font-size: .78rem; font-weight: 700; color: var(--brass); background: var(--brass-soft); padding: 3px 9px; border-radius: 6px; letter-spacing: .03em; }
.measure-list { display: grid; gap: 10px; }
.measure { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px; }
.measure .mh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.measure .mh b { font-size: 1rem; }
.measure .lim { font-size: .92rem; color: var(--muted); }
.measure .lim b { color: var(--bad); font-weight: 700; }
.assess-note { border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--ink); border-radius: var(--r); padding: 12px 16px; font-size: .95rem; }
.caution { border-left: 4px solid var(--bad); background: var(--bad-soft); padding: 12px 16px; border-radius: 0 var(--r) var(--r) 0; font-size: .94rem; }

/* MCQ */
.mcq { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 12px; }
.mcq .qn { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.mcq .q { font-weight: 600; font-size: 1.02rem; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .k { font-family: var(--f-mono); font-weight: 500; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-size: .8rem; }
.opt[disabled] { cursor: default; }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.correct .k { background: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--surface); }
.opt .why { grid-column: 2; font-size: .9rem; color: var(--muted); margin-top: 4px; }
.verdict { font-weight: 700; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }

/* Challenge */
.challenge textarea { width: 100%; min-height: 180px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); resize: vertical; line-height: 1.5; }
.rubric { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.rubric label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; cursor: pointer; padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.rubric input { margin-top: 4px; accent-color: var(--accent); }
.meter { height: 8px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
.feedback { padding: 12px 16px; border-radius: 8px; background: var(--brass-soft); color: var(--ink); font-size: .95rem; }

/* Cheat sheet */
.cheat { list-style: none; counter-reset: c; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
.cheat li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 12px 14px; font-size: .95rem; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; }
.cheat li::before { counter-increment: c; content: counter(c, decimal-leading-zero); font-family: var(--f-mono); color: var(--accent); font-size: .8rem; padding-top: 2px; }

/* Pager */
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }

/* WHO-5 demo */
.who5 { display: grid; gap: 10px; }
.who5 .item { display: grid; grid-template-columns: minmax(0, 1fr) 140px 26px; gap: 12px; align-items: center; }
.who5 input[type=range] { width: 100%; accent-color: var(--accent); }
.who5 output { font-family: var(--f-mono); text-align: right; }
.who5-result { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 8px; background: var(--sunk); }
.who5-result .big { font-family: var(--f-display); font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.scale { position: relative; height: 10px; border-radius: 999px; background: linear-gradient(90deg, var(--bad) 0 28%, var(--brass) 28% 50%, var(--good) 50% 100%); flex: 1 1 200px; min-width: 160px; }
.scale i { position: absolute; top: -4px; width: 3px; height: 18px; background: var(--ink); border-radius: 2px; transform: translateX(-1px); }

/* Tools, exam, progress */
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: .86rem; font-weight: 600; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.prog-table td { font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--sunk); border-radius: 999px; overflow: hidden; min-width: 80px; }
.bar > i { display: block; height: 100%; background: var(--good); }
.result-list { display: grid; gap: 8px; }
.result-list a { display: block; text-decoration: none; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.result-list a:hover { border-color: var(--accent); }
.result-list small { display: block; color: var(--muted); }
mark { background: var(--brass-soft); color: var(--ink); padding: 0 2px; border-radius: 3px; }

/* Syllabus layer */
.paper-nav { border-bottom: 1px solid var(--line); padding: 4px 0; }
.paper-nav summary { display: flex; gap: 8px; align-items: baseline; cursor: pointer; font-weight: 700; font-size: .86rem; line-height: 1.3; padding: 7px 6px; border-radius: 6px; list-style: none; }
.paper-nav summary::-webkit-details-marker { display: none; }
.paper-nav summary::after { content: "+"; margin-left: auto; color: var(--muted); font-family: var(--f-mono); }
.paper-nav[open] summary::after { content: "−"; }
.paper-nav summary:hover { background: var(--sunk); }
.paper-nav .mod-link { padding-left: 14px; }
.lib-unit { font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px 8px 2px 14px; }
.paper-mods { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.paper-mods a { text-decoration: none; font-weight: 600; font-size: .92rem; display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 6px; background: var(--sunk); color: var(--ink); }
.paper-mods a:hover { background: var(--accent-soft); color: var(--accent); }
.unit-list { display: grid; gap: 2px; padding: 4px 10px 0; font-size: .86rem; color: var(--muted); }
.unit-list .mono { color: var(--ink); font-size: .76rem; }
.h-num { font-size: .55em; color: var(--accent); vertical-align: middle; font-weight: 500; letter-spacing: .02em; }
.slo-unit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; display: grid; gap: 10px; }
.slo-unit header { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.slo-unit h3 { font-size: 1.08rem; }
.u-code { color: var(--accent); font-size: .8rem; }
.tool-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; display: grid; gap: 10px; }
.tool-card header { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.tool-card h3 { font-size: 1.1rem; }
.tool-card dl { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: .94rem; }
.tool-card dt { color: var(--muted); font-weight: 700; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; padding-top: 3px; }
.tool-card dd { margin: 0; }
.scorer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.scorer-grid label { display: grid; gap: 4px; font-size: .84rem; font-weight: 600; color: var(--muted); }
.scorer-grid label.wide { grid-column: 1 / -1; }
.scorer-grid input { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-family: var(--f-mono); font-size: .9rem; width: 100%; }
tr.grp th { background: var(--accent-soft); color: var(--accent); text-transform: none; letter-spacing: 0; font-size: .86rem; }
@media (max-width: 600px) { .tool-card dl { grid-template-columns: minmax(0, 1fr); } .tool-card dd { margin-bottom: 6px; } }

@media (max-width: 880px) {
  .frame { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 14px 48px; }
  .rail { position: static; max-height: none; overflow: visible; }
  .rail .rail-toggle { display: inline-flex; margin-bottom: 10px; }
  .top { position: static; }
  .rail { top: auto; }
  .rail .rail-body[data-open="false"] { display: none; }
  .search input { width: 100%; max-width: none; }
  .search { flex: 1 1 100%; order: 5; }

/* Unit 1: Foundations, Neurobiology of Learning, and Individual Differences */
OB.modules.push({
  id: "m1-1", unit: 1,
  title: "Foundations of OB and the Neurobiology of Workplace Learning",
  threads: ["A", "N", "C"],
  construct: {
    def: `<p><b>Organizational Behaviour (OB)</b> is the systematic study of how individuals, groups and organizational structures shape behaviour at work, and how that behaviour affects performance, well-being and organizational effectiveness. It draws on psychology, sociology, anthropology and economics and works at three <b>levels of analysis</b>: individual, group and organization.</p>
<p><b>Learning</b> is operationally defined as <i>a relatively permanent change in behaviour, or in behavioural potential, that results from experience</i>. Maturation, fatigue and drug effects are excluded because they are not driven by experience.</p>`,
    framework: `<p>Three families of learning theory form the foundation:</p>
<ul>
<li><b>Classical conditioning</b> (Pavlov): a neutral stimulus paired with an unconditioned stimulus comes to elicit a conditioned response. At work it explains <i>emotional</i> reactions, such as the anxiety a manager's calendar invite can trigger.</li>
<li><b>Operant conditioning</b> (Skinner): behaviour is a function of its consequences. Positive and negative reinforcement increase behaviour; punishment and extinction reduce it. <b>Schedules</b> matter: continuous reinforcement produces fast acquisition and fast extinction, while variable-ratio schedules produce high, persistent response rates.</li>
<li><b>Social cognitive theory</b> (Bandura, 1977, 1986): people learn by observing models. Four sub-processes govern this: <i>attention, retention, reproduction and motivation</i>. Behaviour, person and environment influence one another (<b>triadic reciprocal determinism</b>). Self-efficacy sits at the centre of this theory (see Module 1.2).</li>
</ul>
<p>Applied to management, operant principles became <b>Organizational Behaviour Modification (OB Mod)</b> (Luthans &amp; Kreitner). Its five steps are: identify the critical behaviour, measure the baseline, run a functional (A-B-C) analysis, intervene, and evaluate.</p>`
  },
  advanced: [
    { ev: "est", title: "Reward prediction error", html: `<p>Schultz, Dayan &amp; Montague (1997, <i>Science</i>) showed that midbrain dopamine neurons in primates fire to the <i>difference</i> between expected and received reward, not to reward as such. A fully predicted reward produces little signal; an omitted expected reward depresses firing. <b>Interpretive bridge (theoretical, not directly tested in workplaces):</b> feedback that is informative and somewhat unexpected should carry more learning value than a predictable annual bonus. Treat the link to compensation design as an analogy, not a proven mechanism.</p>` },
    { ev: "est", title: "Retrieval practice and spacing", html: `<p>Testing yourself improves long-term retention more than re-studying (Roediger &amp; Karpicke, 2006), and distributed practice beats massed practice (Cepeda et al., 2006, meta-analysis). These are among the most robust findings in cognitive psychology. They argue for spaced micro-learning and scenario quizzes rather than single all-day workshops.</p>` },
    { ev: "est", title: "OB Mod works, with boundary conditions", html: `<p>Stajkovic &amp; Luthans (1997) meta-analysed OB Mod interventions and reported an average performance improvement of about 17%. Effects were larger in manufacturing than in service organizations. The <b>boundary condition</b>: behaviour-based reinforcement works best when the critical behaviour is observable and countable, which is harder for knowledge work.</p>` },
    { ev: "crit", title: "Neuromyths and learning styles", html: `<p>The idea that matching instruction to a learner's preferred "style" (visual, auditory, kinaesthetic) improves learning has not held up when tested properly (Pashler, McDaniel, Rohrer &amp; Bjork, 2008). Many educators still endorse neuromyths such as "we use only 10% of our brains" (Dekker et al., 2012). Be sceptical of training vendors who sell "brain-based" programmes without outcome data.</p>` },
    { ev: "prac", title: "Transfer of training", html: `<p>Baldwin &amp; Ford's (1988) model holds that transfer depends on <b>trainee characteristics</b> (ability, motivation), <b>training design</b> and the <b>work environment</b> (supervisor support, opportunity to perform). Meta-analytic work (Blume, Ford, Baldwin &amp; Huang, 2010) supports supervisor support and transfer climate as important predictors. The practical lesson is that most transfer failures are environmental, not instructional.</p>` },
    { ev: "emg", title: "Learning in hybrid and AI-augmented workplaces", html: `<p>Observational learning relies on <i>attention</i> to models. Remote work reduces incidental observation of experts, which may slow tacit-skill acquisition for newcomers. This is an active research area, and current evidence is mixed and context-dependent. Generative AI tools add a new kind of "model" whose outputs learners imitate. Whether this builds or erodes underlying skill is an open, emerging question.</p>` }
  ],
  matrices: [{
    caption: "Comparing learning theories in OB",
    head: ["Theory", "Core mechanism", "Key figures", "Workplace example", "Main limitation"],
    rows: [
      ["Classical conditioning", "Stimulus–stimulus association", "Pavlov; Watson", "Anxiety cued by appraisal meetings", "Explains reflexive and emotional responses, not voluntary skills"],
      ["Operant conditioning", "Consequences shape voluntary behaviour", "Skinner; Thorndike (law of effect)", "Recognition after safety-compliant behaviour", "Ignores cognition; risk of 'teaching to the metric'"],
      ["Social cognitive theory", "Observation, modelling, self-efficacy", "Bandura", "Junior staff copy how senior doctors respond to errors", "Model choice is hard to control; needs credible models"],
      ["Experiential learning", "Cycle of experience, reflection, conceptualisation, experimentation", "Kolb (1984)", "Action-learning projects with debriefs", "The cycle is a useful heuristic; the related learning-style inventory has weak psychometric support"],
      ["Cognitive and neuro view", "Prediction error, consolidation, retrieval", "Schultz; Roediger &amp; Karpicke", "Spaced scenario quizzes after onboarding", "Lab-to-workplace generalisation is often inferred, not tested"]
    ]
  }],
  case: {
    title: "The audit-only hand-hygiene problem",
    setting: "Fictional illustrative scenario: a 600-bed private multispecialty hospital in Chennai.",
    scenario: `<p>After a hospital-acquired infection cluster, the infection-control team introduced monthly announced audits of hand hygiene, with written warnings for non-compliance. Audit-day compliance exceeds 90%. Covert observation shows roughly half that on ordinary days. Senior consultants are frequently observed skipping hand rub between patients.</p>`,
    issue: `<p><b>Behavioural diagnosis.</b> The announced audit has become a <i>discriminative stimulus</i>: compliance is reinforced, or rather punishment is avoided, only when the audit is present, so the behaviour is under stimulus control. Punishment suppresses behaviour without teaching a replacement routine. Through social cognitive processes, staff are also modelling high-status consultants whose non-compliance carries no consequence.</p>`,
    intervention: `<ol><li><b>A-B-C analysis:</b> map antecedents (dispenser placement, workload peaks), the behaviour, and consequences.</li><li><b>Shift from punishment to frequent, immediate positive feedback.</b> Use unannounced peer observation with real-time ward-level dashboards.</li><li><b>Visible modelling:</b> recruit respected consultants and charge nurses as champions, using the attention and motivation processes in Bandura's model.</li><li><b>Environmental redesign:</b> put dispensers at the point of care so the behaviour is easy.</li><li><b>Evaluate:</b> use an interrupted time-series of covert-observation compliance and infection rates. A simple pre/post comparison is weaker.</li></ol>`
  },
  measures: [
    { name: "Kirkpatrick's four levels", type: "Evaluation framework", use: "Reaction, learning, behaviour, results. Structures training evaluation.", limits: "Levels are not causally linked; high reaction scores do not predict transfer. Level 4 attribution needs a comparison group." },
    { name: "Learning Transfer System Inventory (LTSI)", type: "Survey", use: "Diagnoses transfer climate factors such as supervisor support and opportunity to use learning (Holton, Bates &amp; Ruona, 2000).", limits: "Self-report; validate the factor structure locally before using subscale scores." },
    { name: "A-B-C functional analysis and behavioural observation", type: "Behavioural indicator", use: "Frequency counts of a defined behaviour under different antecedents.", limits: "Reactivity (behaviour changes when observed); needs clear operational definitions and inter-rater reliability checks." },
    { name: "Knowledge tests and work samples", type: "Learning outcome", use: "Measure skill acquisition directly.", limits: "Must be content-valid, mapped to a job analysis, rather than testing trivia." }
  ],
  assess: "Assessment link: evaluating training means separating reaction, learning, behaviour and results, and choosing a design (control group, time series) that supports causal claims.",
  mcqs: [
    { q: "A pharmaceutical sales team receives a bonus after an unpredictable number of closed accounts: sometimes after 3, sometimes after 7. Which schedule is this, and what is its typical effect?",
      options: ["Fixed-interval; scalloped responding just before payday", "Variable-ratio; high, steady responding that resists extinction", "Fixed-ratio; a pause after each reward", "Variable-interval; moderate, steady responding tied to time"],
      answer: 1,
      why: ["Wrong. Fixed-interval rewards depend on elapsed time, not on the number of responses.", "Correct. Reward follows an unpredictable <i>number</i> of responses. Variable-ratio schedules produce the highest, most persistent response rates, the same logic as slot machines.", "Wrong. The ratio here is not fixed. A fixed ratio, such as every 5th sale, often produces a post-reinforcement pause.", "Wrong. Variable-interval schedules depend on unpredictable <i>time</i> periods, not on response counts."] },
    { q: "A new analyst watched a senior colleague handle a difficult client flawlessly, remembers the steps, and has the skill, but does not use the approach because escalation is never rewarded. Which of Bandura's observational-learning processes is failing?",
      options: ["Attention", "Retention", "Motor reproduction", "Motivation"],
      answer: 3,
      why: ["Wrong. They watched the model closely, so attention was intact.", "Wrong. They remember the steps, so retention is intact.", "Wrong. They have the skill to reproduce the behaviour.", "Correct. Learning has occurred but performance does not follow, because anticipated consequences do not favour it. Bandura's distinction between <i>learning</i> and <i>performance</i> is central here."] },
    { q: "Which statement best represents the reward prediction error finding of Schultz, Dayan & Montague (1997)?",
      options: ["Dopamine neurons encode the pleasure experienced from a reward", "Dopamine neurons signal the discrepancy between expected and received reward", "Rewards are effective only if delivered on a continuous schedule", "Learning is impossible without dopamine release in the prefrontal cortex"],
      answer: 1,
      why: ["Wrong. This is a common misreading. The signal tracks <i>prediction error</i>, not hedonic pleasure.", "Correct. Unexpected reward increases firing, fully predicted reward produces little change, and omission of an expected reward depresses firing.", "Wrong. The finding concerns prediction, not schedules. Continuous reinforcement actually extinguishes quickly.", "Wrong. An overstatement. The study recorded midbrain dopamine neurons and did not claim dopamine is necessary for all learning."] }
  ],
  challenge: {
    title: "The high-satisfaction, low-transfer onboarding programme",
    scenario: `<p><i>Fictional scenario.</i> A Bengaluru software services firm runs a two-week classroom onboarding bootcamp for graduate engineers. Reaction surveys average 4.6/5 and end-of-course quiz scores are high. Six months later, code-review data show that new hires repeat the same security mistakes the bootcamp covered. Team leads say they are "too busy to coach", and most new hires work remotely three days a week.</p>`,
    tasks: ["Diagnose the transfer failure using Baldwin &amp; Ford's three factors.", "Identify which evidence you would collect, and at which Kirkpatrick level, to confirm your diagnosis.", "Design an intervention that uses at least two learning mechanisms from this module.", "Specify an evaluation design that could support a causal claim."],
    rubric: ["Recognises that high reaction and learning scores do not imply behaviour change (Kirkpatrick levels are not causally chained)", "Places the main failure in the work environment (supervisor support, opportunity to perform) rather than in course content", "Uses objective behavioural evidence such as code-review defect rates, not only self-report", "Applies spacing and retrieval practice (for example spaced code-security drills) and/or modelling (pairing with senior reviewers)", "Addresses remote work's effect on observational learning, for example recorded code walkthroughs or virtual pairing", "Proposes a comparison design: staggered rollout across cohorts, a matched control group, or a time series", "Identifies at least one contextual confound, such as project difficulty differing across teams"],
    model: `<p><b>Diagnosis.</b> Trainee characteristics and design are adequate: learning-level scores are high. The failure is environmental. There is no supervisor reinforcement, little opportunity to rehearse secure-coding behaviour with feedback, and reduced observational learning in remote work. Classroom massing also ignores spacing.</p><p><b>Evidence.</b> Level 3: defect rates per 1,000 lines of code in review, tagged by error type. Use the LTSI or a short transfer-climate survey to test supervisor-support hypotheses. Run a Level 2 retention re-test at 3 months to check forgetting.</p><p><b>Intervention.</b> (1) Spaced, retrieval-based micro-drills: weekly 10-minute secure-code puzzles. (2) Modelling through structured pair reviews with a senior engineer, including recorded walkthroughs for remote staff. (3) Immediate, specific feedback through automated static-analysis comments framed as learning prompts. (4) Make coaching a measured part of team leads' goals.</p><p><b>Evaluation.</b> Staggered rollout by cohort (a stepped-wedge-like design) with defect-rate time series. Control for project complexity.</p>`
  },
  cheat: [
    "Learning = a relatively permanent change in behaviour or potential, from experience.",
    "Reinforcement (positive or negative) increases behaviour. Punishment and extinction decrease it.",
    "Variable-ratio schedules give the highest, most persistent responding.",
    "Bandura's four observational processes: Attention, Retention, Reproduction, Motivation.",
    "Learning is not the same as performance: consequences determine whether learned behaviour is shown.",
    "Dopamine signals reward prediction error, not pleasure (Schultz et al., 1997).",
    "Spacing and retrieval practice are robust. Learning styles (meshing) are not.",
    "Transfer = trainee + design + work environment (Baldwin &amp; Ford, 1988).",
    "Kirkpatrick: Reaction, Learning, Behaviour, Results. These levels are not causally chained."
  ]
});

OB.modules.push({
  id: "m1-2", unit: 1,
  title: "Personality, Cognitive Ability, and Self-Beliefs",
  threads: ["A", "E"],
  construct: {
    def: `<p><b>Personality</b> refers to relatively enduring, individually distinctive patterns of thinking, feeling and behaving. The <b>trait approach</b> describes people by their standing on continuous dimensions, not by types.</p>
<p><b>General mental ability (GMA)</b> is the capacity to reason, plan, solve problems, think abstractly and learn quickly. <b>Self-efficacy</b> is a belief in one's capability to organise and execute the actions needed to reach a given attainment (Bandura, 1997). It is task-specific and forward-looking.</p>`,
    framework: `<ul>
<li><b>Five-Factor Model (Big Five)</b>: Openness, Conscientiousness, Extraversion, Agreeableness, Neuroticism (or Emotional Stability). It comes from the lexical tradition (Goldberg) and questionnaire research (Costa &amp; McCrae).</li>
<li><b>HEXACO</b> (Ashton &amp; Lee): six factors, adding <b>Honesty-Humility</b> (sincerity, fairness, greed avoidance, modesty). It also reorganises Agreeableness and Emotionality relative to the Big Five.</li>
<li><b>Core self-evaluations</b> (Judge, Locke &amp; Durham, 1997): a higher-order trait made of self-esteem, generalised self-efficacy, locus of control and emotional stability.</li>
<li><b>Person-situation interaction</b>: <i>trait activation theory</i> (Tett &amp; Burnett, 2003) says traits are expressed when situations offer relevant cues. <i>Situational strength</i> (Meyer, Dalal &amp; Hermida, 2010) says strong situations, with clear rules and consequences, reduce the variance that traits explain.</li>
</ul>`
  },
  advanced: [
    { ev: "est", title: "Conscientiousness generalises", html: `<p>Across occupations, Conscientiousness is the most consistent Big Five predictor of job performance (Barrick &amp; Mount, 1991; Barrick, Mount &amp; Judge, 2001). Its validities are modest, with correlations typically around .20 or a little higher after correction. Other traits matter in specific contexts: Extraversion for sales and management, Emotional Stability for high-stress roles.</p>` },
    { ev: "est", title: "Honesty-Humility adds incremental value", html: `<p>Research by Ashton, Lee and colleagues shows that Honesty-Humility predicts integrity-related outcomes, such as counterproductive work behaviour and exploitation, beyond the Big Five factors. This makes HEXACO attractive where ethical risk matters, such as finance and procurement.</p>` },
    { ev: "emg", title: "Re-estimating selection validities", html: `<p>Sackett, Zhang, Berry &amp; Lievens (2022) argued that earlier corrections for range restriction overstated validities. Their revised estimates place structured interviews at the top of common predictors and lower GMA's estimated validity compared with Schmidt &amp; Hunter's (1998) classic figures. This is an active debate. The practical message is that no single predictor dominates, and a combination grounded in job analysis is best.</p>` },
    { ev: "est", title: "Self-efficacy is not the same as mindset", html: `<p><b>Self-efficacy</b> is "Can I do <i>this</i> task?" It is built through mastery experiences (the strongest source), vicarious experience, verbal persuasion, and the interpretation of physiological states. It correlates with work performance; Stajkovic &amp; Luthans (1998) reported a meta-analytic r of about .38, stronger for simpler tasks.</p><p><b>Mindset</b> (Dweck) is an <i>implicit theory</i>: "Is ability fixed or malleable?" Meta-analyses find small average effects of mindset interventions on achievement (Sisk et al., 2018). Benefits appear concentrated in specific subgroups and contexts (Yeager et al., 2019). Keep the distinction clear: a person can believe ability is malleable and still have low efficacy for a specific task today.</p>` },
    { ev: "crit", title: "The MBTI problem", html: `<p>The Myers-Briggs Type Indicator sorts people into dichotomous types, even though the underlying scores are continuous and mostly unimodal. Retest studies show that many people get a different type on retest. It may be useful as a conversation starter, but it is not appropriate for selection or promotion decisions.</p>` },
    { ev: "crit", title: "Faking and adverse impact", html: `<p>Self-report personality tests can be faked in high-stakes settings, which distorts rank order. GMA tests can show subgroup differences that produce adverse impact. Combining predictors, using structured interviews and work samples, and validating locally all reduce these risks.</p>` }
  ],
  matrices: [{
    caption: "Personality frameworks compared",
    head: ["Framework", "Structure", "Evidence base", "Typical measure", "Appropriate use"],
    rows: [
      ["Big Five (FFM)", "5 continuous traits, each with facets", "Very large; cross-cultural replication with some variation", "BFI-2; NEO-PI-3; IPIP scales", "Selection (with job analysis), development, research"],
      ["HEXACO", "6 traits including Honesty-Humility", "Large and growing; strong for integrity outcomes", "HEXACO-PI-R (100 or 60 items)", "Integrity-sensitive roles, research, development"],
      ["Core self-evaluations", "1 higher-order trait made of 4 indicators", "Good for satisfaction and performance", "CSES (12 items; Judge et al., 2003)", "Research; development coaching"],
      ["MBTI", "4 dichotomies giving 16 types", "Weak for prediction; retest classification instability", "MBTI (proprietary)", "Team conversation only, never selection"]
    ]
  }, {
    caption: "Distinguishing self-beliefs",
    head: ["Construct", "Question it answers", "Specificity", "Key source", "Changeable by"],
    rows: [
      ["Self-efficacy", "Can I execute this task?", "Task- or domain-specific", "Bandura (1977, 1997)", "Mastery, modelling, persuasion, arousal reinterpretation"],
      ["Mindset (implicit theory)", "Is ability fixed or malleable?", "Domain-general belief", "Dweck", "Brief belief interventions (small, context-dependent effects)"],
      ["Self-esteem", "Am I worthy?", "Global evaluation", "Rosenberg", "Slow-changing"],
      ["Locus of control", "Do outcomes depend on me?", "Generalised expectancy", "Rotter (1966)", "Experience over time"]
    ]
  }],
  case: {
    title: "Promotions by personality type",
    setting: "Fictional illustrative scenario: a 1,200-person fintech in Hyderabad.",
    scenario: `<p>The HR head uses a type-based personality inventory to shortlist candidates for team-lead roles, preferring "E" and "T" types. After two years, team leads are homogeneous, two leads have been investigated for manipulating client KPIs, and high-performing introverted engineers are leaving.</p>`,
    issue: `<p><b>Behavioural issue.</b> Selection is based on an instrument with weak predictive validity and unstable classification. This produces homogeneity through attraction-selection-attrition dynamics (Schneider, 1987) and possibly adverse impact. Integrity-related traits are not assessed at all, which is the part HEXACO's Honesty-Humility would cover.</p>`,

OB.modules.push({
  id: "m2-1", unit: 2,
  title: "Classic Motivation Theories: Needs, Expectancy, Equity, and Goals",
  threads: ["A", "N"],
  construct: {
    def: `<p><b>Work motivation</b> is the set of internal and external forces that initiate work-related behaviour and determine its <b>direction</b> (what we do), <b>intensity</b> (how hard) and <b>persistence</b> (for how long) (Pinder; Kanfer). Motivation is one input to performance. Performance also depends on ability and opportunity.</p>`,
    framework: `<ul>
<li><b>Content theories</b> ask <i>what</i> motivates. Maslow's hierarchy (1943); Alderfer's ERG (Existence, Relatedness, Growth), which allows frustration-regression; Herzberg's two-factor theory (1959), with <i>hygiene</i> factors that prevent dissatisfaction and <i>motivators</i> that create satisfaction; McClelland's needs for achievement, affiliation and power.</li>
<li><b>Process theories</b> ask <i>how</i> motivation operates.
 <ul><li><b>Expectancy theory</b> (Vroom, 1964): Motivational force is approximately E × I × V. Expectancy is effort leading to performance, instrumentality is performance leading to outcome, and valence is the value of the outcome. Because the model is multiplicative, any zero term gives zero motivation.</li>
 <li><b>Equity theory</b> (Adams, 1963, 1965): people compare their outcome-to-input ratio with a referent's. Perceived inequity creates tension, which people reduce by changing inputs, outcomes, perceptions or referents, or by leaving. It was later broadened into <b>organizational justice</b>: distributive, procedural, interpersonal and informational (Colquitt, 2001).</li>
 <li><b>Goal-setting theory</b> (Locke &amp; Latham, 1990, 2002): specific, difficult goals lead to higher performance than vague "do your best" goals. The mechanisms are direction, effort, persistence and strategy. The moderators are goal commitment, feedback, ability and task complexity.</li></ul></li>
</ul>`
  },
  advanced: [
    { ev: "est", title: "Goal setting: one of the strongest bodies of evidence in OB", html: `<p>Hundreds of studies support the specific-difficult-goal effect (Locke &amp; Latham, 2002). Boundary condition: for <b>complex, novel tasks</b>, performance goals can narrow attention prematurely. <b>Learning goals</b>, such as "find five strategies", tend to work better until the person has the necessary skill (Winters &amp; Latham, 1996; Seijts &amp; Latham).</p>` },
    { ev: "crit", title: "Goals gone wild", html: `<p>Ordóñez, Schweitzer, Galinsky &amp; Bazerman (2009) argued that narrow, aggressive goals can encourage unethical behaviour, risk-taking and neglect of unmeasured dimensions. Locke &amp; Latham (2009) replied that these are failures of goal <i>implementation</i>, not of the theory. For exams, be able to present both sides.</p>` },
    { ev: "crit", title: "Weak empirical support for need hierarchies", html: `<p>Reviews such as Wahba &amp; Bridwell (1976) found little support for Maslow's strict ordering of needs. Herzberg's findings have been criticised as partly an artefact of the critical-incident method: people credit themselves for good events (motivators) and blame the environment for bad ones (hygiene), which is a self-serving attribution pattern. The theories remain useful as heuristic vocabularies, not as predictive models.</p>` },
    { ev: "est", title: "Justice matters for attitudes and behaviour", html: `<p>Meta-analytic work (Colquitt, Conlon, Wesson, Porter &amp; Ng, 2001) shows that procedural justice is strongly related to organizational commitment and trust. Distributive justice is more closely related to outcome satisfaction. Practical lesson: people accept unfavourable outcomes more readily when the process is fair, transparent and respectful.</p>` },
    { ev: "int", title: "Neuroscience of anticipated reward (interpretive)", html: `<p>fMRI work by Knutson and colleagues (2001) links ventral striatal activity to the <i>anticipation</i> of monetary reward. This fits expectancy-style models, but neuroimaging does not "validate" Vroom. Expectancy theory is a cognitive-level model, and striatal activation is a correlate at a different level of analysis. Be cautious about reverse inference.</p>` },
    { ev: "est", title: "Expectancy theory: modest support", html: `<p>Van Eerde &amp; Thierry's (1996) meta-analysis found that VIE components relate to effort and performance, but more weakly than the theory implies. The multiplicative model did not outperform simpler additive combinations. Use expectancy theory as a <i>diagnostic</i> lens ("which link is broken?") rather than a precise prediction formula.</p>` }
  ],
  matrices: [{
    caption: "Motivation theories at a glance",
    head: ["Theory", "Core claim", "Evidence strength", "Managerial lever", "Key critique"],
    rows: [
      ["Maslow (1943)", "Needs are satisfied in a hierarchical order", "Weak", "Address basic security before growth appeals", "Ordering not supported; culturally bound"],
      ["Herzberg (1959)", "Hygiene factors prevent dissatisfaction; motivators create satisfaction", "Mixed", "Job enrichment", "Method artefact; pay can be a motivator"],
      ["Vroom VIE (1964)", "Force = E × I × V", "Moderate", "Repair broken E, I or V links", "Multiplicative form not supported; assumes rational calculation"],
      ["Adams equity (1963)", "Comparisons of outcome/input ratios", "Moderate to strong; extended into justice research", "Transparent, fair processes; clear referents", "Referent choice is hard to predict"],
      ["Goal setting (1990/2002)", "Specific, difficult goals plus commitment and feedback", "Strong", "SMART goals; learning goals for novel tasks", "Narrow goals can crowd out ethics and quality"]
    ]
  }],
  case: {
    title: "Average handle time and the hang-up epidemic",
    setting: "Fictional illustrative scenario: a 900-seat customer-service centre in Coimbatore.",
    scenario: `<p>Management set a strict target of 240 seconds for average handle time (AHT), with monthly bonuses for the top 20% of agents. AHT fell by 25% within a quarter, but repeat-call rates doubled and the QA team found agents disconnecting complex calls. Agents describe the bonus calculation as "a black box".</p>`,
    issue: `<p>This is a textbook <b>goals-gone-wild</b> pattern. A narrow quantity goal without a quality counterweight redirects effort toward the measured dimension, the "what gets measured gets managed" distortion. The forced-ranking bonus with an opaque formula breaks <b>instrumentality</b> and produces <b>procedural and informational injustice</b>. New agents face complex tasks for which performance goals are premature.</p>`,
    intervention: `<ol><li>Replace the single AHT goal with a balanced scorecard: first-contact resolution, QA score, customer satisfaction, and an AHT <i>range</i>.</li><li>Give new hires learning goals for their first 60 days ("master three resolution paths for billing disputes").</li><li>Publish the bonus formula. Allow agents to see and contest their data (procedural voice).</li><li>Run weekly feedback huddles: feedback is a necessary moderator of goal effects.</li><li>Evaluate: compare repeat-call rates and CSAT across pilot and comparison teams over 3 months.</li></ol>`
  },
  measures: [

    { name: "Goal commitment scale", type: "Survey", use: "Klein, Wesson, Hollenbeck, Wright &amp; DeShon (2001): a 5-item unidimensional measure.", limits: "Self-report; commitment measured after goal attainment is confounded with success." },
    { name: "Behavioural performance metrics", type: "Behavioural indicator", use: "Output, quality, repeat contacts, error rates.", limits: "Metric gaming. Always pair quantity metrics with quality and ethics indicators." },
    { name: "VIE diagnostic interview", type: "Qualitative diagnostic", use: "Structured questions about each link: \"If you work harder, will performance improve? Will performance be rewarded? Do you value the reward?\"", limits: "Not a scale. Use it for diagnosis, not scoring." }
  ],
  assess: "Assessment link: justice perceptions are measured with validated multidimensional scales. Goal systems need balanced metrics to avoid measurement-induced distortion.",
  mcqs: [
    { q: "According to Herzberg's two-factor theory, improving salary, supervision and working conditions will most likely:",
      options: ["Increase job satisfaction and motivation", "Reduce dissatisfaction without necessarily increasing satisfaction", "Have no effect on either satisfaction or dissatisfaction", "Increase motivation only for employees high in need for achievement"],
      answer: 1,
      why: ["Wrong. This treats satisfaction and dissatisfaction as one continuum, which Herzberg rejected.", "Correct. These are hygiene factors. Addressing them moves people to 'no dissatisfaction', not to satisfaction, which requires motivators such as achievement and responsibility.", "Wrong. Hygiene factors do affect dissatisfaction.", "Wrong. This mixes in McClelland's theory. Herzberg makes no such moderator claim."] },
    { q: "An engineer believes extra effort will improve performance and values promotion highly, but has seen promotions go to the director's favourites regardless of performance. In Vroom's terms, which component is near zero?",
      options: ["Expectancy", "Instrumentality", "Valence", "Equity sensitivity"],
      answer: 1,
      why: ["Wrong. Expectancy (effort to performance) is high. They believe effort improves performance.", "Correct. Instrumentality (performance to outcome) is broken because promotions do not depend on performance. With a multiplicative model, motivation collapses.", "Wrong. Valence is high. They value the promotion.", "Wrong. Equity sensitivity is a separate individual difference, not a VIE component."] },
    { q: "For a team learning a complex, unfamiliar analytics platform, goal-setting research suggests the best initial goal is:",
      options: ["\"Do your best\"", "A specific, difficult performance goal (for example, 50 dashboards per month)", "A specific learning goal (for example, identify and test five ways to model the data)", "No goal until performance stabilises"],
      answer: 2,
      why: ["Wrong. Vague goals consistently underperform specific goals.", "Wrong. For complex, novel tasks, performance goals can narrow attention and reduce strategy search.", "Correct. Learning goals direct attention toward discovering effective strategies when skill is not yet in place (Winters &amp; Latham, 1996; Seijts &amp; Latham).", "Wrong. Goals help early learning when they are learning-oriented."] }
  ],
  challenge: {
    title: "The pharma field-force incentive redesign",
    scenario: `<p><i>Fictional scenario.</i> A mid-sized Indian pharmaceutical firm pays medical representatives quarterly bonuses based solely on prescription volume in their territory. Territories differ greatly in potential. Compliance has flagged aggressive promotional practices. Top performers in rural territories feel the system is "rigged" toward metro territories.</p>`,
    tasks: ["Diagnose the motivational problems using at least two process theories.", "Specify the evidence you would gather before redesigning.", "Design a new incentive and goal architecture.", "Explain how you would test whether it works."],
    rubric: ["Applies equity or justice theory to territory inequality (input/outcome comparisons with metro referents)", "Applies expectancy theory: low expectancy where territory potential caps performance", "Identifies goals-gone-wild ethical risk from a single volume metric", "Proposes territory-adjusted targets (potential-indexed) and balanced metrics including a compliance gate", "Builds procedural justice: transparent formula, appeals process, rep input into targets", "Evaluates with a pilot across matched territories, tracking performance and compliance incidents"],
    model: `<p><b>Diagnosis.</b> Distributive and procedural injustice, because unequal territory potential makes outcome/input ratios unfair compared with metro referents. Low expectancy in low-potential territories. A single volume goal creates ethical risk.</p><p><b>Evidence.</b> Territory potential data, bonus distribution by territory type, justice survey (Colquitt), compliance incidents, attrition by territory.</p><p><b>Design.</b> Potential-indexed targets. A bonus based on percent of target achieved. A quality and compliance gate (no bonus with a confirmed violation). Learning goals for new reps. A transparent formula with a quarterly appeals window.</p><p><b>Test.</b> Pilot in matched territories for two quarters. Track sales growth, justice perceptions, attrition and compliance flags.</p>`

  construct: {
    def: `<p><b>Self-Determination Theory (SDT)</b> (Deci &amp; Ryan, 1985, 2000) is a macro-theory of human motivation. It holds that well-being and high-quality motivation depend on satisfying three <b>basic psychological needs</b>: <b>autonomy</b> (volition and self-endorsement of one's actions), <b>competence</b> (effectiveness and mastery) and <b>relatedness</b> (mutual care and connection).</p>
<p>SDT distinguishes motivation by <i>quality</i>, not just quantity. <b>Autonomous motivation</b> (intrinsic, integrated, identified) is contrasted with <b>controlled motivation</b> (introjected, external).</p>`,
    framework: `<ul>
<li><b>Cognitive Evaluation Theory (CET)</b>: rewards experienced as <i>controlling</i> undermine intrinsic motivation. Rewards experienced as <i>informational</i> (signalling competence) can support it.</li>
<li><b>Organismic Integration Theory (OIT)</b>: a continuum of internalisation, running from amotivation, to external regulation, introjected regulation ("guilt or pride"), identified regulation ("I value it"), integrated regulation, and intrinsic motivation.</li>
<li><b>Job Characteristics Model</b> (Hackman &amp; Oldham, 1975, 1976, 1980): five core dimensions (skill variety, task identity, task significance, autonomy, feedback) produce three <i>critical psychological states</i> (experienced meaningfulness, responsibility and knowledge of results), which lead to internal motivation, satisfaction and performance. Growth-need strength moderates the effect. <br><b>Motivating Potential Score</b> = ((SV + TI + TS) / 3) × Autonomy × Feedback.</li>
</ul>`
  },

    { ev: "est", title: "The undermining effect", html: `<p>Deci, Koestner &amp; Ryan's (1999) meta-analysis found that <b>expected, tangible, task-contingent rewards</b> reduce free-choice intrinsic motivation for interesting tasks. Verbal rewards (positive feedback) tended to <i>enhance</i> it. The finding was contested by Cameron &amp; Pierce, among others. The boundary conditions matter: the task must be initially interesting, and the reward must be expected and contingent.</p>` },
    { ev: "est", title: "Incentives and intrinsic motivation work together", html: `<p>Cerasoli, Nicklin &amp; Ford's (2014) meta-analysis found that intrinsic motivation better predicts the <b>quality</b> of performance, while incentives better predict <b>quantity</b>. Intrinsic motivation remained a predictor even when incentives were present. Design implication: use incentives for clearly measurable output and protect autonomy for complex, quality-driven work.</p>` },

    { ev: "emg", title: "Remote and hybrid work through an SDT lens", html: `<p>Remote work often increases autonomy (schedule control) but can reduce relatedness and informal competence feedback. This interpretation is supported by early telework meta-analysis (Gajendran &amp; Harrison, 2007) and is still being refined. Hybrid arrangements may balance the needs, but the effects depend on manager practices.</p>` },

      ["Merit pay and bonus", "Competence signal if transparent", "Perceived injustice when the process is opaque", "Roles with valid performance appraisal"],

      ["Algorithmic gamified incentives", "Can thwart autonomy if opaque or coercive", "Surveillance, gaming, burnout", "Use only with transparency, contestability and worker input"],

  case: {
    title: "The quick-commerce rider churn crisis",

    scenario: `<p>Riders are assigned orders by an algorithm. Their acceptance rate below 85% triggers automatic "priority demotion"; incentives come as surprise "streak" bonuses; there is no human appeal. Monthly rider churn exceeds 40%. Riders' WhatsApp groups are full of complaints that "the app decides everything".</p>`,
    issue: `<p>Through an SDT lens, the system is <b>autonomy-thwarting</b> (coercive acceptance thresholds, no choice), offers poor <b>competence</b> feedback (opaque ratings) and provides minimal <b>relatedness</b>. Rewards are experienced as controlling, not informational. Under CET, this predicts controlled motivation, low persistence and exit.</p>`,

  mcqs: [

  title: "Perception, Attribution, and Work Attitudes",
  threads: ["A", "C", "E"],
  construct: {
    def: `<p><b>Perception</b> is the process by which individuals select, organise and interpret sensory information to give meaning to their environment. In OB, what matters is <i>perceived</i> reality, because people act on their interpretations.</p>
<p>An <b>attitude</b> is an evaluative judgement about an object, person or event, with cognitive, affective and behavioural components. Key work attitudes include <b>job satisfaction</b>, <b>organizational commitment</b> and <b>job involvement</b>.</p>`,
    framework: `<ul>
<li><b>Attribution theory</b> (Heider; Kelley, 1967): we judge whether behaviour is internally or externally caused using three cues. <b>Consensus</b>: do others behave the same way? <b>Distinctiveness</b>: does the person behave this way only in this situation? <b>Consistency</b>: does the person behave this way over time? Low consensus, low distinctiveness and high consistency point to an internal attribution.</li>
<li><b>Fundamental attribution error</b> (Ross, 1977): over-attributing others' behaviour to dispositions. <b>Self-serving bias</b>: attributing one's own successes internally and failures externally.</li>
<li><b>Perceptual shortcuts</b>: selective perception, halo effect (Thorndike, 1920), contrast effects, stereotyping, projection.</li>
<li><b>Cognitive dissonance</b> (Festinger, 1957): discomfort from inconsistency between attitudes and behaviour motivates attitude change.</li>
<li><b>Theory of Planned Behaviour</b> (Ajzen, 1991): attitudes, subjective norms and perceived behavioural control predict intentions, which predict behaviour.</li>
<li><b>Three-component commitment</b> (Meyer &amp; Allen, 1991): affective ("want to"), continuance ("need to") and normative ("ought to").</li>
</ul>`

    { ev: "est", title: "Affective commitment is the most useful component", html: `<p>Meta-analytic research (Meyer, Stanley, Herscovitch &amp; Topolnytsky, 2002) found that affective commitment has the strongest positive relations with performance and citizenship and the strongest negative relation with turnover. Continuance commitment can relate to <i>staying</i> without performing ("stuck").</p>` },

  case: {

OB.modules.push({
  id: "m3-2", unit: 3,
  title: "Heuristics, Biases, and the Neuroscience of Decisions",
  threads: ["A", "N", "C"],
  construct: {
    def: `<p><b>Decision-making</b> is the process of choosing among alternatives to reach a goal. The <b>rational model</b> assumes complete information, clear preferences and maximisation. <b>Bounded rationality</b> (Simon) recognises cognitive and informational limits. Decision-makers therefore <b>satisfice</b>: they choose the first option that meets an aspiration level.</p>
<p>A <b>heuristic</b> is a mental shortcut that simplifies judgement. A <b>bias</b> is a systematic deviation from a normative standard that results, often but not always, from heuristic use.</p>`,
    framework: `<ul>
<li><b>Heuristics and biases programme</b> (Tversky &amp; Kahneman, 1974): <i>availability</i> (judging frequency by ease of recall), <i>representativeness</i> (judging probability by similarity, with base-rate neglect) and <i>anchoring and adjustment</i>.</li>
<li><b>Prospect theory</b> (Kahneman &amp; Tversky, 1979): outcomes are evaluated as gains and losses relative to a <b>reference point</b>. The value function is concave for gains, convex for losses, and steeper for losses (<b>loss aversion</b>). Probabilities are weighted non-linearly.</li>
<li><b>Framing effects</b> (Tversky &amp; Kahneman, 1981, the "Asian disease" problem): logically equivalent options framed as gains produce risk aversion; framed as losses, they produce risk seeking.</li>
<li><b>Dual-process accounts</b> (Kahneman, 2011): fast, intuitive "System 1" and slow, deliberative "System 2". Kahneman described these as useful characters for explanation, not literal brain systems.</li>
<li><b>Escalation of commitment</b> (Staw, 1976): continuing to invest in a failing course of action, partly driven by sunk costs and self-justification.</li>
</ul>`
  },
  advanced: [
    { ev: "est", title: "Core effects replicate", html: `<p>In the large multi-lab replication project Many Labs 1 (Klein et al., 2014), anchoring, gain/loss framing and sunk-cost effects replicated. Some social-priming effects, and ego depletion (Hagger et al., 2016 multi-lab study), have not replicated well. Distinguish the robust core of decision research from its contested periphery.</p>` },
    { ev: "crit", title: "Ecological rationality", html: `<p>Gigerenzer and colleagues argue that "fast and frugal" heuristics can be <b>adaptive</b>, sometimes outperforming complex models in uncertain environments. The disagreement is about the normative benchmark: biases relative to probability theory, or performance in real environments? Dual-process theories also face conceptual critique (for example Melnikoff &amp; Bargh, 2018).</p>` },
    { ev: "est", title: "The somatic marker hypothesis and the Iowa Gambling Task", html: `<p>Damasio's somatic marker hypothesis proposes that bodily-emotional signals guide decisions. Bechara, Damasio, Tranel &amp; Damasio (1997) found that patients with ventromedial prefrontal damage kept choosing disadvantageous decks in the Iowa Gambling Task and lacked anticipatory skin-conductance responses. <b>Critique:</b> Dunn, Dalgleish &amp; Lawrence (2006) questioned whether participants' implicit knowledge was truly unconscious, and identified alternative explanations.</p>` },
    { ev: "est", title: "Neural correlates of framing and fairness", html: `<p>De Martino, Kumaran, Seymour &amp; Dolan (2006, <i>Science</i>) linked susceptibility to framing with amygdala activity, and resistance to framing with orbitofrontal and medial prefrontal activity. Sanfey et al. (2003) linked rejection of unfair Ultimatum Game offers with anterior insula activation.</p>` },
    { ev: "crit", title: "The reverse inference trap", html: `<p>Inferring a mental state from regional activation (for example "insula active, so disgust") is <b>reverse inference</b>. It is weak when a region serves many functions (Poldrack, 2006). Be sceptical of "neuroleadership" or "neuro-marketing" claims that leap from brain scans to management prescriptions.</p>` },
    { ev: "emg", title: "Algorithms in decisions: aversion vs automation bias", html: `<p>People may abandon algorithms after seeing them err (<b>algorithm aversion</b>; Dietvorst, Simmons &amp; Massey, 2015). In other settings, lay people prefer algorithmic advice (<b>algorithm appreciation</b>; Logg, Minson &amp; Moore, 2019). Over-reliance on automated aids is <b>automation bias</b> (Parasuraman &amp; Manzey, 2010). With AI-assisted HR and clinical decision tools, both risks coexist. Human-in-the-loop design must be deliberate.</p>` },
    { ev: "prac", title: "Debiasing and decision hygiene", html: `<p><b>Pre-mortem</b> (Klein, 2007): imagine the project has failed and explain why. <b>Consider the opposite</b> (Lord, Lepper &amp; Preston, 1984). <b>Reference-class forecasting</b>: use base rates from similar projects (Kahneman &amp; Lovallo, 1993; Flyvbjerg). <b>Noise audits</b> and independent, structured judgements (Kahneman, Sibony &amp; Sunstein, 2021). Structural fixes generally beat exhortation to "be less biased".</p>` }
  ],
  matrices: [{
    caption: "Common biases: mechanism, workplace signature and countermeasure",
    head: ["Bias or heuristic", "Mechanism", "Workplace signature", "Countermeasure"],
    rows: [
      ["Availability", "Ease of recall stands in for frequency", "Over-reacting to a recent dramatic incident", "Use base-rate data and incident databases"],
      ["Representativeness", "Similarity stands in for probability; base-rate neglect", "Hiring the candidate who 'looks like' past stars", "Structured criteria; statistical prediction"],
      ["Anchoring", "Insufficient adjustment from an initial value", "Salary offers anchored on the last-drawn salary", "Independent estimates before discussion"],
      ["Framing and loss aversion", "Reference-dependent valuation", "Rejecting change framed as 'losing' benefits", "Re-frame; show both frames; pilot reversibility"],
      ["Overconfidence", "Miscalibration of certainty", "Unrealistic project timelines", "Calibration training; reference-class forecasts"],
      ["Confirmation bias", "Seeking confirming evidence", "Ignoring negative pilot data", "Red teams; consider the opposite"],
      ["Escalation of commitment", "Sunk cost plus self-justification", "Continuing a failing IT rollout", "Pre-set exit criteria; rotate decision-makers"]
    ]
  }, {
    caption: "Experimental paradigms used in decision research",
    head: ["Paradigm", "What it measures", "Classic source", "Interpretation caution"],
    rows: [
      ["Asian disease problem", "Framing effects on risk preference", "Tversky &amp; Kahneman (1981)", "Hypothetical stakes"],
      ["Iowa Gambling Task", "Decision-making under ambiguity; learning from feedback", "Bechara et al. (1994, 1997)", "Multiple cognitive processes are involved"],
      ["Ultimatum Game", "Fairness and punishment of unfair offers", "Güth et al. (1982); Sanfey et al. (2003, neural)", "Culture and stake size moderate results"],
      ["Cognitive Reflection Test", "Tendency to override intuitive wrong answers", "Frederick (2005)", "Item familiarity contaminates scores"],
      ["Anchoring paradigm", "Influence of arbitrary numbers on estimates", "Tversky &amp; Kahneman (1974)", "Expertise and incentives may reduce, not eliminate, the effect"]

  case: {

    setting: "Fictional illustrative scenario: the board of a Tamil Nadu hospital network.",
    scenario: `<p>Three years and ₹18 crore into an electronic health record rollout, only 2 of 7 hospitals are live. Clinician satisfaction is low and the vendor misses milestones. The CIO who championed the vendor argues "we're too far in to switch". A recent board presentation framed alternatives as "writing off ₹18 crore".</p>`,
    issue: `<p><b>Escalation of commitment</b>, driven by sunk-cost reasoning, self-justification (the champion's identity is tied to the decision) and <b>loss framing</b> ("writing off" invites risk-seeking continuation). Confirmation bias is probably selecting favourable vendor updates.</p>`,

OB.modules.push({
  id: "m4-1", unit: 4,
  title: "Group Dynamics and Psychological Safety",
  threads: ["A", "C"],
  construct: {
    def: `<p>A <b>group</b> is two or more interdependent individuals who interact to achieve shared objectives. A <b>team</b> is a group whose members have complementary skills, mutual accountability and a common purpose.</p>
<p><b>Psychological safety</b> is "a shared belief held by members of a team that the team is safe for interpersonal risk taking" (Edmondson, 1999, p. 350). It is a <i>group-level climate</i> about whether one can speak up, ask questions, admit errors or challenge without being humiliated or punished.</p>`,
    framework: `<ul>
<li><b>Stages of development</b>: Tuckman (1965), forming, storming, norming and performing, with adjourning added by Tuckman &amp; Jensen (1977). <b>Punctuated equilibrium</b> (Gersick, 1988): project teams often show inertia until a midpoint transition, then a burst of change.</li>
<li><b>Group structure</b>: roles, norms, status, size and cohesion.</li>
<li><b>Process losses</b> (Steiner, 1972): actual productivity = potential productivity minus process losses (coordination and motivation losses).</li>
<li><b>Social loafing</b> (Latané, Williams &amp; Harkins, 1979): reduced individual effort in collective tasks. Karau &amp; Williams (1993) explained it with the Collective Effort Model: loafing increases when individual contributions are unidentifiable or seen as dispensable.</li>
<li><b>Groupthink</b> (Janis, 1972): concurrence-seeking that overrides realistic appraisal in cohesive, insulated groups with directive leadership. Symptoms include an illusion of invulnerability, self-censorship and mindguards.</li>
<li><b>Team effectiveness conditions</b> (Hackman): a real team, a compelling direction, an enabling structure, a supportive context and competent coaching.</li>
</ul>`
  },
  advanced: [
    { ev: "est", title: "Psychological safety and learning behaviour", html: `<p>Edmondson (1999) showed that team psychological safety predicted <b>team learning behaviour</b> (seeking feedback, discussing errors), which in turn predicted performance. In an earlier hospital study, Edmondson (1996) found that better-led units <i>reported</i> more medication errors, likely reflecting greater willingness to report rather than more errors. That is a key lesson for reading safety metrics.</p>` },
    { ev: "est", title: "Meta-analytic support", html: `<p>Frazier, Fainshmidt, Klinger, Pezeshkan &amp; Vracheva (2017) meta-analysed psychological safety. They found positive relationships with information sharing, learning behaviour, engagement and performance. Leader behaviours (support, inclusiveness) and peer support were important antecedents.</p>` },
    { ev: "est", title: "Leader inclusiveness in clinical teams", html: `<p>Nembhard &amp; Edmondson (2006) studied neonatal ICU teams. <b>Leader inclusiveness</b> (words and deeds inviting input) was associated with psychological safety, especially for lower-status professionals, and with engagement in quality improvement.</p>` },
    { ev: "crit", title: "Psychological safety is not comfort", html: `<p>Edmondson distinguishes psychological safety from lowered standards. Her matrix crosses safety with accountability: high safety and low standards give the <i>comfort zone</i>; high safety and high standards give the <i>learning zone</i>; low safety and high standards give the <i>anxiety zone</i>. Psychological safety also differs from <b>trust</b>, which concerns an individual's willingness to be vulnerable to a specific other, and from <b>cohesion</b>, which can actually suppress dissent.</p>` },
    { ev: "crit", title: "Groupthink evidence is mostly case-based", html: `<p>Groupthink was developed from historical case analyses (for example the Bay of Pigs). Experimental tests show mixed support for the full model, and cohesion alone does not reliably cause poor decisions (Esser, 1998 review). Treat it as a useful diagnostic heuristic rather than a precisely validated causal model.</p>` },
    { ev: "emg", title: "Psychological safety in hybrid teams", html: `<p>Speaking up in hybrid meetings involves extra friction: remote members may lose "airtime", and side conversations exclude them. Google's internal re:Work research (Project Aristotle) publicly reported psychological safety as the most important factor distinguishing effective teams. That was organizational research rather than peer-reviewed, but it is consistent with the academic literature. Facilitation norms for hybrid meetings are an emerging area of practice.</p>` },
    { ev: "prac", title: "Checklists and structured voice in surgery", html: `<p>The WHO Surgical Safety Checklist study (Haynes et al., 2009, <i>New England Journal of Medicine</i>) reported reductions in complications and deaths across eight international hospitals after implementation. The checklist includes team introductions, which structure the expectation that everyone speaks. Structural "voice permission" complements leadership behaviour.</p>` }
  ],
  matrices: [{
    caption: "Related but distinct team constructs",
    head: ["Construct", "Level", "Core question", "Measure", "Can be harmful when"],
    rows: [
      ["Psychological safety", "Team climate", "Is it safe to take interpersonal risks here?", "Edmondson (1999) 7-item scale", "Not paired with accountability (the comfort zone)"],
      ["Trust", "Dyadic or individual", "Will I be vulnerable to this person?", "Mayer &amp; Davis trust scales", "It becomes blind trust"],

  }, {

    head: ["Phenomenon", "Mechanism", "Remedy"],
    rows: [
      ["Social loafing", "Low identifiability; dispensability", "Make individual contributions visible; meaningful tasks; smaller teams"],

  case: {
    title: "The silent anaesthetist",
    setting: "Fictional illustrative scenario: an operating theatre team at a tertiary hospital.",
    scenario: `<p>During a complex procedure, a junior anaesthesia resident noticed a drug-dosage discrepancy but did not speak up because the senior surgeon "doesn't like interruptions". A near-miss followed and was caught by a nurse. Incident reports from this theatre are unusually low compared with others.</p>`,
    issue: `<p>A psychological-safety deficit amplified by a steep <b>status hierarchy</b>. The low incident-reporting rate is probably a <i>reporting</i> effect (silence), not a true safety record, the same interpretation Edmondson (1996) found. Self-censorship is also a groupthink-like symptom.</p>`,
    intervention: `<ol><li>Implement or reinforce the WHO Surgical Safety Checklist with genuine team introductions and an explicit invitation to raise concerns.</li><li>Train senior surgeons in leader-inclusiveness behaviours (Nembhard &amp; Edmondson, 2006): "What am I missing?"</li><li>Adopt a "stop-the-line" phrase any member can use without penalty.</li><li>Run a just-culture approach to incident reporting with feedback loops.</li><li>Measure: team psychological-safety survey, incident-reporting rates (expect them to <i>rise</i> at first), and near-miss capture.</li></ol>`

  measures: [

  mcqs: [
    { q: "Edmondson's (1999) definition of psychological safety specifies it as:",

    { q: "After a successful psychological-safety intervention in a hospital unit, the reported incident rate rises by 30%. The most defensible initial interpretation is:",

      answer: 1,
      why: ["Wrong. Possible, but not the first inference. Reporting rates confound true error rates with willingness to report.", "Correct. Edmondson (1996) showed better-led units reported more errors. Rising reports often reflect improved voice. Verify with independent measures such as chart review.", "Wrong. The incident rate is not a survey score.", "Wrong. Loafing does not explain increased reporting."] },
    { q: "Which condition, according to Karau & Williams's Collective Effort Model, most increases social loafing?",

      answer: 2,
      why: ["Wrong. Identifiability <i>reduces</i> loafing.", "Wrong. Meaningful tasks reduce loafing.", "Correct. When people believe their effort is not identifiable or needed, expectancy and instrumentality drop and so does effort.", "Wrong. Small, cohesive groups tend to reduce loafing."] }
