  }
  function bindChallenge(m) {
    var ta = document.getElementById("draft-" + m.id), wc = document.getElementById("wc");
    var count = function () { var n = (ta.value.trim().match(/\S+/g) || []).length; wc.textContent = n + " words" + (n < 150 ? " · aim for 250–400 for a full answer" : ""); };
    count();
    ta.addEventListener("input", function () { store.drafts[m.id] = ta.value; save(); count(); });
    document.getElementById("reveal").addEventListener("click", function (e) {
      var box = document.getElementById("rubricBox"), show = box.hidden;
      box.hidden = !show; store.rubric[m.id + ":shown"] = show; save();
      e.currentTarget.textContent = show ? "Hide rubric and model answer" : "Check my answer against the rubric";
      if (show) { scoreRubric(m); box.scrollIntoView({ block: "start", behavior: "smooth" }); }
    });
    document.getElementById("rubricBox").addEventListener("change", function (e) {
      var i = e.target.getAttribute("data-rb"); if (i === null) return;
      var arr = store.rubric[m.id] || []; arr[+i] = e.target.checked; store.rubric[m.id] = arr; save(); scoreRubric(m);
    });
    scoreRubric(m);
  }
  function scoreRubric(m) {
    var s = modStats(m), pct = Math.round(100 * s.rubric / s.rubricTotal);
    var meter = document.getElementById("rbMeter"), fb = document.getElementById("rbFeedback");
    if (!meter) return;
    meter.style.width = pct + "%";
    var msg;
    if (s.rubric === 0) msg = "Tick the criteria your draft meets to see feedback.";
    else if (pct < 50) msg = "<b>" + s.rubric + "/" + s.rubricTotal + ". Developing.</b> Your draft names the issue but needs more of the diagnostic chain. Revisit the Deep Dive tabs, then name specific evidence and an evaluation design.";
    else if (pct < 85) msg = "<b>" + s.rubric + "/" + s.rubricTotal + ". Competent.</b> A solid answer. To reach distinction level, check the unticked criteria: they usually concern measurement cautions, ethics, or a causal evaluation design.";
    else msg = "<b>" + s.rubric + "/" + s.rubricTotal + ". Distinction level.</b> You diagnose, select evidence, design and evaluate. Compare your wording with the model answer for precision of constructs and citations.";
    fb.innerHTML = msg;
  }

  /* ---------- WHO-5 scoring demonstrator ---------- */
  var WHO5_ITEMS = ["Cheerful, in good spirits", "Calm and relaxed", "Active and vigorous", "Woke up fresh and rested", "Daily life filled with things of interest"];
  var who5vals = [3, 2, 2, 1, 3];
  function who5HTML() {
    return '<div class="panel stack"><div><div class="eyebrow">Scoring practice · hypothetical respondent</div><h3>WHO-5 scoring demonstrator</h3></div>' +
      '<p class="muted" style="margin:0">Practise the arithmetic and the interpretation language. The item labels are paraphrased; use the official WHO-5 wording in real administrations. Each item is rated 0 (at no time) to 5 (all of the time) over the last two weeks. This demo starts with an example profile.</p>' +
      '<div class="who5">' + WHO5_ITEMS.map(function (t, i) { return '<div class="item"><label for="w5-' + i + '">' + t + '</label><input type="range" min="0" max="5" step="1" id="w5-' + i + '" value="' + who5vals[i] + '" data-w5="' + i + '"><output id="w5o-' + i + '">' + who5vals[i] + "</output></div>"; }).join("") + "</div>" +
      '<div class="who5-result"><div><div class="muted mono" style="font-size:.78rem">RAW (0–25) → × 4</div><div class="big" id="w5pct">—</div></div><div class="scale" aria-hidden="true"><i id="w5mark"></i></div></div><div class="feedback" id="w5text"></div>' +
      '<p class="caution" style="margin:0">This is a teaching demonstrator, not an assessment. Do not enter real people\'s data. A WHO-5 score never diagnoses depression; in practice a low score prompts a supportive, consented conversation and referral to a qualified professional if the person wishes.</p></div>';
  }
  function bindWho5() {
    var upd = function () {
      var raw = who5vals.reduce(function (a, b) { return a + b; }, 0), pct = raw * 4;
      document.getElementById("w5pct").textContent = raw + " → " + pct;
      document.getElementById("w5mark").style.left = pct + "%";
      var t;
      if (pct <= 28) t = "<b>" + pct + "/100: at or below 28.</b> In screening research this range is often used to indicate likely depression. Interpretation for practice: recommend a confidential conversation and offer referral to a qualified clinician. Do not label, diagnose or report the individual to a manager.";
      else if (pct <= 50) t = "<b>" + pct + "/100: at or below 50.</b> Suggests poor well-being and warrants further assessment. In a workplace survey, report only in aggregate and make support resources visible to all respondents.";
      else t = "<b>" + pct + "/100: above 50.</b> No screening threshold is met. Remember the score reflects the last two weeks only. Track change over time; a change of 10 percentage points is commonly treated as meaningful.";
      document.getElementById("w5text").innerHTML = t;
    };
    document.querySelectorAll("[data-w5]").forEach(function (r) {
      r.addEventListener("input", function () { var i = +r.getAttribute("data-w5"); who5vals[i] = +r.value; document.getElementById("w5o-" + i).textContent = r.value; upd(); });
    });
    upd();
  }

  /* ---------- toolbox ---------- */
  function allTools() {
    var list = [];
    MODS.forEach(function (m) {
      (m.tools || []).forEach(function (t) { list.push({ name: t.name + " (" + t.abbr + ")", type: "Manual instrument", use: t.construct + " " + t.format, limits: t.cautions, module: m.id }); });
    });
    MODS.forEach(function (m) { m.measures.forEach(function (x) { if (!/^(Practical tools?)$/.test(x.type)) list.push({ name: x.name, type: x.type, use: x.use, limits: x.limits, module: m.id }); }); });
    return list.concat(OB.extraTools);
  }
  function toolGroup(type) {
    var t = type.toLowerCase();
    if (/manual instrument/.test(t)) return "Manual instruments";
    if (/paradigm/.test(t)) return "Experimental paradigms";
    if (/intervention/.test(t)) return "Interventions";
    if (/behavio|metric|structural|indicator/.test(t)) return "Behavioural metrics";
    if (/framework|evaluation|practice|diagnostic|qualitative|method|tool|design|planning|process|learning|measurement|communication|integrity|fairness/.test(t)) return "Frameworks & methods";
    return "Scales & surveys";
  }
  function renderTools() {
    renderRail("tools");
    var tools = allTools(), groups = ["All", "Manual instruments", "Scales & surveys", "Behavioural metrics", "Experimental paradigms", "Interventions", "Frameworks & methods"];
    var shown = tools.filter(function (t) { return ui.toolFilter === "All" || toolGroup(t.type) === ui.toolFilter; });
    view.innerHTML = '<div class="stack"><header class="mod-head"><div class="eyebrow">Rapid reference</div><h1>Reference toolbox</h1><p class="lede">' + tools.length + ' assessment tools, experimental paradigms, behavioural metrics and intervention approaches from every module. “Manual instruments” are the ten tools in your Assessment Tools manual (Paper 8).</p></header>' +
      '<div class="filters" role="group" aria-label="Filter by kind">' + groups.map(function (g) { return '<button data-f="' + g + '" aria-pressed="' + (g === ui.toolFilter) + '">' + g + "</button>"; }).join("") + "</div>" +
      '<div class="tbl-wrap"><table><thead><tr><th>Tool</th><th>Kind</th><th>Intended use</th><th>Limits and interpretation cautions</th><th>Module</th></tr></thead><tbody>' +
      shown.map(function (t) { return "<tr><td>" + t.name + "</td><td>" + t.type + "</td><td>" + t.use + '</td><td class="muted">' + t.limits + '</td><td><a class="mono" href="#' + t.module + '" style="white-space:nowrap">' + modNum(byId[t.module]) + "</a></td></tr>"; }).join("") +
      '</tbody></table></div><p class="caution" style="margin:0">Psychometric properties quoted here are summaries. Before using any instrument, obtain the current official version and technical manual, check licensing, and confirm validity evidence for your population and language.</p></div>';
    view.querySelector(".filters").addEventListener("click", function (e) { var b = e.target.closest("[data-f]"); if (!b) return; ui.toolFilter = b.getAttribute("data-f"); renderTools(); });
  }

  /* ---------- mixed exam ---------- */
  function scopeMods(scope) {
    if (scope === "syl") return SYL;
    if (scope === "lib") return LIB;
    if (scope === "all") return MODS;
    var p = PAPERS.filter(function (x) { return x.id === scope; })[0];
    return p ? p.modules.map(function (e) { return byId[entryId(e)]; }) : SYL;
  }
  function newExam(n, scope) {
    var pool = [];
    scopeMods(scope).forEach(function (m) { m.mcqs.forEach(function (_, i) { pool.push([m.id, i]); }); });
    for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    ui.exam = { items: pool.slice(0, n), picks: {}, done: false, scope: scope };
  }
  function renderExam() {
    renderRail("exam");
    var ex = ui.exam;
    if (!ex) {
      view.innerHTML = '<div class="stack"><header class="mod-head"><div class="eyebrow">Exam rehearsal</div><h1>Mixed exam</h1><p class="lede">Questions are drawn at random from the scope you choose. Answer them all, then submit to see your score and the rationale for every question. Exam answers do not change your module progress.</p></header>' +
        '<div class="panel stack"><div class="row"><label for="exN"><b>Questions</b></label><select id="exN"><option>6</option><option selected>10</option><option>15</option><option>25</option></select><label for="exU"><b>Scope</b></label><select id="exU"><option value="syl">All nine syllabus papers</option>' + PAPERS.map(function (p) { return '<option value="' + p.id + '">' + p.id + " · " + esc(p.title) + "</option>"; }).join("") + '<option value="lib">Reference library only</option><option value="all">Everything</option></select><button class="btn primary" id="exGo">Start exam</button></div><p class="muted" style="margin:0">A single paper has 6 to 12 questions; the exam uses as many as are available.</p></div></div>';
      document.getElementById("exGo").addEventListener("click", function () { newExam(+document.getElementById("exN").value, document.getElementById("exU").value); renderExam(); });
      return;
    }
    var letters = "ABCD", score = 0;
    var qs = ex.items.map(function (it, k) {
      var m = byId[it[0]], q = m.mcqs[it[1]], pick = ex.picks[k];
      if (ex.done && pick === q.answer) score++;
      var opts = q.options.map(function (o, j) {
        var cls = "", why = "";
        if (ex.done) { if (j === q.answer) cls = " correct"; else if (j === pick) cls = " wrong"; if (j === q.answer || j === pick) why = '<span class="why">' + q.why[j] + "</span>"; }
        return '<button class="opt' + cls + '" data-k="' + k + '" data-o="' + j + '"' + (ex.done ? " disabled" : "") + (j === pick && !ex.done ? ' style="border-color:var(--accent);background:var(--accent-soft)"' : "") + '><span class="k">' + letters[j] + "</span><span>" + o + "</span>" + why + "</button>";
      }).join("");
      return '<div class="mcq"><div class="qn">Q' + (k + 1) + ' · from <a href="#' + m.id + '">' + modNum(m) + " " + esc(m.title) + '</a></div><div class="q">' + q.q + '</div><div class="opts">' + opts + "</div></div>";
    }).join("");
    var answered = Object.keys(ex.picks).length;
    var head = ex.done
      ? '<div class="panel row" style="justify-content:space-between"><div><div class="eyebrow">Result</div><div style="font-family:var(--f-display);font-size:2rem;font-weight:700">' + score + " / " + ex.items.length + '</div><div class="muted">' + examVerdict(score / ex.items.length) + '</div></div><div class="row"><button class="btn primary" id="exAgain">New exam</button><button class="btn" id="exSetup">Change settings</button></div></div>'
      : '<div class="panel row" style="justify-content:space-between"><span class="mono">' + answered + " of " + ex.items.length + ' answered</span><button class="btn primary" id="exSubmit"' + (answered < ex.items.length ? " disabled style=\"opacity:.55;cursor:not-allowed\"" : "") + ">Submit exam</button></div>";
    view.innerHTML = '<div class="stack"><header class="mod-head"><div class="eyebrow">Exam rehearsal</div><h1>Mixed exam</h1></header>' + head + '<div class="stack" id="exQs">' + qs + "</div>" + (ex.done ? "" : head.replace('id="exSubmit"', 'id="exSubmit2"')) + "</div>";
    document.getElementById("exQs").addEventListener("click", function (e) { var b = e.target.closest("[data-k]"); if (!b || ex.done) return; ex.picks[+b.getAttribute("data-k")] = +b.getAttribute("data-o"); var y = window.scrollY; renderExam(); window.scrollTo(0, y); });
    ["exSubmit", "exSubmit2"].forEach(function (idn) { var b = document.getElementById(idn); if (b) b.addEventListener("click", function () { if (Object.keys(ex.picks).length < ex.items.length) return; ex.done = true; renderExam(); window.scrollTo(0, 0); }); });
    var again = document.getElementById("exAgain"); if (again) again.addEventListener("click", function () { newExam(ex.items.length, ex.scope); renderExam(); window.scrollTo(0, 0); });
    var setup = document.getElementById("exSetup"); if (setup) setup.addEventListener("click", function () { ui.exam = null; renderExam(); });
  }
  function examVerdict(r) {
    if (r >= .85) return "Distinction range. Now practise the case challenges to test applied reasoning.";
    if (r >= .65) return "Good grasp. Review the rationales for the questions you missed, then revisit those modules' cheat sheets.";
    return "Keep building. Work through the Deep Dive tabs for the modules linked above, then retake a single-paper exam.";
  }

  /* ---------- progress ---------- */
  function renderProgress() {
    renderRail("progress");
    var tc = 0, ta = 0, ts = 0, tsT = 0;
    var row = function (m, label) {
      var s = modStats(m);
      return '<tr><td><a href="#' + m.id + '">' + label + " " + esc(m.title) + '</a></td><td class="mono">' + (s.sloTotal ? s.slo + "/" + s.sloTotal : "—") + '</td><td class="mono">' + s.correct + "/" + s.total + '</td><td><div class="bar"><i style="width:' + Math.round(100 * s.rubric / s.rubricTotal) + '%"></i></div><span class="mono muted" style="font-size:.76rem">' + s.rubric + "/" + s.rubricTotal + " rubric</span></td><td>" + (store.drafts[m.id] ? "Draft saved" : '<span class="muted">—</span>') + "</td></tr>";
    };
    MODS.forEach(function (m) { var s = modStats(m); tc += s.correct; ta += s.answered; ts += s.slo; tsT += s.sloTotal; });
    var body = PAPERS.map(function (p) {
      return '<tr class="grp"><th colspan="5">' + p.id + " · " + esc(p.title) + "</th></tr>" + p.modules.map(function (e, i) { var m = byId[entryId(e)]; return row(m, p.id + " · M" + (i + 1)); }).join("");
    }).join("") + '<tr class="grp"><th colspan="5">Reference library</th></tr>' + LIB.map(function (m) { return row(m, modNum(m)); }).join("");
    view.innerHTML = '<div class="stack"><header class="mod-head"><div class="eyebrow">Study record</div><h1>My progress</h1><p class="lede">' + ts + " of " + tsT + " learning outcomes ticked; " + tc + " of " + TOTAL_Q + " concept checks correct on first attempt; " + ta + " answered. Progress is stored only in this browser on this device.</p></header>" +
      '<div class="tbl-wrap"><table class="prog-table"><thead><tr><th>Module</th><th>SLOs</th><th>First-try correct</th><th>Case challenge</th><th>Draft</th></tr></thead><tbody>' + body + "</tbody></table></div>" +
      '<div class="panel stack"><h3>Start over</h3><p class="muted" style="margin:0">Clears your answers, SLO ticks, drafts and rubric ticks from this browser.</p><div class="row" id="resetRow"><button class="btn" id="reset1">Reset my progress</button></div></div></div>';
    document.getElementById("reset1").addEventListener("click", function () {
      document.getElementById("resetRow").innerHTML = '<span><b>Clear everything?</b> This cannot be undone.</span><button class="btn primary" id="reset2">Yes, clear my progress</button><button class="btn" id="reset0">Keep it</button>';
      document.getElementById("reset2").addEventListener("click", function () { store = { answers: {}, first: {}, drafts: {}, rubric: {}, slo: {} }; save(); updatePill(); renderProgress(); });
      document.getElementById("reset0").addEventListener("click", renderProgress);
    });
  }

  /* ---------- search ---------- */
  var INDEX = [];
  MODS.forEach(function (m) {
    var add = function (sec, title, html) { INDEX.push({ m: m, sec: sec, title: title, text: strip(html) }); };
    (m.units || []).forEach(function (u) { add("syllabus", "Unit " + u.code + " " + u.title, u.topics + " " + u.slos.join(" ")); });
    (m.tools || []).forEach(function (t) { add("manual", t.name, [t.source, t.construct, t.format, t.scoring, t.interpret, t.cautions].join(" ")); });
    add("construct", "Core construct", m.construct.def + m.construct.framework);
    m.advanced.forEach(function (a) { add("advanced", a.title, a.html); });
    (m.matrices || []).forEach(function (x) { add("matrix", strip(x.caption), x.head.join(" ") + " " + x.rows.map(function (r) { return r.join(" "); }).join(" ")); });
    add("case", m.case.title, m.case.scenario + m.case.issue + m.case.intervention);
    m.measures.forEach(function (x) { add("measures", x.name, x.use + " " + x.limits); });
    m.mcqs.forEach(function (q, i) { add("mcq", "MCQ " + (i + 1), q.q + " " + q.options.join(" ")); });
    add("challenge", m.challenge.title, m.challenge.scenario + m.challenge.model);
    add("cheat", "Cheat sheet", m.cheat.join(" "));
  });
  var SECNAME = { syllabus: "Syllabus & SLOs", manual: "Tool manual", construct: "Core construct", advanced: "Advanced expansion", matrix: "Comparative matrix", "case": "Case in point", measures: "Measurement", mcq: "MCQs", challenge: "Case challenge", cheat: "Cheat sheet" };
  function renderSearch(q) {
    renderRail("");
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    var hits = INDEX.filter(function (r) { var t = (r.title + " " + r.text).toLowerCase(); return terms.every(function (w) { return t.indexOf(w) > -1; }); }).slice(0, 50);
    var snip = function (r) {
      var t = r.text, i = t.toLowerCase().indexOf(terms[0]), s = Math.max(0, i - 70);
      var out = esc((s > 0 ? "…" : "") + t.slice(s, s + 200) + "…");
      terms.forEach(function (w) { out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); });
      return out;
    };
    view.innerHTML = '<div class="stack"><header class="mod-head"><div class="eyebrow">Search</div><h1>' + hits.length + (hits.length === 50 ? "+" : "") + " results for “" + esc(q) + '”</h1></header><div class="result-list">' +
      (hits.length ? hits.map(function (r, k) { return '<a href="#' + r.m.id + '" data-hit="' + k + '"><b>' + modNum(r.m) + " · " + SECNAME[r.sec] + " · " + esc(r.title) + "</b><small>" + snip(r) + "</small></a>"; }).join("") : '<p class="muted">No matches. Try an author (Edmondson), a construct (psychological contract) or a scale (WLCS).</p>') + "</div></div>";
    view.querySelectorAll("[data-hit]").forEach(function (a) { a.addEventListener("click", function () { var r = hits[+a.getAttribute("data-hit")]; ui.tab[r.m.id] = r.sec; save(); document.getElementById("q").value = ""; }); });
  }
  var qInput = document.getElementById("q"), qTimer;
  qInput.addEventListener("input", function () {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { var v = qInput.value.trim(); if (v.length >= 2) renderSearch(v); else route(); }, 180);
  });

  /* ---------- router ---------- */
  function route() {
    var h = (location.hash || "#map").slice(1);
    if (byId[h]) renderModule(h);
    else if (h === "tools") renderTools();
    else if (h === "exam") renderExam();
    else if (h === "progress") renderProgress();
    else renderMap();
    updatePill();
  }
  window.addEventListener("hashchange", function () {
    route(); window.scrollTo(0, 0);
    if (!window.matchMedia("(min-width: 881px)").matches && railBody.getAttribute("data-open") === "true") railToggle.click();
  });
  route();
})();

</script>

</body>
</html>
