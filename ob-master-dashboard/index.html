/* Unit 4: Group Dynamics, Psychological Safety, Power, and Political Skill */
OB.modules.push({
  id: "m4-1", unit: 4,
  title: "Group Dynamics and Psychological Safety",
  threads: ["A", "C"],
  construct: {
    def: `<p>A <b>group</b> is two or more interdependent individuals who interact to achieve shared objectives. A <b>team</b> is a group whose members have complementary skills, mutual accountability and a common purpose.</p>
<p><b>Psychological safety</b> is "a shared belief held by members of a team that the team is safe for interpersonal risk taking" (Edmondson, 1999, p. 350). It is a <i>group-level climate</i> about whether one can speak up, ask questions, admit errors or challenge without being humiliated or punished.</p>`,
    framework: `<ul>
<li><b>Stages of development</b>: Tuckman (1965), forming, storming, norming and performing, with adjourning added by Tuckman &amp; Jensen (1977). <b>Punctuated equilibrium</b> (Gersick, 1988): project teams often show inertia until a midpoint transition, then a burst of change.</li>
<li><b>Group structure</b>: roles, norms, status, size and cohesion.</li>
<li><b>Process losses</b> (Steiner, 1972): actual productivity = potential productivity minus process losses (coordination and motivation losses).</li>
<li><b>Social loafing</b> (Latané, Williams &amp; Harkins, 1979): reduced individual effort in collective tasks. Karau &amp; Williams (1993) explained it with the Collective Effort Model: loafing increases when individual contributions are unidentifiable or seen as dispensable.</li>
<li><b>Groupthink</b> (Janis, 1972): concurrence-seeking that overrides realistic appraisal in cohesive, insulated groups with directive leadership. Symptoms include an illusion of invulnerability, self-censorship and mindguards.</li>
<li><b>Team effectiveness conditions</b> (Hackman): a real team, a compelling direction, an enabling structure, a supportive context and competent coaching.</li>
</ul>`
  },
  advanced: [
    { ev: "est", title: "Psychological safety and learning behaviour", html: `<p>Edmondson (1999) showed that team psychological safety predicted <b>team learning behaviour</b> (seeking feedback, discussing errors), which in turn predicted performance. In an earlier hospital study, Edmondson (1996) found that better-led units <i>reported</i> more medication errors, likely reflecting greater willingness to report rather than more errors. That is a key lesson for reading safety metrics.</p>` },
    { ev: "est", title: "Meta-analytic support", html: `<p>Frazier, Fainshmidt, Klinger, Pezeshkan &amp; Vracheva (2017) meta-analysed psychological safety. They found positive relationships with information sharing, learning behaviour, engagement and performance. Leader behaviours (support, inclusiveness) and peer support were important antecedents.</p>` },
    { ev: "est", title: "Leader inclusiveness in clinical teams", html: `<p>Nembhard &amp; Edmondson (2006) studied neonatal ICU teams. <b>Leader inclusiveness</b> (words and deeds inviting input) was associated with psychological safety, especially for lower-status professionals, and with engagement in quality improvement.</p>` },
    { ev: "crit", title: "Psychological safety is not comfort", html: `<p>Edmondson distinguishes psychological safety from lowered standards. Her matrix crosses safety with accountability: high safety and low standards give the <i>comfort zone</i>; high safety and high standards give the <i>learning zone</i>; low safety and high standards give the <i>anxiety zone</i>. Psychological safety also differs from <b>trust</b>, which concerns an individual's willingness to be vulnerable to a specific other, and from <b>cohesion</b>, which can actually suppress dissent.</p>` },
    { ev: "crit", title: "Groupthink evidence is mostly case-based", html: `<p>Groupthink was developed from historical case analyses (for example the Bay of Pigs). Experimental tests show mixed support for the full model, and cohesion alone does not reliably cause poor decisions (Esser, 1998 review). Treat it as a useful diagnostic heuristic rather than a precisely validated causal model.</p>` },
    { ev: "emg", title: "Psychological safety in hybrid teams", html: `<p>Speaking up in hybrid meetings involves extra friction: remote members may lose "airtime", and side conversations exclude them. Google's internal re:Work research (Project Aristotle) publicly reported psychological safety as the most important factor distinguishing effective teams. That was organizational research rather than peer-reviewed, but it is consistent with the academic literature. Facilitation norms for hybrid meetings are an emerging area of practice.</p>` },
    { ev: "prac", title: "Checklists and structured voice in surgery", html: `<p>The WHO Surgical Safety Checklist study (Haynes et al., 2009, <i>New England Journal of Medicine</i>) reported reductions in complications and deaths across eight international hospitals after implementation. The checklist includes team introductions, which structure the expectation that everyone speaks. Structural "voice permission" complements leadership behaviour.</p>` }
  ],
  matrices: [{
    caption: "Related but distinct team constructs",

OB.modules.push({

  title: "Power, Influence, and Political Skill",
  threads: ["A", "E"],
  construct: {
    def: `<p><b>Power</b> is the capacity of A to influence the behaviour of B so that B acts in accordance with A's wishes. It is a <i>potential</i> that need not be exercised. Power rests on <b>dependence</b>: B's dependence on A increases with the importance, scarcity and non-substitutability of the resources A controls (Emerson, 1962).</p>
<p><b>Organizational politics</b> refers to behaviour that is not formally sanctioned and is intended to influence outcomes for individual or group interests. <b>Political skill</b> is "the ability to effectively understand others at work, and to use such knowledge to influence others to act in ways that enhance one's personal and/or organizational objectives" (Ferris et al., 2005).</p>`,
    framework: `<ul>
<li><b>Bases of power</b> (French &amp; Raven, 1959; Raven, 1965). Formal bases: <i>legitimate</i>, <i>reward</i>, <i>coercive</i> and <i>informational</i>. Personal bases: <i>expert</i> and <i>referent</i>.</li>
<li><b>Influence tactics</b> (Yukl and colleagues): rational persuasion, inspirational appeals, consultation, collaboration, apprising, ingratiation, exchange, personal appeals, coalition, legitimating and pressure. <i>Core tactics</i> (rational persuasion, consultation, inspirational appeal, collaboration) tend to produce commitment. Pressure tends to produce resistance (Yukl &amp; Tracey, 1992).</li>
<li><b>Political skill dimensions</b> (Ferris et al., 2005): social astuteness, interpersonal influence, networking ability and apparent sincerity.</li>
<li><b>Approach-inhibition theory of power</b> (Keltner, Gruenfeld &amp; Anderson, 2003): having power activates approach tendencies (reward focus, action, less inhibition). Lacking power activates inhibition (threat vigilance).</li>
</ul>`

    { ev: "est", title: "Perceptions of politics", html: `<p>Perceived organizational politics (POPS; Kacmar &amp; Ferris, 1991; Kacmar &amp; Carlson, 1997) is consistently associated with lower satisfaction and commitment and higher strain and turnover intention. Political skill tends to <i>buffer</i> the stress of political environments.</p>` },
    { ev: "est", title: "Power changes cognition", html: `<p>Research under the approach-inhibition framework indicates that power increases action orientation and goal focus but may reduce perspective-taking. Galinsky, Magee, Inesi &amp; Gruenfeld (2006) reported that power primes reduced visual perspective-taking in the "E on the forehead" task. Effect sizes and replicability for some power-priming effects are debated, so treat individual priming studies cautiously.</p>` },
    { ev: "crit", title: "Politics is not inherently negative", html: `<p>Pfeffer (1992) argued that politics is how things get done in organizations with interdependent units and scarce resources. The ethical question concerns <b>means and ends</b>. Does the action serve organizational and stakeholder interests? Does it respect others' rights? Would it survive public disclosure?</p>` },
    { ev: "emg", title: "Dark-side traits and influence", html: `<p>The Dark Triad (Paulhus &amp; Williams, 2002) of Machiavellianism, narcissism and psychopathy relates to manipulative influence tactics and counterproductive behaviour. Narcissists may emerge as leaders without being more effective. HEXACO Honesty-Humility is the inverse pole of much of this space (link to Module 1.2).</p>` },
    { ev: "emg", title: "Network power in matrix and hybrid organizations", html: `<p>In matrix and hybrid structures, informal network position (brokerage across groups, centrality) is an increasingly important source of power, building on Burt's structural holes. Organizational network analysis is used to identify hidden influencers. It must be governed ethically: consent, aggregate use, no surveillance.</p>` }

OB.modules.push({
  id: "m5-1", unit: 5,
  title: "Organizational Culture: Levels, Types, and Diagnosis",
  threads: ["A", "C"],
  construct: {
    def: `<p><b>Organizational culture</b>, in Schein's definition, is "a pattern of shared basic assumptions learned by a group as it solved its problems of external adaptation and internal integration, that has worked well enough to be considered valid and, therefore, to be taught to new members as the correct way to perceive, think, and feel in relation to those problems."</p>
<p><b>Organizational climate</b> differs from culture. Climate is employees' shared perceptions of the policies, practices and behaviours that are rewarded and supported (Schneider). It is more measurable and closer to the surface, and is often <i>"climate for"</i> something (safety, service, innovation).</p>`,
    framework: `<ul>
<li><b>Schein's three levels</b>: (1) <i>Artefacts</i>: visible structures, rituals, dress, office layout; easy to see, hard to decode. (2) <i>Espoused beliefs and values</i>: stated strategies, goals and philosophies. (3) <i>Basic underlying assumptions</i>: taken-for-granted beliefs, the true essence of culture.</li>
<li><b>Competing Values Framework</b> (Quinn &amp; Rohrbaugh; Cameron &amp; Quinn): two axes, flexibility vs stability and internal vs external, give four types: <i>Clan</i> (collaborate), <i>Adhocracy</i> (create), <i>Market</i> (compete) and <i>Hierarchy</i> (control).</li>
<li><b>Three perspectives</b> (Martin, 1992): <i>integration</i> (shared culture), <i>differentiation</i> (subcultures) and <i>fragmentation</i> (ambiguity).</li>
<li><b>Attraction-Selection-Attrition</b> (Schneider, 1987): "the people make the place". Similar people are attracted, selected and retained, which strengthens culture and also homogeneity.</li>
<li><b>National culture</b> context: Hofstede's dimensions and the GLOBE project (House et al., 2004) describe <i>societal</i> values. They frame but do not determine organizational culture.</li>
</ul>`
  },
  advanced: [
    { ev: "est", title: "Person-organization fit", html: `<p>Kristof-Brown, Zimmerman &amp; Johnson's (2005) meta-analysis found that P-O fit (values congruence) relates strongly to organizational commitment and satisfaction, and less strongly to performance. Fit is not homogeneity: complementary fit (filling gaps) matters too.</p>` },
    { ev: "est", title: "Climate predicts specific outcomes", html: `<p>Climate research shows that <i>focused</i> climates, such as safety climate (Zohar's work) and service climate (Schneider and colleagues), predict domain-specific outcomes such as accidents and customer satisfaction more strongly than generic culture measures. This is useful for measurement: decide what the climate is "for".</p>` },
    { ev: "crit", title: "The ecological fallacy with national culture", html: `<p>Hofstede's dimensions describe country-level averages. Applying them to individual employees ("she's Indian, so high power distance") is an <b>ecological fallacy</b>. Within-country variance is large. Critics have also challenged the original single-company sample and the dimensions' stability over time.</p>` },
    { ev: "int", title: "Culture change is assumption change", html: `<p>Schein argued that leaders shape culture through what they pay attention to, measure and control. Important signals include their reactions to critical incidents, how they allocate resources, deliberate role modelling, how they allocate rewards and status, and their criteria for recruitment, promotion and exit. Interpretation: rewriting the values statement (level 2) without changing these "primary embedding mechanisms" leaves assumptions (level 3) unchanged.</p>` },
    { ev: "emg", title: "Culture in distributed organizations", html: `<p>With hybrid work, artefacts move online (Slack norms, meeting etiquette, response-time expectations), and onboarding socialisation has fewer informal touchpoints. Research is emerging on how distributed firms transmit tacit assumptions. Documented norms ("handbook-first" cultures) are one practitioner response; their effectiveness is not yet well studied.</p>` },
    { ev: "crit", title: "Can culture be measured with a survey?", html: `<p>Schein was sceptical that surveys capture deep assumptions. Surveys measure espoused values or climate. Ethnographic interviews and artefact analysis can reach assumptions. Best practice is <b>mixed methods</b>: a survey for breadth, qualitative methods for depth.</p>` }
  ],
  matrices: [{
    caption: "Competing Values Framework",
    head: ["Type", "Orientation", "Leader role", "Value drivers", "Typical risk"],
    rows: [
      ["Clan", "Internal and flexible", "Facilitator, mentor", "Commitment, communication, development", "Complacency; slow decisions"],

      ["Market", "External and stable", "Hard-driver, competitor", "Market share, goal achievement", "Short-termism; ethics pressure"],

    caption: "Culture and climate assessment approaches",
    head: ["Approach", "Captures", "Strength", "Limitation"],
    rows: [
      ["OCAI (Cameron &amp; Quinn)", "CVF profile, current vs preferred", "Simple, visual, change-oriented", "Ipsative (100-point allocation) scores complicate standard statistics"],
      ["Organizational Culture Profile (O'Reilly, Chatman &amp; Caldwell, 1991)", "Values via Q-sort", "Supports P-O fit analysis", "Time-consuming"],
      ["Denison model survey", "Involvement, consistency, adaptability, mission", "Linked to performance in practitioner research", "Commercial; mostly vendor-published evidence"],
      ["Focused climate surveys", "Safety, service, innovation climate", "Predicts specific outcomes", "Not 'culture' in Schein's sense"],
      ["Ethnography and artefact analysis", "Assumptions, rituals, stories", "Depth", "Resource-intensive; researcher subjectivity"]
    ]

  case: {
    title: "The family hospital meets private equity",
    setting: "Fictional illustrative scenario: two hospital chains merge in Tamil Nadu.",
    scenario: `<p>A family-founded hospital known for long-tenured staff, consensus decision-making and community outreach is acquired by a private-equity-backed chain with KPI dashboards, cost targets and centralised procurement. Six months later, senior nurses from the acquired hospital are leaving, and a new "One Culture" values poster ("Excellence. Agility. Ownership.") is widely mocked.</p>`,

  mcqs: [

    { q: "A manager assumes a new hire from a high power-distance country will avoid challenging authority. This reasoning commits:",
      options: ["The ecological fallacy", "The fundamental attribution error only", "Escalation of commitment", "Social loafing"],
      answer: 0,
      why: ["Correct. Applying country-level averages to an individual is the ecological fallacy. Individual variance within countries is large.", "Wrong. It is related to dispositional stereotyping, but the specific error is inferring individual traits from group-level statistics.", "Wrong. Escalation concerns persistence with failing decisions.", "Wrong. Social loafing concerns effort in groups."] }

  challenge: {
    title: "The 'innovation culture' mandate",
    scenario: `<p><i>Fictional scenario.</i> The CEO of a 40-year-old public-sector-style insurance company wants to "become an adhocracy in 12 months". HR proposes a hackathon, bean bags, and a new values statement. Employees report that past experiments that failed led to transfers to remote branches.</p>`,
    tasks: ["Diagnose the current culture using Schein's levels and the CVF.", "Critique the HR proposal.", "Design a diagnostic approach.", "Propose a realistic culture-change plan, including how you'd evaluate it."],
    rubric: ["Identifies hierarchy-dominant culture with an assumption that failure is punished (from the transfer stories)", "Critiques the proposal as artefact- and espoused-level change that won't reach assumptions", "Proposes mixed methods: OCAI current vs preferred, interviews, critical-incident analysis, subculture comparison", "Uses Schein's embedding mechanisms: leader reactions to failure, reward and promotion criteria", "Connects to psychological safety (Unit 4): safe-to-fail experiments", "Sets realistic timelines and evaluation (innovation climate, experiments run, ideas implemented, re-measured OCAI)"],
    model: `<p>The transfer stories reveal a basic assumption that <i>failure is punished</i>. That is a hierarchy-culture assumption that bean bags and hackathons (artefacts) cannot change. Diagnose with an OCAI current-vs-preferred profile by function and level, interviews about critical incidents, and an artefact audit. Change plan: (1) leaders publicly reframe a past failure as learning and reverse the punitive-transfer practice; (2) bounded "safe-to-fail" pilots with explicit learning goals; (3) promotion criteria that reward experimentation; (4) keep hierarchy strengths for regulatory compliance, since you probably want a balanced profile, not a pure adhocracy. Evaluate over 18 to 24 months: innovation climate scores, number of pilots, ideas implemented, and a repeat OCAI.</p>`

OB.modules.push({
  id: "m5-2", unit: 5,
  title: "Psychological Contracts and Resistance to Change",
  threads: ["A", "C", "E"],
  construct: {
    def: `<p>The <b>psychological contract</b> is an individual's beliefs about the terms and conditions of a reciprocal exchange agreement between themselves and the organization (Rousseau, 1989, 1995). It is <i>subjective</i> and perceptual, and need not match the written contract.</p>
<p><b>Resistance to change</b> is now understood as a multidimensional response, with cognitive, emotional and behavioural components (Piderit, 2000). It reflects both dispositional tendencies and how the change is managed.</p>`,
    framework: `<ul>
<li><b>Contract types</b> (Rousseau): <i>transactional</i> (short-term, monetary, narrow), <i>relational</i> (long-term, socio-emotional, broad), and in Rousseau's PCI, <i>balanced</i> (dynamic, performance-linked development) and <i>transitional</i> (a breakdown state).</li>
<li><b>Breach vs violation</b> (Morrison &amp; Robinson, 1997): <i>breach</i> is the cognitive perception that the organization failed to fulfil obligations. <i>Violation</i> is the emotional reaction (anger, betrayal) that may follow, depending on interpretation (blame, fairness of process).</li>
<li><b>Idiosyncratic deals (i-deals)</b> (Rousseau, 2005): individually negotiated arrangements, such as flexible schedules.</li>
<li><b>Change models</b>: Lewin's unfreeze, change, refreeze (as commonly taught); Kotter's 8 steps (1995/1996); readiness for change (Armenakis, Harris &amp; Mossholder, 1993).</li>
<li><b>Dispositional resistance</b> (Oreg, 2003): routine seeking, emotional reaction, short-term focus and cognitive rigidity.</li>
</ul>`
  },
  advanced: [
    { ev: "est", title: "Breach has broad consequences", html: `<p>Zhao, Wayne, Glibkowski &amp; Bravo's (2007) meta-analysis found that psychological contract breach relates to violation and mistrust (affective responses), and through them to lower satisfaction, commitment, citizenship and performance, and higher turnover intention. This is consistent with an affective-events mechanism.</p>` },
    { ev: "est", title: "Resistance is relational", html: `<p>Ford, Ford &amp; D'Amelio (2008) argued that "resistance" is partly a label change agents apply. It can reflect agents' own broken agreements, communication failures, or legitimate concerns. Resistance can be a <i>resource</i>, because it surfaces implementation problems. Oreg, Vakola &amp; Armenakis's (2011) review of 60 years of research highlighted antecedents such as trust in management, participation and change history.</p>` },
    { ev: "crit", title: "Lewin's three-step model may be a later construction", html: `<p>Cummings, Bridgman &amp; Brown (2016) argued that the tidy "unfreeze, change, refreeze" model was largely constructed by later authors from fragments of Lewin's work, and that Lewin's thinking was more processual. Exams often still teach the three steps. Be ready to present the model and its historiographical critique.</p>` },
    { ev: "crit", title: "Kotter's evidence base", html: `<p>Kotter's 8 steps (urgency, guiding coalition, vision, communicate, empower, short-term wins, consolidate, anchor in culture) were derived from consulting experience rather than systematic empirical testing. Later reviews found partial, mostly case-based support. Use the model as a practitioner checklist, not proven science.</p>` },
    { ev: "est", title: "Commitment to change", html: `<p>Herscovitch &amp; Meyer (2002) extended the three-component model to change: <i>affective</i> (belief in its value), <i>continuance</i> (cost of not supporting it) and <i>normative</i> (sense of obligation). Affective and normative commitment to change predict discretionary support ("championing") better than continuance commitment does.</p>` },
    { ev: "emg", title: "Return-to-office mandates as perceived breach", html: `<p>Employees who formed expectations of flexibility during and after the pandemic may perceive top-down return-to-office mandates as breach. This is a theoretically coherent prediction, and practitioner surveys report dissatisfaction. Peer-reviewed causal evidence specific to RTO and breach is still emerging. Bloom, Han &amp; Liang (2024, <i>Nature</i>) found that a randomised hybrid arrangement reduced quit rates without hurting performance ratings in their sample, which is relevant to the cost side of mandates.</p>` }
  ],
  matrices: [{
    caption: "Psychological contract types",
    head: ["Type", "Time frame", "Content", "Example", "Response to breach"],
    rows: [
      ["Transactional", "Short-term, specific", "Pay for defined performance", "Contract coder paid per project", "Reduces effort to the letter of the deal; exits"],
      ["Relational", "Open-ended", "Loyalty, development, security", "Long-tenured nurse expecting reciprocity", "Strong violation feelings; reduced citizenship"],
      ["Balanced", "Open-ended but performance-linked", "Mutual development, marketability", "High-potential programme", "Renegotiation or exit"],
      ["Transitional", "Breakdown state", "Mistrust, uncertainty", "During layoffs", "Disengagement, erosion"]
    ]
  }, {
    caption: "Change models compared",
    head: ["Model", "Core idea", "Evidence status", "Best use"],
    rows: [
      ["Lewin (as taught)", "Unfreeze, change, refreeze; force-field analysis", "Foundational; attribution of the 3-step model debated", "Framing; force-field diagnosis"],
      ["Kotter 8 steps", "Sequential leadership-driven process", "Practitioner-derived; partial, case-based support", "Large-scale transformation checklist"],
      ["Readiness for change (Armenakis)", "Message: discrepancy, appropriateness, efficacy, principal support, personal valence", "Supported by survey research (for example Holt et al., 2007 readiness scale)", "Diagnosing pre-change readiness"],
      ["ADKAR (Prosci)", "Awareness, Desire, Knowledge, Ability, Reinforcement", "Practitioner model; limited peer-reviewed testing", "Individual change coaching"],
      ["Processual or emergent views", "Change as continuous and political", "Qualitative and theoretical", "Complex, ongoing change"]
    ]
  }],
  case: {
    title: "The five-day return-to-office mandate",
    setting: "Fictional illustrative scenario: a mid-sized IT product company in Bengaluru.",
    scenario: `<p>During 2020 to 2023 the company advertised "work from anywhere" in job postings. In 2025 the new CEO announces a mandatory five-day office return within 30 days, citing "culture and collaboration". Within two months, voluntary attrition among senior engineers doubles, Glassdoor reviews mention "broken promises", and those who stay show reduced discretionary effort.</p>`,
    issue: `<p>A classic <b>perceived psychological contract breach</b>: flexibility was a <i>promise</i> embedded in recruitment messaging. It is then interpreted as <b>violation</b> because of the abrupt timeline and lack of consultation (procedural injustice). Resistance is <i>relational</i>, a response to the change agents' process, not just dispositional inflexibility.</p>`,
    intervention: `<ol><li>Acknowledge the change in terms explicitly. Explain the rationale with evidence, not slogans.</li><li>Consult and co-design. Consider hybrid anchor days instead of an all-or-nothing rule.</li><li>Offer i-deals and transition time for employees with documented constraints.</li><li>Use Armenakis's readiness messages: discrepancy, appropriateness, efficacy, principal support and personal valence.</li><li>Measure breach perceptions, commitment to change and attrition by segment. Pilot before scaling.</li></ol>`
  },
  measures: [
    { name: "Psychological Contract Inventory (PCI)", type: "Survey", use: "Rousseau (2000): transactional, relational, balanced and transitional dimensions.", limits: "Long; requires adaptation to context. Test the factor structure locally." },
    { name: "Global breach and violation measures", type: "Survey", use: "Robinson &amp; Morrison (2000): short global measures of perceived breach and violation feelings.", limits: "Global measures don't identify <i>which</i> obligations were breached. Pair with content items." },
    { name: "Resistance to Change Scale", type: "Disposition scale", use: "Oreg (2003): 17 items across routine seeking, emotional reaction, short-term focus and cognitive rigidity.", limits: "Measures disposition, not reactions to a specific change. Do not use to label 'resisters'." },
    { name: "Commitment to Change", type: "Survey", use: "Herscovitch &amp; Meyer (2002): affective, continuance and normative.", limits: "Specific to the change referent; wording must be adapted carefully." },
    { name: "Readiness for Organizational Change", type: "Survey", use: "Holt, Armenakis, Feild &amp; Harris (2007): appropriateness, management support, change efficacy, personal valence.", limits: "Readiness can shift quickly. Measure close to implementation." }
  ],
  assess: "Assessment link: separate dispositional measures (Oreg) from change-specific reactions (readiness, commitment to change), and cognitive breach from affective violation.",
  mcqs: [
    { q: "Per Morrison & Robinson (1997), what distinguishes psychological contract violation from breach?",
      options: ["Violation is legal; breach is psychological", "Breach is the cognitive perception of unmet obligations; violation is the emotional reaction that may follow", "They are synonyms", "Breach applies to transactional contracts; violation to relational contracts"],
      answer: 1,
      why: ["Wrong. Both are psychological constructs.", "Correct. Breach is a cognitive appraisal. Violation is an affective state (anger, betrayal) whose occurrence depends on interpretation of the breach.", "Wrong. The distinction is central to the theory.", "Wrong. Both concepts apply across contract types."] },
    { q: "Which of these is NOT a dimension of Oreg's (2003) dispositional resistance to change?",
      options: ["Routine seeking", "Emotional reaction", "Short-term focus", "Perceived organizational support"],
      answer: 3,
      why: ["Wrong. Routine seeking is a dimension.", "Wrong. Emotional reaction is a dimension.", "Wrong. Short-term focus is a dimension.", "Correct. The fourth dimension is cognitive rigidity. Perceived organizational support is a separate situational construct."] },
    { q: "A change agent concludes that staff objections to a new rostering system are 'just resistance'. Ford, Ford & D'Amelio (2008) would most likely argue that:",
      options: ["Resistance always reflects employee personality", "Resistance may reflect change agents' own actions and can be a useful resource", "Resistance should be overcome with coercive power", "Resistance only occurs in hierarchy cultures"],
      answer: 1,
      why: ["Wrong. That is a dispositional-only view they explicitly challenge.", "Correct. They argued that resistance is partly constructed by change agents' sensemaking and their broken agreements, and can surface valuable information.", "Wrong. Coercion tends to deepen resistance.", "Wrong. No such claim."] }
  ],
  challenge: {
    title: "Restructuring the hospital nursing model",
    scenario: `<p><i>Fictional scenario.</i> A hospital moves from a functional nursing model to a team-based primary-nursing model, with new shift patterns. Long-tenured nurses had informal assurances about preferred shifts. Management launched with a single town hall. Absenteeism has risen and some nurses openly refuse the new patterns.</p>`,
    tasks: ["Analyse the situation using psychological-contract theory.", "Distinguish dispositional from situational sources of resistance and say how you'd measure each.", "Design a change process using an evidence-informed model.", "Define outcome metrics and an evaluation design."],
    rubric: ["Identifies relational contract content (shift-preference assurances) and perceived breach leading to violation", "Distinguishes Oreg dispositional resistance from change-specific reactions (readiness, commitment to change)", "Selects measures appropriately (PCI or breach scale, Oreg RTC, Holt readiness) and avoids labelling individuals", "Uses readiness messages and participation: nurse co-design, pilot wards", "Addresses procedural justice: transparent criteria for shift allocation, i-deals for constraints", "Evaluation: absenteeism, patient outcomes, nurse retention, staggered pilot comparison"],
    model: `<p>Informal shift assurances formed relational contract terms. The abrupt change was perceived as breach, and violation feelings arose because the process lacked voice. Some nurses may score high on dispositional routine seeking, but group-level resistance mostly reflects situational factors (readiness, trust). Measure breach and readiness anonymously at ward level. Use the Oreg scale only for research or aggregate insight, not to identify 'resisters'. Process: a ward-level design team, a pilot on two wards, transparent shift-allocation rules with an i-deal pathway, readiness messages from respected clinical leaders, and short-term wins shared. Evaluate with absenteeism, retention, nurse-sensitive patient outcomes and repeated readiness surveys, comparing pilot and non-pilot wards.</p>`
  },
  cheat: [

    "Transactional vs relational (plus balanced and transitional in the PCI).",
    "Breach = cognitive; violation = emotional (Morrison &amp; Robinson, 1997).",

    "Oreg RTC: routine seeking, emotional reaction, short-term focus, cognitive rigidity.",
    "Ford et al. (2008): resistance can be a resource and is partly created by change agents.",
    "Lewin's 3-step model: attribution debated (Cummings et al., 2016). Kotter: practitioner-derived.",

  ]
});

OB.modules.push({
  id: "m6-1", unit: 6,
  title: "Stress, Burnout, and Well-Being in Modern Work",
  threads: ["A", "N", "C", "E"],
  construct: {
    def: `<p><b>Occupational stress</b> is, in the transactional view (Lazarus &amp; Folkman, 1984), a relationship between person and environment that the person appraises as taxing or exceeding their resources and endangering well-being. Primary appraisal asks "is this a threat?" Secondary appraisal asks "can I cope?"</p>
<p><b>Burnout</b> is a syndrome of <i>exhaustion</i>, <i>cynicism/depersonalisation</i> and <i>reduced professional efficacy</i> resulting from chronic workplace stress (Maslach and colleagues). The WHO's ICD-11 (2019) classifies burnout as an <b>occupational phenomenon</b> (QD85), not a medical condition, and restricts it to the occupational context.</p>
<p><b>Work engagement</b> is "a positive, fulfilling, work-related state of mind characterised by vigour, dedication, and absorption" (Schaufeli, Salanova, González-Romá &amp; Bakker, 2002).</p>`,
    framework: `<ul>
<li><b>Demand-Control(-Support) model</b> (Karasek, 1979; Johnson &amp; Hall, 1988): high demands combined with low control produce high strain. Social support buffers this.</li>
<li><b>Effort-Reward Imbalance</b> (Siegrist, 1996): high effort combined with low reward (pay, esteem, security) produces strain. <i>Overcommitment</i> amplifies the effect.</li>
<li><b>Job Demands-Resources (JD-R) model</b> (Demerouti, Bakker, Nachreiner &amp; Schaufeli, 2001; Bakker &amp; Demerouti, 2007, 2017). It has two processes: a <i>health-impairment</i> process (demands lead to exhaustion and health problems) and a <i>motivational</i> process (resources lead to engagement and performance). Resources buffer demands, and resources are most salient when demands are high. Later extensions add personal resources and job crafting.</li>
<li><b>Compassion fatigue</b> (Figley) and <b>secondary traumatic stress</b> in helping professions. These are captured by the ProQOL's subscales (see Module 6.2).</li>
</ul>`
  },
  advanced: [
    { ev: "est", title: "The JD-R model is robust and flexible", html: `<p>The JD-R model has broad support across occupations and countries. Its flexibility is both a strength and a critique: almost any job feature can be classified as a "demand" or "resource", which makes the model hard to falsify. Distinguish <b>challenge demands</b> (workload, responsibility, often linked to engagement) from <b>hindrance demands</b> (role ambiguity, red tape, linked to strain) (Crawford, LePine &amp; Rich, 2010, meta-analysis).</p>` },
    { ev: "crit", title: "Burnout is not a diagnosis", html: `<p>Maslach and Leiter caution that the MBI was designed as a research measure of a continuum, not a diagnostic tool, and that arbitrary cut-offs misclassify people. Burnout overlaps substantially with depression in some studies, and the boundary is debated. In practice, a high burnout score should prompt <i>organizational</i> review and, where appropriate, referral to a qualified professional, not a label.</p>` },
    { ev: "est", title: "Telework: small average benefits, important trade-offs", html: `<p>Gajendran &amp; Harrison's (2007) meta-analysis found that telecommuting had small positive effects on perceived autonomy, job satisfaction and performance, and lower work-family conflict. High-intensity telecommuting harmed co-worker relationships. Bloom, Han &amp; Liang (2024, <i>Nature</i>) reported in a randomised trial that two home days a week reduced quits by about one-third with no detectable damage to performance ratings or promotions over two years.</p>` },
    { ev: "emg", title: "Technostress and the right to disconnect", html: `<p>Technostress, stress from ICT overload, invasion and complexity, has been studied since Tarafdar and colleagues (2007). "Always-on" expectations blur boundaries. Boundary-management research and "right to disconnect" policies (for example in France and Australia) are emerging responses. Evidence on policy effectiveness is still limited.</p>` },
    { ev: "emg", title: "Individual vs organizational interventions", html: `<p>Fleming's (2024, <i>Industrial Relations Journal</i>) analysis of a large UK employee survey found that participants in individual-level well-being interventions (for example resilience training, well-being apps) reported no better well-being than non-participants. Organizational-level changes (scheduling, staffing, workload) appeared more promising. The study is cross-sectional, so causal claims are limited. It supports the long-standing occupational health principle of tackling causes at source.</p>` },
    { ev: "int", title: "Neurobiology of chronic stress (interpretive)", html: `<p>Chronic stress involves prolonged hypothalamic-pituitary-adrenal (HPA) axis activation. McEwen's <b>allostatic load</b> concept describes cumulative physiological wear. Biomarkers such as cortisol are used in research, but they vary with time of day and individual differences. They are <i>not</i> appropriate for screening individual employees.</p>` },
    { ev: "prac", title: "Healthcare workforce well-being", html: `<p>For helping professions, monitor <i>compassion satisfaction</i> as well as burnout and secondary traumatic stress. Interventions with the strongest rationale are organizational: safe staffing, protected breaks, peer support (for example structured debriefs after critical incidents), and reducing administrative hindrance demands.</p>` }
  ],
  matrices: [{
    caption: "Stress models compared",
    head: ["Model", "Key variables", "Core prediction", "Typical measure", "Main critique"],
    rows: [
      ["Transactional (Lazarus &amp; Folkman)", "Appraisal, coping", "Stress depends on appraisal of demands vs resources", "Ways of Coping; PSS-10 (Cohen et al., 1983)", "Hard to measure appraisal independently of strain"],
      ["Demand-Control-Support", "Demands, decision latitude, support", "High demand + low control + low support = iso-strain", "Job Content Questionnaire (Karasek)", "Interaction effects are often weak"],
      ["Effort-Reward Imbalance", "Effort, reward, overcommitment", "High effort + low reward = strain", "ERI questionnaire (Siegrist)", "Overlaps with justice constructs"],
      ["JD-R", "Demands, resources (job and personal)", "Dual process: health impairment and motivation", "JD-R surveys, UWES, burnout measures", "Very flexible, so hard to falsify"]
    ]
  }, {
    caption: "Burnout and engagement measures",
    head: ["Instrument", "Dimensions", "Access", "Caution"],
    rows: [
      ["MBI-HSS / MBI-GS (Maslach et al.)", "Emotional exhaustion, depersonalisation/cynicism, personal accomplishment/efficacy", "Proprietary (Mind Garden)", "Authors caution against diagnostic cut-offs"],
      ["Copenhagen Burnout Inventory (Kristensen et al., 2005)", "Personal, work-related, client-related burnout", "Free to use", "Exhaustion-focused; different construct emphasis"],
      ["Burnout Assessment Tool (Schaufeli, De Witte &amp; Desart, 2020)", "Exhaustion, mental distance, cognitive impairment, emotional impairment (plus secondary symptoms)", "Free for non-commercial use", "Newer; cut-off values come from specific national samples"],
      ["UWES-9 / UWES-17", "Vigour, dedication, absorption", "Free for non-commercial use", "Three factors often correlate highly; total score commonly used"]
    ]
  }],
  case: {
    title: "ICU nurses after the surge",
    setting: "Fictional illustrative scenario: a 1,000-bed tertiary teaching hospital in South India.",
    scenario: `<p>Two years after a pandemic surge, ICU nurse turnover is 28% a year. A pulse survey with the WHO-5 and ProQOL shows low well-being scores and high burnout subscale scores on average, but high compassion satisfaction. Nurses cite mandatory overtime, documentation load and lack of breaks. Management has proposed a mindfulness app.</p>`,
    issue: `<p>A <b>JD-R health-impairment</b> pattern: high quantitative demands and hindrance demands (documentation), low recovery resources. High compassion satisfaction shows the motivational core is intact; nurses value the work itself. An individual-level app does not address the demand sources and may signal that the problem is the nurses' coping.</p>`,
    intervention: `<ol><li>Organizational first: safe-staffing review, overtime caps, protected break relief, documentation streamlining (removing hindrance demands).</li><li>Resources: peer-support debriefs, charge-nurse coaching, recognition, scheduling autonomy.</li><li>Individual supports as an addition, not a substitute, including access to confidential counselling.</li><li>Ethics: aggregate reporting only, voluntary participation, a referral pathway for anyone who requests help.</li><li>Evaluate: ProQOL, WHO-5 and turnover at 6 and 12 months, compared with a ward that has not yet implemented the changes.</li></ol>`
  },
  measures: [
    { name: "MBI (Maslach Burnout Inventory)", type: "Burnout scale", use: "Research and organizational assessment of burnout dimensions.", limits: "Not diagnostic. Report the three dimensions separately; avoid arbitrary cut-offs." },
    { name: "Copenhagen Burnout Inventory", type: "Burnout scale", use: "Free; suits health and public-sector surveys.", limits: "Exhaustion-centric. Not directly comparable with MBI scores." },
    { name: "UWES-9", type: "Engagement scale", use: "Short engagement measure (Schaufeli, Bakker &amp; Salanova, 2006).", limits: "Consider the total score if the subscales are highly correlated." },
    { name: "Perceived Stress Scale (PSS-10)", type: "Stress appraisal", use: "Cohen, Kamarck &amp; Mermelstein (1983): perceived stress in the last month.", limits: "General, not work-specific. Not a diagnostic measure." },
    { name: "Behavioural and organizational indicators", type: "Behavioural indicator", use: "Overtime hours, missed breaks, sick leave, turnover, after-hours system logins.", limits: "Use in aggregate. Individual-level monitoring raises surveillance and ethical issues." }
  ],
  assess: "Assessment link: well-being instruments are monitoring tools, not diagnostic tests. Combine them with demand and resource data so you can act on causes.",
  mcqs: [
    { q: "In the JD-R model, the 'health-impairment process' primarily links:",
      options: ["Job resources to engagement", "Job demands to exhaustion and health problems", "Personal resources to performance", "Engagement to job crafting"],
      answer: 1,
      why: ["Wrong. That is the motivational process.", "Correct. Chronic job demands drain energy, leading to exhaustion and health impairment (Demerouti et al., 2001; Bakker &amp; Demerouti, 2007).", "Wrong. Personal resources are an extension of the model, mostly linked to the motivational process.", "Wrong. That is a feedback loop in later versions, not the health-impairment process."] },
    { q: "Under WHO's ICD-11, burnout is best described as:",
      options: ["A psychiatric disorder diagnosed with the MBI", "An occupational phenomenon resulting from chronic workplace stress that has not been successfully managed", "A synonym for clinical depression", "A personality trait"],
      answer: 1,
      why: ["Wrong. ICD-11 does not classify burnout as a medical condition, and the MBI is not a diagnostic instrument.", "Correct. ICD-11 (QD85) classifies burnout as an occupational phenomenon specific to the work context.", "Wrong. Overlap with depression is debated, but they are not synonyms.", "Wrong. Burnout is a response to chronic work stress, not a trait."] },
    { q: "Crawford, LePine & Rich (2010) distinguished challenge from hindrance demands. Which is a hindrance demand?",
      options: ["High responsibility for patient outcomes", "Time urgency on an important project", "Role ambiguity and bureaucratic red tape", "Job complexity"],
      answer: 2,
      why: ["Wrong. Responsibility is a typical challenge demand.", "Wrong. Time urgency is typically classed as a challenge demand.", "Correct. Role ambiguity and red tape are hindrance demands, associated with strain and lower engagement.", "Wrong. Complexity is typically a challenge demand."] }
  ],
  challenge: {
    title: "The 24/7 analytics team",
    scenario: `<p><i>Fictional scenario.</i> A global capability centre's analytics team supports US and UK clients from Chennai. Employees attend late-night calls, receive weekend messages, and have experienced two rounds of layoffs. UWES scores are falling, sick leave is up, and the CHRO wants to "measure burnout and identify at-risk employees" with the MBI.</p>`,
    tasks: ["Apply at least two stress models to diagnose the situation.", "Evaluate the CHRO's plan for using the MBI.", "Design an ethical measurement strategy.", "Propose an intervention portfolio and how you would evaluate it."],
    rubric: ["Uses JD-R (time-zone demands, low recovery resources) and/or ERI (high effort, job insecurity as low reward) and/or DCS", "Flags technostress and boundary erosion", "Rejects identifying 'at-risk' individuals via MBI cut-offs: it is not diagnostic, raises stigma and ethical risk", "Proposes anonymous, aggregate measurement with consent, a minimum reporting group size, and a referral pathway", "Prioritises organizational interventions (call rotation, after-hours norms, workload review, communication about job security)", "Evaluation: repeated UWES and burnout measures, sick-leave data, comparison team or staggered rollout"],
    model: `<p>JD-R: high time-zone and after-hours demands, with recovery resources eroded. ERI: high effort with low security after layoffs, which is a reward deficit. The MBI should not be used to flag individuals. It is not a diagnostic tool, and labelling risks stigma, discrimination and loss of trust. Use anonymous, team-level measurement with a minimum group size of about 10, explicit consent, and a voluntary confidential support route. Interventions: rotating late-call rosters, response-time norms and a "no-weekend-messages" protocol, compensatory time off, honest communication about restructuring, manager training in recognising strain and signposting support. Evaluate with quarterly UWES-9 and CBI work-related burnout scores, sick leave and attrition, using a staggered rollout across sub-teams.</p>`
  },
  cheat: [
    "Stress is transactional: primary appraisal (threat?) and secondary appraisal (can I cope?).",
    "Burnout: exhaustion, cynicism or depersonalisation, reduced efficacy. ICD-11 calls it an occupational phenomenon.",
    "Engagement: vigour, dedication, absorption (UWES).",
    "DCS: high demand, low control, low support. ERI: high effort, low reward, overcommitment.",
    "JD-R: demands lead to exhaustion (health impairment); resources lead to engagement (motivation).",

OB.modules.push({
  id: "m6-2", unit: 6,
  title: "Psychometrics, Assessment, and Behavioural Interventions",
  threads: ["A", "N", "C", "E"],
  widget: "who5",
  construct: {
    def: `<p><b>Psychometrics</b> is the science of measuring psychological attributes. In <b>classical test theory</b>, an observed score is a true score plus error (X = T + E). <b>Reliability</b> is the proportion of observed-score variance that is true-score variance, meaning consistency. <b>Validity</b> is "the degree to which evidence and theory support the interpretations of test scores for proposed uses" (<i>Standards for Educational and Psychological Testing</i>, AERA/APA/NCME, 2014). Validity belongs to the <i>interpretation and use</i>, not to the test itself.</p>
<p>A <b>behavioural intervention</b> is a planned change to the environment, incentives, information or choice architecture, intended to change specific behaviours. It should be evaluated with designs that support causal inference.</p>`,
    framework: `<ul>
<li><b>Reliability types</b>: internal consistency (Cronbach's α; McDonald's ω is often preferred), test-retest, inter-rater (ICC, Cohen's κ), and parallel forms.</li>
<li><b>Sources of validity evidence</b> (Standards, 2014): test content, response processes, internal structure (factor analysis), relations to other variables (convergent, discriminant, criterion), and consequences of testing.</li>
<li><b>Measurement invariance</b>: configural, metric and scalar levels must hold before comparing groups (for example across languages, genders or sites).</li>
<li><b>Screening vs diagnosis</b>: screening tools flag people for further assessment, judged by sensitivity and specificity. Diagnosis requires a qualified professional and clinical assessment.</li>
<li><b>Intervention logic</b>: Kirkpatrick levels for training; logic models (inputs, activities, outputs, outcomes); behavioural design frameworks such as EAST (Easy, Attractive, Social, Timely; Behavioural Insights Team) and nudges (Thaler &amp; Sunstein, 2008).</li>
</ul>`
  },
  advanced: [
    { ev: "est", title: "ProQOL: Professional Quality of Life", html: `<p>The ProQOL (Stamm; version 5, 2010) has 30 items on a 1-5 frequency scale over the last 30 days. There are three 10-item subscales: <b>Compassion Satisfaction</b>, <b>Burnout</b>, and <b>Secondary Traumatic Stress</b>. The ProQOL 5 manual's guidance places summed scores of 22 or less as low, 23 to 41 as average, and 42 or more as high for each subscale. It is designed for helpers such as health workers, social workers and first responders. <b>Use cautions:</b> it is a screening and self-reflection tool, not a diagnostic test. Use the official version under its stated terms; the ProQOL organisation publishes the measure and its conditions of use. Validate translations before use in Tamil, Hindi or other languages. Check the official source for the current version, as the measure has been revised since version 5.</p>` },
    { ev: "est", title: "WHO-5 Well-Being Index", html: `<p>The WHO-5 has 5 positively worded items about the last two weeks, each rated 0-5. The raw score (0-25) is multiplied by 4 to give a 0-100 percentage. Topp, Østergaard, Søndergaard &amp; Bech's (2015) systematic review supported its validity as a well-being measure and as a screening tool for depression. Commonly used thresholds: <b>50 or below</b> suggests poor well-being and warrants further assessment; <b>28 or below</b> is often used to indicate likely depression for screening. <b>Use cautions:</b> a low score is a signal for supportive follow-up with consent, never a diagnosis. In workplace surveys, report aggregate results and give respondents information about support resources.</p>` },
    { ev: "crit", title: "Common method variance", html: `<p>When predictor and outcome are both self-reported by the same person at the same time, correlations may be inflated by shared method (Podsakoff, MacKenzie, Lee &amp; Podsakoff, 2003). Remedies include temporal separation, multi-source data and procedural safeguards (anonymity, reducing item ambiguity).</p>` },
    { ev: "crit", title: "Nudge effects may be smaller than headlines", html: `<p>Mertens, Herberz, Hahnel &amp; Brosch (2022, <i>PNAS</i>) meta-analysed choice-architecture interventions and reported a small-to-medium average effect. Commentators (for example Maier et al., 2022) argued that after adjusting for publication bias, the evidence for an average effect was weak. Effects vary greatly by type: defaults tend to be strongest. Pilot locally and evaluate rigorously.</p>` },
    { ev: "est", title: "Experimental paradigms used in OB research", html: `<p>Vignette and policy-capturing experiments (manipulating scenario features), economic games (Ultimatum, Dictator, Trust Game; Berg, Dickhaut &amp; McCabe, 1995, and public goods games), decision paradigms (IGT, framing tasks), and cognitive tasks (Stroop, n-back for workload). Field experiments, including randomised rollouts and A/B tests, offer stronger external validity. Each paradigm trades internal against external validity.</p>` },
    { ev: "prac", title: "Ethics and data protection", html: `<p>Workplace psychometric data are sensitive personal data. In India, the <b>Digital Personal Data Protection Act, 2023</b> sets consent and purpose-limitation obligations. Professional practice also requires informed consent, confidentiality, a minimum group size for aggregate reports, qualified interpretation (for example by registered psychologists or trained I-O practitioners), and the International Test Commission (ITC) Guidelines for translating and adapting tests.</p>` }
  ],
  matrices: [{
    caption: "Reliability and validity evidence: what, how, typical benchmark",
    head: ["Evidence", "Question", "Typical statistic", "Rule of thumb (context-dependent)"],
    rows: [
      ["Internal consistency", "Do items hang together?", "α, ω", "≥ .70 for research; higher for individual decisions"],
      ["Test-retest", "Is the score stable over time?", "Pearson r / ICC", "Depends on whether the construct is trait-like or state-like"],

      ["Convergent and discriminant", "Related to similar constructs, distinct from different ones?", "Correlations; MTMM", "Pattern matters more than any one value"],

  }, {

      ["Appropriate use", "Self-reflection, programme monitoring, research", "Well-being monitoring, depression screening prompt"],

      ["Pre/post with comparison group", "Moderate", "Natural comparison units exist", "Selection differences"],
      ["Difference-in-differences", "Moderate to strong", "Parallel pre-trends can be shown", "Violated parallel-trends assumption"],
      ["Interrupted time series", "Moderate to strong", "Many repeated measures", "Co-occurring events"],
      ["Stepped-wedge rollout", "Strong", "Everyone eventually gets the intervention", "Time trends; contamination"],
      ["Randomised controlled trial / A/B test", "Strongest", "Random assignment feasible and ethical", "Attrition; limited generalisability"]
    ]
  }],
  case: {
    title: "The vendor's 20-point well-being claim",
    setting: "Fictional illustrative scenario: a corporate well-being programme in a Chennai manufacturing company.",
    scenario: `<p>A vendor's 8-week resilience programme reports that participants' mean WHO-5 score rose from 44 to 64. Participation was voluntary (about 15% of staff). Only 60% of starters completed the post-survey. The vendor proposes a company-wide rollout and wants to share individual scores with line managers "to target support".</p>`,
    issue: `<p>Several threats to validity: <b>self-selection</b> (volunteers differ), <b>attrition bias</b> (completers may be those who improved), <b>regression to the mean</b> (people who join when they feel low tend to improve anyway), no comparison group, and a possible demand effect. Sharing individual WHO-5 scores with managers is <b>ethically inappropriate</b>: it breaches confidentiality, risks stigma, and treats a screening tool as a diagnostic or management tool.</p>`,
    intervention: `<ol><li>Refuse individual score sharing. Reports should be aggregate only, with a minimum group size.</li><li>Require an intention-to-treat analysis and the attrition data.</li><li>Run a stepped-wedge or waitlist-controlled rollout across plants.</li><li>Add organizational measures (shift patterns, overtime) and outcome data (sick leave).</li><li>Provide a confidential referral pathway for anyone scoring low who wants support, offered to the individual, not reported to managers.</li></ol>`
  },
  measures: [
    { name: "WHO-5", type: "Well-being index", use: "5 items, 0-100 percentage score. Monitoring and screening prompt.", limits: "Not diagnostic. Use validated language versions. Low scores warrant supportive, consented follow-up." },
    { name: "ProQOL", type: "Professional quality of life", use: "Compassion satisfaction, burnout and secondary traumatic stress in helpers.", limits: "Screening and reflection only. Use the official current version under its conditions of use." },
    { name: "WEMWBS", type: "Mental well-being", use: "Warwick-Edinburgh Mental Wellbeing Scale: 14 items (short form SWEMWBS: 7). Covers hedonic and eudaimonic aspects.", limits: "Registration and licence terms apply. Not diagnostic." },

    { name: "Logic model and evaluation plan", type: "Evaluation framework", use: "Link inputs, activities, outputs and outcomes, with pre-registered metrics.", limits: "Must be agreed before data collection to avoid cherry-picking." }
  ],
  assess: "Assessment hub: this module is the cross-cutting home of assessment and evaluation in OB. Every other module's 'Measurement & Diagnostics' panel applies these principles.",
  mcqs: [
    { q: "A WHO-5 respondent's raw item scores sum to 11. What is their percentage score, and what is the most appropriate response in a workplace well-being survey?",
      options: ["44; diagnose mild depression and inform their manager", "44; the score suggests poor well-being, so offer confidential information about further assessment or support", "11; no action needed", "55; the score is within the normal range"],
      answer: 1,
      why: ["Wrong. The calculation is right (11 × 4 = 44), but the WHO-5 is not diagnostic and sharing individual scores with managers breaches confidentiality.", "Correct. 11 × 4 = 44, which is at or below 50 and suggests poor well-being, warranting supportive, consented follow-up. Not a diagnosis.", "Wrong. The raw score must be multiplied by 4. 11 is not the percentage score.", "Wrong. The arithmetic is incorrect (11 × 5 = 55)."] },
    { q: "According to the Standards for Educational and Psychological Testing (2014), validity is best described as:",
      options: ["A property of the test itself, established once", "The degree to which evidence and theory support score interpretations for proposed uses", "The test's internal consistency (Cronbach's alpha)", "The correlation between two administrations of a test"],
      answer: 1,
      why: ["Wrong. Modern validity theory locates validity in interpretations and uses, not in the instrument.", "Correct. This is the Standards' unified view. Validity evidence must be accumulated for each intended use.", "Wrong. Alpha is reliability evidence, which is necessary but not sufficient for validity.", "Wrong. That is test-retest reliability."] },
    { q: "Which design gives the strongest causal evidence that a well-being programme improved outcomes, when everyone must eventually receive it?",
      options: ["Single-group pre/post", "Post-only survey of participants", "Stepped-wedge (staggered randomised) rollout", "Comparing volunteers with non-volunteers"],
      answer: 2,
      why: ["Wrong. Vulnerable to history, maturation and regression to the mean.", "Wrong. There is no baseline and no comparison.", "Correct. Randomising the order in which units receive the intervention gives each unit periods of control and intervention, supporting causal inference while ensuring universal access.", "Wrong. Confounded by self-selection."] }
  ],
  challenge: {

    scenario: `<p><i>Fictional scenario.</i> A hospital network asks you to design a well-being measurement and intervention system for 4,000 staff (doctors, nurses, allied health, administrative staff) across three cities. Leadership wants a single "well-being score" on a dashboard, and asks whether ProQOL or WHO-5 is "better".</p>`,
    tasks: ["Recommend instruments and justify fit for each staff group.", "Address reliability, validity, invariance and translation.", "Design ethical governance for data collection and reporting.", "Propose an intervention-evaluation plan."],
    rubric: ["Explains that ProQOL and WHO-5 measure different constructs. ProQOL fits helping roles; WHO-5 fits all staff. Possibly both, with clear purposes", "Rejects a single composite score as misleading; recommends a profile of subscales", "Addresses translation (ITC Guidelines), measurement invariance across groups and languages, and local reliability checks", "Specifies ethics: consent, anonymity, minimum group size, DPDP Act compliance, no individual reporting to managers, voluntary support pathway, qualified oversight", "Links measures to actionable organizational drivers (JD-R demands and resources)", "Uses a robust evaluation design (stepped-wedge, DiD) with pre-specified outcomes including turnover and sick leave"],
    model: `<p>Neither is "better"; they answer different questions. Use the WHO-5 for all staff (brief, general well-being) and the ProQOL for clinical and helping staff (compassion satisfaction, burnout, STS), plus a short JD-R driver module (workload, autonomy, support). Do not merge everything into one score. Show a profile with confidence intervals. Use validated translations following ITC Guidelines, test invariance across professions and languages before comparing means, and report ω. Governance: an ethics committee review, informed consent, anonymous collection through a third party, reporting only for groups of 10 or more, signposting to confidential support, and interpretation overseen by qualified professionals. Evaluation: stepped-wedge rollout of organizational interventions across hospitals with pre-registered outcomes (WHO-5, ProQOL subscales, turnover, sick leave).</p>`

</script>
<script>
(function () {
  "use strict";
  var EV = {
    est: ["Established finding", "Replicated or meta-analytic evidence"],
    emg: ["Emerging research", "Growing but incomplete evidence"],
    int: ["Theoretical interpretation", "A reasoned bridge, not directly tested"],
    crit: ["Critique / boundary", "Limits, contested claims, failed replications"],
    prac: ["Practical recommendation", "Evidence-informed practice guidance"]
  };
  var TABS = [
    ["Deep Dive", [["construct", "Core construct"], ["advanced", "Advanced expansion"], ["matrix", "Comparative matrix"], ["case", "Case in point"], ["measures", "Measurement & diagnostics"]]],
    ["Exam & Field Toolkit", [["mcq", "Concept-check MCQs"], ["challenge", "Case challenge"], ["cheat", "Cheat sheet"]]]
  ];
  var MODS = OB.modules;
  var byId = {};
  MODS.forEach(function (m) { byId[m.id] = m; });
  var TOTAL_Q = MODS.reduce(function (s, m) { return s + m.mcqs.length; }, 0);
  var view = document.getElementById("view");
  var ui = { tab: {}, toolFilter: "All", exam: null };

  /* ---------- storage (per-viewer convenience only) ---------- */
  var KEY = "obmd-v1";
  var store = { answers: {}, first: {}, drafts: {}, rubric: {} };
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); store.answers = p.answers || {}; store.first = p.first || {}; store.drafts = p.drafts || {}; store.rubric = p.rubric || {}; } } catch (e) {}
  try { var t = localStorage.getItem(KEY + "-tabs"); if (t) ui.tab = JSON.parse(t) || {}; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); localStorage.setItem(KEY + "-tabs", JSON.stringify(ui.tab)); } catch (e) {} }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function strip(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent || ""; }
  function modNum(m) { return m.id.slice(1).replace("-", "."); }
  function unitOf(m) { return OB.units[m.unit - 1]; }
  function evChip(k) { return '<span class="chip ev-' + k + '" title="' + esc(EV[k][1]) + '">' + EV[k][0] + "</span>"; }
  function threadChips(m) { return m.threads.map(function (t) { return '<span class="chip t" title="' + esc(OB.threads[t].desc) + '">' + OB.threads[t].name + "</span>"; }).join(" "); }

  /* ---------- progress ---------- */
  function modStats(m) {
    var a = 0, c = 0;
    m.mcqs.forEach(function (_, i) { var f = store.first[m.id + ":" + i]; if (f !== undefined) { a++; if (f) c++; } });
    var rub = store.rubric[m.id] || [];
    var rc = rub.filter(Boolean).length;
    return { answered: a, correct: c, total: m.mcqs.length, rubric: rc, rubricTotal: m.challenge.rubric.length };
  }
  function updatePill() {
    var c = 0; MODS.forEach(function (m) { c += modStats(m).correct; });
    document.getElementById("scorePill").textContent = c + " / " + TOTAL_Q + " correct";
  }
  function dotsFor(m) {
    return m.mcqs.map(function (_, i) { var f = store.first[m.id + ":" + i]; return '<i class="dot' + (f === undefined ? "" : (f ? " ok" : " no")) + '"></i>'; }).join("");
  }

  /* ---------- rail ---------- */
  function renderRail(active) {
    var html = OB.units.map(function (u) {
      return '<li><div class="u-head"><span class="u-num">U' + u.n + "</span><span>" + esc(u.title) + "</span></div>" +
        u.modules.map(function (id) {
          var m = byId[id];
          return '<a class="mod-link" href="#' + id + '"' + (active === id ? ' aria-current="page"' : "") + '><span class="mono" style="font-size:.78rem">' + modNum(m) + "</span><span>" + esc(m.title) + '</span><span class="dots" aria-hidden="true">' + dotsFor(m) + "</span></a>";
        }).join("") + "</li>";
    }).join("");
    document.getElementById("unitNav").innerHTML = html;
    document.getElementById("railLegend").innerHTML = Object.keys(EV).map(function (k) { return "<div>" + evChip(k) + "</div>"; }).join("");
    document.querySelectorAll("[data-nav]").forEach(function (a) {
      if (a.getAttribute("data-nav") === active) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
  }
  var railBody = document.getElementById("railBody"), railToggle = document.getElementById("railToggle");
  railToggle.addEventListener("click", function () {
    var open = railBody.getAttribute("data-open") !== "true";
    railBody.setAttribute("data-open", open ? "true" : "false");
    railToggle.setAttribute("aria-expanded", open ? "true" : "false");
    railToggle.textContent = open ? "Hide units and modules" : "Show units and modules";
  });
  if (window.matchMedia("(min-width: 881px)").matches) railBody.setAttribute("data-open", "true");

  /* ---------- matrix ---------- */
  function matrixHTML(mx, idx) {
    return '<div class="tbl-wrap"><table><caption>' + mx.caption + "</caption><thead><tr>" +
      mx.head.map(function (h) { return '<th scope="col">' + h + "</th>"; }).join("") + "</tr></thead><tbody>" +
      mx.rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") +
      '</tbody></table><div class="matrix-tools"><button class="btn small" data-copymd="' + idx + '">Copy as Markdown table</button></div></div>';
  }
  function matrixMD(mx) {
    var cell = function (c) { return strip(c).replace(/\|/g, "\\|").trim(); };
    var lines = ["**" + strip(mx.caption) + "**", "", "| " + mx.head.map(cell).join(" | ") + " |", "|" + mx.head.map(function () { return " --- "; }).join("|") + "|"];
    mx.rows.forEach(function (r) { lines.push("| " + r.map(cell).join(" | ") + " |"); });
    return lines.join("\n");
  }

  /* ---------- MCQ component ---------- */
  function mcqHTML(m, i, label) {
    var q = m.mcqs[i], key = m.id + ":" + i, rec = store.answers[key];
    var letters = "ABCD";
    var opts = q.options.map(function (o, j) {
      var cls = "", why = "";
      if (rec) {
        if (j === q.answer) cls = " correct"; else if (j === rec.choice) cls = " wrong";
        if (j === q.answer || j === rec.choice || rec.showAll) why = '<span class="why">' + q.why[j] + "</span>";
      }
      return '<button class="opt' + cls + '" data-q="' + key + '" data-o="' + j + '"' + (rec ? " disabled" : "") + '><span class="k">' + letters[j] + "</span><span>" + o + "</span>" + why + "</button>";
    }).join("");
    var verdict = "";
    if (rec) {
      var ok = rec.choice === q.answer;
      verdict = '<div class="verdict ' + (ok ? "ok" : "no") + '">' + (ok ? "Correct." : "Not quite. The correct answer is " + letters[q.answer] + ".") +
        (store.first[key] === false && ok ? ' <span class="muted" style="font-weight:400">(first attempt was incorrect)</span>' : "") +
        '<span class="row" style="margin-left:auto">' + (rec.showAll ? "" : '<button class="btn small" data-all="' + key + '">Show rationale for every option</button>') +
        '<button class="btn small" data-retry="' + key + '">Try again</button></span></div>';
    }
    return '<div class="mcq" id="q-' + key.replace(":", "-") + '"><div class="qn">' + (label || "Question " + (i + 1) + " of " + m.mcqs.length) + '</div><div class="q">' + q.q + '</div><div class="opts">' + opts + "</div>" + verdict + "</div>";
  }
  function bindMCQ(root, rerender) {
    root.addEventListener("click", function (e) {
      var b = e.target.closest("[data-q],[data-retry],[data-all]");
      if (!b || !root.contains(b)) return;
      var key;
      if (b.hasAttribute("data-q")) {
        key = b.getAttribute("data-q");
        var parts = key.split(":"), m = byId[parts[0]], ch = +b.getAttribute("data-o");
        store.answers[key] = { choice: ch };
        if (store.first[key] === undefined) store.first[key] = ch === m.mcqs[+parts[1]].answer;
      } else if (b.hasAttribute("data-retry")) {
        key = b.getAttribute("data-retry");
        delete store.answers[key];
      } else {
        key = b.getAttribute("data-all");
        if (store.answers[key]) store.answers[key].showAll = true;
      }
      save(); updatePill(); rerender(key);
    });
  }

  /* ---------- views ---------- */
  function renderMap() {
    renderRail("map");
    var unitCards = OB.units.map(function (u) {
      return '<article class="unit-card"><h3><span class="u-num">UNIT ' + u.n + "</span>" + esc(u.title) + '</h3>' +
        '<div><div class="lbl">Core curriculum covered</div><ul>' + u.covers.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul></div>" +
        '<div><div class="lbl">Contemporary extensions</div><ul>' + u.extends.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul></div>" +
        '<div class="mods">' + u.modules.map(function (id) { var m = byId[id], s = modStats(m); return '<a href="#' + id + '"><span><span class="mono" style="color:var(--accent)">' + modNum(m) + "</span> " + esc(m.title) + '</span><span class="mono muted" style="font-size:.78rem;white-space:nowrap">' + s.correct + "/" + s.total + "</span></a>"; }).join("") + "</div></article>";
    }).join("");
    var tk = Object.keys(OB.threads);
    var threadRows = MODS.map(function (m) {
      return '<tr><td><a href="#' + m.id + '">' + modNum(m) + " " + esc(m.title) + "</a></td>" + tk.map(function (k) { return '<td class="thread-cell">' + (m.threads.indexOf(k) > -1 ? '<span class="tick" aria-label="yes">●</span>' : '<span class="muted" aria-label="no">·</span>') + "</td>"; }).join("") + "</tr>";
    }).join("");
    var covRows = OB.coverage.map(function (c) {
      return "<tr><td>" + esc(c[0]) + "</td><td>" + c[1].map(function (id) { return id === "all" ? '<span class="muted">every module’s Measurement tab</span>' : '<a href="#' + id + '">' + modNum(byId[id]) + "</a>"; }).join(", ") + "</td></tr>";
    }).join("");
    view.innerHTML =
      '<div class="stack">' +
      '<section class="hero"><div class="eyebrow">Architectural overview</div><h1>Twelve modules, six master units, one exam-ready map</h1>' +
      '<p class="lede">This dashboard organises the Organizational Behaviour Analysis curriculum into six master units. Each module follows the same Deep Dive template and ends with an Exam &amp; Field Toolkit. Four cross-cutting threads, including <b>Assessment &amp; Evaluation in OB</b>, run through every unit, so you can study by topic or by method.</p></section>' +
      '<section class="how" aria-label="How to use this dashboard">' +
      '<div class="step"><b>1 · Choose a unit</b><span>Pick any module from the curriculum rail or the unit cards below. Your place and answers are remembered in this browser.</span></div>' +
      '<div class="step"><b>2 · Read the Deep Dive</b><span>Construct, advanced research, comparative matrix, illustrative case, and measurement. Evidence labels tell you how firm each claim is.</span></div>' +

  function copyText(text, btn, done) {
    var label = btn.textContent;
    var ok = function () { btn.textContent = done; setTimeout(function () { btn.textContent = label; }, 1600); };
    try {
      navigator.clipboard.writeText(text).then(ok, function () { fallback(); });
    } catch (e) { fallback(); }
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.width = "100%"; ta.style.minHeight = "120px";
      btn.insertAdjacentElement("afterend", ta); ta.select(); btn.textContent = "Select and copy the text below";
    }
  }

  /* ---------- case challenge ---------- */
  function challengeHTML(m) {
    var c = m.challenge, rub = store.rubric[m.id] || [], draft = store.drafts[m.id] || "", revealed = !!store.rubric[m.id + ":shown"];
    return '<div class="panel stack challenge"><div class="row"><span class="fict">Scenario-based case challenge · fictional</span></div><h2>' + esc(c.title) + '</h2><div class="prose">' + c.scenario + '</div>' +
      '<div><div class="eyebrow">Your tasks</div><ol class="prose">' + c.tasks.map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ol></div>" +
      '<div class="stack" style="gap:8px"><label for="draft-' + m.id + '"><b>Draft your answer</b> <span class="muted">(saved in this browser as you type)</span></label><textarea id="draft-' + m.id + '" placeholder="Diagnosis… Evidence… Intervention… Evaluation…">' + esc(draft) + '</textarea><div class="row"><span class="muted mono" id="wc" style="font-size:.8rem"></span><button class="btn primary" id="reveal">' + (revealed ? "Hide rubric and model answer" : "Check my answer against the rubric") + "</button></div></div></div>" +
      '<div id="rubricBox" class="stack"' + (revealed ? "" : " hidden") + '><div class="panel stack"><h3>Self-assessment rubric</h3><p class="muted" style="margin:0">Tick each criterion your draft clearly meets. Be strict: an examiner would want to see it stated, not implied.</p><ul class="rubric">' +
      c.rubric.map(function (r, i) { return '<li><label><input type="checkbox" id="rb-' + m.id + "-" + i + '" data-rb="' + i + '"' + (rub[i] ? " checked" : "") + "><span>" + r + "</span></label></li>"; }).join("") +
      '</ul><div class="meter" aria-hidden="true"><i id="rbMeter"></i></div><div class="feedback" id="rbFeedback"></div></div><div class="panel prose"><div class="eyebrow">Model answer (one strong approach, not the only one)</div>' + c.model + "</div></div>";
  }
  function bindChallenge(m) {
    var ta = document.getElementById("draft-" + m.id), wc = document.getElementById("wc");
    var count = function () { var n = (ta.value.trim().match(/\S+/g) || []).length; wc.textContent = n + " words" + (n < 150 ? " · aim for 250–400 for a full answer" : ""); };
    count();
    ta.addEventListener("input", function () { store.drafts[m.id] = ta.value; save(); count(); });
    document.getElementById("reveal").addEventListener("click", function (e) {
      var box = document.getElementById("rubricBox"), show = box.hidden;
      box.hidden = !show; store.rubric[m.id + ":shown"] = show; save();
      e.currentTarget.textContent = show ? "Hide rubric and model answer" : "Check my answer against the rubric";
      if (show) { scoreRubric(m); box.scrollIntoView({ block: "start", behavior: "smooth" }); }
    });
    document.getElementById("rubricBox").addEventListener("change", function (e) {
      var i = e.target.getAttribute("data-rb"); if (i === null) return;
      var arr = store.rubric[m.id] || []; arr[+i] = e.target.checked; store.rubric[m.id] = arr; save(); scoreRubric(m);
