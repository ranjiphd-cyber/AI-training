OB.modules.push({
  id: "f3", paper: "P1",
  title: "Individual Differences",
  threads: ["A", "N", "E"],
  units: [
    { code: "3.1", title: "Attitudes and Workplace Values", topics: "Attitude components; values (Rokeach, Schwartz); cultural and generational values", sloSrc: "suggested",
      slos: ["Distinguish attitudes from values", "Explain how values shape workplace attitudes and behaviour"], lib: ["m3-1"] },
    { code: "3.2", title: "Personality Traits & Individual Differences", topics: "Big Five, locus of control, self-monitoring, proactive personality, cognitive ability, emotional intelligence", sloSrc: "suggested",
      slos: ["Describe major personality traits and other individual differences", "Evaluate their relevance to workplace behaviour"], lib: ["m1-2"] },
    { code: "3.3", title: "Learning Styles & Workplace Behaviour", topics: "Kolb's cycle; Honey & Mumford; learning-styles evidence; learning theories", sloSrc: "suggested",
      slos: ["Explain experiential learning and common learning-style models", "Critically evaluate learning-style claims and apply evidence-based learning principles"], lib: ["m1-1"] }
  ],
  construct: {
    def: `<p><b>Individual differences</b> are stable and semi-stable ways in which people vary: attitudes, values, personality, abilities and learning preferences. They explain why the same situation produces different behaviour in different people. <b>Values</b> are enduring beliefs about what is desirable that guide choices across situations. <b>Attitudes</b> are evaluations of specific objects (a job, a manager, a policy).</p>`,
    framework: `<h4>Unit 3.1 · Attitudes and workplace values</h4>
<ul><li><b>Rokeach (1973):</b> <i>terminal</i> values (desirable end-states, such as a sense of accomplishment or security) and <i>instrumental</i> values (preferred means, such as honesty, ambition, responsibility).</li>
<li><b>Schwartz (1992):</b> ten basic values arranged in a circle of compatibility and conflict. The main axes are openness to change vs conservation, and self-enhancement vs self-transcendence.</li>
<li><b>Culture:</b> Hofstede's dimensions describe national value tendencies (power distance, individualism-collectivism and others); see Module 4.</li>
<li>Values are more abstract and stable than attitudes. Attitudes have <b>cognitive, affective and behavioural</b> components (Paper 2, Module 3).</li></ul>
<h4>Unit 3.2 · Personality traits and other individual differences</h4>
<ul><li><b>Big Five</b> (Openness, Conscientiousness, Extraversion, Agreeableness, Neuroticism), with HEXACO adding Honesty-Humility (Library 1.2).</li>
<li><b>Locus of control</b> (Rotter, 1966): internal vs external beliefs about what controls outcomes. Work locus of control is measured with Spector's WLCS (Paper 8).</li>
<li><b>Self-monitoring</b> (Snyder, 1974): adjusting behaviour to situational cues.</li>
<li><b>Proactive personality</b> (Bateman &amp; Crant, 1993): a tendency to take initiative to change one's environment.</li>
<li><b>Cognitive ability</b> and <b>emotional intelligence</b>. The <i>ability model</i> of EI (Mayer &amp; Salovey) treats it as perceiving, using, understanding and managing emotions. <i>Mixed models</i> blend EI with traits and competencies.</li></ul>
<h4>Unit 3.3 · Learning styles and workplace behaviour</h4>
<ul><li><b>Kolb's experiential learning cycle</b> (1984): concrete experience, then reflective observation, then abstract conceptualisation, then active experimentation.</li>
<li><b>Honey &amp; Mumford:</b> Activist, Reflector, Theorist, Pragmatist, mapped to stages of the cycle.</li>
<li><b>VARK</b> and similar sensory-modality models.</li>
<li><b>Key distinction:</b> the <i>cycle</i> is a useful design heuristic, while the claim that matching teaching to a person's "style" improves learning (the meshing hypothesis) lacks support. Combine the cycle with robust principles such as spacing, retrieval and feedback (Library 1.1).</li></ul>`
  },
  advanced: [
    { ev: "crit", title: "The learning-styles evidence gap", html: `<p>Pashler, McDaniel, Rohrer &amp; Bjork (2008) set out the experimental design needed to test the meshing hypothesis (learners with different styles randomised to matched and mismatched instruction, with a crossover interaction). They found very few studies with this design and no convincing support. Learning-style questionnaires can still prompt reflection, but should not be used to sort trainees.</p>` },
    { ev: "crit", title: "Generational value differences are small", html: `<p>Popular claims about "Millennials" or "Gen Z" at work outrun the evidence. Costanza, Badger, Fraser, Severt &amp; Gade's (2012) meta-analysis found generational differences in job satisfaction, commitment and turnover intentions were small and inconsistent. Age, career stage and period effects are hard to separate from cohort effects.</p>` },
    { ev: "est", title: "Emotional intelligence: what it adds", html: `<p>Joseph &amp; Newman (2010) found that ability-based EI predicts job performance modestly, more so in jobs with high emotional labour. Mixed-model measures overlap substantially with personality and self-efficacy (Joseph, Jin, Newman &amp; O'Boyle, 2015). Ask which EI model an instrument measures before interpreting it.</p>` },
    { ev: "est", title: "Proactive personality and careers", html: `<p>Meta-analytic work (for example Fuller &amp; Marler, 2009) links proactive personality with job performance, career success and network building. This is one reason organisations value proactivity in roles with ambiguous, changing demands.</p>` },
    { ev: "int", title: "Values and person-organisation fit", html: `<p>When personal values match organisational values, commitment and satisfaction tend to be higher (Kristof-Brown et al., 2005, meta-analysis; Paper 2, Module 1). Interpretation: values diagnosis is a useful input to recruitment messaging and onboarding, provided it does not become a tool for excluding diverse candidates.</p>` }
  ],
  matrices: [{
    caption: "Individual-difference constructs at a glance",
    head: ["Construct", "Definition", "Stability", "Typical measure", "Workplace relevance"],
    rows: [
      ["Values", "Enduring beliefs about desirable end-states and modes of conduct", "High", "Rokeach Value Survey; Schwartz PVQ", "Fit, ethics, career choice"],
      ["Attitudes", "Evaluations of specific objects", "Moderate", "Job satisfaction and commitment scales", "Withdrawal, citizenship"],
      ["Big Five traits", "Broad dispositional tendencies", "High in adulthood", "BFI-2, IPIP, NEO", "Performance, leadership, teamwork"],
      ["Locus of control", "Beliefs about control over outcomes", "Moderately high", "Rotter scale; Spector WLCS", "Motivation, coping, leadership preference"],
      ["Emotional intelligence", "Ability or trait-like handling of emotion", "Depends on model", "MSCEIT (ability); mixed-model questionnaires", "Emotional-labour roles, leadership"],
      ["Learning preference", "Preferred approach to learning", "Low to moderate", "Kolb LSI; Honey &amp; Mumford LSQ", "Reflection prompt only; not for matching"]
    ]
  }],
  case: {
    title: "The 'learning styles' training calendar",
    setting: "Fictional illustrative scenario: L&D department of a private bank in Chennai.",
    scenario: `<p>L&D has tested every branch officer with a learning-styles questionnaire and created separate "visual", "auditory" and "kinaesthetic" versions of the anti-money-laundering course. Costs have tripled. Audit findings on KYC errors have not improved.</p>`,
    issue: `<p>The design rests on the <b>meshing hypothesis</b>, which lacks support. Effort went into matching formats rather than into evidence-based learning principles (practice with feedback, spacing, realistic cases) or the <b>work environment</b> (checklists, supervision). Individual differences that do matter, such as prior knowledge and conscientiousness, were ignored.</p>`,
    intervention: `<ol><li>Consolidate to one well-designed course using Kolb's cycle as a design sequence (case, reflection, concept, practice).</li><li>Add spaced scenario quizzes on KYC red flags.</li><li>Use pre-tests to adapt content to prior knowledge, which is a difference that matters.</li><li>Evaluate on audit error rates by branch, with staggered rollout.</li></ol>`
  },
  measures: [
    { name: "Schwartz Portrait Values Questionnaire (PVQ)", type: "Values survey", use: "Measures the ten basic values via short portraits.", limits: "Cross-cultural invariance must be checked. Values predict behaviour more weakly than specific attitudes." },
    { name: "Work Locus of Control Scale (WLCS)", type: "Personality scale", use: "Spector (1988): work-specific locus of control (see Paper 8).", limits: "Use the published key; higher scores indicate externality." },
    { name: "Learning Style Questionnaires", type: "Self-report", use: "Prompt reflection on learning habits.", limits: "Not valid for assigning instruction; weak predictive evidence." },
    { name: "Emotional intelligence measures", type: "Ability test or self-report", use: "MSCEIT for ability EI; questionnaires for trait or mixed EI.", limits: "Different models measure different constructs; check licences and validity evidence." }
  ],
  assess: "Assessment link: choose measures that match the construct's level of specificity, and do not use weakly validated typologies for decisions about people.",
  mcqs: [
    { q: "In Rokeach's framework, 'honesty' and 'responsibility' are examples of:",
      options: ["Terminal values", "Instrumental values", "Attitudes", "Personality traits"],
      answer: 1,
      why: ["Wrong. Terminal values are desired end-states, such as security or accomplishment.", "Correct. Instrumental values are preferred modes of conduct, the means to reach end-states.", "Wrong. Attitudes are evaluations of specific objects.", "Wrong. Rokeach classified these as values, not traits."] },
    { q: "What is the correct order of Kolb's experiential learning cycle?",
      options: ["Abstract conceptualisation, then concrete experience, then active experimentation, then reflective observation", "Concrete experience, then reflective observation, then abstract conceptualisation, then active experimentation", "Reflective observation, then active experimentation, then concrete experience, then abstract conceptualisation", "Active experimentation, then abstract conceptualisation, then reflective observation, then concrete experience"],
      answer: 1,
      why: ["Wrong. The cycle begins from experience, not concepts.", "Correct. Experience, reflection, conceptualisation, experimentation, and then back to new experience.", "Wrong. Experimentation follows conceptualisation.", "Wrong. This reverses the cycle."] },
    { q: "Which conclusion about learning styles is best supported by the evidence reviewed by Pashler et al. (2008)?",
      options: ["Matching instruction to style reliably improves learning", "There is little convincing evidence that matching instruction to style improves learning", "Learning styles are fixed at birth", "Visual learners cannot learn from text"],
      answer: 1,
      why: ["Wrong. This is the meshing hypothesis, which lacks support.", "Correct. Few studies used the required design, and those that did did not support meshing.", "Wrong. No such claim is supported.", "Wrong. An unsupported overgeneralisation."] }
  ],
  challenge: {
    title: "Values clash in a merged team",
    scenario: `<p><i>Fictional scenario.</i> Two software teams merge. Team A prizes stability, procedures and loyalty; Team B prizes autonomy, experimentation and speed. Conflicts arise over code-review rules. The manager wants to give everyone a personality test to "find the troublemakers".</p>`,

  construct: {
    def: `<p><b>Personality</b> is the relatively enduring pattern of thoughts, feelings and behaviours that distinguishes individuals. <b>Person–environment fit</b> is the compatibility between a person and their work environment. <b>Person–job (P-J) fit</b> is the specific match between a person's abilities, needs and preferences and the demands and rewards of a particular job.</p>`,

OB.modules.push({
  id: "i2", paper: "P2",
  title: "Perception and Cognition",
  threads: ["A", "N", "C"],
  units: [
    { code: "2.1", title: "Perceptual Processes", topics: "Nature and Stages of Perception", sloSrc: "syllabus",
      slos: ["Explain perception process", "Apply to workplace behaviour"], lib: ["m3-1"] },
    { code: "2.2", title: "Perceptual Errors", topics: "Halo Effect, Stereotyping, Contrast Effect", sloSrc: "syllabus",
      slos: ["Identify perceptual errors", "Evaluate their impact"], lib: ["m3-1"] },
    { code: "2.3", title: "Attribution Theory", topics: "Internal vs External Causes", sloSrc: "syllabus",
      slos: ["Explain attribution theory", "Apply in HR contexts"], lib: ["m3-1"] }
  ],
  construct: {
    def: `<p><b>Perception</b> is the process by which people select, organise and interpret sensory information to give meaning to their environment. A <b>perceptual error</b> is a systematic distortion in that process. <b>Attribution</b> is the process of inferring the causes of behaviour, our own and others'.</p>`,
    framework: `<h4>Unit 2.1 · Nature and stages of perception</h4>
<ol><li><b>Stimulus exposure and attention (selection):</b> we attend to salient stimuli (novel, intense, moving, contrasting) and to what matches our needs and expectations.</li>
<li><b>Organisation:</b> Gestalt principles. <i>Figure–ground</i> (what stands out), <i>closure</i> (filling gaps), <i>proximity</i> (grouping nearby things), <i>similarity</i> (grouping similar things). Information is also organised by <b>schemas</b>: mental structures of knowledge about people, roles and events.</li>
<li><b>Interpretation:</b> meaning is assigned, influenced by expectations, motives, mood and culture.</li>
<li><b>Response:</b> attitudes, judgements and behaviour follow.</li></ol>
<p><b>Factors influencing perception:</b> the <i>perceiver</i> (attitudes, motives, interests, experience, expectations), the <i>target</i> (novelty, motion, size, background, proximity) and the <i>situation</i> (time, work setting, social setting).</p>
<h4>Unit 2.2 · Perceptual errors</h4>
<ul><li><b>Halo effect</b> (Thorndike, 1920): one positive trait colours overall judgement. The <i>horns effect</i> is the negative version.</li>
<li><b>Stereotyping:</b> judging someone by perceived characteristics of their group.</li>
<li><b>Contrast effect:</b> evaluations are distorted by comparison with recently encountered others, as when an average candidate seems strong after a weak one.</li>
<li>Also: <b>selective perception</b>, <b>projection</b>, <b>similar-to-me bias</b>, <b>primacy and recency</b>, <b>leniency, severity and central tendency</b>, and the <b>self-fulfilling prophecy</b>.</li></ul>
<h4>Unit 2.3 · Attribution theory</h4>
<ul><li><b>Heider:</b> people act as naive scientists, inferring internal (dispositional) or external (situational) causes.</li>
<li><b>Kelley (1967):</b> consensus, distinctiveness, consistency (Library 3.1).</li>
<li><b>Weiner:</b> causes vary by <i>locus</i> (internal/external), <i>stability</i> (stable/unstable) and <i>controllability</i>. These shape emotions and expectations: stable causes predict the future, controllable causes invite blame.</li>
<li><b>Biases:</b> fundamental attribution error, self-serving bias, actor–observer asymmetry.</li></ul>`
  },
  advanced: [
    { ev: "crit", title: "Selective perception by function", html: `<p>Dearborn &amp; Simon (1958) reported that executives tended to define a case's main problem in terms of their own department, a classic illustration of selective perception. Later studies gave mixed support (for example Walsh, 1988). Treat it as a vivid illustration, not a precise law.</p>` },
    { ev: "crit", title: "Stereotype threat: replication concerns", html: `<p>Steele &amp; Aronson (1995) proposed that awareness of a negative stereotype about one's group can impair performance. The effect has been widely cited in work and testing contexts, but meta-analytic work (for example Flore &amp; Wicherts, 2015) suggests publication bias and smaller effects than early studies implied. Focus on structural fairness rather than relying on this one mechanism.</p>` },
    { ev: "est", title: "Rater training improves accuracy", html: `<p>Frame-of-reference training improves rating accuracy (Woehr &amp; Huffcutt, 1994, meta-analysis). Structured interviews, which use standard questions and anchored scales, reduce the impact of first impressions, halo and contrast effects.</p>` },
    { ev: "emg", title: "Perception in digital interactions", html: `<p>Video interviews and remote work change cues: background, camera angle and audio quality can influence impressions of competence. Asynchronous video interviews scored by AI raise further validity and fairness questions. This is an emerging research area; current advice is to standardise conditions and use structured scoring.</p>` }

  case: {

    setting: "Fictional illustrative scenario: campus hiring at an IT services firm.",
    scenario: `<p>Two interviewers each assess 20 graduates in one day using free-form conversation. Candidates from the interviewers' own colleges receive higher ratings, candidates interviewed right after very strong candidates receive lower ratings, and confident speakers are rated higher on "coding skills" without a coding test.</p>`,

  mcqs: [
    { q: "A manager sees an incomplete project timeline and automatically assumes the remaining steps are on track. Which Gestalt principle is operating?",
      options: ["Figure–ground", "Closure", "Proximity", "Similarity"],
      answer: 1,

OB.modules.push({
  id: "i3", paper: "P2",
  title: "Attitudes and Work Behaviour",
  threads: ["A", "C"],
  units: [
    { code: "3.1", title: "Components of Attitudes", topics: "Cognitive, Affective, Behavioural Components", sloSrc: "syllabus",
      slos: ["Define attitudes", "Analyse workplace relevance"], lib: ["m3-1"] },
    { code: "3.2", title: "Job Satisfaction & Organisational Commitment", topics: "Job Satisfaction; Organisational Commitment", sloSrc: "syllabus",
      slos: ["Evaluate impact on performance and turnover"], lib: ["m3-1"] },
    { code: "3.3", title: "Employee Engagement & Attitudes", topics: "Employee Engagement; Workplace Attitudes", sloSrc: "syllabus",
      slos: ["Link engagement with organisational outcomes"], lib: ["m6-1"] }
  ],
  construct: {
    def: `<p>An <b>attitude</b> is an evaluative statement or judgement, favourable or unfavourable, about an object, person or event. <b>Job satisfaction</b> is a positive feeling about one's job resulting from an evaluation of its characteristics. <b>Organisational commitment</b> is a psychological attachment to the organisation. <b>Employee engagement</b> is a positive, energised work state: Kahn (1990) described it as the harnessing of one's physical, cognitive and emotional self in work roles.</p>`,
    framework: `<h4>Unit 3.1 · Components of attitudes</h4>
<ul><li><b>Cognitive</b> (belief: "My supervisor gives credit to others for my work"), <b>Affective</b> (feeling: "I dislike my supervisor"), <b>Behavioural</b> (intention: "I'm looking for another job").</li>
<li><b>Cognitive dissonance</b> (Festinger, 1957): inconsistency between attitudes, or between attitude and behaviour, creates discomfort that people reduce by changing attitudes, behaviour or justifications.</li>
<li><b>Attitudes predict behaviour better</b> when attitudes are specific, accessible, strongly held, formed through direct experience, and when social pressures are weak. Ajzen's <b>Theory of Planned Behaviour</b> adds subjective norms and perceived behavioural control.</li></ul>
<h4>Unit 3.2 · Job satisfaction and organisational commitment</h4>
<ul><li><b>Causes of satisfaction:</b> the work itself (typically the strongest facet), pay, supervision, coworkers, promotion; dispositional factors such as core self-evaluations.</li>
<li><b>Responses to dissatisfaction (EVLN model):</b> <i>Exit</i> (leave), <i>Voice</i> (constructively try to improve), <i>Loyalty</i> (wait passively and optimistically), <i>Neglect</i> (let conditions worsen). Exit and neglect are destructive; voice and loyalty are constructive.</li>
<li><b>Commitment</b> (Meyer &amp; Allen, 1991): affective, continuance and normative.</li>
<li><b>Outcomes:</b> satisfaction–performance r ≈ .30 (Judge et al., 2001); satisfaction and commitment predict turnover modestly, mainly via turnover intentions (Griffeth, Hom &amp; Gaertner, 2000).</li></ul>
<h4>Unit 3.3 · Employee engagement</h4>
<ul><li><b>Kahn (1990):</b> personal engagement depends on psychological <i>meaningfulness</i>, <i>safety</i> and <i>availability</i>.</li>
<li><b>Schaufeli et al. (2002):</b> vigour, dedication and absorption (UWES).</li>
<li><b>Saks (2006):</b> distinguished job and organisation engagement; antecedents include job characteristics, perceived organisational support and fairness.</li>
<li><b>Outcomes:</b> Harter, Schmidt &amp; Hayes (2002) meta-analysed Gallup business-unit data and found engagement linked to customer satisfaction, productivity, profit, turnover and safety.</li></ul>`
  },
  advanced: [
    { ev: "crit", title: "Is engagement new wine in old bottles?", html: `<p>Macey &amp; Schneider (2008) noted confusion between engagement as a state, a trait and a behaviour. Newman &amp; Harrison (2008) argued that engagement overlaps heavily with satisfaction, commitment and involvement. Clarify which definition you use, and choose the measure accordingly.</p>` },
    { ev: "est", title: "Turnover is a process", html: `<p>Griffeth, Hom &amp; Gaertner's (2000) meta-analysis found that satisfaction and commitment predict turnover modestly, while turnover intentions and job search are the strongest proximal predictors. The <b>unfolding model</b> (Lee &amp; Mitchell, 1994) adds that "shocks" (a job offer, a conflict, a life event) often trigger leaving.</p>` },
    { ev: "emg", title: "Vendor engagement indices", html: `<p>Many organisations buy proprietary engagement surveys (for example Gallup's Q12). Business-unit-level associations are documented in vendor-affiliated research. Independent evidence on causality is more limited. Ask for technical documentation before treating an "engagement index" as validated.</p>` },
    { ev: "prac", title: "Act on voice", html: `<p>When dissatisfied employees choose voice, the organisational response determines whether voice continues or turns into exit or neglect. Closing the loop on survey feedback ("you said, we did") is a practical engagement lever.</p>` }
  ],
  matrices: [{
    caption: "EVLN responses to dissatisfaction",
    head: ["Response", "Active / passive", "Constructive / destructive", "Example"],
    rows: [
      ["Exit", "Active", "Destructive", "Resigning; searching for a new job"],
      ["Voice", "Active", "Constructive", "Suggesting improvements; raising concerns with the union"],

  }, {
    caption: "Satisfaction, commitment and engagement compared",
    head: ["Construct", "Core idea", "Typical measure", "Strongest outcome links"],
    rows: [
      ["Job satisfaction", "Evaluation of the job", "JDI; MSQ; single item", "Performance (about .30), withdrawal"],
      ["Affective commitment", "Emotional attachment to the organisation", "Allen &amp; Meyer ACS", "Turnover, citizenship"],
      ["Work engagement", "Energised, absorbed work state", "UWES-9", "Performance, well-being"],
      ["Job involvement", "Identification with the job", "Kanungo (1982) scale", "Effort, absence"]
    ]
  }],
  case: {
    title: "The silent neglect in billing",
    setting: "Fictional illustrative scenario: billing department of a corporate hospital.",
    scenario: `<p>Billing staff's satisfaction scores fell after a software change. Few resigned (local jobs are scarce), but errors and late arrivals rose and suggestions stopped. Managers say "they're still here, so they must be committed".</p>`,
    issue: `<p>A <b>neglect</b> response, with <b>continuance</b> commitment (staying because leaving is costly) rather than affective commitment. Earlier voice (suggestions) was probably ignored, pushing employees from voice toward neglect.</p>`,
    intervention: `<ol><li>Run focus groups and a facet satisfaction survey to locate the cause (software, workload, supervision).</li><li>Fix usability problems and train staff.</li><li>Re-open voice channels and respond visibly.</li><li>Track errors, lateness and affective commitment.</li></ol>`
  },
  measures: [
    { name: "Job Descriptive Index / single-item satisfaction", type: "Attitude scale", use: "Facet or global satisfaction.", limits: "Facets help diagnose; single items only track." },
    { name: "Three-Component Commitment scales", type: "Attitude scale", use: "Affective, continuance and normative commitment.", limits: "Check fit in local samples." },
    { name: "UWES-9", type: "Engagement scale", use: "Vigour, dedication and absorption.", limits: "Free for non-commercial use; high subscale overlap." },
    { name: "Turnover and absence analytics", type: "Behavioural indicator", use: "Outcome indicators to link with attitude data.", limits: "Lagged and influenced by labour markets." }
  ],
  assess: "Assessment link: distinguish attitude constructs and measure them separately before linking them to performance and turnover.",
  mcqs: [
    { q: "\"I believe the new shift policy is unfair\" is an example of which attitude component?",
      options: ["Affective", "Cognitive", "Behavioural", "Normative"],
      answer: 1,
      why: ["Wrong. Affective is the feeling (\"I'm angry about it\").", "Correct. A belief or evaluation statement is the cognitive component.", "Wrong. Behavioural is an intention to act.", "Wrong. Normative is a commitment component, not an attitude component."] },
    { q: "In the EVLN model, an employee who stays, waits patiently for management to improve conditions and speaks well of the organisation is showing:",
      options: ["Exit", "Voice", "Loyalty", "Neglect"],
      answer: 2,
      why: ["Wrong. Exit means leaving.", "Wrong. Voice is actively attempting to improve conditions.", "Correct. Loyalty is passive and constructive.", "Wrong. Neglect is passive and destructive."] },
    { q: "Kahn (1990) proposed that personal engagement depends on three psychological conditions. Which set is correct?",
      options: ["Vigour, dedication, absorption", "Meaningfulness, safety, availability", "Autonomy, competence, relatedness", "Satisfaction, commitment, involvement"],
      answer: 1,
      why: ["Wrong. These are Schaufeli's dimensions of engagement itself.", "Correct. Kahn's conditions are psychological meaningfulness, safety and availability.", "Wrong. These are SDT's basic needs.", "Wrong. These are other attitudes."] }
  ],
  challenge: {
    title: "Linking engagement to outcomes",
    scenario: `<p><i>Fictional scenario.</i> A retail pharmacy chain with 120 stores wants to show the board that engagement "drives sales". It has annual engagement survey data and monthly store sales.</p>`,
    tasks: ["Define the engagement construct you would use.", "Explain how engagement could link to store outcomes.", "Design an analysis, noting threats to causal claims.", "Recommend actions."],
    rubric: ["Chooses and justifies a definition and measure (for example UWES or Kahn-based)", "Proposes mechanisms (service behaviour, lower turnover, fewer errors)", "Uses store-level aggregation with agreement checks", "Notes reverse causality (successful stores are more engaging), confounds (location, size) and lagged effects", "Suggests longitudinal or quasi-experimental design", "Recommends actions on antecedents (manager support, staffing)"],
    model: `<p>Use UWES-9 aggregated to store level after checking within-store agreement. Mechanisms: engaged staff give better service and leave less. Analyse with a lagged panel (engagement in year 1 predicting sales growth in year 2) controlling for store size, location and prior sales. Reverse causality is a real threat, since thriving stores may create engagement. A stronger design pilots manager-support interventions in matched stores. Act on antecedents: staffing levels, manager coaching, recognition.</p>`
  },
  cheat: [
    "Attitude components: cognitive (belief), affective (feeling), behavioural (intention).",
    "Dissonance: inconsistency drives attitude or behaviour change (Festinger).",
    "Attitudes predict behaviour when specific, strong, accessible, experienced.",
    "EVLN: exit, voice, loyalty, neglect.",

    "Turnover: intentions are the strongest proximal predictor (Griffeth et al., 2000).",

  ]

OB.modules.push({
  id: "i4", paper: "P2",
  title: "Applying Individual Differences in HR",
  threads: ["A", "E", "C"],
  units: [
    { code: "4.1", title: "Linking Personality with Performance", topics: "Personality–Performance Link", sloSrc: "syllabus",
      slos: ["Apply insights to recruitment and selection"], lib: ["m1-2"] },
    { code: "4.2", title: "Cognitive Insights for HR Practices", topics: "Perception and Decision-Making", sloSrc: "syllabus",
      slos: ["Use cognitive models to improve HR interventions"], lib: ["m3-2"] },
    { code: "4.3", title: "Practical Tool Administration", topics: "Personality/Attitude Scales & Case Discussion", sloSrc: "syllabus",
      slos: ["Administer, score, and interpret tools", "Analyse case studies"], lib: ["m6-2"] }
  ],
  construct: {
    def: `<p>This module turns individual-difference knowledge into HR practice. <b>Selection validity</b> is the extent to which a selection method predicts job-relevant criteria. <b>Cognitive insights</b> are evidence about how people perceive and decide, used to design better HR processes. <b>Tool administration</b> is the standardised, ethical use of psychological scales.</p>`,
    framework: `<h4>Unit 4.1 · Personality and performance in selection</h4>
<ol><li><b>Job analysis</b> identifies the tasks and the KSAOs (knowledge, skills, abilities, other characteristics).</li>
<li><b>Choose predictors</b> with evidence of validity: structured interviews, work samples, cognitive ability tests, personality measures, integrity tests, situational judgement tests.</li>
<li><b>Consider incremental validity:</b> what does personality add beyond other predictors? Conscientiousness and integrity tests tend to add prediction beyond cognitive ability.</li>
<li><b>Manage risks:</b> faking, adverse impact, candidate experience, data protection.</li>
<li><b>Validate locally:</b> correlate predictor scores with later performance.</li></ol>
<h4>Unit 4.2 · Cognitive insights for HR practices</h4>
<ul><li><b>Interview judgements</b> are vulnerable to first impressions, halo, contrast and confirmation bias. Structure reduces these.</li>
<li><b>Decision hygiene:</b> independent ratings before discussion, mechanical combination of scores, noise audits (Kahneman, Sibony &amp; Sunstein, 2021).</li>
<li><b>Choice architecture in HR:</b> default enrolment in savings plans greatly increased participation (Madrian &amp; Shea, 2001); framing and timing of messages affect take-up of benefits and training.</li>
<li><b>Feedback design:</b> specific, behaviour-focused feedback avoids attribution errors and defensive reactions.</li></ul>
<h4>Unit 4.3 · Practical tool administration</h4>
<ol><li><b>Prepare:</b> confirm purpose, choose a validated version, check licence, obtain informed consent, plan data protection.</li>
<li><b>Administer:</b> standard instructions, quiet setting, no coaching, time limits if specified.</li>
<li><b>Score:</b> apply the scoring key, reverse-score negatively keyed items (new score = (min + max) − old score), compute subscale and total scores, check missing data rules.</li>
<li><b>Interpret:</b> against appropriate norms or cut-offs, with confidence and cautions; never diagnose.</li>
<li><b>Feed back:</b> share results respectfully, focusing on development; report groups only in aggregate.</li></ol>`
  },
  advanced: [
    { ev: "est", title: "Integrity tests", html: `<p>Ones, Viswesvaran &amp; Schmidt's (1993) meta-analysis reported that integrity tests predict both job performance and counterproductive behaviour. Integrity tests relate substantially to Conscientiousness, Agreeableness and Emotional Stability. Later critiques questioned some estimates, but integrity measures remain among the more useful non-cognitive predictors.</p>` },
    { ev: "est", title: "Structure beats intuition", html: `<p>Structured interviews show higher validity than unstructured ones in meta-analyses (for example McDaniel et al., 1994; Sackett et al., 2022). Combining scores mechanically (formula) usually predicts better than holistic judgement of the same information.</p>` },
    { ev: "crit", title: "Blind screening is not a cure-all", html: `<p>Anonymised CVs and blind auditions are widely cited fairness tools (for example Goldin &amp; Rouse's 2000 orchestra study). The orchestra findings have since been critiqued for statistical robustness. Blind screening can help at one stage, but bias can re-enter at later stages such as interviews.</p>` },
    { ev: "prac", title: "Administration ethics", html: `<p>Professional standards (for example the APA Ethical Principles, ITC Guidelines on Test Use) require competence, informed consent, confidentiality, use of current validated versions, and avoiding misuse such as using clinical tools for hiring. In India, also consider the DPDP Act, 2023.</p>` }
  ],
  matrices: [{
    caption: "Selection methods compared",
    head: ["Method", "What it measures", "Validity evidence", "Adverse impact risk", "Faking risk"],
    rows: [
      ["Structured interview", "Job-relevant competencies", "High (among the best)", "Low–moderate", "Moderate"],
      ["Work sample", "Actual task performance", "High", "Low–moderate", "Low"],
      ["Cognitive ability test", "Reasoning, learning", "Moderate–high", "Can be higher", "Low"],
      ["Personality measure", "Traits (for example Conscientiousness)", "Modest; incremental", "Low", "High in selection"],
      ["Integrity test", "Honesty, rule-following", "Moderate", "Low", "Moderate"],
      ["Unstructured interview", "Global impression", "Lower", "Higher", "High"]
    ]
  }],
  case: {
    title: "The scale that was scored wrongly",
    setting: "Fictional illustrative scenario: an HR internship project.",
    scenario: `<p>Interns administered a 10-item stress scale to 80 employees and reported that "60% are highly stressed". A supervisor notices that four positively worded items were not reverse-scored, results were shared by name with team leaders, and some forms had blanks treated as zeros.</p>`,
    issue: `<p>Three administration errors: <b>scoring</b> (no reverse scoring inflates or distorts totals), <b>missing data</b> handling (zeros bias totals downward or upward depending on the item), and <b>confidentiality</b> breach (individual reporting to leaders).</p>`,
    intervention: `<ol><li>Re-score with the correct key, reverse-scoring the positively worded items.</li><li>Apply the manual's missing-data rule (for example prorate if few items missing; otherwise exclude).</li><li>Retract the named report; issue an aggregate report with a minimum group size.</li><li>Inform participants and review consent wording.</li><li>Train interns on administration standards.</li></ol>`
  },
  measures: [
    { name: "Scoring key and reverse-scoring formula", type: "Psychometric practice", use: "Reverse score = (min + max) − response.", limits: "Always confirm which items are reversed in the manual." },
    { name: "Local validation study", type: "Evaluation method", use: "Correlate predictor scores with later performance.", limits: "Needs adequate sample and a good criterion measure." },
    { name: "Adverse-impact analysis", type: "Fairness check", use: "Compare selection rates across groups (for example the four-fifths rule used in US practice as a rule of thumb).", limits: "A heuristic signal, not proof of bias." },
    { name: "Tools in Paper 8", type: "Practical tools", use: "Big Five, WLCS, EIQ, PSS, ProQOL, WHO-5 and others, with scoring practice.", limits: "Use the versions and keys in your manual." }
  ],
  assess: "Assessment link: this module is where theory meets practice: validity for selection, cognitive design for HR processes, and standardised, ethical administration.",
  mcqs: [
    { q: "On a 1–5 scale, a respondent answers 2 on a reverse-keyed item. What is the reverse-scored value?",
      options: ["2", "3", "4", "-2"],
      answer: 2,
      why: ["Wrong. The item must be reversed.", "Wrong. (1 + 5) − 2 = 4, not 3.", "Correct. Reverse score = (min + max) − response = 6 − 2 = 4.", "Wrong. Reverse scoring keeps values on the same scale."] },
    { q: "Which practice best reduces bias in interview decisions?",
      options: ["Letting interviewers discuss candidates before rating", "Structured questions with anchored scales and independent ratings", "Relying on the interviewer's overall impression", "Asking each candidate different questions to explore their strengths"],
      answer: 1,
      why: ["Wrong. Prior discussion leads to anchoring and conformity.", "Correct. Structure and independent rating reduce halo, contrast and conformity, and improve validity.", "Wrong. Global impressions are the most bias-prone.", "Wrong. Inconsistent questions reduce comparability."] },
    { q: "Madrian & Shea's (2001) study of retirement savings is a classic example of which cognitive insight applied to HR?",
      options: ["Halo effect", "Defaults (choice architecture)", "Contrast effect", "Self-serving bias"],
      answer: 1,
      why: ["Wrong. Halo concerns trait generalisation in judgement.", "Correct. Automatic enrolment as the default markedly increased participation.", "Wrong. Contrast concerns comparative evaluation.", "Wrong. Self-serving bias concerns attributions."] }
  ],
  challenge: {
    title: "Building a fair graduate selection process",

OB.modules.push({

      slos: ["Describe the stages of group development", "Apply stage models to diagnose a team"], lib: ["m4-1"] },
    { code: "1.3", title: "Groupthink and Decision-Making", topics: "Causes, Symptoms, Remedies", sloSrc: "syllabus",
      slos: ["Analyse groupthink", "Suggest prevention strategies"], lib: ["m4-1", "m3-2"] }
  ],
  construct: {
    def: `<p>A <b>group</b> is two or more individuals who interact, are interdependent and share a common purpose or identity. <b>Group dynamics</b> are the processes (forming relationships, norms, roles, conflict, influence and decision-making) that unfold when people work in groups. <b>Groupthink</b> (Janis, 1972) is "a mode of thinking that people engage in when they are deeply involved in a cohesive in-group, when the members' strivings for unanimity override their motivation to realistically appraise alternative courses of action".</p>`,
    framework: `<h4>Unit 1.1 · Types of groups</h4>
<ul><li><b>Formal groups</b> are defined by the organisation: <i>command</i> groups (a manager and direct reports) and <i>task</i> groups (people working on a specific job).</li>
<li><b>Informal groups</b> form naturally: <i>interest</i> groups (shared concern) and <i>friendship</i> groups.</li>
<li><b>Primary</b> (small, intimate, face-to-face) vs <b>secondary</b> (larger, more formal) groups; <b>reference groups</b> (whose standards we use to judge ourselves); <b>in-groups and out-groups</b>.</li>
<li><b>Why people join:</b> security, status, self-esteem, affiliation, power, goal achievement. <b>Social identity theory</b> (Tajfel &amp; Turner, 1979): group memberships form part of the self-concept, producing in-group favouritism.</li>
<li><b>Group properties:</b> roles (role expectations, role conflict, role ambiguity), norms (acceptable standards; conformity, as in Asch's line studies), status, size (social loafing in larger groups), cohesion.</li></ul>
<h4>Unit 1.2 · Stages of group development</h4>
<ul><li><b>Tuckman (1965); Tuckman &amp; Jensen (1977):</b> <i>Forming</i> (uncertainty, testing), <i>Storming</i> (conflict over roles and control), <i>Norming</i> (cohesion, shared expectations), <i>Performing</i> (functional, task-focused), <i>Adjourning</i> (wrapping up).</li>
<li><b>Punctuated equilibrium</b> (Gersick, 1988): temporary project groups set a framework at the first meeting, show inertia, then undergo a transition around the <b>midpoint</b> of their deadline, followed by accelerated activity.</li>
<li>Stages can repeat, overlap or regress when membership or tasks change.</li></ul>
<h4>Unit 1.3 · Groupthink and decision-making</h4>
<ul><li><b>Antecedents (causes):</b> high cohesion, insulation from outsiders, directive leadership, lack of decision procedures, homogeneity, high stress with low hope of a better solution.</li>
<li><b>Janis's eight symptoms:</b> illusion of invulnerability; collective rationalisation; belief in the group's inherent morality; stereotyped views of out-groups; direct pressure on dissenters; self-censorship; illusion of unanimity; self-appointed mindguards.</li>
<li><b>Consequences:</b> incomplete survey of alternatives and objectives, failure to examine risks, poor information search, no contingency plans.</li>
<li><b>Remedies:</b> leader withholds preference initially; critical evaluator or devil's advocate; outside experts; subgroups working independently; a "second-chance" meeting before final commitment.</li>
<li><b>Related phenomena:</b> <i>group polarisation</i> (discussion shifts groups toward a more extreme position); the <i>Abilene paradox</i> (Harvey, 1974): a group agrees to something no member actually wants; <i>hidden profiles</i>.</li></ul>`
  },
  advanced: [
    { ev: "est", title: "Groups under-use unshared information", html: `<p>Stasser &amp; Titus (1985) showed that when critical information is distributed among members (a "hidden profile"), groups discuss mostly the information everyone already shares and often miss the best option. Structured information-sharing and assigning experts to specific information help.</p>` },
    { ev: "crit", title: "Groupthink's evidence base", html: `<p>Janis built groupthink from historical cases (Bay of Pigs, Pearl Harbor, escalation in Vietnam). Later analyses applied it to the Challenger launch decision (Esser &amp; Lindoerfer, 1989). Experimental tests support parts of the model (directive leadership, insulation) more than cohesion as such (Esser, 1998). Use the symptoms as a diagnostic checklist rather than a precise causal law.</p>` },
    { ev: "est", title: "Conformity pressure", html: `<p>Asch's line-judgement studies showed that many people conform to a clearly wrong majority on at least some trials. Bond &amp; Smith's (1996) meta-analysis found conformity levels varied by culture, being higher in more collectivist societies. This is relevant to group decisions in hierarchical workplaces.</p>` },
    { ev: "emg", title: "Groupthink in virtual groups", html: `<p>Virtual meetings can reduce some conformity cues (fewer non-verbal signals) but also make dissent easier to suppress (muted microphones, chat ignored). Anonymous digital polling before discussion is a practical remedy. Evidence specific to virtual groupthink is still developing.</p>` }
  ],
  matrices: [{
    caption: "Types of groups",
    head: ["Type", "Formed by", "Example", "Typical purpose"],
    rows: [
      ["Command group", "Organisation chart", "Nursing superintendent and ward sisters", "Ongoing supervision"],
      ["Task group", "Organisation", "Accreditation preparation committee", "Specific task"],
      ["Interest group", "Members", "Staff pushing for a crèche", "Shared concern"],
      ["Friendship group", "Members", "Lunch group from the same batch", "Social needs"],
      ["Reference group", "Individual's identification", "Professional body peers", "Standards for self-evaluation"]
    ]
  }, {
    caption: "Groupthink: symptom to remedy",
    head: ["Symptom", "What it looks like", "Remedy"],
    rows: [
      ["Illusion of invulnerability", "\"We've never failed an audit\"", "Pre-mortem; outside review"],
      ["Collective rationalisation", "Warnings explained away", "Assign a critical evaluator"],
      ["Belief in inherent morality", "\"We mean well, so it's fine\"", "Ethical review step"],
      ["Stereotyped out-groups", "\"The regulators don't understand\"", "Invite outsiders' views"],
      ["Pressure on dissenters", "\"Are you with the team?\"", "Leader rewards dissent"],
      ["Self-censorship", "Doubts not voiced", "Anonymous input before discussion"],
      ["Illusion of unanimity", "Silence treated as agreement", "Round-robin explicit views"],
      ["Mindguards", "Bad news filtered from leader", "Direct channels to decision-makers"]
    ]
  }],
  case: {
    title: "The unanimous expansion decision",
    setting: "Fictional illustrative scenario: the executive committee of a regional diagnostic chain.",
    scenario: `<p>The founder-chairman proposed opening 15 new centres in a year. The committee, close-knit and long-serving, approved unanimously in one meeting. The finance head later admitted she had doubts about cash flow but "didn't want to spoil the mood". A consultant's cautious report was not circulated. Within a year, the chain faced a cash crisis.</p>`,
    issue: `<p>Classic <b>groupthink</b>: a cohesive, insulated group with a directive leader stating his preference first. Symptoms include self-censorship (finance head), mindguards (report withheld), illusion of unanimity and probably invulnerability. The decision process lacked an alternatives review and contingency planning.</p>`,
    intervention: `<ol><li>Adopt a decision protocol: the chair speaks last; written independent views before meetings.</li><li>Assign a rotating devil's advocate for major decisions.</li><li>Require external review for investments above a threshold.</li><li>Hold a second-chance meeting before final approval.</li><li>Review decisions after the fact (post-mortems) to learn.</li></ol>`
  },
  measures: [
    { name: "Group development questionnaires", type: "Survey", use: "Assess perceived stage (for example Wheelan's Group Development Questionnaire).", limits: "Stage models are heuristic; responses vary by member." },
    { name: "Decision-process audit", type: "Diagnostic", use: "Checklist of Janis's symptoms and procedures used (alternatives, risk review, dissent).", limits: "Retrospective audits are subject to hindsight bias." },
    { name: "Interaction analysis", type: "Observation", use: "Who speaks, how much and to whom (for example Bales' Interaction Process Analysis).", limits: "Observer training needed; observation can change behaviour." }
  ],
  assess: "Assessment link: group processes are best assessed by observing decision procedures and interactions, not only by members' self-reports.",
  mcqs: [
    { q: "A project team does little in its first few weeks, then dramatically re-plans its approach at roughly the halfway point to its deadline. This pattern is best explained by:",
      options: ["Tuckman's storming stage", "Gersick's punctuated equilibrium model", "Social loafing", "The Abilene paradox"],
      answer: 1,
      why: ["Wrong. Storming concerns interpersonal conflict, not deadline-timed transitions.", "Correct. Gersick found inertia followed by a midpoint transition in temporary groups.", "Wrong. Loafing is reduced individual effort, not a timed transition.", "Wrong. The Abilene paradox is agreement to an option nobody wants."] },
    { q: "A senior manager quietly ensures that a critical audit report never reaches the CEO before a board decision. In Janis's terms, the manager is acting as a:",
      options: ["Devil's advocate", "Mindguard", "Critical evaluator", "Boundary spanner"],
      answer: 1,
      why: ["Wrong. A devil's advocate deliberately raises counter-arguments.", "Correct. Mindguards shield the group or leader from dissonant information.", "Wrong. A critical evaluator is a remedy, not a symptom.", "Wrong. Boundary spanners connect a group to outside information."] },
    { q: "Stasser & Titus (1985) found that in group discussions:",
      options: ["Unique information held by one member dominates discussion", "Groups focus on information members already share and often miss hidden profiles", "Larger groups always make better decisions", "Cohesion eliminates information loss"],
      answer: 1,
      why: ["Wrong. The opposite: unique information is under-discussed.", "Correct. Shared information dominates, so the best option can be missed when key facts are unshared.", "Wrong. Not supported.", "Wrong. Not supported."] }
  ],
  challenge: {
    title: "The quality committee that never disagrees",
    scenario: `<p><i>Fictional scenario.</i> A hospital's quality committee approves every proposal from its chair, the medical director. Meetings last 20 minutes. Junior members rarely speak. Two approved protocols were later withdrawn after adverse events.</p>`,
    tasks: ["Identify the group type and its development stage.", "Analyse causes and symptoms of groupthink.", "Propose prevention strategies.", "Explain how you would know the changes worked."],
    rubric: ["Classifies it as a formal task group and comments on stage (apparent norming without real storming)", "Identifies antecedents: directive leader, status hierarchy, no procedures", "Names at least three symptoms with evidence", "Proposes several remedies (leader speaks last, devil's advocate, anonymous input, external review)", "Addresses status and psychological safety for juniors", "Evaluates with process measures (alternatives considered, dissent recorded) and outcomes (protocol withdrawals)"],
    model: `<p>A formal task group that appears to be "norming" but has skipped productive storming: harmony is a product of hierarchy. Antecedents include a directive chair, a steep status hierarchy and no decision procedure. Symptoms: self-censorship, illusion of unanimity, possibly rationalisation of risks. Remedies: the chair presents data and speaks last; written pre-meeting comments; a rotating critical evaluator; external peer review for high-risk protocols; minutes recording alternatives and dissent. Evaluate via number of alternatives considered, dissent recorded, protocol withdrawals and a team psychological-safety survey.</p>`
  },
  cheat: [

OB.modules.push({
  id: "g2", paper: "P3",
  title: "Teamwork",
  threads: ["A", "C"],
  units: [
    { code: "2.1", title: "Building Effective Teams", topics: "Team Formation and Roles", sloSrc: "syllabus",
      slos: ["Identify team roles", "Build high performing teams"], lib: ["m4-1"] },
    { code: "2.2", title: "Virtual and Cross Cultural Teams", topics: "Collaboration Across Geographies", sloSrc: "syllabus",
      slos: ["Analyse challenges", "Apply virtual team best practices"], lib: ["m4-1"] },
    { code: "2.3", title: "Collaboration and Decision Making", topics: "Group Decision Processes", sloSrc: "syllabus",
      slos: ["Evaluate decision techniques", "Recommend improvements"], lib: ["m3-2"] }
  ],
  construct: {
    def: `<p>A <b>team</b> is a group whose individual efforts produce performance greater than the sum of individual inputs, through <b>positive synergy</b>, <b>mutual accountability</b> and <b>complementary skills</b> (Katzenbach &amp; Smith, 1993). A <b>virtual team</b> relies mainly on technology to collaborate across distance. <b>Group decision techniques</b> are structured procedures that improve how groups generate and evaluate options.</p>`,
    framework: `<h4>Unit 2.1 · Building effective teams</h4>
<ul><li><b>Team types:</b> problem-solving, self-managed, cross-functional, virtual, multiteam systems.</li>
<li><b>Hackman's conditions:</b> a real team (bounded, stable, interdependent), compelling direction, enabling structure (task design, composition, norms), supportive organisational context, competent coaching.</li>
<li><b>Team processes</b> (Marks, Mathieu &amp; Zaccaro, 2001): <i>transition</i> (planning, goal specification), <i>action</i> (monitoring, coordination), <i>interpersonal</i> (conflict management, motivation).</li>
<li><b>Team roles.</b> Benne &amp; Sheats (1948): <i>task roles</i> (initiator, information seeker, summariser), <i>maintenance roles</i> (encourager, harmoniser, gatekeeper) and <i>individual (self-centred) roles</i> (blocker, dominator). Belbin's nine roles: Plant, Resource Investigator, Co-ordinator, Shaper, Monitor Evaluator, Teamworker, Implementer, Completer Finisher, Specialist.</li>
<li><b>Composition:</b> ability, personality mix, diversity (informational benefits vs faultlines), size (small enough to coordinate).</li></ul>
<h4>Unit 2.2 · Virtual and cross-cultural teams</h4>
<ul><li><b>Challenges:</b> reduced non-verbal cues, time zones, technology problems, slower trust development, misattributions of silence, cultural differences in communication, faultlines between locations.</li>
<li><b>Swift trust</b> (Jarvenpaa &amp; Leidner, 1999): temporary virtual teams can develop trust quickly through early enthusiasm and predictable, responsive communication. It is fragile without follow-through.</li>
<li><b>Media richness</b> (Daft &amp; Lengel, 1986): ambiguous messages need rich media (video, face-to-face); routine messages suit lean media.</li>
<li><b>Culture:</b> high- vs low-context communication (Hall), power distance, individualism-collectivism; cultural intelligence (P1 · M4).</li>
<li><b>Best practices:</b> kick-off (ideally face-to-face), team charter, communication norms (response times, channels), rotating meeting times, documented decisions, inclusive facilitation.</li></ul>
<h4>Unit 2.3 · Collaboration and group decision processes</h4>
<ul><li><b>Interacting groups:</b> open discussion; prone to conformity and dominance.</li>
<li><b>Brainstorming</b> (Osborn): generate ideas without criticism. Real groups usually generate fewer ideas than the same number working alone (<b>production blocking</b>, Diehl &amp; Stroebe, 1987).</li>
<li><b>Nominal Group Technique</b> (Delbecq &amp; Van de Ven): silent individual idea generation, round-robin sharing, clarification, independent ranking.</li>
<li><b>Delphi technique:</b> anonymous expert rounds with feedback, no face-to-face meeting.</li>
<li><b>Electronic meetings</b>, <b>devil's advocacy</b> and <b>dialectical inquiry</b> (structured debate of opposing plans), and the <b>stepladder technique</b> (members join one at a time and present before hearing the group).</li></ul>`
  },
  advanced: [
    { ev: "crit", title: "Belbin's roles: popular but psychometrically weak", html: `<p>Belbin's team roles are widely used in development. Independent studies (for example Furnham, Steele &amp; Pendleton, 1993) raised concerns about the Self-Perception Inventory's ipsative format, reliability and factor structure. Use role language for reflection and conversation, not for selection.</p>` },
    { ev: "est", title: "Diversity: a double-edged sword", html: `<p>Reviews (for example van Knippenberg &amp; Schippers, 2007) conclude that diversity can improve decisions through broader information but can also create subgroup conflict. Effects depend on how diversity is managed: task-relevant diversity plus inclusive processes tends to help; demographic faultlines that align with location or function can hurt.</p>` },
    { ev: "est", title: "Team training improves performance", html: `<p>Salas et al. (2008) meta-analysed team training and found positive effects on team cognition, process and performance. Crew Resource Management in aviation and team training in healthcare (for example TeamSTEPPS) apply these findings.</p>` },
    { ev: "emg", title: "Hybrid collaboration", html: `<p>Hybrid teams face "two-tier" meetings in which remote members are disadvantaged. Practices such as "one person, one screen", shared digital whiteboards and asynchronous pre-work are spreading. Rigorous evidence is still emerging.</p>` }
  ],
  matrices: [{
    caption: "Group decision techniques evaluated",
    head: ["Technique", "How it works", "Strength", "Weakness", "Best use"],
    rows: [
      ["Interacting group", "Open discussion", "Builds commitment; quick", "Conformity, dominance, groupthink", "Low-stakes, routine decisions"],
      ["Brainstorming", "Ideas without criticism", "Enthusiasm; participation", "Production blocking, evaluation apprehension", "Warm-up; idea volume with brainwriting"],
      ["Nominal Group Technique", "Silent generation, round-robin, ranking", "Equal participation; less dominance", "Less spontaneous; one problem at a time", "Prioritising problems or solutions"],
      ["Delphi", "Anonymous expert rounds", "No status pressure; geographically dispersed", "Slow; depends on panel", "Forecasting, guideline consensus"],
      ["Devil's advocacy / dialectical inquiry", "Structured critique or opposing plans", "Exposes assumptions", "Can feel adversarial", "High-stakes strategic choices"],
      ["Electronic meeting", "Anonymous digital input and voting", "Speed, anonymity, honest input", "Less rich communication", "Large or hybrid groups"]
    ]
  }, {
    caption: "Benne & Sheats role categories",
    head: ["Category", "Example roles", "Effect on the team"],
    rows: [
      ["Task roles", "Initiator, information seeker, opinion giver, summariser, evaluator", "Move the work forward"],
      ["Maintenance (building) roles", "Encourager, harmoniser, compromiser, gatekeeper, standard setter", "Keep relationships healthy"],
      ["Individual (self-centred) roles", "Aggressor, blocker, dominator, recognition seeker", "Undermine the team"]
    ]
  }],
  case: {
    title: "The Chennai–Frankfurt project",
    setting: "Fictional illustrative scenario: a medical-device software team split between Chennai and Frankfurt.",
    scenario: `<p>Chennai engineers say Frankfurt colleagues are "blunt and impatient"; Frankfurt colleagues say Chennai engineers "say yes but mean maybe". Meetings are always at 7 p.m. Chennai time. Decisions are made in Frankfurt corridor conversations. Defects arise from misunderstood requirements.</p>`,
    issue: `<p>Cross-cultural communication differences (directness, high- vs low-context, power distance), a location <b>faultline</b>, unequal meeting burden, and decisions made through rich media in one site while the other gets lean media. Trust is eroding through mutual misattribution.</p>`,
    intervention: `<ol><li>Hold a joint kick-off or reset workshop on cultural communication styles.</li><li>Create a team charter: decision rules, documented decisions, response-time norms, explicit confirmation ("say what you'll do").</li><li>Rotate meeting times; use asynchronous updates.</li><li>Pair engineers across sites (cross-site buddies).</li><li>Track defects from requirement misunderstandings and a trust survey.</li></ol>`
  },
  measures: [
    { name: "Team Diagnostic Survey", type: "Team survey", use: "Hackman's conditions (Wageman, Hackman &amp; Lehman, 2005).", limits: "Development use; aggregate to team level." },
    { name: "Virtual team trust measures", type: "Survey", use: "Trust in teammates across sites.", limits: "Compare across subgroups; small samples." },
    { name: "Meeting process data", type: "Behavioural indicator", use: "Speaking time by site, decision documentation, action follow-through.", limits: "Privacy: collect with consent, aggregate." },
    { name: "Team role inventories", type: "Self-report", use: "Belbin SPI or similar for reflection.", limits: "Weak psychometrics; not for selection." }
  ],
  assess: "Assessment link: team effectiveness needs team-level measures (aggregated with agreement checks) and process data, not only individual satisfaction.",
  mcqs: [
    { q: "In Benne & Sheats' classification, a member who invites quiet colleagues to speak and keeps communication channels open is playing which role?",
      options: ["Initiator (task role)", "Gatekeeper (maintenance role)", "Blocker (individual role)", "Summariser (task role)"],
      answer: 1,
      why: ["Wrong. An initiator proposes new ideas or goals.", "Correct. The gatekeeper regulates participation and keeps channels open, which is a maintenance role.", "Wrong. Blockers resist and obstruct.", "Wrong. Summarisers pull together ideas; that is a task role."] },
    { q: "Which technique has members generate ideas silently, share them in a round-robin, and then rank them independently?",
      options: ["Brainstorming", "Delphi technique", "Nominal Group Technique", "Dialectical inquiry"],
      answer: 2,
      why: ["Wrong. Brainstorming is open, verbal idea generation.", "Wrong. Delphi uses anonymous rounds without meeting.", "Correct. These are the defining steps of the Nominal Group Technique.", "Wrong. Dialectical inquiry debates opposing plans."] },
    { q: "Jarvenpaa & Leidner (1999) described the trust that temporary virtual teams can establish quickly as:",
      options: ["Swift trust", "Calculus-based trust", "Identification-based trust", "Blind trust"],
      answer: 0,
      why: ["Correct. Swift trust forms early based on role expectations and responsive communication, but is fragile.", "Wrong. Calculus-based trust develops from cost-benefit reasoning over time.", "Wrong. Identification-based trust takes long to develop.", "Wrong. Not the term used."] }
  ],
  challenge: {
    title: "Improving decisions in a cross-functional team",
    scenario: `<p><i>Fictional scenario.</i> A hospital's cross-functional patient-flow team (doctors, nurses, IT, finance) must choose among five proposals to reduce emergency department waiting times. Past meetings were dominated by senior doctors; IT and finance staff join remotely and rarely speak.</p>`,
    tasks: ["Analyse the team's composition and process problems.", "Evaluate at least three decision techniques for this situation.", "Recommend a decision process with justification.", "Propose how to build longer-term team effectiveness."],
    rubric: ["Identifies status dominance, hybrid exclusion and possible hidden profiles", "Evaluates techniques with strengths and weaknesses (for example NGT, Delphi, devil's advocacy, electronic voting)", "Recommends a process that equalises participation (for example NGT with digital input)", "Uses team roles: a gatekeeper or facilitator", "Addresses Hackman's conditions (direction, structure, coaching)", "Includes evaluation (decision quality, waiting times, participation)"],
    model: `<p>Status hierarchy and hybrid format suppress input from IT and finance, whose information (system constraints, costs) is critical: a hidden-profile risk. Interacting discussion would reinforce dominance. NGT equalises input; Delphi is too slow; devil's advocacy is useful for stress-testing the top choice. Recommendation: pre-circulate proposals; NGT with digital anonymous idea and rank collection; a neutral facilitator acting as gatekeeper; structured critique of the top two options; a documented decision. Longer term: a team charter, clear direction (a waiting-time target), rotating facilitation, coaching. Evaluate with ED waiting times, participation by function and a team climate survey.</p>`
  },
  cheat: [
    "Team = synergy, mutual accountability, complementary skills.",
    "Hackman: real team, compelling direction, enabling structure, supportive context, coaching.",

OB.modules.push({
  id: "g3", paper: "P3",
  title: "Power & Politics",
  threads: ["A", "E"],
  units: [
    { code: "3.1", title: "Sources & Types of Power", topics: "French & Raven's Model", sloSrc: "syllabus",
      slos: ["Identify power bases", "Apply in workplace contexts"], lib: ["m4-2"] },
    { code: "3.2", title: "Political Behaviour in Organisations", topics: "Political Tactics & Consequences", sloSrc: "syllabus",
      slos: ["Analyse political behaviour", "Evaluate organisational impact"], lib: ["m4-2"] },
    { code: "3.4", title: "Influence in Organisations", topics: "Power vs Influence", sloSrc: "syllabus",
      slos: ["Apply influence strategies ethically"], lib: ["m4-2"] }
  ],
  construct: {
    def: `<p><b>Power</b> is the capacity to influence others' behaviour. <b>Influence</b> is the actual process of changing others' attitudes or behaviour: power is potential, influence is power in action. <b>Political behaviour</b> consists of activities not required by one's formal role that influence, or attempt to influence, the distribution of advantages and disadvantages in the organisation.</p>`,
    framework: `<h4>Unit 3.1 · Sources and types of power</h4>
<ul><li><b>French &amp; Raven (1959):</b> <i>formal</i> bases (legitimate, reward, coercive, and informational, added by Raven in 1965) and <i>personal</i> bases (expert, referent). See the Library 4.2 matrix.</li>
<li><b>Dependence</b> (Emerson, 1962): power increases when the resource you control is <i>important</i>, <i>scarce</i> and <i>non-substitutable</i>.</li>
<li><b>Structural sources</b> of power for units and roles: centrality in workflow, criticality, flexibility (discretion), visibility and relevance to organisational priorities. Controlling critical uncertainties confers power (strategic contingencies theory).</li></ul>
<h4>Unit 3.2 · Political behaviour</h4>
<ul><li><b>Legitimate</b> politics (complaining to a supervisor, forming coalitions, networking) vs <b>illegitimate</b> politics (sabotage, whistle-swallowing, misrepresenting data).</li>
<li><b>Individual drivers:</b> high self-monitoring, internal locus of control, Machiavellianism, investment in the organisation, expectations of success.</li>
<li><b>Organisational drivers:</b> scarce resources, role ambiguity, unclear performance evaluation, zero-sum rewards, high pressure, self-serving senior managers.</li>
<li><b>Impression management tactics</b> (Jones &amp; Pittman, 1982): ingratiation (being liked), self-promotion (seeming competent), exemplification (seeming dedicated), intimidation (seeming dangerous), supplication (seeming needy).</li>
<li><b>Consequences:</b> perceived politics is linked to lower satisfaction and commitment, higher stress and turnover intent. Political skill buffers some of these effects.</li></ul>
<h4>Unit 3.4 · Influence in organisations</h4>
<ul><li><b>Yukl's tactics:</b> rational persuasion, inspirational appeals, consultation, collaboration, apprising, ingratiation, exchange, personal appeals, coalition tactics, legitimating, pressure (Library 4.2).</li>
<li><b>Outcomes of influence:</b> <i>commitment</i>, <i>compliance</i> or <i>resistance</i>.</li>
<li><b>Cialdini's principles of persuasion:</b> reciprocity, commitment and consistency, social proof, liking, authority, scarcity.</li>
<li><b>Ethics test:</b> is the influence attempt in the organisation's interest, respectful of rights, fair, and would it survive disclosure?</li></ul>`

OB.modules.push({

  ],
  construct: {
    def: `<p><b>Leadership</b> is the process of influencing a group toward achieving goals. <b>Team leadership</b> focuses on meeting the team's needs so that it can perform: setting direction, structuring, coaching, and managing boundaries (a functional view). A <b>team simulation</b> is a structured exercise that reproduces team challenges in a safe setting, followed by a debrief to connect experience with theory.</p>`,
    framework: `<h4>Unit 4.1 · Leadership roles and styles</h4>
<ul><li><b>Trait approaches:</b> leaders differ on some traits (Judge et al., 2002).</li>
<li><b>Behavioural approaches:</b> Ohio State studies (<i>initiating structure</i> and <i>consideration</i>); Michigan studies (employee- vs production-oriented). Lewin's autocratic, democratic and laissez-faire styles.</li>
<li><b>Contingency approaches:</b> <i>Fiedler</i> (LPC style matched to situational favourableness); <i>Hersey &amp; Blanchard's Situational Leadership</i> (telling, selling, participating, delegating matched to follower readiness); <i>Path–goal theory</i> (House: directive, supportive, participative, achievement-oriented behaviours depending on task and follower).</li>
<li><b>Transformational and transactional</b> (Bass): idealised influence, inspirational motivation, intellectual stimulation, individualised consideration vs contingent reward and management by exception.</li>
<li><b>Team-oriented approaches:</b> servant leadership (Greenleaf), shared leadership, functional team leadership (Hackman &amp; Wageman; Morgeson, DeRue &amp; Karam, 2010).</li>
<li><b>Leadership roles in teams:</b> liaison with external constituencies, troubleshooter, conflict manager, coach.</li></ul>
<h4>Unit 4.2 · Team simulations</h4>
<ul><li><b>Survival ranking exercises</b> (for example NASA "Lost on the Moon", "Lost at Sea"): individuals rank items, then the team ranks them, and both are compared with expert rankings to show synergy or process loss.</li>
<li><b>Build challenges</b> (for example the Marshmallow Challenge, tower building): planning vs prototyping, roles, leadership emergence.</li>
<li><b>In-basket and business simulations:</b> prioritisation and decision-making under pressure.</li>
<li><b>Debrief</b> using the experiential cycle: What happened? (experience) Why? (reflection with theory) So what? (concepts) Now what? (application).</li></ul>
<h4>Unit 4.3 · Case study method for power, politics and teams</h4>
<ul><li>Identify actors, their interests and power bases; map dependencies and coalitions.</li>
<li>Identify political tactics used and their effects on team process and outcomes.</li>
<li>Diagnose using group concepts (groupthink, roles, norms) and leadership concepts.</li>
<li>Recommend structural and behavioural changes; evaluate ethics.</li>
<li>Well-documented public cases include the 1986 Challenger launch decision, widely analysed for groupthink and organisational pressure (for example Esser &amp; Lindoerfer, 1989).</li></ul>`
  },
  advanced: [
    { ev: "est", title: "Transformational and transactional leadership both work", html: `<p>Judge &amp; Piccolo's (2004) meta-analysis found transformational leadership strongly related to follower satisfaction, motivation and leader effectiveness. Contingent reward (transactional) was also strongly related to many criteria. Laissez-faire leadership was negatively related. Effective leaders typically combine both.</p>` },
    { ev: "crit", title: "Situational Leadership's weak evidence", html: `<p>Hersey &amp; Blanchard's model is popular in training, but empirical tests provide limited support for its specific prescriptions (for example Thompson &amp; Vecchio, 2009). Teach it as a useful prompt to adapt to follower needs, not a validated formula.</p>` },
    { ev: "est", title: "Shared leadership helps teams", html: `<p>Wang, Waldman &amp; Zhang's (2014) meta-analysis found shared leadership positively related to team effectiveness, especially in complex knowledge work. Leadership functions can be distributed among members.</p>` },

  case: {

    scenario: `<p>An external hire becomes leader of a 12-person IT support team. Three long-serving members formed a coalition and continue to take decisions with the previous leader, now in another department. The new leader responds by issuing written instructions and monitoring tickets closely. Morale and response times worsen.</p>`,

  measures: [

  mcqs: [

      slos: ["Explain the meaning, characteristics and importance of organisational culture", "Analyse an organisation's culture using Schein's levels and cultural elements"], lib: ["m5-1"] },
    { code: "1.2", title: "Types of Workplace Culture", topics: "Clan, adhocracy, market, hierarchy; the Competing Values Framework; culture–strategy fit", sloSrc: "suggested",
      slos: ["Classify workplace cultures using the Competing Values Framework", "Evaluate culture–strategy fit"], lib: ["m5-1"] }
  ],
  construct: {
    def: `<p><b>Organisational culture</b> is the pattern of shared basic assumptions, values and beliefs that a group has learned as it solved problems of external adaptation and internal integration, and that it teaches new members as the correct way to perceive, think and feel (Schein). Culture is <b>shared</b>, <b>learned</b>, <b>largely tacit</b>, <b>relatively stable</b> and <b>expressed in symbols and practices</b>.</p>`,
    framework: `<h4>Unit 1.1 · Elements of organisational culture</h4>
<ul><li><b>Importance and functions:</b> gives identity, generates commitment, guides behaviour (a social control system), provides sense-making and stability, and coordinates action without detailed rules.</li>
<li><b>Schein's levels:</b> artefacts; espoused beliefs and values; basic underlying assumptions (Library 5.1).</li>
<li><b>Elements</b> (often taught via Hofstede's "onion" and Deal &amp; Kennedy, 1982):
 <ul><li><i>Values</i>: what the organisation considers important.</li>
 <li><i>Norms</i>: expected behaviours ("how we do things here").</li>
 <li><i>Beliefs and assumptions</i>: taken-for-granted views of reality.</li>
 <li><i>Everyday practices</i>: routines, meetings, decision habits.</li>
 <li><i>Rituals and ceremonies</i>: repeated activities that reinforce values (award days, morning huddles).</li>
 <li><i>Symbols</i>: logos, dress, office layout, titles.</li>
 <li><i>Language</i>: jargon, acronyms, metaphors.</li>
 <li><i>Stories and heroes</i>: narratives about founders or critical events.</li></ul></li>
<li><b>Characteristics of culture</b> (as profiled by O'Reilly, Chatman &amp; Caldwell, 1991, and widely taught): innovation and risk-taking, attention to detail, outcome orientation, people orientation, team orientation, aggressiveness, stability.</li>
<li><b>Strong vs weak culture:</b> strong cultures have widely shared, intensely held values, which brings consistency and lower turnover but potential rigidity.</li></ul>
<h4>Unit 1.2 · Types of workplace culture</h4>
<ul><li><b>Competing Values Framework</b> (Quinn &amp; Rohrbaugh; Cameron &amp; Quinn): flexibility vs stability, internal vs external focus. Four types: <b>Clan</b> (collaborate), <b>Adhocracy</b> (create), <b>Market</b> (compete), <b>Hierarchy</b> (control).</li>
<li>Most organisations show a <b>profile</b> combining all four, with one or two dominant.</li>
<li><b>Culture–strategy fit:</b> innovation and differentiation strategies fit adhocracy elements; cost leadership and operational excellence fit hierarchy and market; talent-intensive service strategies fit clan elements. Kotter &amp; Heskett (1992) argued that <i>adaptive</i> cultures sustain performance better than merely strong ones.</li></ul>`
  },
  advanced: [
    { ev: "est", title: "Testing the CVF", html: `<p>Hartnell, Ou &amp; Kinicki's (2011) meta-analysis found that clan, adhocracy and market culture types were all positively associated with organisational effectiveness criteria. The pattern was less differentiated than the framework predicts. Clan cultures related most strongly to employee attitudes, and market cultures related well to operational and financial outcomes.</p>` },
    { ev: "crit", title: "Strong culture is not always good", html: `<p>Strong cultures can resist necessary change and suppress dissent. Kotter &amp; Heskett's (1992) study suggested that cultures emphasising adaptation to customers and stakeholders outperformed strong but inward-looking cultures over the long term. This was a study of large US firms; generalise with care.</p>` },
    { ev: "int", title: "Culture–strategy alignment", html: `<p>The saying "culture eats strategy for breakfast" (popularly attributed to Peter Drucker, although the attribution is uncertain) captures a real point: strategies that require behaviour the culture does not support tend to fail. Diagnose the current culture profile before committing to a strategy that needs a different one.</p>` },

      ["Stories / heroes", "Narratives about exemplars", "The founder who treated patients free", "Artefact / values"],
      ["Norms", "Expected behaviour", "Juniors never question consultants on rounds", "Values / assumptions"],
      ["Espoused values", "Stated priorities", "'Patient first' mission statement", "Espoused values"],
      ["Assumptions", "Taken-for-granted beliefs", "Hierarchy guarantees safety", "Basic assumptions"]
    ]
  }, {
    caption: "Culture–strategy fit",
    head: ["Strategy", "Fitting culture emphasis", "Example practices", "Misfit risk"],
    rows: [
      ["Innovation / differentiation", "Adhocracy (plus clan)", "Experimentation, tolerance of failure", "Hierarchy stifles experimentation"],
      ["Cost leadership", "Hierarchy and market", "Standard processes, metrics", "Clan-only culture slows efficiency"],
      ["Customer intimacy / service", "Clan and market", "Empowerment, service recognition", "Rigid rules frustrate service"],
      ["Rapid growth / market share", "Market", "Targets, competition", "Burnout; ethics pressure"]

  }],
  case: {
    title: "Strategy says innovate, culture says comply",
    setting: "Fictional illustrative scenario: a 50-year-old diagnostics company.",
    scenario: `<p>The board announces a strategy to launch AI-assisted diagnostic services. The company's rituals celebrate zero-error audits; promotions reward tenure; language includes "follow the SOP". New data scientists leave within months, describing a culture where "every idea needs six signatures".</p>`,
