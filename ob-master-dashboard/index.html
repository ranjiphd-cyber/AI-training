  construct: {
    def: `<p><b>Organisational change</b> is the movement of an organisation from its current state to a desired future state to improve effectiveness. <b>Resistance to change</b> is any response, cognitive, emotional or behavioural, that slows or opposes change.</p>`,
    framework: `<h4>Unit 2.1 · Meaning, need, types; Lewin's model</h4>
<ul><li><b>Forces for change:</b> workforce diversity, technology, economic shocks, competition, social trends, regulation and politics.</li>
<li><b>Types:</b> planned vs emergent; incremental (first-order) vs transformational (second-order); structural, technological, people-focused and cultural change.</li>
<li><b>Lewin's three steps:</b> <i>Unfreeze</i> (create readiness: show why the status quo cannot continue); <i>Change</i> (move to new behaviours, structures, processes); <i>Refreeze</i> (stabilise through rewards, policies, culture).</li>
<li><b>Force-field analysis:</b> driving forces push for change; restraining forces resist. Change occurs by strengthening drivers or, often more effectively, reducing restrainers.</li></ul>
<h4>Unit 2.2 · Kotter's 8 steps (1995, 1996)</h4>
<ol><li>Establish a sense of urgency.</li><li>Form a powerful guiding coalition.</li><li>Create a vision (and strategy).</li><li>Communicate the vision.</li><li>Empower others to act on the vision (remove obstacles).</li><li>Plan for and create short-term wins.</li><li>Consolidate improvements and produce still more change.</li><li>Institutionalise new approaches (anchor them in the culture).</li></ol>
<p>Steps 1–4 correspond broadly to unfreezing, 5–7 to changing, and 8 to refreezing.</p>
<h4>Unit 2.3 · Causes of resistance</h4>
<ul><li><b>Individual:</b> habit, security, economic factors (fear of losing income), fear of the unknown, selective information processing.</li>
<li><b>Organisational:</b> structural inertia, limited focus of change (subsystems pull back), group inertia (norms), threat to expertise, threat to established power relationships, threat to resource allocations.</li>
<li><b>Kotter &amp; Schlesinger (1979)</b> identified four common reasons: parochial self-interest, misunderstanding and lack of trust, different assessments of the situation, and low tolerance for change.</li></ul>
<h4>Unit 2.4 · Strategies to overcome resistance</h4>
<p>Kotter &amp; Schlesinger's (1979) six approaches, in roughly increasing degree of force: <b>education and communication</b>; <b>participation and involvement</b>; <b>facilitation and support</b>; <b>negotiation and agreement</b>; <b>manipulation and co-optation</b>; <b>explicit and implicit coercion</b>. The choice depends on speed needed, the amount of resistance, the power of resisters, where information and commitment lie, and the risks of failure.</p>`
  },
  advanced: [
    { ev: "crit", title: "Lewin's 3-step model as a later construction", html: `<p>Cummings, Bridgman &amp; Brown (2016) argued that the tidy three-step model was largely constructed by later authors from Lewin's writings. Lewin's own thinking was more about continuous, quasi-stationary equilibria. Know the model for exams, and be ready to discuss this critique.</p>` },
    { ev: "crit", title: "Kotter's evidence base", html: `<p>Kotter's model was derived from observation of change efforts in companies, not systematic empirical testing. Appelbaum et al. (2012) reviewed the literature and found partial support for individual steps but little direct test of the full sequence. It remains a widely used practical framework.</p>` },
    { ev: "est", title: "Participation increases acceptance", html: `<p>Classic studies (Coch &amp; French, 1948, in a garment factory) found that groups participating in designing job changes recovered productivity faster and showed less turnover. Later research supports participation and fair process as predictors of change acceptance (Oreg, Vakola &amp; Armenakis, 2011).</p>` },

  case: {

    issue: `<p>No <b>unfreezing</b> (urgency not shared), weak <b>coalition</b> (no clinical champions), poor <b>communication</b>, little <b>facilitation</b>. Resistance causes: habit, fear of the unknown, economic insecurity (records staff), threat to expertise and power (senior doctors).</p>`,

  ],
  construct: {
    def: `<p>The <b>psychological contract</b> is an individual's beliefs, shaped by the organisation, regarding the terms of an exchange agreement between the individual and the organisation (Rousseau, 1995). It is <b>subjective</b> (in the eye of the beholder), <b>reciprocal</b>, <b>promise-based</b>, <b>dynamic</b> and largely <b>implicit</b>.</p>`,
    framework: `<h4>Unit 3.1 · Meaning, formation and types</h4>
<ul><li><b>Formation:</b> begins before entry (employer branding, recruitment messages, interviews, offer letters), continues through socialisation (what managers and colleagues say and do), and evolves with HR practices. Individuals build a <i>mental schema</i> of the deal (Rousseau, 2001).</li>
<li><b>Contract makers:</b> recruiters, line managers, mentors, HR policies and senior leaders all send signals about promises.</li>
<li><b>Transactional contracts:</b> short-term, specific, economic (pay for defined work), limited involvement.</li>
<li><b>Relational contracts:</b> long-term, open-ended, socio-emotional (loyalty, development, security).</li>
<li><b>Balanced</b> and <b>transitional</b> types are also distinguished (Rousseau's PCI).</li>
<li><b>Significance:</b> the contract shapes commitment, discretionary effort, trust and retention. It explains why identical HR changes provoke different reactions in different employees.</li></ul>
<h4>Unit 3.2 · Breach and restoring trust</h4>
<ul><li><b>Breach</b> is the perception that the organisation failed to fulfil one or more obligations. <b>Violation</b> is the emotional response (anger, betrayal).</li>
<li><b>Causes</b> (Morrison &amp; Robinson, 1997): <i>reneging</i> (the organisation knowingly fails to keep a promise, because it cannot or will not) and <i>incongruence</i> (the parties understood the promise differently). Vigilance (how closely employees monitor) also affects whether breach is noticed.</li>
<li><b>Consequences</b> (Zhao et al., 2007): mistrust, lower satisfaction and commitment, reduced citizenship and performance, higher turnover intention. Under the EVLN model, employees respond with exit, voice, loyalty or neglect.</li>
<li><b>Restoring trust:</b> trust rests on perceived <i>ability, benevolence and integrity</i> (Mayer, Davis &amp; Schoorman, 1995). Repair strategies include acknowledgement and explanation (social accounts), apology, substantive remedies (renegotiation, compensation, i-deals), fair process, and consistent follow-through by leaders.</li></ul>`
  },
  advanced: [
    { ev: "est", title: "Apology or denial? It depends on the violation", html: `<p>Kim, Ferrin, Cooper &amp; Dirks (2004) found that after a <b>competence</b>-based trust violation, apologising repaired trust more effectively than denial. After an <b>integrity</b>-based violation, denial was more effective (when guilt was uncertain), because admitting an integrity failure is especially damaging. In real organisations where guilt is clear, denial is unethical and risky; the practical lesson is to address integrity breaches with substantive remedies, not words alone.</p>` },
    { ev: "est", title: "Realistic job previews prevent incongruence", html: `<p>Premack &amp; Wanous's (1985) meta-analysis found that realistic job previews lowered initial expectations and modestly reduced turnover. By making promises accurate, they reduce incongruence-based breach.</p>` },
    { ev: "est", title: "Breach effects on behaviour", html: `<p>Zhao, Wayne, Glibkowski &amp; Bravo (2007) found that breach relates to affective reactions (violation, mistrust), which in turn relate to lower commitment, satisfaction, citizenship and performance, and higher turnover intention.</p>` },

  }],
  case: {
    title: "The promised promotion",
    setting: "Fictional illustrative scenario: a nursing college.",
    scenario: `<p>Junior faculty were told at interview that they would be "considered for assistant professor after two years". After two years, a hiring freeze stops all promotions. Leaders send a short email. Several faculty stop volunteering for committees and start applying elsewhere.</p>`,

    intervention: `<ol><li>Leaders acknowledge the commitment in person and explain the freeze honestly.</li><li>Offer substantive alternatives: designation changes, development funds, research time (i-deals).</li><li>Set a transparent timeline and criteria for future promotions.</li><li>Review recruitment messaging to avoid over-promising.</li><li>Monitor committee participation, turnover and trust.</li></ol>`

  challenge: {

    scenario: `<p><i>Fictional scenario.</i> A hospital promised annual increments in its recruitment brochure. After a revenue drop, it freezes increments for a year, announced via notice board. Nursing attrition rises and union representatives call it a "betrayal".</p>`,
    tasks: ["Analyse the psychological contract and type of breach.", "Predict the consequences for different employee groups.", "Design a trust-repair plan for HR and leaders.", "Propose measures to evaluate recovery."],

  construct: {
    def: `<p><b>Motivation</b> is the set of processes that account for an individual's <b>direction</b>, <b>intensity</b> and <b>persistence</b> of effort toward a goal. <b>Content (need) theories</b> ask <i>what</i> motivates people: which needs or factors energise behaviour.</p>`,
    framework: `<h4>Unit 1 · Maslow's hierarchy (1943, 1954)</h4>
<ul><li>Five levels: <b>physiological</b>, <b>safety</b>, <b>social (belongingness)</b>, <b>esteem</b>, <b>self-actualisation</b>.</li>
<li><b>Prepotency:</b> a lower need must be substantially satisfied before the next becomes dominant; a satisfied need no longer motivates.</li>
<li>Lower-order (physiological, safety) needs are satisfied mostly externally; higher-order (social, esteem, self-actualisation) needs internally.</li>
<li>Workplace mapping: pay and conditions, job security, team belonging, recognition, growth opportunities.</li></ul>
<h4>Unit 2 · Alderfer's ERG theory (1969) and McClelland's needs theory</h4>
<ul><li><b>ERG:</b> <i>Existence</i> (material and physical), <i>Relatedness</i> (relationships), <i>Growth</i> (personal development). Differences from Maslow: more than one need can operate at once; no rigid order; <b>frustration–regression</b>: when a higher need is frustrated, desire for a lower need increases (for example a blocked promotion leads to demands for more pay).</li>
<li><b>McClelland:</b> learned needs. <b>Need for achievement (nAch):</b> preference for moderately challenging goals, personal responsibility, feedback. <b>Need for affiliation (nAff):</b> desire for friendly relationships. <b>Need for power (nPow):</b> desire to influence others; <i>personalised</i> vs <i>socialised</i> power.</li>
<li>Implications: high nAch suits entrepreneurial and individual-contributor roles but does not guarantee good management; effective managers often show high socialised nPow and lower nAff (the "leadership motive pattern", McClelland &amp; Boyatzis, 1982).</li></ul>
<h4>Unit 3 · Herzberg's two-factor theory (1959)</h4>
<ul><li><b>Hygiene factors</b> (extrinsic: company policy, supervision, pay, working conditions, relationships, security): adequate levels prevent dissatisfaction but do not create satisfaction.</li>
<li><b>Motivators</b> (intrinsic: achievement, recognition, the work itself, responsibility, advancement, growth): create satisfaction and motivation.</li>
<li>The opposite of satisfaction is "no satisfaction"; the opposite of dissatisfaction is "no dissatisfaction".</li>
<li>Practical legacy: <b>job enrichment</b> (vertical loading: more responsibility, autonomy, feedback), which fed into the Job Characteristics Model (Library 2.2).</li></ul>`
  },
  advanced: [
    { ev: "crit", title: "Maslow's hierarchy: weak empirical support", html: `<p>Wahba &amp; Bridwell (1976) reviewed research and found little support for the ranking of needs or for the idea that a satisfied need stops motivating. Tay &amp; Diener (2011) studied people across many countries and found that need fulfilment related to well-being, but needs did not have to be met in strict order. Use Maslow as a vocabulary, not a predictive law.</p>` },
    { ev: "crit", title: "Herzberg's method problem", html: `<p>Herzberg used the critical incident method: people attributed good events to themselves (motivators) and bad events to the environment (hygiene), which is consistent with self-serving attribution. Studies using other methods often found that the same factor (for example pay) can both satisfy and dissatisfy.</p>` },
    { ev: "est", title: "Achievement motivation predicts entrepreneurial behaviour", html: `<p>Meta-analytic work (for example Collins, Hanges &amp; Locke, 2004) found that need for achievement relates to choosing entrepreneurial careers and to entrepreneurial performance. McClelland's needs are typically measured with the Thematic Apperception Test (implicit motives) or self-report scales; the two methods correlate weakly because they tap different levels of motivation.</p>` },
    { ev: "int", title: "Needs in an Indian workplace", html: `<p>In contexts where job security and family obligations are salient, security and relatedness needs may remain strong motivators even at senior levels. ERG's flexible, simultaneous needs fit this better than a strict hierarchy. Treat this as an interpretation to test locally, not a cultural rule.</p>` }
  ],
  matrices: [{
    caption: "Content theories compared",
    head: ["Theory", "Need categories", "Ordering", "Key mechanism", "Evidence"],
    rows: [
      ["Maslow", "Physiological, safety, social, esteem, self-actualisation", "Strict hierarchy (prepotency)", "Satisfaction–progression", "Weak for ordering"],
      ["Alderfer ERG", "Existence, relatedness, growth", "Flexible; several at once", "Satisfaction–progression and frustration–regression", "Somewhat better than Maslow"],
      ["McClelland", "Achievement, affiliation, power", "No hierarchy; learned", "Motive strength shapes preferences", "Good for nAch and leadership motive pattern"],
      ["Herzberg", "Hygiene factors vs motivators", "Two separate continua", "Hygiene prevents dissatisfaction; motivators create satisfaction", "Method-dependent; mixed"]
    ]
  }, {
    caption: "Mapping the theories",
    head: ["Maslow", "ERG", "Herzberg"],
    rows: [
      ["Physiological, safety", "Existence", "Hygiene (pay, conditions, security)"],
      ["Social; part of esteem", "Relatedness", "Hygiene (relationships, supervision)"],
      ["Esteem (part), self-actualisation", "Growth", "Motivators (achievement, recognition, growth)"]
    ]
  }],
  case: {
    title: "The pay rise that changed nothing",
    setting: "Fictional illustrative scenario: medical coders at a healthcare BPO in Chennai.",
    scenario: `<p>After high attrition, management raised coders' salaries by 15%. Six months later, attrition is unchanged. Exit interviews mention "no growth", "same codes every day" and "my supervisor never notices good work".</p>`,
    issue: `<p>Pay is a <b>hygiene factor</b>: raising it reduced dissatisfaction but did not create satisfaction. The unmet needs are <b>growth</b> and <b>esteem</b> (Herzberg's motivators: advancement, recognition, the work itself). ERG's frustration–regression may explain why earlier complaints focused on pay.</p>`,
    intervention: `<ol><li>Create a skills ladder (coder, senior coder, auditor, trainer) with visible criteria.</li><li>Enrich jobs: rotate specialties, add quality-audit responsibilities.</li><li>Train supervisors in specific recognition.</li><li>Track attrition and a short motivation survey.</li></ol>`
  },
  measures: [
    { name: "Need-satisfaction surveys", type: "Survey", use: "Assess satisfaction of different needs (for example work-related basic need satisfaction).", limits: "Map items carefully to the theory you test." },
    { name: "Thematic Apperception Test (implicit motives)", type: "Projective technique", use: "Research measure of nAch, nAff, nPow.", limits: "Requires trained coding; low agreement with self-report." },
    { name: "Exit and stay interviews", type: "Qualitative", use: "Identify hygiene vs motivator issues.", limits: "Social desirability; code systematically." },
    { name: "WEIMS (manual tool)", type: "Practical tool", use: "See Paper 8 · Module 1 for motivation-type scoring.", limits: "Measures regulation types (SDT), not needs." }
  ],
  assess: "Assessment link: content theories suggest what to ask about, but use validated need or motivation scales rather than home-made 'Maslow surveys'.",
  mcqs: [
    { q: "An employee denied promotion starts demanding higher pay and better office facilities. Which theory best explains this?",
      options: ["Maslow's prepotency", "Alderfer's frustration–regression", "Herzberg's hygiene factors", "McClelland's need for power"],
      answer: 1,
      why: ["Wrong. Maslow describes upward progression, not regression.", "Correct. Frustrated growth needs increase desire for lower-level (existence) needs.", "Wrong. Hygiene factors explain dissatisfaction but not the regression pattern.", "Wrong. No evidence of a desire to influence others."] },
    { q: "According to Herzberg, which is a motivator?",
      options: ["Salary", "Company policy", "Recognition for achievement", "Working conditions"],
      answer: 2,
      why: ["Wrong. Salary is a hygiene factor in Herzberg's classification.", "Wrong. Policy and administration are hygiene factors.", "Correct. Recognition is one of the motivators.", "Wrong. Working conditions are hygiene factors."] },
    { q: "McClelland's research suggests that effective managers in large organisations often show:",
      options: ["High need for affiliation and low need for power", "High socialised need for power and relatively low need for affiliation", "Only high need for achievement", "Low levels of all three needs"],
      answer: 1,
      why: ["Wrong. High affiliation can make tough decisions harder.", "Correct. This is the leadership motive pattern (McClelland &amp; Boyatzis, 1982).", "Wrong. High nAch suits individual contribution but does not guarantee managerial effectiveness.", "Wrong. Not supported."] }
  ],
  challenge: {
    title: "Motivating ward attendants",
    scenario: `<p><i>Fictional scenario.</i> A hospital's ward attendants (housekeeping and patient transport) have high absenteeism. They earn the least, work rotating shifts and are rarely included in ward meetings. A manager proposes "motivational posters and a monthly star award".</p>`,
    tasks: ["Analyse the situation using Maslow, ERG and Herzberg.", "Evaluate the manager's proposal.", "Recommend an intervention addressing several need levels.", "Explain how to evaluate it."],
    rubric: ["Identifies unmet existence or safety needs (pay, predictable shifts) as hygiene issues", "Identifies relatedness and esteem gaps (exclusion from meetings, low status)", "Explains why posters and awards alone are unlikely to work if hygiene issues persist", "Recommends combined actions (fair pay review, stable rosters, inclusion, recognition, skill growth)", "Notes evidence limits of content theories", "Proposes evaluation (absenteeism, satisfaction facets, turnover)"],
    model: `<p>Maslow and ERG: existence and safety needs (low pay, unpredictable shifts) are poorly met; relatedness and esteem needs are frustrated by exclusion. Herzberg: hygiene problems produce dissatisfaction that recognition alone will not fix. Posters are unlikely to help, and a single monthly award may seem tokenistic. Intervene with a pay review, stable rosters with input, inclusion in ward huddles, specific recognition from nurses and doctors, and a skill pathway (for example to patient-care assistant). Evaluate with absenteeism, facet satisfaction (pay, supervision, coworkers) and turnover over six months.</p>`
  },
  cheat: [
    "Motivation: direction, intensity, persistence.",
    "Maslow: physiological, safety, social, esteem, self-actualisation; prepotency; weak evidence for order.",
    "ERG: existence, relatedness, growth; several needs at once; frustration–regression.",
    "McClelland: nAch, nAff, nPow; leadership motive pattern = high socialised nPow, lower nAff.",
    "Herzberg: hygiene prevents dissatisfaction; motivators create satisfaction; job enrichment.",
    "Critique: Herzberg's critical-incident method and self-serving attributions."
  ]
});

OB.modules.push({
  id: "mo2", paper: "P4",
  title: "Process Approaches",
  threads: ["A", "N"],
  units: [
    { code: "4", title: "Expectancy & Equity Theories", topics: "Vroom's VIE; Porter–Lawler; Adams' equity; organisational justice", sloSrc: "suggested",
      slos: ["Explain expectancy and equity theories", "Diagnose motivation problems using VIE and equity comparisons"], lib: ["m2-1"] },
    { code: "5", title: "Goal-Setting Theory", topics: "Locke & Latham; SMART goals; moderators; learning goals", sloSrc: "suggested",
      slos: ["Explain how goals motivate", "Design effective goals and anticipate their risks"], lib: ["m2-1"] },
    { code: "6", title: "Contemporary Perspectives (Self-Determination, Intrinsic Motivation)", topics: "SDT; cognitive evaluation theory; intrinsic motivation", sloSrc: "suggested",
      slos: ["Explain SDT's basic needs and motivation continuum", "Apply SDT to job and reward design"], lib: ["m2-2"] }
  ],
  construct: {
    def: `<p><b>Process theories</b> explain <i>how</i> motivation arises and is sustained: through expectations, comparisons, goals and the quality of motivation. They are generally better supported than content theories and more useful for designing interventions.</p>`,
    framework: `<h4>Unit 4 · Expectancy and equity</h4>
<ul><li><b>Vroom (1964):</b> Motivation = Expectancy (effort leads to performance) × Instrumentality (performance leads to rewards) × Valence (value of rewards).</li>
<li><b>Porter &amp; Lawler (1968)</b> extended this: effort leads to performance (moderated by abilities and role perceptions), which leads to rewards, then satisfaction, which depends on whether rewards are perceived as equitable.</li>
<li><b>Adams (1963, 1965):</b> people compare their outcome/input ratio with a referent's. <i>Under-reward</i> leads to anger and to reduced inputs or demands for more; <i>over-reward</i> can lead to guilt (weaker effect). Responses: change inputs, change outcomes, distort perceptions, change referent, leave.</li>
<li><b>Organisational justice:</b> distributive, procedural, interpersonal and informational (Library 2.1).</li></ul>
<h4>Unit 5 · Goal-setting</h4>
<ul><li><b>Locke &amp; Latham:</b> specific, difficult goals lead to higher performance than easy or vague goals.</li>
<li><b>Mechanisms:</b> direction, effort, persistence, task strategies.</li>
<li><b>Moderators:</b> goal commitment (raised by participation, public commitment, self-efficacy), feedback, task complexity, ability.</li>
<li><b>SMART</b> (specific, measurable, achievable, relevant, time-bound) is a practitioner acronym consistent with the theory.</li>
<li><b>Learning goals</b> are better for complex, novel tasks. <b>Management by Objectives (MBO)</b> applies goal-setting organisation-wide.</li></ul>
<h4>Unit 6 · Contemporary perspectives</h4>
<ul><li><b>Self-Determination Theory</b> (Deci &amp; Ryan): basic needs for autonomy, competence and relatedness; a continuum from amotivation, through external, introjected, identified and integrated regulation, to intrinsic motivation.</li>
<li><b>Intrinsic motivation:</b> doing an activity for its inherent satisfaction.</li>
<li><b>Cognitive Evaluation Theory:</b> controlling rewards can undermine intrinsic motivation; informational feedback supports it.</li>
<li>Related: <b>self-efficacy</b> (Bandura), <b>reinforcement</b> and <b>job design</b> (Library 1.1, 2.2).</li></ul>`
  },
  advanced: [
    { ev: "est", title: "Goal-setting has strong support", html: `<p>Locke &amp; Latham (2002) summarised decades of research showing that specific, difficult goals improve performance in many settings. Its risks: narrow goals can crowd out unmeasured behaviour and encourage unethical shortcuts (Ordóñez et al., 2009).</p>` },
    { ev: "est", title: "Equity: under-reward is felt more than over-reward", html: `<p>Research consistently shows stronger reactions to under-reward than over-reward. People tend to rationalise over-reward ("I deserve it"). Procedural justice can soften reactions to unfavourable outcomes.</p>` },
    { ev: "est", title: "SDT in work settings", html: `<p>Van den Broeck et al.'s (2016) meta-analysis found that satisfaction of autonomy, competence and relatedness needs at work related to well-being, engagement and performance. Autonomous motivation is associated with better well-being and performance quality.</p>` },
    { ev: "crit", title: "Expectancy theory's rationality assumption", html: `<p>Vroom's model assumes people calculate expectancies and valences. People rarely do so explicitly, and the multiplicative form is not consistently supported (Van Eerde &amp; Thierry, 1996). It is most useful as a diagnostic checklist.</p>` },
    { ev: "int", title: "Neuroscience of anticipation (interpretive)", html: `<p>Anticipation of reward is associated with ventral striatum activity (Knutson et al., 2001), which fits expectancy-like processes, but neural data do not validate a management formula. Avoid overclaiming.</p>` }
  ],
  matrices: [{
    caption: "Process theories compared",
    head: ["Theory", "Core idea", "Diagnostic question", "Managerial lever"],
    rows: [
      ["Expectancy (Vroom)", "E × I × V", "Which link is broken?", "Training (E), credible reward links (I), valued rewards (V)"],
      ["Porter–Lawler", "Effort, performance, rewards, satisfaction; equity perceptions", "Do role clarity and ability limit performance?", "Clarify roles; fair rewards"],
      ["Equity (Adams)", "Outcome/input comparisons", "Who is the referent? What feels unfair?", "Transparency; fair process; explain differences"],
      ["Goal-setting", "Specific, difficult goals plus commitment and feedback", "Are goals clear, accepted, with feedback?", "SMART goals; learning goals; feedback"],
      ["SDT", "Needs for autonomy, competence, relatedness", "Is motivation autonomous or controlled?", "Choice, rationale, feedback, belonging"]
    ]
  }],
  case: {
    title: "The research coordinators' targets",
    setting: "Fictional illustrative scenario: a clinical trials unit.",
    scenario: `<p>Coordinators were given a target of "recruit as many patients as possible". Bonuses go to the top recruiter. Recruitment rose briefly, protocol deviations increased, and coordinators on difficult trials (rare diseases) feel the system is unfair and have stopped trying.</p>`,
    issue: `<p>Vague goals ("as many as possible") and a single quantity metric; low <b>expectancy</b> for those on difficult trials; <b>inequity</b> because inputs differ by trial; a controlling bonus that may crowd out intrinsic interest in research quality; ethical risk.</p>`,
    intervention: `<ol><li>Set trial-specific, realistic targets based on eligibility rates.</li><li>Add quality and compliance goals (protocol deviations).</li><li>Replace top-recruiter bonus with team-based recognition and development.</li><li>Give coordinators input into targets (commitment, autonomy).</li><li>Monitor recruitment, deviations and motivation (for example WEIMS).</li></ol>`
  },
  measures: [
    { name: "Organisational justice scale", type: "Survey", use: "Colquitt (2001): four justice dimensions.", limits: "Adapt referents carefully." },
    { name: "Goal commitment scale", type: "Survey", use: "Klein et al. (2001) 5 items.", limits: "Measure before outcomes are known." },
    { name: "WEIMS / MWMS", type: "Survey", use: "SDT regulation types (Paper 8 · Module 1).", limits: "Report subscales; use validated translations." }
  ],
  assess: "Assessment link: process theories point to measurable links: expectancy beliefs, justice perceptions, goal commitment and motivation quality.",
  mcqs: [
    { q: "In Vroom's theory, an employee believes extra effort will not improve performance because the equipment is faulty. Which component is low?",
      options: ["Expectancy", "Instrumentality", "Valence", "Equity"],
      answer: 0,
      why: ["Correct. Expectancy is the belief that effort leads to performance.", "Wrong. Instrumentality concerns performance leading to rewards.", "Wrong. Valence concerns how much the reward is valued.", "Wrong. Equity is Adams' theory."] },
    { q: "According to equity theory, which reaction is most likely when an employee feels under-rewarded relative to a colleague?",
      options: ["Increasing effort to match the colleague", "Reducing inputs or asking for higher outcomes", "Feeling guilty", "Ignoring the comparison completely"],
      answer: 1,
      why: ["Wrong. Increased effort is more associated with over-reward.", "Correct. Under-reward typically leads people to reduce inputs, seek more outcomes, change referents or leave.", "Wrong. Guilt is associated with over-reward.", "Wrong. Comparison is central to the theory."] },
    { q: "Which statement best reflects SDT's view of motivation?",
      options: ["Only the amount of motivation matters", "The quality of motivation (autonomous vs controlled) matters, not just the amount", "Rewards always increase intrinsic motivation", "Intrinsic and extrinsic motivation are unrelated to well-being"],
      answer: 1,
      why: ["Wrong. SDT emphasises quality.", "Correct. Autonomous motivation is associated with better well-being and performance quality.", "Wrong. Controlling rewards can undermine intrinsic motivation.", "Wrong. Motivation quality relates to well-being."] }
  ],
  challenge: {
    title: "Redesigning a teaching hospital's resident motivation system",
    scenario: `<p><i>Fictional scenario.</i> Postgraduate residents complain that assessments feel arbitrary, workloads differ greatly between units, and feedback is rare. Faculty want to add a "best resident" cash award.</p>`,
    tasks: ["Diagnose using expectancy, equity and goal-setting.", "Apply SDT to evaluate the cash award.", "Design improvements.", "Plan evaluation."],
    rubric: ["Low instrumentality (arbitrary assessments) and low expectancy (overload) identified", "Equity concerns about uneven workloads", "Goal-setting: lack of specific goals and feedback", "SDT: cash award may be controlling; competence and autonomy needs unmet", "Improvements: transparent competency-based assessment, workload balancing, regular feedback, learning goals, recognition", "Evaluation with validated measures and outcomes"],
    model: `<p>Arbitrary assessments break instrumentality; overload reduces expectancy; uneven workloads create inequity. Residents lack specific goals and feedback, which are moderators in goal-setting theory. A "best resident" cash award risks feeling controlling and competitive, undermining autonomy and relatedness. Improvements: competency-based assessment with clear criteria, workload balancing across units, monthly feedback meetings with learning goals, and recognition that is informational (for example case presentation feedback). Evaluate with justice perceptions, WEIMS, burnout indicators and assessment outcomes at baseline and six months.</p>`
  },
  cheat: [
    "Vroom: E × I × V; use it to find the broken link.",
    "Porter–Lawler: ability and role clarity; equity of rewards.",
    "Adams: outcome/input ratio vs referent; under-reward produces stronger reactions.",
    "Justice: distributive, procedural, interpersonal, informational.",
    "Goal-setting: specific, difficult, committed, with feedback; learning goals for complex tasks.",
    "SDT: autonomy, competence, relatedness; autonomous vs controlled motivation."
  ]
});

OB.modules.push({
  id: "mo3", paper: "P4",
  title: "Rewards in Organisations",
  threads: ["A", "C", "E"],
  units: [
    { code: "7", title: "Intrinsic vs Extrinsic Rewards", topics: "Definitions; crowding-out; when each works", sloSrc: "suggested",
      slos: ["Distinguish intrinsic and extrinsic rewards", "Explain when extrinsic rewards undermine or support motivation"], lib: ["m2-2"] },
    { code: "8", title: "Designing Reward Systems", topics: "Total rewards; pay structures; variable pay; pay for performance; fairness", sloSrc: "suggested",
      slos: ["Describe components of a total reward system", "Design a reward system aligned with strategy and fairness"], lib: ["m2-1", "m2-2"] },
    { code: "9", title: "Recognition & Non-Financial Rewards", topics: "Recognition programmes; development; flexibility; meaningful work", sloSrc: "suggested",
      slos: ["Explain the value of recognition and non-financial rewards", "Design effective recognition practices"], lib: ["m2-2"] }
  ],
  construct: {
    def: `<p><b>Extrinsic rewards</b> are tangible outcomes provided by others (pay, bonuses, benefits, promotions). <b>Intrinsic rewards</b> come from the work itself (interest, achievement, growth, meaning). A <b>reward system</b> is the set of policies and practices by which an organisation recognises and compensates employees. <b>Total rewards</b> combine compensation, benefits, well-being, development and recognition.</p>`,
    framework: `<h4>Unit 7 · Intrinsic vs extrinsic</h4>
<ul><li>Extrinsic rewards motivate effort on clear, measurable tasks. Intrinsic motivation drives quality, creativity and persistence on interesting tasks (Cerasoli et al., 2014).</li>
<li><b>Crowding out (undermining):</b> expected, tangible, contingent rewards can reduce intrinsic motivation for interesting tasks (Deci, Koestner &amp; Ryan, 1999). Verbal and informational rewards are less likely to undermine.</li>
<li>Frey's motivation crowding theory in economics makes similar predictions.</li></ul>
<h4>Unit 8 · Designing reward systems</h4>
<ul><li><b>Total rewards components:</b> base pay, variable pay (individual, team, organisation-wide), benefits, recognition, development and career, work-life flexibility.</li>
<li><b>Design decisions:</b> what to pay for (job, skill or competency), how much (market position), how to vary pay (merit, piece rate, bonuses, gainsharing, profit-sharing, ESOPs), and how to communicate it.</li>
<li><b>Principles:</b> alignment with strategy, internal equity (job evaluation), external competitiveness (market surveys), individual contribution (performance-based pay), transparency and procedural fairness, legal compliance (in India, for example, wage codes and minimum wage rules), and cost control.</li>
<li><b>Line of sight:</b> employees should see how their behaviour affects the reward measure.</li></ul>
<h4>Unit 9 · Recognition and non-financial rewards</h4>
<ul><li><b>Recognition:</b> timely, specific, sincere acknowledgement of contributions; formal (awards) or informal (thanks); top-down or peer-to-peer.</li>
<li><b>Other non-financial rewards:</b> development opportunities, interesting assignments, autonomy, flexible work, visibility, meaningful work.</li>
<li>Good recognition is <i>specific</i> (describes behaviour and impact), <i>timely</i>, <i>fair</i> (available to all roles) and <i>personalised</i>.</li></ul>`
  },
  advanced: [
    { ev: "est", title: "Pay for performance can raise productivity", html: `<p>Lazear's (2000) study of a US auto-glass company found that switching from hourly wages to piece rates increased productivity substantially, through both greater effort and attracting more productive workers (sorting). Clear, measurable output was key.</p>` },
    { ev: "est", title: "Recognition as a reward", html: `<p>Stajkovic &amp; Luthans (1997, 2003) found social recognition and performance feedback contributed to performance improvements in OB Mod interventions, with money often having the largest single effect but combinations of money, recognition and feedback producing the strongest effects.</p>` },
    { ev: "crit", title: "Incentives can backfire", html: `<p>Incentives can reduce prosocial behaviour when they change how people interpret a situation. Gneezy &amp; Rustichini (2000) found that introducing a fine for late pickup at Israeli day-care centres increased lateness, apparently because the fine turned a moral obligation into a price. Design rewards with attention to meaning.</p>` },
    { ev: "emg", title: "Pay transparency", html: `<p>Pay transparency laws and practices are spreading in some countries. Research suggests transparency can reduce pay gaps and increase perceived fairness, but can also compress pay and create dissatisfaction when differences cannot be justified. Evidence is still developing.</p>` }
  ],
  matrices: [{
    caption: "Reward types and when they work",
    head: ["Reward", "Type", "Works best when", "Risk"],
    rows: [
      ["Piece rate / commission", "Extrinsic, individual", "Output simple and measurable", "Quality neglect; competition"],
      ["Merit pay", "Extrinsic, individual", "Appraisals valid and trusted", "Small differentials; perceived unfairness"],
      ["Gainsharing / team bonus", "Extrinsic, group", "Interdependent work; measurable unit gains", "Free-riding"],
      ["Profit-sharing / ESOPs", "Extrinsic, organisation", "Building ownership mindset", "Weak line of sight"],
      ["Recognition", "Mixed (social)", "Specific and timely", "Tokenistic if generic"],
      ["Development opportunities", "Intrinsic-supporting", "Growth-oriented employees", "Unequal access"],
      ["Flexibility / autonomy", "Intrinsic-supporting", "Roles allowing discretion", "Perceived unfairness across roles"]
    ]
  }],
  case: {
    title: "The recognition app nobody uses",
    setting: "Fictional illustrative scenario: an IT company in Coimbatore.",
    scenario: `<p>The company launched a peer-recognition app with points convertible to gift vouchers. After a surge, usage dropped. Employees joke that people "trade points" with friends. Support staff are rarely recognised; developers receive most points.</p>`,
    issue: `<p>Recognition became <b>transactional</b> (points for vouchers), losing sincerity and meaning; gaming emerged. Recognition is <b>inequitable</b> across roles. The app emphasises extrinsic value over informational feedback.</p>`,
    intervention: `<ol><li>Shift emphasis to specific, behaviour-based messages; cap reciprocal point exchanges.</li><li>Train managers to recognise less visible roles.</li><li>Link recognition to company values and share stories publicly.</li><li>Monitor distribution across roles and survey perceived sincerity.</li></ol>`
  },
  measures: [
    { name: "Pay satisfaction questionnaire", type: "Survey", use: "Heneman &amp; Schwab (1985): pay level, raises, benefits, structure and administration.", limits: "Measure fairness perceptions separately." },
    { name: "Recognition distribution analytics", type: "Behavioural indicator", use: "Who gives and receives recognition by role, team, gender.", limits: "Quantity does not equal quality." },
    { name: "Total rewards statements", type: "Communication tool", use: "Show employees the full value of their rewards.", limits: "Value perceived varies by person." }
  ],
  assess: "Assessment link: evaluate reward systems on perceived fairness, motivation quality and behavioural outcomes, not only cost.",
  mcqs: [
    { q: "Which reward is most likely to undermine intrinsic motivation for an already interesting task?",
      options: ["Unexpected verbal praise", "An expected cash reward contingent on doing the task", "Informational feedback on quality", "Choice of projects"],
      answer: 1,
      why: ["Wrong. Unexpected verbal rewards rarely undermine intrinsic motivation.", "Correct. Expected, tangible, task-contingent rewards are most likely to undermine (Deci et al., 1999).", "Wrong. Informational feedback supports competence.", "Wrong. Choice supports autonomy."] },
    { q: "Which principle requires that employees can see how their actions affect the measure on which they are rewarded?",
      options: ["Internal equity", "Line of sight", "External competitiveness", "Pay compression"],
      answer: 1,

  construct: {
    def: `<p><b>Cognition</b> refers to the mental processes of acquiring, storing, transforming and using information: attention, perception, memory, reasoning and judgement. At work, cognition determines what people notice, remember and decide, and it is limited, effortful and shaped by prior knowledge.</p>`,
    framework: `<h4>Unit 2.1 · Cognitive processes at work</h4>
<ul><li><b>Attention:</b> selective and limited; multitasking usually means rapid switching, with switch costs.</li>
<li><b>Memory:</b> sensory memory, then <b>working memory</b> (limited capacity, often described as around four meaningful chunks in current research; Cowan, 2001), then long-term memory.</li>
<li><b>Cognitive load theory</b> (Sweller): <i>intrinsic</i> load (task complexity), <i>extraneous</i> load (poor design) and <i>germane</i> load (effort that builds schemas). Reduce extraneous load: clear interfaces, checklists, chunked information.</li>
<li><b>Situation awareness</b> (Endsley, 1995): perceiving elements, comprehending their meaning, projecting future status. Critical in ICU, aviation and control rooms.</li>
<li><b>Fatigue and interruptions</b> degrade attention and memory; important for shift work and safety.</li></ul>
<h4>Unit 2.2 · Mental models and schemas</h4>
<ul><li><b>Schema:</b> an organised knowledge structure about a concept (for example "a good manager"). <b>Script:</b> a schema for a sequence of events (for example how a performance review proceeds). <b>Mental model:</b> an internal representation of how a system works, used to explain and predict (Johnson-Laird).</li>
<li>Schemas speed up processing but produce stereotyping and resistance to disconfirming information.</li>
<li><b>Shared (team) mental models</b> (Cannon-Bowers, Salas &amp; Converse, 1993): overlapping understanding of tasks, equipment, roles and teammates allows implicit coordination. Mathieu et al. (2000) found that shared mental models predicted team process and performance.</li>
<li><b>Expertise:</b> experts have richer, better-organised schemas, enabling recognition-primed decisions (Klein).</li></ul>
<h4>Unit 2.3 · Cognitive biases in decision-making</h4>
<ul><li><b>Dual-process view:</b> fast, intuitive "System 1" and slow, deliberate "System 2" (Kahneman, 2011).</li>
<li><b>Common biases:</b> anchoring, availability, representativeness (base-rate neglect), confirmation bias, overconfidence, framing and loss aversion, hindsight bias, sunk cost and escalation (Library 3.2).</li>
<li><b>Debiasing:</b> structure (checklists, criteria), consider-the-opposite, pre-mortems, base rates, independent judgements, decision audits.</li></ul>`

  ],
  construct: {
    def: `<p><b>Decision-making</b> is choosing among alternatives to achieve goals. <b>Decision quality</b> depends on the process (information, alternatives, criteria) as well as the outcome, because good processes can produce bad outcomes through chance, and vice versa.</p>`,
    framework: `<h4>Unit 3.1 · Individual vs group decisions</h4>
<ul><li><b>Group strengths:</b> more complete information, more diverse alternatives, greater acceptance and legitimacy.</li>
<li><b>Group weaknesses:</b> time-consuming, conformity pressure, domination by a few, ambiguous responsibility, groupthink, group polarisation.</li>
<li><b>Individuals</b> are faster and accountable but limited in information and perspective.</li>
<li><b>Choosing the mode:</b> the Vroom–Yetton–Jago model asks about decision quality requirements, information held, need for commitment, and time to choose among autocratic, consultative and group decisions.</li></ul>
<h4>Unit 3.2 · Rational and bounded rationality models</h4>
<ul><li><b>Rational model:</b> (1) define the problem; (2) identify criteria; (3) weight criteria; (4) generate alternatives; (5) evaluate alternatives; (6) choose the best (maximise).</li>
<li><b>Assumptions:</b> complete information, clear preferences, no time or cost limits, maximum payoff.</li>
<li><b>Bounded rationality</b> (Simon): limited information-processing capacity, so people construct simplified models and <b>satisfice</b> (choose the first acceptable option).</li>
<li><b>Intuitive decision-making:</b> fast, experience-based pattern recognition; valid in learnable environments (Klein's recognition-primed decisions).</li>
<li><b>Garbage can model</b> (Cohen, March &amp; Olsen, 1972): in ambiguous organisations, problems, solutions, participants and choice opportunities flow somewhat independently.</li></ul>
<h4>Unit 3.3 · Heuristics and errors</h4>
<ul><li>Availability, representativeness, anchoring and adjustment (Tversky &amp; Kahneman, 1974).</li>
<li>Prospect theory: reference points, loss aversion, framing (Kahneman &amp; Tversky, 1979).</li>
<li>Overconfidence, confirmation bias, hindsight bias, randomness error, escalation of commitment (Staw, 1976).</li>
<li>See Library 3.2 for neuroscience and debiasing in depth.</li></ul>`
  },
  advanced: [
    { ev: "est", title: "Groups vs individuals: depends on the task", html: `<p>For tasks with demonstrably correct answers ("intellective" tasks), groups usually outperform the average member and sometimes the best member. For judgement tasks without clear answers, group advantages are smaller and conformity effects stronger (Laughlin's work on group problem solving).</p>` },
    { ev: "est", title: "Group polarisation", html: `<p>Discussion tends to shift groups toward a more extreme version of their initial leaning (Myers &amp; Lamm, 1976). Mechanisms: persuasive arguments and social comparison. Relevant to risk decisions and committees.</p>` },
    { ev: "crit", title: "Satisficing is not always bad", html: `<p>Simon saw satisficing as an adaptive response to limited resources. Gigerenzer's ecological rationality argues that simple heuristics can perform well in uncertain environments. The question is fit between strategy and environment.</p>` },
    { ev: "emg", title: "Algorithmic decision support", html: `<p>Organisations increasingly combine human judgement with algorithms. Research shows both algorithm aversion and automation bias (Library 3.2). Hybrid processes need clear roles and accountability.</p>` }

  construct: {
    def: `<p>This module applies perception, cognition and decision science to organisational practice. Two kinds of judgement error matter: <b>bias</b> (systematic deviation in one direction) and <b>noise</b> (unwanted variability in judgements that should be identical) (Kahneman, Sibony &amp; Sunstein, 2021).</p>`,
    framework: `<h4>Unit 4.1 · Decision-making in HR practices</h4>
<ul><li><b>Selection:</b> CV screening, interviews (first impressions, similarity, halo), final choice.</li>
<li><b>Performance appraisal:</b> leniency, central tendency, recency, attribution errors.</li>
<li><b>Promotion and pay:</b> anchoring on current salary, visibility bias, inconsistent criteria.</li>
<li><b>Noise:</b> different managers rate the same performance differently (level noise and pattern noise).</li></ul>
<h4>Unit 4.2 · Strategies for improving decisions</h4>
<ul><li><b>Decision hygiene:</b> independent judgements, structured criteria, sequencing information to avoid anchoring, aggregating several judgements.</li>
<li><b>Debiasing techniques:</b> pre-mortem, consider-the-opposite, red teams, reference-class forecasting, checklists.</li>
<li><b>Choice architecture:</b> defaults, reminders, simplification.</li>
<li><b>Data and algorithms:</b> statistical prediction often matches or beats clinical judgement (Grove et al., 2000, meta-analysis). Algorithms need validation, fairness auditing and human oversight.</li>
<li><b>Learning loops:</b> record decisions and reasons; review outcomes; calibrate.</li></ul>
<h4>Unit 4.3 · Simulations and case discussions</h4>
<ul><li><b>Decision simulations:</b> in-basket exercises, business games, crisis simulations, survival-ranking exercises, hiring simulations comparing structured and unstructured decisions.</li>
<li><b>Case discussion:</b> identify the decision, alternatives considered, information used, biases, process quality, outcome; separate process from outcome (avoid outcome bias).</li></ul>`

    { ev: "crit", title: "Algorithms can encode bias", html: `<p>Algorithms trained on historical decisions can reproduce past discrimination. A widely reported example is Amazon's experimental recruiting tool, reported by Reuters in 2018 to have downgraded CVs associated with women, after which the project was dropped. Validation and fairness checks are essential.</p>` },

<li><b>Character strengths:</b> the VIA classification of 24 strengths (Peterson &amp; Seligman, 2004).</li>
<li><b>Flow</b> (Csikszentmihalyi): absorption when challenge and skill are both high.</li>
<li><b>Broaden-and-build theory</b> (Fredrickson, 2001): positive emotions broaden attention and build resources over time.</li>

<ul><li><b>Environmental:</b> economic uncertainty, political change, technological change.</li>

<li><b>Models:</b> General Adaptation Syndrome (Selye: alarm, resistance, exhaustion); transactional model (Lazarus &amp; Folkman); Demand–Control–Support; Effort–Reward Imbalance; JD-R (Library 6.1).</li>

<h4>Unit 2.2 · Consequences of stress</h4>

<li><b>Psychological:</b> anxiety, irritability, low mood, reduced job satisfaction.</li>
<li><b>Behavioural:</b> absenteeism, turnover, presenteeism, substance use, errors.</li>

  construct: {
    def: `<p><b>Coping</b> is constantly changing cognitive and behavioural efforts to manage specific external or internal demands appraised as taxing (Lazarus &amp; Folkman, 1984). <b>Work–life balance</b> refers to satisfaction and good functioning across work and non-work roles with minimal role conflict. <b>Work–life integration</b> emphasises flexible blending of roles.</p>`,
    framework: `<h4>Unit 3.1 · Coping mechanisms</h4>
<ul><li><b>Problem-focused coping:</b> act on the stressor (plan, seek information, negotiate workload).</li>
<li><b>Emotion-focused coping:</b> manage emotional response (reappraisal, seeking emotional support, relaxation).</li>
<li><b>Avoidance coping:</b> denial, withdrawal, substance use; usually maladaptive in the long run.</li>
<li><b>Fit:</b> problem-focused coping suits controllable stressors; emotion-focused coping suits uncontrollable ones.</li>
<li><b>Resources:</b> social support, self-efficacy, resilience, PsyCap.</li>
<li><b>Recovery</b> (Sonnentag &amp; Fritz, 2007): psychological detachment, relaxation, mastery experiences and control during off-job time.</li></ul>
<h4>Unit 3.2 · Work–life balance</h4>
<ul><li><b>Work–family conflict</b> (Greenhaus &amp; Beutell, 1985): time-based, strain-based and behaviour-based; in both directions (work-to-family, family-to-work).</li>
<li><b>Work–family enrichment</b> (Greenhaus &amp; Powell, 2006): experiences in one role improve quality of life in the other.</li>
<li><b>Boundary theory</b> (Ashforth, Kreiner &amp; Fugate, 2000): people prefer segmenting or integrating roles.</li>
<li><b>Organisational practices:</b> flexible hours, remote or hybrid work, leave policies, childcare support, supportive supervisors (family-supportive supervisor behaviours), right-to-disconnect norms.</li>
<li><b>Indian context:</b> statutory provisions include maternity benefits under the Maternity Benefit (Amendment) Act, 2017 (26 weeks for eligible women and crèche requirements for establishments of a specified size).</li></ul>`

    { ev: "est", title: "Recovery experiences", html: `<p>Sonnentag &amp; Fritz (2007) developed the Recovery Experience Questionnaire. Psychological detachment from work during off-time is consistently associated with lower exhaustion and better well-being.</p>` },

    { ev: "crit", title: "Resilience training is not enough", html: `<p>Resilience training can produce small improvements, but placing the burden of coping on individuals without changing demands may be ineffective and unfair. Combine individual coping support with organisational redesign.</p>` }

    intervention: `<ol><li>Create on-call rotas so that only designated consultants answer after hours.</li><li>Set communication norms and escalation pathways for juniors.</li><li>Train juniors to resolve or escalate appropriately.</li><li>Offer optional coping and recovery resources (yoga can be one).</li><li>Measure detachment, exhaustion and work–family conflict.</li></ol>`

  mcqs: [

  construct: {
    def: `<p><b>Workplace wellness programmes</b> are organisational initiatives to promote employee health and well-being. Interventions are often classified as <b>primary</b> (remove or reduce stressors at source), <b>secondary</b> (help individuals manage stress) and <b>tertiary</b> (treat and rehabilitate those affected).</p>`,
    framework: `<h4>Unit 4.1 · Wellness programmes</h4>
<ul><li><b>Primary:</b> job redesign, staffing, scheduling, leadership training, anti-harassment measures.</li>
<li><b>Secondary:</b> stress-management training, mindfulness, resilience programmes, health screening.</li>
<li><b>Tertiary:</b> Employee Assistance Programmes (EAPs), counselling, return-to-work support.</li>
<li><b>Health promotion:</b> physical activity, nutrition, smoking cessation, sleep.</li>
<li><b>Design principles:</b> needs assessment; participation; targeting causes; combining levels; accessibility for all shifts; confidentiality; evaluation built in.</li>
<li><b>Evaluation:</b> logic model; process measures (reach, uptake) and outcome measures (well-being, absence, turnover); comparison design (Library 6.2).</li></ul>
<h4>Unit 4.2 · Case study method</h4>
<ol><li>Describe the population and data.</li><li>Identify stressors and resources (JD-R).</li><li>Assess well-being and strain with validated tools.</li><li>Choose interventions at primary, secondary and tertiary levels.</li><li>Address ethics.</li><li>Plan evaluation.</li></ol>`

OB.modules.push({

  title: "Research Foundations",
  threads: ["A", "E"],
  units: [
    { code: "1.1", title: "Research Approaches (Qualitative, Quantitative, Mixed)", topics: "Paradigms, designs, strengths and limits", sloSrc: "suggested",

      slos: ["Distinguish sampling techniques", "Choose sampling and data-collection tools for a study"], lib: ["m6-2"] },

      slos: ["Calculate and interpret descriptive statistics", "Choose and interpret basic inferential tests"], lib: ["m6-2"] }
  ],
  construct: {
    def: `<p><b>Research</b> is systematic inquiry to answer questions or test ideas using evidence. In OB, research produces the theories and findings this dashboard relies on, and practitioners use research methods to diagnose and evaluate interventions.</p>`,
    framework: `<h4>Unit 1.1 · Research approaches</h4>
<ul><li><b>Quantitative:</b> numerical data, hypothesis testing, generalisation. Designs: experiments (random assignment), quasi-experiments, surveys (cross-sectional, longitudinal), correlational studies.</li>
<li><b>Qualitative:</b> rich textual or observational data to understand meanings and processes. Designs: interviews, focus groups, ethnography, case studies, grounded theory, thematic analysis (Braun &amp; Clarke, 2006).</li>
<li><b>Mixed methods:</b> combine both. Designs include explanatory sequential (quantitative then qualitative), exploratory sequential (qualitative then quantitative) and convergent (parallel) (Creswell &amp; Plano Clark).</li>
<li><b>Quality criteria:</b> quantitative: reliability, internal validity, external validity, construct validity. Qualitative: credibility, transferability, dependability, confirmability (Lincoln &amp; Guba, 1985).</li></ul>
<h4>Unit 1.2 · Sampling techniques and tools</h4>
<ul><li><b>Probability sampling:</b> simple random, systematic, stratified (proportionate or disproportionate), cluster.</li>
<li><b>Non-probability sampling:</b> convenience, purposive (judgemental), quota, snowball.</li>
<li><b>Sample size:</b> depends on effect size, desired power (often .80), significance level (often .05) and analysis; use power analysis (for example G*Power). In qualitative research, sample size is guided by information power or saturation.</li>
<li><b>Data-collection tools:</b> questionnaires (validated scales), interviews (structured, semi-structured, unstructured), observation, archival and HR records, experiments and vignettes.</li></ul>
<h4>Unit 1.3 · Descriptive and inferential statistics</h4>
<ul><li><b>Descriptive:</b> mean, median, mode; standard deviation, range; frequencies; skewness.</li>
<li><b>Inferential:</b> generalise from sample to population. Null hypothesis, p-value, Type I error (false positive) and Type II error (false negative), confidence intervals, effect sizes (Cohen's d, r, η²).</li>
<li><b>Common tests:</b> independent t-test (two groups), paired t-test (pre/post), one-way ANOVA (three or more groups), chi-square (categorical association), Pearson correlation, simple and multiple regression.</li>
<li><b>Choosing a test:</b> based on the question (difference or relationship), number of groups, and level of measurement (nominal, ordinal, interval, ratio).</li></ul>`
  },
  advanced: [
    { ev: "est", title: "Statistical significance is not importance", html: `<p>The American Statistical Association's statement on p-values (Wasserstein &amp; Lazar, 2016) emphasised that a p-value does not measure the size or importance of an effect, and that conclusions should not rest on p &lt; .05 alone. Report effect sizes and confidence intervals.</p>` },
    { ev: "est", title: "Replication and open science", html: `<p>The Open Science Collaboration (2015) replicated 100 psychology studies and found that fewer than half produced significant results again, with smaller effects. Practices such as preregistration, open data and adequate power improve credibility.</p>` },

    def: `<p><b>Academic writing</b> presents an argument supported by evidence, in a structured, precise and honest way, with sources acknowledged. In OB it requires accurate use of constructs, critical evaluation of evidence and clear distinction between findings, interpretations and recommendations, the same discipline this dashboard models with its evidence labels.</p>`,

<ol><li><b>Title</b> and <b>abstract</b> (purpose, method, key findings, implications, ~150–250 words).</li>
<li><b>Introduction:</b> problem, gap, aims and research questions or hypotheses.</li>
<li><b>Literature review:</b> synthesis (not a list) of theory and evidence leading to the gap.</li>
<li><b>Method:</b> design, participants and sampling, measures (with reliability), procedure, ethics, analysis.</li>
<li><b>Results:</b> findings without interpretation; tables and figures.</li>
<li><b>Discussion:</b> interpretation, links to literature, implications, limitations, future research.</li>
<li><b>Conclusion</b>, <b>references</b>, <b>appendices</b> (instruments, consent forms).</li></ol>
<h4>Unit 2.2 · Referencing and citation (APA 7th edition)</h4>
<ul><li><b>In-text:</b> (Author, Year) or Author (Year). Two authors: (Deci &amp; Ryan, 2000). Three or more: (Bakker et al., 2014).</li>
<li><b>Journal article:</b> Author, A. A., &amp; Author, B. B. (Year). Title of article. <i>Journal Name, volume</i>(issue), pages. https://doi.org/...</li>
<li><b>Book:</b> Author, A. A. (Year). <i>Title of book</i> (ed.). Publisher.</li>
<li><b>Plagiarism:</b> presenting others' words or ideas as your own, including copying without quotation marks, patchwriting, and self-plagiarism. Paraphrase genuinely and cite.</li>

<li><b>Verify every source:</b> AI tools can produce fabricated references; always check against the original.</li></ul>
<h4>Unit 2.3 · Academic writing for OB</h4>
<ul><li><b>Argument:</b> clear claim, evidence, reasoning, counter-evidence, conclusion.</li>

<li><b>Critical evaluation:</b> methods, sample, context, alternative explanations.</li>
<li><b>Hedging appropriately:</b> "suggests", "is associated with" for correlational evidence.</li>
<li><b>Style:</b> formal, concise, active voice where appropriate, inclusive language.</li></ul>`

</script>
<script>
(function () {
  "use strict";
  var EV = {
    est: ["Established finding", "Replicated or meta-analytic evidence"],
    emg: ["Emerging research", "Growing but incomplete evidence"],
    int: ["Theoretical interpretation", "A reasoned bridge, not directly tested"],
    crit: ["Critique / boundary", "Limits, contested claims, failed replications"],
    prac: ["Practical recommendation", "Evidence-informed practice guidance"]
  };
  var DEEP = [["construct", "Core construct"], ["advanced", "Advanced expansion"], ["matrix", "Comparative matrix"], ["case", "Case in point"], ["measures", "Measurement & diagnostics"]];
  var KIT = [["mcq", "Concept-check MCQs"], ["challenge", "Case challenge"], ["cheat", "Cheat sheet"]];

  var byId = {};
  OB.modules.forEach(function (m) { byId[m.id] = m; });
  /* Deterministic per-question option shuffle, so the answer key is not predictable by position */
  OB.modules.forEach(function (m) {
    m.mcqs.forEach(function (q, qi) {
      var seed = 0, s = m.id + ":" + qi;
      for (var c = 0; c < s.length; c++) seed = (seed * 31 + s.charCodeAt(c)) >>> 0;
      var order = [0, 1, 2, 3];
      for (var i = 3; i > 0; i--) { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; var j = (seed >>> 8) % (i + 1); var tmp = order[i]; order[i] = order[j]; order[j] = tmp; }
      q.options = order.map(function (k) { return q.options[k]; });
      q.why = order.map(function (k) { return q.why[k]; });
      q.answer = order.indexOf(q.answer);
    });
  });
  var PAPERS = OB.papers;
  var entryId = function (e) { return typeof e === "string" ? e : e.id; };
  var SYL = [], primary = {}, appearances = {};
  PAPERS.forEach(function (p, pi) {
    p.modules.forEach(function (e, mi) {
      var id = entryId(e);
      (appearances[id] = appearances[id] || []).push({ paper: p, n: mi + 1, entry: e });
      if (!primary[id]) { primary[id] = { paper: p, n: mi + 1 }; SYL.push(byId[id]); }
    });
  });
  var LIB = OB.modules.filter(function (m) { return /^m\d/.test(m.id); });
  var MODS = SYL.concat(LIB);
  var TOTAL_Q = MODS.reduce(function (s, m) { return s + m.mcqs.length; }, 0);
  var view = document.getElementById("view");
  var ui = { tab: {}, toolFilter: "All", exam: null };

  /* ---------- storage (per-viewer convenience only) ---------- */
  var KEY = "obmd-v2";
  var store = { answers: {}, first: {}, drafts: {}, rubric: {}, slo: {} };
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); ["answers", "first", "drafts", "rubric", "slo"].forEach(function (k) { store[k] = p[k] || {}; }); } } catch (e) {}
  try { var t = localStorage.getItem(KEY + "-tabs"); if (t) ui.tab = JSON.parse(t) || {}; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); localStorage.setItem(KEY + "-tabs", JSON.stringify(ui.tab)); } catch (e) {} }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function strip(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent || ""; }
  function isLib(m) { return !primary[m.id]; }
  function modNum(m) { return isLib(m) ? "Lib " + m.id.slice(1).replace("-", ".") : primary[m.id].paper.id + " · M" + primary[m.id].n; }
  function evChip(k) { return '<span class="chip ev-' + k + '" title="' + esc(EV[k][1]) + '">' + EV[k][0] + "</span>"; }
  function threadChips(m) { return m.threads.map(function (t) { return '<span class="chip t" title="' + esc(OB.threads[t].desc) + '">' + OB.threads[t].name + "</span>"; }).join(" "); }
  function libLink(id) { var m = byId[id]; return '<a href="#' + id + '">' + modNum(m) + " " + esc(m.title) + "</a>"; }

  /* ---------- progress ---------- */
  function sloCount(m) {
    var done = 0, total = 0;
    (m.units || []).forEach(function (u, ui2) { u.slos.forEach(function (_, si) { total++; if (store.slo[m.id + ":" + ui2 + ":" + si]) done++; }); });
    return { done: done, total: total };
  }
  function modStats(m) {
    var a = 0, c = 0;
    m.mcqs.forEach(function (_, i) { var f = store.first[m.id + ":" + i]; if (f !== undefined) { a++; if (f) c++; } });
    var rub = store.rubric[m.id] || [];
    var s = sloCount(m);
    return { answered: a, correct: c, total: m.mcqs.length, rubric: rub.filter(Boolean).length, rubricTotal: m.challenge.rubric.length, slo: s.done, sloTotal: s.total };
  }
  function updatePill() {
    var c = 0; MODS.forEach(function (m) { c += modStats(m).correct; });
    document.getElementById("scorePill").textContent = c + " / " + TOTAL_Q + " correct";
  }
  function dotsFor(m) {
    return m.mcqs.map(function (_, i) { var f = store.first[m.id + ":" + i]; return '<i class="dot' + (f === undefined ? "" : (f ? " ok" : " no")) + '"></i>'; }).join("");
  }

  /* ---------- rail ---------- */
  var openPaper = null;
  function renderRail(active) {
    var activeMod = byId[active];
    if (activeMod && !isLib(activeMod)) openPaper = primary[active].paper.id;
    var link = function (m, label, title) {
      return '<a class="mod-link" href="#' + m.id + '"' + (active === m.id ? ' aria-current="page"' : "") + '><span class="mono" style="font-size:.74rem">' + label + "</span><span>" + esc(title) + '</span><span class="dots" aria-hidden="true">' + dotsFor(m) + "</span></a>";
    };
    var html = '<h2>Your syllabus</h2>' + PAPERS.map(function (p) {
      var open = openPaper === p.id;
      return '<details class="paper-nav"' + (open ? " open" : "") + ' data-paper="' + p.id + '"><summary><span class="u-num">' + p.id + "</span><span>" + esc(p.title) + "</span></summary>" +
        p.modules.map(function (e, i) { var m = byId[entryId(e)]; return link(m, "M" + (i + 1), typeof e === "string" ? m.title : e.title); }).join("") + "</details>";
    }).join("") +
      '<h2 style="margin-top:14px">Reference library</h2><details class="paper-nav"' + (activeMod && isLib(activeMod) ? " open" : "") + '><summary><span class="u-num">Lib</span><span>Six master units · deeper study and beyond-syllabus topics</span></summary>' +
      OB.units.map(function (u) { return '<div class="lib-unit">U' + u.n + " · " + esc(u.title) + "</div>" + u.modules.map(function (id) { var m = byId[id]; return link(m, m.id.slice(1).replace("-", "."), m.title); }).join(""); }).join("") + "</details>";
    document.getElementById("unitNav").innerHTML = html;
    document.querySelectorAll("#unitNav details[data-paper]").forEach(function (d) { d.addEventListener("toggle", function () { if (d.open) openPaper = d.getAttribute("data-paper"); }); });
    document.getElementById("railLegend").innerHTML = Object.keys(EV).map(function (k) { return "<div>" + evChip(k) + "</div>"; }).join("");
    document.querySelectorAll("[data-nav]").forEach(function (a) {
      if (a.getAttribute("data-nav") === active) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
  }
  var railBody = document.getElementById("railBody"), railToggle = document.getElementById("railToggle");
  railToggle.addEventListener("click", function () {
    var open = railBody.getAttribute("data-open") !== "true";
    railBody.setAttribute("data-open", open ? "true" : "false");
    railToggle.setAttribute("aria-expanded", open ? "true" : "false");
    railToggle.textContent = open ? "Hide papers and modules" : "Show papers and modules";
  });
  if (window.matchMedia("(min-width: 881px)").matches) railBody.setAttribute("data-open", "true");

  /* ---------- matrix ---------- */
  function matrixHTML(mx, idx) {
    return '<div class="tbl-wrap"><table><caption>' + mx.caption + "</caption><thead><tr>" +
      mx.head.map(function (h) { return '<th scope="col">' + h + "</th>"; }).join("") + "</tr></thead><tbody>" +
      mx.rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") +
      '</tbody></table><div class="matrix-tools"><button class="btn small" data-copymd="' + idx + '">Copy as Markdown table</button></div></div>';
  }
  function matrixMD(mx) {
    var cell = function (c) { return strip(c).replace(/\|/g, "\\|").trim(); };
    var lines = ["**" + strip(mx.caption) + "**", "", "| " + mx.head.map(cell).join(" | ") + " |", "|" + mx.head.map(function () { return " --- "; }).join("|") + "|"];
    mx.rows.forEach(function (r) { lines.push("| " + r.map(cell).join(" | ") + " |"); });
    return lines.join("\n");
  }

  /* ---------- MCQ component ---------- */
  function mcqHTML(m, i, label) {
    var q = m.mcqs[i], key = m.id + ":" + i, rec = store.answers[key];
    var letters = "ABCD";
    var opts = q.options.map(function (o, j) {
      var cls = "", why = "";
      if (rec) {
        if (j === q.answer) cls = " correct"; else if (j === rec.choice) cls = " wrong";
        if (j === q.answer || j === rec.choice || rec.showAll) why = '<span class="why">' + q.why[j] + "</span>";
      }
      return '<button class="opt' + cls + '" data-q="' + key + '" data-o="' + j + '"' + (rec ? " disabled" : "") + '><span class="k">' + letters[j] + "</span><span>" + o + "</span>" + why + "</button>";
    }).join("");
    var verdict = "";
    if (rec) {
      var ok = rec.choice === q.answer;
      verdict = '<div class="verdict ' + (ok ? "ok" : "no") + '">' + (ok ? "Correct." : "Not quite. The correct answer is " + letters[q.answer] + ".") +
        (store.first[key] === false && ok ? ' <span class="muted" style="font-weight:400">(first attempt was incorrect)</span>' : "") +
        '<span class="row" style="margin-left:auto">' + (rec.showAll ? "" : '<button class="btn small" data-all="' + key + '">Show rationale for every option</button>') +
        '<button class="btn small" data-retry="' + key + '">Try again</button></span></div>';
    }
    return '<div class="mcq" id="q-' + key.replace(":", "-") + '"><div class="qn">' + (label || "Question " + (i + 1) + " of " + m.mcqs.length) + '</div><div class="q">' + q.q + '</div><div class="opts">' + opts + "</div>" + verdict + "</div>";
  }
  function bindMCQ(root, rerender) {
    root.addEventListener("click", function (e) {
      var b = e.target.closest("[data-q],[data-retry],[data-all]");
      if (!b || !root.contains(b)) return;
      var key;
      if (b.hasAttribute("data-q")) {
        key = b.getAttribute("data-q");
        var parts = key.split(":"), m = byId[parts[0]], ch = +b.getAttribute("data-o");
        store.answers[key] = { choice: ch };
        if (store.first[key] === undefined) store.first[key] = ch === m.mcqs[+parts[1]].answer;
      } else if (b.hasAttribute("data-retry")) {
        key = b.getAttribute("data-retry");
        delete store.answers[key];
      } else {
        key = b.getAttribute("data-all");
        if (store.answers[key]) store.answers[key].showAll = true;
      }
      save(); updatePill(); rerender(key);
    });
  }

  /* ---------- overview ---------- */
  function renderMap() {
    renderRail("map");
    var nUnits = 0;
    PAPERS.forEach(function (p) { p.modules.forEach(function (e) { nUnits += typeof e === "string" ? (byId[e].units || []).length : e.units.length; }); });

  function copyText(text, btn, done) {
    var label = btn.textContent;
    var ok = function () { btn.textContent = done; setTimeout(function () { btn.textContent = label; }, 1600); };
    try {
      navigator.clipboard.writeText(text).then(ok, function () { fallback(); });
    } catch (e) { fallback(); }
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.width = "100%"; ta.style.minHeight = "120px";
      btn.insertAdjacentElement("afterend", ta); ta.select(); btn.textContent = "Select and copy the text below";
    }
  }

  /* ---------- scoring practice ---------- */
  var PRESETS = {
    pss: { label: "PSS-10 (published key)", n: 10, min: 0, max: 4, rev: "4,5,7,8", resp: "2,3,2,1,2,3,1,2,3,2" },
    custom: { label: "Custom: enter your manual's key", n: 16, min: 1, max: 6, rev: "", resp: "" }
  };
  function scorerHTML(m) {
    var weims = m.tools.some(function (t) { return t.practice === "weims"; });
    var preset = m.tools.some(function (t) { return t.practice === "pss"; }) ? "pss" : "custom";
    var P = PRESETS[preset];
    var h = '<div class="panel stack" id="scorer"><div><div class="eyebrow">Scoring practice · hypothetical respondent</div><h3>Reverse-scoring calculator</h3></div>' +
      '<p class="muted" style="margin:0">Enter the number of items, the response scale and the reverse-keyed item numbers from your manual, then a respondent\'s answers in item order. ' + (preset === "pss" ? "Pre-filled with the PSS-10 key and an example respondent." : "Use it for the WLCS, Big Five, ROCS or any manual scale.") + ' Do not enter real people\'s data.</p>' +
      '<div class="scorer-grid"><label>Items<input id="sc-n" type="number" min="1" max="60" value="' + P.n + '"></label><label>Scale min<input id="sc-min" type="number" value="' + P.min + '"></label><label>Scale max<input id="sc-max" type="number" value="' + P.max + '"></label><label class="wide">Reverse-keyed items (comma-separated)<input id="sc-rev" type="text" value="' + P.rev + '"></label><label class="wide">Responses in item order (comma-separated)<input id="sc-resp" type="text" value="' + P.resp + '" placeholder="e.g. 3,4,2,5,…"></label></div>' +
      '<div class="feedback" id="sc-out" aria-live="polite"></div></div>';
    if (weims) h += '<div class="panel stack"><div><div class="eyebrow">Scoring practice · hypothetical respondent</div><h3>WEIMS Work Self-Determination Index</h3></div><p class="muted" style="margin:0">Enter subscale means (1–7). W-SDI = +3 IM +2 INTEG +1 IDEN −1 INTRO −2 EXT −3 AMOT.</p><div class="scorer-grid">' +
      [["IM", "Intrinsic", 6], ["INTEG", "Integrated", 5], ["IDEN", "Identified", 5], ["INTRO", "Introjected", 3], ["EXT", "External", 2], ["AMOT", "Amotivation", 1]].map(function (s) { return '<label>' + s[1] + '<input type="number" step="0.1" min="1" max="7" data-weims="' + s[0] + '" id="wm-' + s[0] + '" value="' + s[2] + '"></label>'; }).join("") +
      '</div><div class="feedback" id="wm-out" aria-live="polite"></div></div>';
    return h;
  }
  function bindScorer(m) {
    var calc = function () {
      var out = document.getElementById("sc-out"); if (!out) return;
      var n = +document.getElementById("sc-n").value, mn = +document.getElementById("sc-min").value, mx = +document.getElementById("sc-max").value;
      var rev = document.getElementById("sc-rev").value.split(/[,\s]+/).filter(Boolean).map(Number);
      var resp = document.getElementById("sc-resp").value.split(/[,\s]+/).filter(Boolean).map(Number);
      if (!resp.length) { out.innerHTML = "Enter responses to see the scored total."; return; }
      if (resp.length !== n) { out.innerHTML = "<b>" + resp.length + " responses entered for " + n + " items.</b> Enter exactly one response per item, or apply your manual's missing-data rule first."; return; }
      var bad = resp.some(function (r) { return isNaN(r) || r < mn || r > mx; });
      if (bad) { out.innerHTML = "<b>A response is outside the " + mn + "–" + mx + " scale.</b> Check the entries."; return; }
      var scored = resp.map(function (r, i) { return rev.indexOf(i + 1) > -1 ? (mn + mx) - r : r; });
      var total = scored.reduce(function (a, b) { return a + b; }, 0);
      out.innerHTML = "<b>Total = " + total + "</b> (possible " + (n * mn) + "–" + (n * mx) + "); mean item score = " + (total / n).toFixed(2) + ".<br><span class=\"mono\" style=\"font-size:.82rem\">Scored items: " + scored.map(function (s, i) { return rev.indexOf(i + 1) > -1 ? "<u>" + s + "</u>" : s; }).join(", ") + "</span> <span class=\"muted\" style=\"font-size:.85rem\">(reversed items underlined; reverse = " + (mn + mx) + " − response)</span>";
    };
    ["sc-n", "sc-min", "sc-max", "sc-rev", "sc-resp"].forEach(function (id) { var el = document.getElementById(id); if (el) el.addEventListener("input", calc); });
    calc();
    var wcalc = function () {
      var o = document.getElementById("wm-out"); if (!o) return;
      var v = {}; document.querySelectorAll("[data-weims]").forEach(function (i) { v[i.getAttribute("data-weims")] = +i.value; });
      var sdi = 3 * v.IM + 2 * v.INTEG + v.IDEN - v.INTRO - 2 * v.EXT - 3 * v.AMOT;
      o.innerHTML = "<b>W-SDI = " + (Math.round(sdi * 10) / 10) + "</b>. " + (sdi > 0 ? "Positive: the profile leans toward autonomous motivation." : sdi < 0 ? "Negative: the profile leans toward controlled motivation or amotivation." : "Zero: autonomous and controlled forms balance.") + " Read the six subscales too; the same index can come from different profiles.";
    };
    document.querySelectorAll("[data-weims]").forEach(function (i) { i.addEventListener("input", wcalc); });
    wcalc();
  }

  /* ---------- case challenge ---------- */
  function challengeHTML(m) {

    return '<div class="panel stack challenge"><div class="row"><span class="fict">Scenario-based case challenge · fictional</span></div><h2>' + esc(c.title) + '</h2><div class="prose">' + c.scenario + '</div>' +

      '<div id="rubricBox" class="stack"' + (revealed ? "" : " hidden") + '><div class="panel stack"><h3>Self-assessment rubric</h3><p class="muted" style="margin:0">Tick each criterion your draft clearly meets. Be strict: an examiner would want to see it stated, not implied.</p><ul class="rubric">' +
      c.rubric.map(function (r, i) { return '<li><label><input type="checkbox" id="rb-' + m.id + "-" + i + '" data-rb="' + i + '"' + (rub[i] ? " checked" : "") + "><span>" + r + "</span></label></li>"; }).join("") +
